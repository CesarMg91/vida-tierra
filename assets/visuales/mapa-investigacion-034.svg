<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mapa epistemológico de la Investigación 034 sobre el Cuaternario</title>
  <desc id="desc">Seis columnas separan límites formales, ritmos orbitales y glaciares, transición del Pleistoceno medio, cambios abruptos, extinciones de megafauna y atribución causal. Cada columna distingue archivo, traducción, resultado y salto prohibido.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a22"/><stop offset="1" stop-color="#18232a"/></linearGradient>
    <style>
      .h{font:700 30px system-ui,sans-serif;fill:#f5eddc}.s{font:400 17px system-ui,sans-serif;fill:#b8cbd0}.t{font:700 19px system-ui,sans-serif;fill:#fff4d6}.b{font:400 16px system-ui,sans-serif;fill:#e0eaeb}.k{font:700 14px system-ui,sans-serif;fill:#6ed0d8;letter-spacing:1px}.x{font:600 15px system-ui,sans-serif;fill:#ffc58d}.line{stroke:#56747b;stroke-width:2}.card{fill:#102b34;stroke:#31545d;stroke-width:2}.warn{fill:#37251f;stroke:#a46742;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="64" y="68" class="h">Cuaternario: seis relojes, seis tipos de inferencia</text>
  <text x="64" y="100" class="s">El archivo no es el resultado · la sincronía no es la causa · la ausencia no es la extinción</text>
  <g transform="translate(48 145)">
    <g transform="translate(0)"><rect class="card" width="238" height="610" rx="18"/><text x="18" y="38" class="t">1 · LÍMITES</text><text x="18" y="74" class="k">ARCHIVO</text><text x="18" y="102" class="b">Monte San Nicola</text><text x="18" y="126" class="b">Byk-E + polaridad</text><text x="18" y="150" class="b">NGRIP2</text><path d="M28 178V240" class="line"/><circle cx="28" cy="195" r="6" fill="#6ed0d8"/><circle cx="28" cy="225" r="6" fill="#6ed0d8"/><text x="48" y="198" class="b">GSSP</text><text x="48" y="228" class="b">correlación</text><text x="18" y="280" class="k">RESULTADO</text><text x="18" y="310" class="b">2.58 Ma</text><text x="18" y="334" class="b">774.1 ka</text><text x="18" y="358" class="b">11 700 b2k</text><rect x="14" y="480" width="210" height="108" rx="12" class="warn"/><text x="28" y="510" class="x">NO AUTORIZA</text><text x="28" y="542" class="b">fecha = proceso</text><text x="28" y="566" class="b">cambio instantáneo</text></g>
    <g transform="translate(252)"><rect class="card" width="238" height="610" rx="18"/><text x="18" y="38" class="t">2 · ÓRBITA/HIELO</text><text x="18" y="74" class="k">ARCHIVO</text><text x="18" y="102" class="b">solución orbital</text><text x="18" y="126" class="b">testigo marino</text><text x="18" y="150" class="b">δ18O bentónico</text><path d="M28 178V240" class="line"/><circle cx="28" cy="195" r="6" fill="#6ed0d8"/><circle cx="28" cy="225" r="6" fill="#6ed0d8"/><text x="48" y="198" class="b">insolación estacional</text><text x="48" y="228" class="b">edad–profundidad</text><text x="18" y="280" class="k">RESULTADO</text><text x="18" y="310" class="b">23 / 41 / ~100 kyr</text><text x="18" y="334" class="b">ciclos modulados</text><text x="18" y="358" class="b">señal combinada</text><rect x="14" y="480" width="210" height="108" rx="12" class="warn"/><text x="28" y="510" class="x">NO AUTORIZA</text><text x="28" y="542" class="b">órbita = glaciación</text><text x="28" y="566" class="b">δ18O = hielo puro</text></g>
    <g transform="translate(504)"><rect class="card" width="238" height="610" rx="18"/><text x="18" y="38" class="t">3 · MPT</text><text x="18" y="74" class="k">ARCHIVO</text><text x="18" y="102" class="b">pilas marinas</text><text x="18" y="126" class="b">hielo antiguo</text><text x="18" y="150" class="b">modelos de manto</text><path d="M28 178V240" class="line"/><circle cx="28" cy="195" r="6" fill="#6ed0d8"/><circle cx="28" cy="225" r="6" fill="#6ed0d8"/><text x="48" y="198" class="b">amplitud / asimetría</text><text x="48" y="228" class="b">CO₂ + umbrales</text><text x="18" y="280" class="k">RESULTADO</text><text x="18" y="310" class="b">~1.2–0.7 Ma</text><text x="18" y="334" class="b">41 → ~100 kyr</text><text x="18" y="358" class="b">causa abierta</text><rect x="14" y="480" width="210" height="108" rx="12" class="warn"/><text x="28" y="510" class="x">NO AUTORIZA</text><text x="28" y="542" class="b">un día de transición</text><text x="28" y="566" class="b">un motor demostrado</text></g>
    <g transform="translate(756)"><rect class="card" width="238" height="610" rx="18"/><text x="18" y="38" class="t">4 · ABRUPTOS</text><text x="18" y="74" class="k">ARCHIVO</text><text x="18" y="102" class="b">capas de hielo</text><text x="18" y="126" class="b">metano + polvo</text><text x="18" y="150" class="b">espeleotemas</text><path d="M28 178V240" class="line"/><circle cx="28" cy="195" r="6" fill="#6ed0d8"/><circle cx="28" cy="225" r="6" fill="#6ed0d8"/><text x="48" y="198" class="b">conteo</text><text x="48" y="228" class="b">sincronización</text><text x="18" y="280" class="k">RESULTADO</text><text x="18" y="310" class="b">años / décadas</text><text x="18" y="334" class="b">balancín bipolar</text><text x="18" y="358" class="b">mosaico YD</text><rect x="14" y="480" width="210" height="108" rx="12" class="warn"/><text x="28" y="510" class="x">NO AUTORIZA</text><text x="28" y="542" class="b">Groenlandia = mundo</text><text x="28" y="566" class="b">impacto establecido</text></g>
    <g transform="translate(1008)"><rect class="card" width="238" height="610" rx="18"/><text x="18" y="38" class="t">5 · EXTINCIÓN</text><text x="18" y="74" class="k">ARCHIVO</text><text x="18" y="102" class="b">hueso / diente</text><text x="18" y="126" class="b">contexto</text><text x="18" y="150" class="b">14C calibrado</text><path d="M28 178V240" class="line"/><circle cx="28" cy="195" r="6" fill="#6ed0d8"/><circle cx="28" cy="225" r="6" fill="#6ed0d8"/><text x="48" y="198" class="b">tafonomía</text><text x="48" y="228" class="b">detectabilidad</text><text x="18" y="280" class="k">RESULTADO</text><text x="18" y="310" class="b">intervalo terminal</text><text x="18" y="334" class="b">selectividad</text><text x="18" y="358" class="b">asincronía</text><rect x="14" y="480" width="210" height="108" rx="12" class="warn"/><text x="28" y="510" class="x">NO AUTORIZA</text><text x="28" y="542" class="b">último fósil = fin</text><text x="28" y="566" class="b">umbral universal</text></g>
    <g transform="translate(1260)"><rect class="card" width="238" height="610" rx="18"/><text x="18" y="38" class="t">6 · ATRIBUCIÓN</text><text x="18" y="74" class="k">ARCHIVO</text><text x="18" y="102" class="b">llegada humana</text><text x="18" y="126" class="b">clima / hábitat</text><text x="18" y="150" class="b">ecología</text><path d="M28 178V240" class="line"/><circle cx="28" cy="195" r="6" fill="#6ed0d8"/><circle cx="28" cy="225" r="6" fill="#6ed0d8"/><text x="48" y="198" class="b">cronología común</text><text x="48" y="228" class="b">modelo comparativo</text><text x="18" y="280" class="k">RESULTADO</text><text x="18" y="310" class="b">peso humano</text><text x="18" y="334" class="b">peso climático</text><text x="18" y="358" class="b">sinergias regionales</text><rect x="14" y="480" width="210" height="108" rx="12" class="warn"/><text x="28" y="510" class="x">NO AUTORIZA</text><text x="28" y="542" class="b">coincidencia = causa</text><text x="28" y="566" class="b">motor universal</text></g>
  </g>
  <text x="64" y="812" class="t">Regla de lectura</text><text x="64" y="844" class="s">Cada flecha requiere calibración, escala y alternativa. Ninguna columna sustituye a las demás.</text>
</svg>
