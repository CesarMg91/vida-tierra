<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde población hasta desigualdad</title>
  <desc id="desc">Siete capas conectadas pero no automáticas: población, exposición, denominador, comparación, efecto, implementación y desigualdad. Cada transición conserva un cortafuego inferencial.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141816"/><stop offset="1" stop-color="#1f231d"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2e5c6"/><stop offset="1" stop-color="#dfcc9f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#c78344"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="240" fill="#2d493d" opacity=".28"/>
  <circle cx="115" cy="850" r="250" fill="#8e562e" opacity=".18"/>
  <text x="92" y="92" fill="#d7a45f" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-020 · CADENA DE INFERENCIA</text>
  <text x="92" y="152" fill="#fff8e8" font-family="Georgia, serif" font-size="46" font-weight="700">Una cifra agregada no convierte una población en un efecto</text>
  <text x="92" y="198" fill="#cfc7b5" font-family="Arial, sans-serif" font-size="24">Contar exige definir el grupo y la base; atribuir exige comparar bien; aplicar exige mirar a quién.</text>
  <path d="M205 390H1395" stroke="#c78344" stroke-width="4" stroke-dasharray="8 10" opacity=".75"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">01</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Población</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">quién define</tspan><tspan x="24" dy="25">el grupo</tspan><tspan x="24" dy="25">y con qué fin</tspan></text></g>
    <g transform="translate(282 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">02</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Exposición</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">qué recibió</tspan><tspan x="24" dy="25">qué material</tspan><tspan x="24" dy="25">cómo se verificó</tspan></text></g>
    <g transform="translate(494 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">03</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Denominador</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">numerador</tspan><tspan x="24" dy="25">base · periodo</tspan><tspan x="24" dy="25">criterio de caso</tspan></text></g>
    <g transform="translate(706 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">04</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Comparación</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">cómo se</tspan><tspan x="24" dy="25">formaron los</tspan><tspan x="24" dy="25">grupos</tspan></text></g>
    <g transform="translate(918 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">05</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Efecto</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">qué cantidad</tspan><tspan x="24" dy="25">directo · total</tspan><tspan x="24" dy="25">incertidumbre</tspan></text></g>
    <g transform="translate(1130 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">06</text><text x="24" y="92" fill="#1f211e" font-size="19" font-weight="700">Implementación</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">producción</tspan><tspan x="24" dy="25">coerción</tspan><tspan x="24" dy="25">aceptación</tspan></text></g>
    <g transform="translate(1342 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">07</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Desigualdad</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">quién falta</tspan><tspan x="24" dy="25">quién carga</tspan><tspan x="24" dy="25">quién gana</tspan></text></g>
  </g>
  <g stroke="#c78344" stroke-width="4" marker-end="url(#arrow)"><path d="M260 390H278"/><path d="M472 390H490"/><path d="M684 390H702"/><path d="M896 390H914"/><path d="M1108 390H1126"/><path d="M1320 390H1338"/></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#e6d8b8" text-anchor="middle">
    <text x="271" y="550"><tspan x="271">lista ≠</tspan><tspan x="271" dy="21">población</tspan></text>
    <text x="483" y="550"><tspan x="483">etiqueta ≠</tspan><tspan x="483" dy="21">exposición</tspan></text>
    <text x="695" y="550"><tspan x="695">numerador ≠</tspan><tspan x="695" dy="21">tasa</tspan></text>
    <text x="907" y="550"><tspan x="907">contraste ≠</tspan><tspan x="907" dy="21">causa</tspan></text>
    <text x="1119" y="550"><tspan x="1119">ensayo ≠</tspan><tspan x="1119" dy="21">cada lote</tspan></text>
    <text x="1331" y="550"><tspan x="1331">promedio ≠</tspan><tspan x="1331" dy="21">beneficio</tspan></text>
  </g>
  <rect x="92" y="645" width="1416" height="150" rx="24" fill="#111310" stroke="#517462" stroke-width="2"/>
  <text x="125" y="696" fill="#8eb09d" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CIFRA LEGÍTIMA</text>
  <text x="125" y="744" fill="#fff8e8" font-family="Georgia, serif" font-size="28">La fuerza aumenta cuando grupo, base, asignación, efecto y exclusiones permanecen visibles</text>
  <text x="125" y="778" fill="#cfc7b5" font-family="Arial, sans-serif" font-size="19">y disminuye cuando un promedio, un modelo o una ley sustituyen comparación, medición y distribución.</text>
  <text x="1505" y="850" fill="#8d8779" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Diagrama editorial · sin escala epidemiológica · no recomienda</text>
</svg>
