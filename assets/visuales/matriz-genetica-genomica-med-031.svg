      <g transform="translate(0 558)"><rect x="60" width="1480" height="46" fill="#f7fbf9"/><text x="80" y="30" fill="#1f5a4e" font-weight="700">Puntajes poligénicos</text><circle cx="864" cy="23" r="9" fill="#1f5a4e"/><circle cx="976" cy="23" r="9" fill="#1f5a4e"/><circle cx="1088" cy="23" r="9" fill="#1f5a4e"/><circle cx="1200" cy="23" r="9" fill="#1f5a4e"/><circle cx="1312" cy="23" r="9" fill="#1f5a4e"/></g>
      <g transform="translate(0 604)"><rect x="60" width="1480" height="46" fill="#e3ece8"/><text x="80" y="30" fill="#1f5a4e" font-weight="700">Variantes inciertas</text><circle cx="752" cy="23" r="9" fill="#1f5a4e"/><circle cx="976" cy="23" r="9" fill="#1f5a4e"/><circle cx="1200" cy="23" r="9" fill="#1f5a4e"/><circle cx="1312" cy="23" r="9" fill="#1f5a4e"/></g>
      <g transform="translate(0 650)"><rect x="60" width="1480" height="46" fill="#f7fbf9"/><text x="80" y="30" fill="#1f5a4e" font-weight="700">Penetrancia poblacional</text><circle cx="640" cy="23" r="9" fill="#1f5a4e"/><circle cx="752" cy="23" r="9" fill="#1f5a4e"/><circle cx="864" cy="23" r="9" fill="#1f5a4e"/><circle cx="976" cy="23" r="9" fill="#1f5a4e"/><circle cx="1200" cy="23" r="9" fill="#1f5a4e"/><circle cx="1312" cy="23" r="9" fill="#1f5a4e"/></g>
      <g transform="translate(0 696)"><rect x="60" width="1480" height="46" fill="#e3ece8"/><text x="80" y="30" fill="#1f5a4e" font-weight="700">Representación</text><circle cx="752" cy="23" r="9" fill="#1f5a4e"/><circle cx="864" cy="23" r="9" fill="#1f5a4e"/><circle cx="1088" cy="23" r="9" fill="#1f5a4e"/><circle cx="1200" cy="23" r="9" fill="#1f5a4e"/><circle cx="1312" cy="23" r="9" fill="#1f5a4e"/></g>
      <g transform="translate(0 742)"><rect x="60" width="1480" height="46" fill="#f7fbf9"/><text x="80" y="30" fill="#1f5a4e" font-weight="700">Gobernanza</text><circle cx="640" cy="23" r="9" fill="#1f5a4e"/><circle cx="1088" cy="23" r="9" fill="#1f5a4e"/><circle cx="1312" cy="23" r="9" fill="#1f5a4e"/><circle cx="1424" cy="23" r="9" fill="#1f5a4e"/></g>
    </g>
    <g stroke="#b7cbc3" stroke-width="1"><line x1="696" y1="282" x2="696" y2="788"/><line x1="808" y1="282" x2="808" y2="788"/><line x1="920" y1="282" x2="920" y2="788"/><line x1="1032" y1="282" x2="1032" y2="788"/><line x1="1144" y1="282" x2="1144" y2="788"/><line x1="1256" y1="282" x2="1256" y2="788"/><line x1="1368" y1="282" x2="1368" y2="788"/></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#5a6461"><circle cx="68" cy="852" r="7" fill="#1f5a4e"/><text x="82" y="857">el expediente toca la capa</text></g>
  <text x="1540" y="858" fill="#5a6461" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
