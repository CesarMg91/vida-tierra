<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de expedientes de genética médica y genómica</title>
  <desc id="desc">Once expedientes de MED-031 cruzados con ocho capas: herencia observada, variante, asociación, penetrancia, predicción individual, transferencia, clasificación y gobernanza. Cada marca sólo indica que el expediente toca esa capa con evidencia propia; no gradúa fuerza de evidencia, no ordena poblaciones ni laboratorios y no forma una escalera de progreso.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dde9e4"/><stop offset="1" stop-color="#c3d6ce"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="30" y="30" width="1540" height="850" rx="28" fill="#f3f8f6" stroke="#1f5a4e" stroke-width="2"/>
  <text x="60" y="86" fill="#2f6a5e" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-031 · MATRIZ DE EVIDENCIA</text>
  <text x="60" y="137" fill="#1c2422" font-family="Georgia, serif" font-size="40" font-weight="700">Once expedientes, ocho capas, ninguna escalera de progreso</text>
  <text x="60" y="177" fill="#4c5250" font-family="Arial, sans-serif" font-size="20">Qué capas toca cada expediente. Una marca es presencia, no fuerza ni ranking.</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="60" y="222" width="1480" height="56" rx="10" fill="#1f5a4e"/>
    <g fill="#eef7f3" font-size="15" font-weight="700"><text x="80" y="257">EXPEDIENTE</text><text x="640" y="257" text-anchor="middle">herencia</text><text x="752" y="257" text-anchor="middle">variante</text><text x="864" y="257" text-anchor="middle">asociación</text><text x="976" y="257" text-anchor="middle">penetrancia</text><text x="1088" y="257" text-anchor="middle">predicción</text><text x="1200" y="257" text-anchor="middle">transferencia</text><text x="1312" y="257" text-anchor="middle">clasificación</text><text x="1424" y="257" text-anchor="middle">gobernanza</text></g>
    <g>
      <g transform="translate(0 282)"><rect x="60" width="1480" height="46" fill="#f7fbf9"/><text x="80" y="30" fill="#1f5a4e" font-weight="700">Mendel a Fisher</text><circle cx="640" cy="23" r="9" fill="#1f5a4e"/><circle cx="864" cy="23" r="9" fill="#1f5a4e"/><circle cx="1200" cy="23" r="9" fill="#1f5a4e"/><circle cx="1312" cy="23" r="9" fill="#1f5a4e"/><circle cx="1424" cy="23" r="9" fill="#1f5a4e"/></g>
      <g transform="translate(0 328)"><rect x="60" width="1480" height="46" fill="#e3ece8"/><text x="80" y="30" fill="#1f5a4e" font-weight="700">Cariotipo y trisomía 21</text><circle cx="640" cy="23" r="9" fill="#1f5a4e"/><circle cx="752" cy="23" r="9" fill="#1f5a4e"/><circle cx="864" cy="23" r="9" fill="#1f5a4e"/><circle cx="976" cy="23" r="9" fill="#1f5a4e"/><circle cx="1312" cy="23" r="9" fill="#1f5a4e"/></g>
      <g transform="translate(0 374)"><rect x="60" width="1480" height="46" fill="#f7fbf9"/><text x="80" y="30" fill="#1f5a4e" font-weight="700">Ligamiento</text><circle cx="640" cy="23" r="9" fill="#1f5a4e"/><circle cx="752" cy="23" r="9" fill="#1f5a4e"/><circle cx="864" cy="23" r="9" fill="#1f5a4e"/><circle cx="976" cy="23" r="9" fill="#1f5a4e"/><circle cx="1088" cy="23" r="9" fill="#1f5a4e"/><circle cx="1200" cy="23" r="9" fill="#1f5a4e"/></g>
