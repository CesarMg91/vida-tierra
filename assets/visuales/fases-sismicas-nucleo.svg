<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Qué restringen las fases sísmicas del núcleo</title>
  <desc id="desc">Corte terrestre con trayectorias conceptuales P, PKP, PKIKP y SKS, una zona de sombra de P directa y una leyenda que separa propagación de corte y conversión a compresión.</desc>
  <defs>
    <radialGradient id="mantle"><stop offset="0" stop-color="#92400e"/><stop offset="1" stop-color="#2b1d20"/></radialGradient>
    <radialGradient id="outer"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#b45309"/></radialGradient>
    <radialGradient id="inner"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#d6a34b"/></radialGradient>
    <style>
      .h1{font:700 42px system-ui,sans-serif;fill:#f8fafc}.sub{font:400 21px system-ui,sans-serif;fill:#a8b5c7}
      .lab{font:700 22px system-ui,sans-serif;fill:#fff}.body{font:400 19px system-ui,sans-serif;fill:#cbd5e1}
      .small{font:400 17px system-ui,sans-serif;fill:#94a3b8}.tag{font:800 18px system-ui,sans-serif;letter-spacing:1.2px}
      .card{fill:#101c2c;stroke:#334155;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#07111f"/>
  <text x="70" y="75" class="h1">Las ondas no dibujan capas: restringen propiedades</text>
  <text x="70" y="112" class="sub">Trayectorias conceptuales, no a escala; la onda real tiene frecuencia finita, difracción y sensibilidad volumétrica.</text>

  <g transform="translate(515 550)">
    <circle r="380" fill="url(#mantle)" stroke="#64748b" stroke-width="8"/>
    <circle r="208" fill="url(#outer)" stroke="#f59e0b" stroke-width="7"/>
    <circle r="74" fill="url(#inner)" stroke="#fde68a" stroke-width="6"/>
    <path d="M-335-180 Q-40-430 335-180" fill="none" stroke="#22d3ee" stroke-width="7"/>
    <path d="M-355-140 Q-120 30 355-140" fill="none" stroke="#60a5fa" stroke-width="7"/>
    <path d="M-370-80 Q0 135 370-80" fill="none" stroke="#f8fafc" stroke-width="7"/>
    <path d="M-365 35 Q0 245 365 35" fill="none" stroke="#c084fc" stroke-width="7" stroke-dasharray="16 10"/>
    <circle cx="-345" cy="-184" r="13" fill="#fff"/><path d="M-360-200l-25-25M-360-170l-30 15M-333-200l12-30" stroke="#fff" stroke-width="5"/>
    <text x="-52" y="-332" class="lab">P</text>
    <text x="-45" y="-70" class="lab">PKP</text>
    <text x="-60" y="55" class="lab">PKIKP</text>
    <text x="-45" y="230" class="lab">SKS</text>
    <text x="-70" y="-225" class="small">manto</text>
    <text x="-88" y="-126" class="small">externo líquido</text>
    <text x="-67" y="10" class="small" fill="#1f2937">interno</text>
  </g>

  <path d="M124 302A380 380 0 0 0 132 807" fill="none" stroke="#ef4444" stroke-width="20" opacity=".38"/>
  <text x="38" y="550" class="tag" fill="#fca5a5" transform="rotate(-90 38 550)">SOMBRA DE P DIRECTA</text>

  <g>
    <rect x="970" y="185" width="550" height="665" rx="28" class="card"/>
    <text x="1010" y="235" class="tag" fill="#67e8f9">FASE → RECORRIDO → RESTRICCIÓN</text>

    <line x1="1015" y1="285" x2="1085" y2="285" stroke="#22d3ee" stroke-width="7"/>
    <text x="1110" y="292" class="lab">P</text>
    <text x="1010" y="330" class="body">Solo manto. Curvatura por Vp(r).</text>
    <text x="1010" y="360" class="small">No muestrea directamente el núcleo.</text>

    <line x1="1015" y1="415" x2="1085" y2="415" stroke="#60a5fa" stroke-width="7"/>
    <text x="1110" y="422" class="lab">PKP</text>
    <text x="1010" y="460" class="body">P → compresión K → P.</text>
    <text x="1010" y="490" class="small">Radio y Vp del núcleo externo.</text>

    <line x1="1015" y1="545" x2="1085" y2="545" stroke="#f8fafc" stroke-width="7"/>
    <text x="1110" y="552" class="lab">PKIKP / PKPdf</text>
    <text x="1010" y="590" class="body">Cruza externo e interno.</text>
    <text x="1010" y="620" class="small">ICB, Vp y anisotropía interna.</text>

    <line x1="1015" y1="675" x2="1085" y2="675" stroke="#c084fc" stroke-width="7" stroke-dasharray="16 10"/>
    <text x="1110" y="682" class="lab">SKS</text>
    <text x="1010" y="720" class="body">S → K en líquido → S.</text>
    <text x="1010" y="750" class="small">Conversión; no S propagándose en el fluido.</text>

    <rect x="1010" y="785" width="470" height="2" fill="#334155"/>
    <text x="1010" y="823" class="body">Vs = √(μ/ρ)  ·  μ≈0 en el externo</text>
  </g>

  <text x="70" y="905" class="lab">Límite:</text>
  <text x="160" y="905" class="body">una sombra no es ausencia de toda señal; fases difractadas, reflejadas y convertidas siguen llegando.</text>
  <text x="70" y="950" class="small">Diagrama conceptual reproducible · radios relativos aproximados de PREM · no usar para leer ángulos o tiempos.</text>
</svg>
