<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cronología de agriculturas y domesticaciones múltiples</title>
  <desc id="desc">Carriles regionales separan fechas de objetos y capas, ventanas de rasgos y resultados modelados entre 15 y 4 mil años antes del presente.</desc>
  <defs>
    <style>
      .bg{fill:#0b1117}.plot{fill:#101a22;stroke:#293e4d;stroke-width:2}.lane{fill:#121f29}.grid{stroke:#314653;stroke-width:1}.axis{stroke:#6f8591;stroke-width:1.5}.window{fill:#2a5f63;stroke:#79c2bf;stroke-width:2}.window2{fill:#5b4727;stroke:#edbd6c;stroke-width:2}.model{fill:#452d35;stroke:#ef8f9a;stroke-width:2}.direct{fill:#79c2bf;stroke:#d9ffff;stroke-width:2}.assoc{fill:#edbd6c;stroke:#fff0c8;stroke-width:2}.t{font-family:Arial,Helvetica,sans-serif;fill:#edf3f6}.muted{fill:#a8bac4}.teal{fill:#79c2bf}.amber{fill:#edbd6c}.red{fill:#ef8f9a}.title{font-size:30px;font-weight:700}.sub{font-size:16px}.laneText{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.tick{font-size:13px}.foot{font-size:14px}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="t title" x="48" y="50">Investigación 050 · Relojes regionales, no una revolución</text>
  <text class="t sub muted" x="48" y="80">Las posiciones son orientativas: cada marca fecha objeto, capa, rasgo o modelo. No hay flechas entre regiones.</text>
  <g transform="translate(48 106)">
    <circle class="direct" cx="8" cy="0" r="7"/><text class="t small" x="22" y="5">objeto/resto directamente fechado</text>
    <circle class="assoc" cx="270" cy="0" r="7"/><text class="t small" x="284" y="5">capa o asociación</text>
    <rect class="window" x="445" y="-8" width="34" height="16" rx="4"/><text class="t small" x="489" y="5">ventana de práctica/rasgo</text>
    <polygon class="model" points="708,-9 717,0 708,9 699,0"/><text class="t small" x="729" y="5">resultado genómico/modelado</text>
  </g>

  <rect class="plot" x="48" y="136" width="1504" height="628" rx="14"/>
  <g>
    <rect class="lane" x="60" y="175" width="1480" height="68" rx="8"/>
    <rect class="lane" x="60" y="257" width="1480" height="68" rx="8"/>
    <rect class="lane" x="60" y="339" width="1480" height="68" rx="8"/>
    <rect class="lane" x="60" y="421" width="1480" height="68" rx="8"/>
    <rect class="lane" x="60" y="503" width="1480" height="68" rx="8"/>
    <rect class="lane" x="60" y="585" width="1480" height="68" rx="8"/>
    <rect class="lane" x="60" y="667" width="1480" height="68" rx="8"/>
  </g>
  <line class="axis" x1="270" y1="158" x2="1518" y2="158"/>
  <g class="t tick" text-anchor="middle">
    <text x="270" y="151">15 ka</text><text x="497" y="151">13 ka</text><text x="724" y="151">11 ka</text><text x="951" y="151">9 ka</text><text x="1178" y="151">7 ka</text><text x="1405" y="151">5 ka</text><text x="1518" y="151">4 ka</text>
  </g>
  <g>
    <line class="grid" x1="270" y1="158" x2="270" y2="744"/><line class="grid" x1="497" y1="158" x2="497" y2="744"/><line class="grid" x1="724" y1="158" x2="724" y2="744"/><line class="grid" x1="951" y1="158" x2="951" y2="744"/><line class="grid" x1="1178" y1="158" x2="1178" y2="744"/><line class="grid" x1="1405" y1="158" x2="1405" y2="744"/><line class="grid" x1="1518" y1="158" x2="1518" y2="744"/>
  </g>

  <g class="t laneText"><text x="78" y="214">Asia sudoccidental</text><text x="78" y="296">China</text><text x="78" y="378">Nueva Guinea</text><text x="78" y="460">África</text><text x="78" y="542">Mesoamérica</text><text x="78" y="624">Andes / Amazonia</text><text x="78" y="706">Consecuencia molecular</text></g>

  <circle class="direct" cx="338" cy="202" r="8"/><text class="t body" x="350" y="197">Shubayqa ~14.4 ka</text><text class="t small muted" x="350" y="217">preparación; no cultivo</text>
  <circle class="assoc" cx="690" cy="202" r="8"/><text class="t body" x="702" y="197">Dhra’ ~11.3 ka</text><text class="t small muted" x="702" y="217">almacenamiento</text>
  <rect class="window" x="704" y="226" width="340" height="10" rx="5"/><text class="t small teal" x="874" y="238" text-anchor="middle">cultivo y rasgos cerealistas: ventanas no idénticas</text>
  <polygon class="model" points="1220,189 1231,200 1220,211 1209,200"/><text class="t body" x="1238" y="197">cebada: mosaico 2025</text><text class="t small muted" x="1238" y="217">modelo, no evento a 6.6 ka</text>

  <rect class="window2" x="834" y="269" width="198" height="12" rx="6"/><text class="t small amber" x="933" y="263" text-anchor="middle">arroz: proxies ~9.4–6.6 ka</text>
  <circle class="assoc" cx="1224" cy="287" r="8"/><text class="t body" x="1238" y="282">mijos: uso temprano</text><text class="t small muted" x="1238" y="302">uso ≠ dependencia</text>
  <circle class="assoc" cx="1337" cy="311" r="8"/><text class="t body" x="1351" y="306">Jiahu ~8.6 ka BP</text><text class="t small muted" x="1351" y="326">molar de cerdo</text>

  <rect class="window" x="742" y="357" width="430" height="14" rx="7"/><text class="t body" x="957" y="351" text-anchor="middle">Kuk: manejo de humedal y cultivo por fases desde ~10 ka</text><text class="t small muted" x="957" y="391" text-anchor="middle">canal / paleosuperficie / microresto; sin paquete cerealista</text>

  <text class="t body" x="1233" y="435" text-anchor="end">Sahara: leche, V milenio BCE</text><text class="t small muted" x="1233" y="453" text-anchor="end">pastoralismo móvil compatible</text><circle class="assoc" cx="1247" cy="442" r="8"/>
  <rect class="window2" x="1290" y="469" width="190" height="10" rx="5"/><text class="t small amber" x="1385" y="487" text-anchor="middle">sorgo / mijo: rasgos escalonados</text>
  <text class="t body" x="1440" y="435" text-anchor="end">arroz africano: modelo 2018</text><text class="t small muted" x="1440" y="453" text-anchor="end">no evento a ~4.5 ka</text><polygon class="model" points="1460,432 1471,443 1460,454 1449,443"/>

  <circle class="assoc" cx="985" cy="524" r="8"/><text class="t body" x="999" y="519">Xihuatoxtla ≥8.7 ka cal BP</text><text class="t small muted" x="999" y="539">maíz + calabaza; ocupación estacional</text>
  <rect class="window" x="1040" y="552" width="330" height="10" rx="5"/><text class="t small teal" x="1205" y="570" text-anchor="middle">maíz: dispersión y selección continuada</text>

  <circle class="direct" cx="798" cy="606" r="8"/><text class="t body" x="812" y="601">Moxos ~10.35–10.25 ka</text><text class="t small muted" x="812" y="621">fitolito + perfil / reloj asociado</text>
  <rect class="window2" x="890" y="634" width="440" height="10" rx="5"/><text class="t small amber" x="1110" y="652" text-anchor="middle">Nanchoc: cultivos, jardines y almacenamiento escalonados</text>

  <circle class="direct" cx="1235" cy="688" r="8"/><text class="t body" x="1249" y="683">zoonosis detectables ~6.5 ka</text><text class="t small muted" x="1249" y="703">1,313 humanos de Eurasia</text>
  <rect class="window2" x="1235" y="716" width="170" height="10" rx="5"/><text class="t small amber" x="1420" y="726">pico posterior ~5 ka</text>

  <rect class="plot" x="48" y="786" width="1504" height="66" rx="12"/>
  <text class="t body" x="70" y="814">Reloj de resto ≠ edad de capa ≠ ventana de rasgo ≠ coalescencia ≠ dependencia económica.</text>
  <text class="t body amber" x="70" y="839">La ausencia de una marca no indica ausencia de manejo; la cercanía visual no indica difusión, causalidad o un centro.</text>
  <text class="t foot muted" x="1552" y="878" text-anchor="end">Cronología comparativa no geográfica; intervalos redondeados y unidades declaradas en la Investigación 050.</text>
</svg>
