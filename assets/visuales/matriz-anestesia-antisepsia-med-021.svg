<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de anestesia, analgesia y antisepsia</title>
  <desc id="desc">Diez expedientes comparados por periodo, archivo, producto mejor resuelto y límite. La tabla no forma una escalera de progreso ni reparte prioridad.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe9e7"/><stop offset="1" stop-color="#c4d4d1"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="58" y="40" width="1484" height="830" rx="28" fill="#f3f8f7" stroke="#24434a" stroke-width="2"/>
  <text x="92" y="94" fill="#2f6f66" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-021 · MATRIZ DE EVIDENCIA</text>
  <text x="92" y="145" fill="#1c2422" font-family="Georgia, serif" font-size="42" font-weight="700">Diez archivos, diez productos, ninguna fecha fundacional</text>
  <text x="92" y="183" fill="#4c5250" font-family="Arial, sans-serif" font-size="20">Qué tipo de evidencia sostiene cada expediente y dónde debe detenerse la inferencia.</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="92" y="222" width="1416" height="56" rx="10" fill="#24434a"/>
    <g fill="#eef6f4" font-size="18" font-weight="700"><text x="112" y="257">EXPEDIENTE</text><text x="392" y="257">ARCHIVO</text><text x="760" y="257">PRODUCTO RESUELTO</text><text x="1122" y="257">LÍMITE</text></g>
    <g>
      <g transform="translate(0 286)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Antes de 1846</text><text x="112" y="44" fill="#5a6461" font-size="15">Antigüedad–XIX</text><text x="392" y="34" fill="#252722">recetario · tratado</text><text x="760" y="34" fill="#252722">repertorio de soporíferos</text><text x="1122" y="34" fill="#8e3f2e">sin dosis, serie ni desenlace</text></g>
      <g transform="translate(0 340)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Hanaoka · India británica</text><text x="112" y="44" fill="#5a6461" font-size="15">1804–1850s</text><text x="392" y="34" fill="#252722">síntesis · historia colonial</text><text x="760" y="34" fill="#252722">rutas no bostonianas</text><text x="1122" y="34" fill="#8e3f2e">prioridad retrospectiva</text></g>
      <g transform="translate(0 394)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Óxido nitroso</text><text x="112" y="44" fill="#5a6461" font-size="15">1800–1845</text><text x="392" y="34" fill="#252722">libro · declaraciones</text><text x="760" y="34" fill="#252722">conjetura y función fallida</text><text x="1122" y="34" fill="#8e3f2e">una función no es tasa</text></g>
      <g transform="translate(0 448)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Éter</text><text x="112" y="44" fill="#5a6461" font-size="15">1842–1849</text><text x="392" y="34" fill="#252722">carta · revista · hospital</text><text x="760" y="34" fill="#252722">demostración y difusión</text><text x="1122" y="34" fill="#8e3f2e">prioridad por definición</text></g>
      <g transform="translate(0 502)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Cloroformo</text><text x="112" y="44" fill="#5a6461" font-size="15">1847–1891</text><text x="392" y="34" fill="#252722">casuística · comisión</text><text x="760" y="34" fill="#252722">catálogo de muertes</text><text x="1122" y="34" fill="#8e3f2e">numerador sin denominador</text></g>
      <g transform="translate(0 556)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Local · raquídea</text><text x="112" y="44" fill="#5a6461" font-size="15">1884–1899</text><text x="392" y="34" fill="#252722">publicación primaria</text><text x="760" y="34" fill="#252722">efecto local visible</text><text x="1122" y="34" fill="#8e3f2e">daños contados después</text></g>
      <g transform="translate(0 610)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Mortalidad</text><text x="112" y="44" fill="#5a6461" font-size="15">1890s–1954</text><text x="392" y="34" fill="#252722">hoja · estudio multicéntrico</text><text x="760" y="34" fill="#252722">tasa con denominador</text><text x="1122" y="34" fill="#8e3f2e">causa retrospectiva</text></g>
      <g transform="translate(0 664)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Semmelweis</text><text x="112" y="44" fill="#5a6461" font-size="15">1847–1861</text><text x="392" y="34" fill="#252722">series de dos clínicas</text><text x="760" y="34" fill="#252722">comparación natural</text><text x="1122" y="34" fill="#8e3f2e">no aleatoria</text></g>
      <g transform="translate(0 718)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Lister</text><text x="112" y="44" fill="#5a6461" font-size="15">1867–1890</text><text x="392" y="34" fill="#252722">Lancet · críticos · encuesta</text><text x="760" y="34" fill="#252722">serie y control histórico</text><text x="1122" y="34" fill="#8e3f2e">n pequeño, ciclos, niños</text></g>
      <g transform="translate(0 772)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Asepsia · guantes</text><text x="112" y="44" fill="#5a6461" font-size="15">1881–1900</text><text x="392" y="34" fill="#252722">laboratorio · manual</text><text x="760" y="34" fill="#252722">control trasladado</text><text x="1122" y="34" fill="#8e3f2e">laboratorio, no desenlace</text></g>
    </g>
  </g>
  <text x="1505" y="858" fill="#5a6461" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
