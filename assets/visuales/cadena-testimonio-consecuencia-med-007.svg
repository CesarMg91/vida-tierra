<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de seis capas desde el testimonio hasta la consecuencia</title>
  <desc id="desc">Diagrama epistemológico que separa testimonio, lectura, género, operación, institución y consecuencia. Cada puente exige evidencia adicional y ninguna capa hereda automáticamente la siguiente.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16120f"/><stop offset="1" stop-color="#252019"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".36"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7948"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="100" r="250" fill="#386c5a" opacity=".10"/><circle cx="160" cy="800" r="300" fill="#ca7948" opacity=".07"/>
  <text x="96" y="94" fill="#d9985f" font-family="IBM Plex Sans,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">MED-007 · CORTAFUEGO EPISTEMOLÓGICO</text>
  <text x="96" y="155" fill="#f2eadc" font-family="Source Serif 4,Georgia,serif" font-size="52" font-weight="600">Un testimonio escrito no es un resultado clínico</text>
  <text x="96" y="201" fill="#bfb5a5" font-family="IBM Plex Sans,Arial,sans-serif" font-size="23">Avanzar exige resolver autoría, género, ejecución, alcance y efecto con archivos independientes.</text>
  <g filter="url(#shadow)" font-family="IBM Plex Sans,Arial,sans-serif">
    <g transform="translate(96 290)"><rect width="220" height="286" rx="18" fill="#29251e" stroke="#6c6255"/><text x="24" y="42" fill="#d9985f" font-size="18" font-weight="700">01</text><text x="24" y="84" fill="#f2eadc" font-size="26" font-weight="700">TESTIMONIO</text><path d="M24 112H196" stroke="#6c6255"/><text x="24" y="150" fill="#d8cebf" font-size="19"><tspan x="24">Papiro, códice,</tspan><tspan x="24" dy="29">inscripción, objeto</tspan><tspan x="24" dy="29">o cita posterior</tspan></text><text x="24" y="254" fill="#8fb9a8" font-size="16">¿Qué sobrevivió?</text></g>
    <g transform="translate(336 290)"><rect width="220" height="286" rx="18" fill="#29251e" stroke="#6c6255"/><text x="24" y="42" fill="#d9985f" font-size="18" font-weight="700">02</text><text x="24" y="84" fill="#f2eadc" font-size="28" font-weight="700">LECTURA</text><path d="M24 112H196" stroke="#6c6255"/><text x="24" y="150" fill="#d8cebf" font-size="19"><tspan x="24">Edición, variante,</tspan><tspan x="24" dy="29">traducción, fecha</tspan><tspan x="24" dy="29">y atribución</tspan></text><text x="24" y="254" fill="#8fb9a8" font-size="16">¿Cómo se establece?</text></g>
    <g transform="translate(576 290)"><rect width="220" height="286" rx="18" fill="#29251e" stroke="#6c6255"/><text x="24" y="42" fill="#d9985f" font-size="18" font-weight="700">03</text><text x="24" y="84" fill="#f2eadc" font-size="28" font-weight="700">GÉNERO</text><path d="M24 112H196" stroke="#6c6255"/><text x="24" y="150" fill="#d8cebf" font-size="19"><tspan x="24">Caso, aforismo,</tspan><tspan x="24" dy="29">tratado, voto,</tspan><tspan x="24" dy="29">norma o polémica</tspan></text><text x="24" y="254" fill="#8fb9a8" font-size="16">¿Qué intenta hacer?</text></g>
    <g transform="translate(816 290)"><rect width="220" height="286" rx="18" fill="#29251e" stroke="#6c6255"/><text x="24" y="42" fill="#d9985f" font-size="18" font-weight="700">04</text><text x="24" y="84" fill="#f2eadc" font-size="27" font-weight="700">OPERACIÓN</text><path d="M24 112H196" stroke="#6c6255"/><text x="24" y="150" fill="#d8cebf" font-size="19"><tspan x="24">Observar, prever,</tspan><tspan x="24" dy="29">reducir, incidir,</tspan><tspan x="24" dy="29">disecar o narrar</tspan></text><text x="24" y="254" fill="#8fb9a8" font-size="16">¿Se ejecutó y cómo?</text></g>
    <g transform="translate(1056 290)"><rect width="220" height="286" rx="18" fill="#29251e" stroke="#6c6255"/><text x="24" y="42" fill="#d9985f" font-size="18" font-weight="700">05</text><text x="24" y="84" fill="#f2eadc" font-size="24" font-weight="700">INSTITUCIÓN</text><path d="M24 112H196" stroke="#6c6255"/><text x="24" y="150" fill="#d8cebf" font-size="19"><tspan x="24">Casa, santuario,</tspan><tspan x="24" dy="29">ciudad, corte,</tspan><tspan x="24" dy="29">escuela o archivo</tspan></text><text x="24" y="254" fill="#8fb9a8" font-size="16">¿Quién y para quién?</text></g>
    <g transform="translate(1296 290)"><rect width="220" height="286" rx="18" fill="#29251e" stroke="#6c6255"/><text x="24" y="42" fill="#d9985f" font-size="18" font-weight="700">06</text><text x="24" y="84" fill="#f2eadc" font-size="23" font-weight="700">CONSECUENCIA</text><path d="M24 112H196" stroke="#6c6255"/><text x="24" y="150" fill="#d8cebf" font-size="19"><tspan x="24">Acceso, decisión,</tspan><tspan x="24" dy="29">resultado, daño</tspan><tspan x="24" dy="29">o autoridad</tspan></text><text x="24" y="254" fill="#8fb9a8" font-size="16">¿Qué cambió?</text></g>
  </g>
  <g stroke="#ca7948" stroke-width="3" marker-end="url(#arrow)"><path d="M316 433H331"/><path d="M556 433H571"/><path d="M796 433H811"/><path d="M1036 433H1051"/><path d="M1276 433H1291"/></g>
  <rect x="96" y="646" width="1420" height="132" rx="18" fill="#1d332c" stroke="#477462"/>
  <text x="126" y="692" fill="#a9d0bf" font-family="IBM Plex Sans,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">NO HERENCIAS</text>
  <text x="126" y="734" fill="#f2eadc" font-family="Source Serif 4,Georgia,serif" font-size="24">caso narrado ≠ registro moderno · norma ≠ práctica uniforme · disección ≠ terapia · prestigio ≠ eficacia</text>
  <text x="96" y="842" fill="#8f8679" font-family="IBM Plex Mono,Consolas,monospace" font-size="16">MED-007 · diagrama editorial · seis operaciones de auditoría, no una escalera de progreso</text>
</svg>
