<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de evidencia para reconstruir LUCA</title>
  <desc id="desc">Diagrama que separa datos actuales, inferencias filogenéticas, núcleo robusto, rasgos condicionados y aspectos no reconstruibles de LUCA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a27"/>
      <stop offset="0.55" stop-color="#0b2c39"/>
      <stop offset="1" stop-color="#13242d"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6c2"/>
      <stop offset="1" stop-color="#7bd7f2"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6be5b"/>
      <stop offset="1" stop-color="#ef7f5a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#83cbd6"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1460" cy="90" r="210" fill="#1c6d7b" opacity="0.12"/>
  <circle cx="80" cy="930" r="260" fill="#d9834c" opacity="0.08"/>

  <text x="90" y="86" fill="#f5faf9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">LUCA: del descendiente actual al ancestro probable</text>
  <text x="92" y="126" fill="#a8c7ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">La confianza disminuye al pasar de homología coordinada a retrato histórico.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="180" width="330" height="220" rx="28" fill="#112f3c" stroke="#4c8794" stroke-width="2"/>
    <text x="125" y="224" fill="#7bd7f2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">DATOS ACTUALES</text>
    <text x="125" y="270" fill="#edf7f6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Secuencias y estructuras</text>
    <g fill="#bad0d4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">
      <text x="125" y="310">• rRNA y ribosomas</text>
      <text x="125" y="342">• proteínas y genomas</text>
      <text x="125" y="374">• funciones bioquímicas</text>
    </g>

    <rect x="485" y="180" width="630" height="220" rx="28" fill="#123744" stroke="#5ba9b5" stroke-width="2"/>
    <text x="520" y="224" fill="#7bd7f2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">PUENTE FILOGENÉTICO</text>
    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="520" y="270" fill="#edf7f6" font-size="25" font-weight="600">Homología → árbol del gen → reconciliación</text>
      <text x="520" y="312" fill="#bdd5d9" font-size="20">duplicación · transferencia · pérdida · probabilidad ancestral</text>
      <rect x="520" y="340" width="550" height="34" rx="17" fill="#08232e"/>
      <rect x="520" y="340" width="395" height="34" rx="17" fill="url(#core)" opacity="0.86"/>
      <text x="535" y="364" fill="#05242d" font-size="16" font-weight="700">modelo explícito, no conteo de genes compartidos</text>
    </g>

    <rect x="1180" y="180" width="330" height="220" rx="28" fill="#332a28" stroke="#d98b5b" stroke-width="2"/>
    <text x="1215" y="224" fill="#f6be5b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">FILTROS</text>
    <g fill="#f1e3d7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">
      <text x="1215" y="270">• HGT antiguo</text>
      <text x="1215" y="305">• parálogos ocultos</text>
      <text x="1215" y="340">• muestreo y anotación</text>
      <text x="1215" y="375">• modelo de sustitución</text>
    </g>
  </g>

  <path d="M420 290 H470" stroke="#83cbd6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1115 290 H1165" stroke="#d99a6b" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="90" y="470" width="450" height="390" rx="32" fill="#113f45" stroke="#55d6c2" stroke-width="3"/>
    <rect x="90" y="470" width="450" height="12" rx="6" fill="url(#core)"/>
    <text x="130" y="530" fill="#72e0cf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5">NÚCLEO ROBUSTO</text>
    <text x="130" y="576" fill="#f2fbf9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">A–B</text>
    <g fill="#d0e7e3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">
      <text x="130" y="626">Ascendencia común</text>
      <text x="130" y="667">Código genético casi universal</text>
      <text x="130" y="708">Ribosoma y traducción</text>
      <text x="130" y="749">tRNA y carga de aminoácidos</text>
      <text x="130" y="790">ATP como moneda energética</text>
    </g>
    <text x="130" y="828" fill="#8fb7b5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">No identifica al primer ser vivo.</text>

    <rect x="575" y="470" width="450" height="390" rx="32" fill="#313329" stroke="#f0b85a" stroke-width="3"/>
    <rect x="575" y="470" width="450" height="12" rx="6" fill="url(#model)"/>
    <text x="615" y="530" fill="#f6c66d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5">CONDICIONADO</text>
    <text x="615" y="576" fill="#fff6e8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">B-COND–C</text>
    <g fill="#eee2ca" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">
      <text x="615" y="626">Raíz Bacteria | Archaea</text>
      <text x="615" y="667">Célula y quimiosmosis</text>
      <text x="615" y="708">Genoma probablemente de DNA</text>
      <text x="615" y="749">Anaerobiosis y redes centrales</text>
      <text x="615" y="790">Inventario de familias génicas</text>
    </g>
    <text x="615" y="828" fill="#c1ac89" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Cambia con árbol, HGT y anotación.</text>

    <rect x="1060" y="470" width="450" height="390" rx="32" fill="#3a2928" stroke="#e2765a" stroke-width="3"/>
    <rect x="1060" y="470" width="450" height="12" rx="6" fill="#e2765a"/>
    <text x="1100" y="530" fill="#f39a78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5">RETRATO ABIERTO</text>
    <text x="1100" y="576" fill="#fff1ec" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">C-D–E</text>
    <g fill="#efd9d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">
      <text x="1100" y="626">Membrana exacta</text>
      <text x="1100" y="667">Replicasa concreta</text>
      <text x="1100" y="708">Acetogénesis obligada</text>
      <text x="1100" y="749">Hábitat y temperatura</text>
      <text x="1100" y="790">Edad ~4.2 Ga y aspecto</text>
    </g>
    <text x="1100" y="828" fill="#c9a29a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Compatibilidad no es observación.</text>
  </g>

  <path d="M540 665 H560" stroke="#9dc2bc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1025 665 H1045" stroke="#d5a26c" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="90" y="905" width="1420" height="54" rx="27" fill="#081e28" stroke="#355763"/>
  <text x="800" y="940" text-anchor="middle" fill="#d6e6e7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">LUCA es una frontera de reconstrucción: nodo poblacional, no fósil, genoma recuperado ni primera vida.</text>
</svg>
