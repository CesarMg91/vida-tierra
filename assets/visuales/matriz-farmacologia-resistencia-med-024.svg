<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de farmacología, antibióticos y resistencia</title>
  <desc id="desc">Once expedientes comparados por periodo, archivo, producto mejor resuelto y límite. La tabla no forma una escalera de progreso ni reparte prioridad.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe9e7"/><stop offset="1" stop-color="#c4d4d1"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="58" y="40" width="1484" height="830" rx="28" fill="#f3f8f7" stroke="#24434a" stroke-width="2"/>
  <text x="92" y="94" fill="#2f6f66" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-024 · MATRIZ DE EVIDENCIA</text>
  <text x="92" y="145" fill="#1c2422" font-family="Georgia, serif" font-size="42" font-weight="700">Once archivos, once productos, ningún milagro fundacional</text>
  <text x="92" y="183" fill="#4c5250" font-family="Arial, sans-serif" font-size="20">Qué tipo de evidencia sostiene cada expediente y dónde debe detenerse la inferencia.</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="92" y="222" width="1416" height="56" rx="10" fill="#24434a"/>
    <g fill="#eef6f4" font-size="18" font-weight="700"><text x="112" y="257">EXPEDIENTE</text><text x="392" y="257">ARCHIVO</text><text x="760" y="257">PRODUCTO RESUELTO</text><text x="1122" y="257">LÍMITE</text></g>
    <g>
      <g transform="translate(0 282)"><rect x="92" width="1416" height="50" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Morfina · quinina</text><text x="112" y="42" fill="#5a6461" font-size="14">1805–1820</text><text x="392" y="31" fill="#252722">química · síntesis</text><text x="760" y="31" fill="#252722">sustancia medible</text><text x="1122" y="31" fill="#8e3f2e">medir no es comparar</text></g>
      <g transform="translate(0 332)"><rect x="92" width="1416" height="50" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Withering</text><text x="112" y="42" fill="#5a6461" font-size="14">1785</text><text x="392" y="31" fill="#252722">libro · comentario</text><text x="760" y="31" fill="#252722">serie completa declarada</text><text x="1122" y="31" fill="#8e3f2e">sin contraste</text></g>
      <g transform="translate(0 382)"><rect x="92" width="1416" height="50" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Salvarsán</text><text x="112" y="42" fill="#5a6461" font-size="14">1907–1910</text><text x="392" y="31" fill="#252722">informes · historia</text><text x="760" y="31" fill="#252722">cribado y series</text><text x="1122" y="31" fill="#8e3f2e">desenlace serológico</text></g>
      <g transform="translate(0 432)"><rect x="92" width="1416" height="50" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Sulfonamidas</text><text x="112" y="42" fill="#5a6461" font-size="14">1932–1945</text><text x="392" y="31" fill="#252722">ratones · Lancet · FDA</text><text x="760" y="31" fill="#252722">efecto con control histórico</text><text x="1122" y="31" fill="#8e3f2e">efectos modestos; formulación</text></g>
      <g transform="translate(0 482)"><rect x="92" width="1416" height="50" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Penicilina</text><text x="112" y="42" fill="#5a6461" font-size="14">1928–1945</text><text x="392" y="31" fill="#252722">Fleming · Oxford · Peoria</text><text x="760" y="31" fill="#252722">actividad y producción</text><text x="1122" y="31" fill="#8e3f2e">un caso no es tasa</text></g>
      <g transform="translate(0 532)"><rect x="92" width="1416" height="50" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Estreptomicina</text><text x="112" y="42" fill="#5a6461" font-size="14">1944–1952</text><text x="392" y="31" fill="#252722">BMJ · archivos MRC</text><text x="760" y="31" fill="#252722">contraste aleatorizado</text><text x="1122" y="31" fill="#8e3f2e">resistencia durante el ensayo</text></g>
      <g transform="translate(0 582)"><rect x="92" width="1416" height="50" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Talidomida · 1962</text><text x="112" y="42" fill="#5a6461" font-size="14">1957–1962</text><text x="392" y="31" fill="#252722">cartas · ley · FDA</text><text x="760" y="31" fill="#252722">señal y umbral legal</text><text x="1122" y="31" fill="#8e3f2e">daño de seguridad, ley de eficacia</text></g>
      <g transform="translate(0 632)"><rect x="92" width="1416" height="50" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Farmacovigilancia</text><text x="112" y="42" fill="#5a6461" font-size="14">1963–2026</text><text x="392" y="31" fill="#252722">OMS · VigiBase</text><text x="760" y="31" fill="#252722">señal</text><text x="1122" y="31" fill="#8e3f2e">numerador sin denominador</text></g>
      <g transform="translate(0 682)"><rect x="92" width="1416" height="50" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Estafilococos</text><text x="112" y="42" fill="#5a6461" font-size="14">1940–2021</text><text x="392" y="31" fill="#252722">Nature · revisiones · GRAM</text><text x="760" y="31" fill="#252722">olas fechadas</text><text x="1122" y="31" fill="#8e3f2e">aislamientos hospitalarios</text></g>
      <g transform="translate(0 732)"><rect x="92" width="1416" height="50" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Plásmidos · granjas</text><text x="112" y="42" fill="#5a6461" font-size="14">1950–2022</text><text x="392" y="31" fill="#252722">genética · granja · modelos</text><text x="760" y="31" fill="#252722">rutas de transferencia</text><text x="1122" y="31" fill="#8e3f2e">fracción no identificada</text></g>
      <g transform="translate(0 782)"><rect x="92" width="1416" height="50" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Carga global</text><text x="112" y="42" fill="#5a6461" font-size="14">2014–2025</text><text x="392" y="31" fill="#252722">O'Neill · GRAM · GLASS</text><text x="760" y="31" fill="#252722">magnitud con intervalos</text><text x="1122" y="31" fill="#8e3f2e">contrafactual y cobertura</text></g>
    </g>
  </g>
  <text x="1505" y="858" fill="#5a6461" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
