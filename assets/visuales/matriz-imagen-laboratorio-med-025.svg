<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de imagen, laboratorio y clasificación</title>
  <desc id="desc">Doce expedientes comparados por periodo, archivo, producto mejor resuelto y límite. La tabla no forma una escalera de progreso ni reparte prioridad.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2e8ee"/><stop offset="1" stop-color="#c7d2db"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="58" y="40" width="1484" height="830" rx="28" fill="#f3f6f9" stroke="#2d3f55" stroke-width="2"/>
  <text x="92" y="94" fill="#3f5f7a" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-025 · MATRIZ DE EVIDENCIA</text>
  <text x="92" y="145" fill="#1c2228" font-family="Georgia, serif" font-size="42" font-weight="700">Doce archivos, doce lectores, ninguna transparencia</text>
  <text x="92" y="183" fill="#4c5250" font-family="Arial, sans-serif" font-size="20">Qué tipo de evidencia sostiene cada expediente y dónde debe detenerse la inferencia.</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="92" y="222" width="1416" height="56" rx="10" fill="#2d3f55"/>
    <g fill="#eef3f7" font-size="18" font-weight="700"><text x="112" y="257">EXPEDIENTE</text><text x="392" y="257">ARCHIVO</text><text x="760" y="257">PRODUCTO RESUELTO</text><text x="1122" y="257">LÍMITE</text></g>
    <g>
      <g transform="translate(0 282)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Rayos X y daños</text><text x="112" y="39" fill="#5a6461" font-size="13">1895–1950</text><text x="392" y="29" fill="#252722">Röntgen · Sansare · Duffin</text><text x="760" y="29" fill="#252722">difusión y daño fechados</text><text x="1122" y="29" fill="#8e5a3c">numerador sin denominador</text></g>
      <g transform="translate(0 328)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Placa y lectores</text><text x="112" y="39" fill="#5a6461" font-size="13">1947–1960</text><text x="392" y="29" fill="#252722">JAMA · PHR · Lysen</text><text x="760" y="29" fill="#252722">desacuerdo medido</text><text x="1122" y="29" fill="#8e5a3c">cifras vía historia</text></g>
      <g transform="translate(0 374)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Química clínica</text><text x="112" y="39" fill="#5a6461" font-size="13">1919–1947</text><text x="392" y="29" fill="#252722">JBC · Rosenfeld · AJCP</text><text x="760" y="29" fill="#252722">método y variación</text><text x="1122" y="29" fill="#8e5a3c">textos no leídos</text></g>
      <g transform="translate(0 420)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Hematología</text><text x="112" y="39" fill="#5a6461" font-size="13">1852–2026</text><text x="392" y="29" fill="#252722">Haematologica</text><text x="760" y="29" fill="#252722">conteo manual a electrónico</text><text x="1122" y="29" fill="#8e5a3c">más variables, más falsos +</text></g>
      <g transform="translate(0 466)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Patología</text><text x="112" y="39" fill="#5a6461" font-size="13">2001–2015</text><text x="392" y="29" fill="#252722">ALTS · Elmore</text><text x="760" y="29" fill="#252722">concordancia con consenso</text><text x="1122" y="29" fill="#8e5a3c">la referencia también varía</text></g>
      <g transform="translate(0 512)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Clasificación</text><text x="112" y="39" fill="#5a6461" font-size="13">1893–2022</text><text x="392" y="29" fill="#252722">CIE · OMS · NHANES</text><text x="760" y="29" fill="#252722">códigos y prevalencias</text><text x="1122" y="29" fill="#8e5a3c">código no es enfermedad</text></g>
      <g transform="translate(0 558)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Ultrasonido · TC</text><text x="112" y="39" fill="#5a6461" font-size="13">1958–2012</text><text x="392" y="29" fill="#252722">Lancet · BJR · Nobel</text><text x="760" y="29" fill="#252722">instrumento y riesgo</text><text x="1122" y="29" fill="#8e5a3c">observacional; operador</text></g>
      <g transform="translate(0 604)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Resonancia</text><text x="112" y="39" fill="#5a6461" font-size="13">1971–2007</text><text x="392" y="29" fill="#252722">Science · Nature · J Urol</text><text x="760" y="29" fill="#252722">señal, imagen, crédito</text><text x="1122" y="29" fill="#8e5a3c">archivo del Nobel cerrado</text></g>
      <g transform="translate(0 650)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">PSA</text><text x="112" y="39" fill="#5a6461" font-size="13">1987–2010</text><text x="392" y="29" fill="#252722">NEJM · J Urol · JNCI</text><text x="760" y="29" fill="#252722">continuo y sobrediagnóstico</text><text x="1122" y="29" fill="#8e5a3c">ensayos discordantes</text></g>
      <g transform="translate(0 696)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Troponina</text><text x="112" y="39" fill="#5a6461" font-size="13">2000–2018</text><text x="392" y="29" fill="#252722">JACC · Circulation · Lancet</text><text x="760" y="29" fill="#252722">la prueba cambia la enfermedad</text><text x="1122" y="29" fill="#8e5a3c">un ensayo de desenlace</text></g>
      <g transform="translate(0 742)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Incidentalomas</text><text x="112" y="39" fill="#5a6461" font-size="13">2002–2016</text><text x="392" y="29" fill="#252722">NIH · Rotterdam · Corea</text><text x="760" y="29" fill="#252722">reservorio visible</text><text x="1122" y="29" fill="#8e5a3c">ecológico; sin histología</text></g>
      <g transform="translate(0 788)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">IA en imagen</text><text x="112" y="39" fill="#5a6461" font-size="13">2018–2026</text><text x="392" y="29" fill="#252722">BMJ · Nat Med · MASAI</text><text x="760" y="29" fill="#252722">métricas y sesgos</text><text x="1122" y="29" fill="#8e5a3c">sin mortalidad</text></g>
    </g>
  </g>
  <text x="1505" y="858" fill="#5a6461" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
