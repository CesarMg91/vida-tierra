<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde vestigio hasta consecuencia en MED-008</title>
  <desc id="desc">Seis tarjetas separan vestigio, identificación, función, operación, acceso y consecuencia. Cuatro cortafuegos recuerdan que edificio, título, cobertura y resultado no son equivalentes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111513"/><stop offset="1" stop-color="#1e2722"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4ead3"/><stop offset="1" stop-color="#e4d4b5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".34"/></filter>
    <style>
      .sans{font-family:'IBM Plex Sans',Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}.serif{font-family:'Source Serif 4',Georgia,serif}
      .eyebrow{fill:#c89b5b;font-size:20px;letter-spacing:4px;font-weight:700}.title{fill:#f7efd9;font-size:48px;font-weight:650}.sub{fill:#cbd4ce;font-size:22px}
      .num{fill:#8b562e;font-size:19px;font-weight:700}.ct{fill:#211d18;font-size:27px;font-weight:700}.body{fill:#4f473b;font-size:17px}.limit{fill:#7a382e;font-size:16px;font-weight:650}.arrow{fill:#b77b45;font-size:34px;font-weight:700}
      .foot{fill:#e5dbc6;font-size:18px}.pill{fill:#19231f;stroke:#527261;stroke-width:1.5}.pilltext{fill:#e5dbc6;font-size:16px;font-weight:650}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 710 C330 650 460 810 790 740 C1120 670 1290 800 1600 690 L1600 900 L0 900Z" fill="#7d4c2b" opacity=".12"/>
  <text x="90" y="80" class="sans eyebrow">MED-008 · CONTRATO DE INFERENCIA</text>
  <text x="90" y="145" class="serif title">Del vestigio a la consecuencia</text>
  <text x="90" y="188" class="sans sub">Cada flecha necesita evidencia propia; una capa abierta detiene la conclusión.</text>

  <g filter="url(#shadow)">
    <g transform="translate(70 260)"><rect width="220" height="330" rx="18" fill="url(#card)"/><rect width="220" height="9" rx="4" fill="#a8683c"/><text x="24" y="48" class="mono num">01</text><text x="24" y="90" class="sans ct">Vestigio</text><path d="M26 126h168" stroke="#bba889"/><text x="24" y="164" class="sans body"><tspan x="24">edificio · inscripción</tspan><tspan x="24" dy="29">instrumento · sedimento</tspan><tspan x="24" dy="29">texto · regla</tspan></text><text x="24" y="286" class="sans limit"><tspan x="24">No hereda identidad,</tspan><tspan x="24" dy="24">uso o representatividad.</tspan></text></g>
    <g transform="translate(318 260)"><rect width="220" height="330" rx="18" fill="url(#card)"/><rect width="220" height="9" rx="4" fill="#c1924e"/><text x="24" y="48" class="mono num">02</text><text x="24" y="90" class="sans ct">Identificación</text><path d="M26 126h168" stroke="#bba889"/><text x="24" y="164" class="sans body"><tspan x="24">tipología · procedencia</tspan><tspan x="24" dy="29">datación · lectura</tspan><tspan x="24" dy="29">alternativa explícita</tspan></text><text x="24" y="286" class="sans limit"><tspan x="24">El nombre no fija</tspan><tspan x="24" dy="24">una función única.</tspan></text></g>
    <g transform="translate(566 260)"><rect width="220" height="330" rx="18" fill="url(#card)"/><rect width="220" height="9" rx="4" fill="#8c8a4c"/><text x="24" y="48" class="mono num">03</text><text x="24" y="90" class="sans ct">Función</text><path d="M26 126h168" stroke="#bba889"/><text x="24" y="164" class="sans body"><tspan x="24">capacidad · propósito</tspan><tspan x="24" dy="29">género · uso probable</tspan><tspan x="24" dy="29">restricciones</tspan></text><text x="24" y="286" class="sans limit"><tspan x="24">Capacidad no es</tspan><tspan x="24" dy="24">operación ejecutada.</tspan></text></g>
    <g transform="translate(814 260)"><rect width="220" height="330" rx="18" fill="url(#card)"/><rect width="220" height="9" rx="4" fill="#55725f"/><text x="24" y="48" class="mono num">04</text><text x="24" y="90" class="sans ct">Operación</text><path d="M26 126h168" stroke="#bba889"/><text x="24" y="164" class="sans body"><tspan x="24">actores · secuencia</tspan><tspan x="24" dy="29">frecuencia · recursos</tspan><tspan x="24" dy="29">mantenimiento</tspan></text><text x="24" y="286" class="sans limit"><tspan x="24">Práctica no mide</tspan><tspan x="24" dy="24">cobertura.</tspan></text></g>
    <g transform="translate(1062 260)"><rect width="220" height="330" rx="18" fill="url(#card)"/><rect width="220" height="9" rx="4" fill="#42636a"/><text x="24" y="48" class="mono num">05</text><text x="24" y="90" class="sans ct">Acceso</text><path d="M26 126h168" stroke="#bba889"/><text x="24" y="164" class="sans body"><tspan x="24">pertenencia · admisión</tspan><tspan x="24" dy="29">pago · exclusión</tspan><tspan x="24" dy="29">continuidad</tspan></text><text x="24" y="286" class="sans limit"><tspan x="24">Una cama no implica</tspan><tspan x="24" dy="24">universalidad.</tspan></text></g>
    <g transform="translate(1310 260)"><rect width="220" height="330" rx="18" fill="url(#card)"/><rect width="220" height="9" rx="4" fill="#6d4d63"/><text x="24" y="48" class="mono num">06</text><text x="24" y="90" class="sans ct">Consecuencia</text><path d="M26 126h168" stroke="#bba889"/><text x="24" y="164" class="sans body"><tspan x="24">cuerpo · decisión</tspan><tspan x="24" dy="29">transmisión · autoridad</tspan><tspan x="24" dy="29">beneficio o daño</tspan></text><text x="24" y="286" class="sans limit"><tspan x="24">Prestigio no prueba</tspan><tspan x="24" dy="24">eficacia.</tspan></text></g>
  </g>
  <g class="sans arrow"><text x="294" y="440">›</text><text x="542" y="440">›</text><text x="790" y="440">›</text><text x="1038" y="440">›</text><text x="1286" y="440">›</text></g>

  <g transform="translate(90 650)">
    <rect class="pill" width="315" height="58" rx="29"/><text x="28" y="37" class="sans pilltext">EDIFICIO ≠ OPERACIÓN</text>
    <g transform="translate(335 0)"><rect class="pill" width="315" height="58" rx="29"/><text x="28" y="37" class="sans pilltext">TÍTULO ≠ COBERTURA</text></g>
    <g transform="translate(670 0)"><rect class="pill" width="315" height="58" rx="29"/><text x="28" y="37" class="sans pilltext">NORMA ≠ JORNADA</text></g>
    <g transform="translate(1005 0)"><rect class="pill" width="405" height="58" rx="29"/><text x="28" y="37" class="sans pilltext">AUTORIDAD ≠ RESULTADO CLÍNICO</text></g>
  </g>
  <text x="90" y="790" class="sans foot">Caso adversario: los parásitos persistieron en contextos con infraestructura romana.</text>
  <text x="90" y="824" class="sans foot">La evidencia contraria limita una inferencia; no borra todo beneficio local posible.</text>
  <text x="1510" y="842" text-anchor="end" class="mono" fill="#8fa69a" font-size="15">INV-MED-RB-001 · AUDITADO</text>
</svg>
