<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Las cinco líneas de trabajo de Lilly y qué quedó de cada una</title>
  <desc id="desc">Tabla de cinco filas: neurofisiología, aislamiento, delfines, St. Thomas y autoexperimentos. Para cada una, qué hizo Lilly y qué quedó: trabajo técnico publicado; flotación con efecto a corto plazo sin cegamiento; cognición de delfines confirmada por otros sin habla humana; cierre del laboratorio con fallas éticas; disociación medible sin que las entidades sean dato.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a1f"/><stop offset="1" stop-color="#16282b"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="92" fill="#8fd3c6" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">CON-004 · CINCO LÍNEAS DE TRABAJO</text>
  <text x="92" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="44" font-weight="700">Lo que hizo Lilly y lo que quedó</text>
  <text x="400" y="236" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="20" font-weight="700">Qué hizo</text>
  <text x="940" y="236" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="20" font-weight="700">Qué quedó</text>
  <text x="92" y="320" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Neurofisiología</text>
  <rect x="380" y="270" width="520" height="88" rx="12" fill="#e6ecf5"/>
  <foreignObject x="400" y="278" width="480" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:19px/1.3 Arial,sans-serif;color:#22302e">forma de onda no lesiva (Science, 1955)</p></foreignObject>
  <rect x="920" y="270" width="588" height="88" rx="12" fill="#e8f1ee"/>
  <foreignObject x="940" y="278" width="548" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:19px/1.3 Arial,sans-serif;color:#22302e">trabajo técnico publicado</p></foreignObject>
  <text x="92" y="424" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Aislamiento</text>
  <rect x="380" y="374" width="520" height="88" rx="12" fill="#e6ecf5"/>
  <foreignObject x="400" y="382" width="480" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:19px/1.3 Arial,sans-serif;color:#22302e">tanque de flotación; informe en primera persona (1956)</p></foreignObject>
  <rect x="920" y="374" width="588" height="88" rx="12" fill="#f3e6cf"/>
  <foreignObject x="940" y="382" width="548" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:19px/1.3 Arial,sans-serif;color:#22302e">flotación reduce estrés a corto plazo; sin cegamiento</p></foreignObject>
  <text x="92" y="528" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Delfines</text>
  <rect x="380" y="478" width="520" height="88" rx="12" fill="#e6ecf5"/>
  <foreignObject x="400" y="486" width="480" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:19px/1.3 Arial,sans-serif;color:#22302e">sonidos, intercambios, auxilio, imitación (Science, 1961–1965)</p></foreignObject>
  <rect x="920" y="478" width="588" height="88" rx="12" fill="#f3e6cf"/>
  <foreignObject x="940" y="486" width="548" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:19px/1.3 Arial,sans-serif;color:#22302e">«hablarán con humanos»: no; cognición rica: sí, por otros</p></foreignObject>
  <text x="92" y="632" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">St. Thomas</text>
  <rect x="380" y="582" width="520" height="88" rx="12" fill="#e6ecf5"/>
  <foreignObject x="400" y="590" width="480" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:19px/1.3 Arial,sans-serif;color:#22302e">convivencia de 1965 con el delfín Peter</p></foreignObject>
  <rect x="920" y="582" width="588" height="88" rx="12" fill="#f3d6c8"/>
  <foreignObject x="940" y="590" width="548" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:700 19px/1.3 Arial,sans-serif;color:#22302e">cierre por recorte de fondos; fallas éticas y de bienestar</p></foreignObject>
  <text x="92" y="736" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Autoexperimentos</text>
  <rect x="380" y="686" width="520" height="88" rx="12" fill="#e6ecf5"/>
  <foreignObject x="400" y="694" width="480" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:19px/1.3 Arial,sans-serif;color:#22302e">LSD, ketamina, «entidades», metaprogramación</p></foreignObject>
  <rect x="920" y="686" width="588" height="88" rx="12" fill="#f3d6c8"/>
  <foreignObject x="940" y="694" width="548" height="72"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;font:700 19px/1.3 Arial,sans-serif;color:#22302e">disociación medible en ensayos; las entidades no son dato</p></foreignObject>
  <text x="92" y="850" fill="#9fb0ab" font-family="Arial, sans-serif" font-size="19">Verde: se sostiene. Ocre: se sostiene en parte o lo confirmaron otros con otro alcance. Rojo claro: no se sostiene o falló. Síntesis del expediente.</text>
</svg>
