<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ocho Estados e imperios por siete dimensiones de alcance</title>
  <desc id="desc">Matriz de 8 casos (Acadia y Ur III, imperio neoasirio, imperio aqueménida, Qin y Han, imperio romano, Tawantinsuyu, Triple Alianza mexica, Mali y Songhai) por siete dimensiones: reclamación, presencia, logística, tributo, archivo, negociación y control efectivo. Cada celda indica el estado de la dimensión en el módulo público: sostenido, condicionado, no demostrado o dato ausente. Ninguna fila tiene el control efectivo sostenido.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1011"/><stop offset="1" stop-color="#171512"/></linearGradient>
    <style>.k{font:19px Consolas,monospace;letter-spacing:2px;fill:#c39456}.h{font:24px Georgia,serif;fill:#efe3d1}.t{font:19px Arial,sans-serif;fill:#c9c2b8}.l{font:16px Arial,sans-serif;fill:#d6a27b}.small{font:14px Consolas,monospace;fill:#91ad92}.cell{font:13px Arial,sans-serif;fill:#151310}.head{font:13px Consolas,monospace;letter-spacing:1px;fill:#c39456}.row{font:15px Arial,sans-serif;fill:#e6dccd}.rule{stroke:#8b6a43;stroke-width:2}.dash{stroke:#a96545;stroke-width:2;stroke-dasharray:8 8;fill:none}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="96" class="k">CIV-009 · MATRIZ DE ALCANCE</text>
  <text x="70" y="150" font-family="Georgia,serif" font-size="42" fill="#f2e7d6">Ninguna columna de control está completa</text>
  <text x="70" y="190" class="t">El estado es el del archivo de cada dimensión, no una calificación del imperio. «Dato ausente» no es debilidad ni autonomía.</text>
