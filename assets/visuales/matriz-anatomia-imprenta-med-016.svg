<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de siete expedientes anatómicos, productos y límites</title>
  <desc id="desc">Siete expedientes comparan archivo dominante, producto mejor resuelto y límite decisivo. La matriz no ordena culturas, exactitud general, modernidad ni progreso médico.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101512"/><stop offset="1" stop-color="#241c17"/></linearGradient>
    <style>.k{font:600 20px 'IBM Plex Sans',Arial,sans-serif;letter-spacing:4px;fill:#cc9253}.t{font:700 48px 'Source Serif 4',Georgia,serif;fill:#f5ead7}.h{font:700 18px 'IBM Plex Sans',Arial,sans-serif;fill:#f4e7d3}.case{font:700 19px 'Source Serif 4',Georgia,serif;fill:#f3e4ce}.body{font:400 15px 'IBM Plex Sans',Arial,sans-serif;fill:#d1c5b5}.lim{font:600 15px 'IBM Plex Sans',Arial,sans-serif;fill:#efb482}.n{font:700 14px 'IBM Plex Mono',monospace;fill:#17130f}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="68" class="k">MED-016 · MATRIZ COMPARATIVA</text>
  <text x="70" y="126" class="t">Siete archivos, ninguna anatomía automática</text>
  <text x="70" y="166" class="body" style="font-size:18px">Comparamos productos y límites. No ordenamos culturas, modernidad, exactitud total ni valor clínico.</text>
  <g transform="translate(55 205)">
    <rect width="1490" height="590" rx="24" fill="#171b18" stroke="#55483a"/><rect width="1490" height="64" rx="24" fill="#2b322c"/><rect y="40" width="1490" height="24" fill="#2b322c"/>
    <text x="72" y="40" class="h">EXPEDIENTE</text><text x="430" y="40" class="h">ARCHIVO DOMINANTE</text><text x="825" y="40" class="h">RESUELVE MEJOR</text><text x="1170" y="40" class="h">LÍMITE DECISIVO</text>
    <g transform="translate(0 64)"><rect width="1490" height="75" fill="#1d211d"/><circle cx="35" cy="37" r="17" fill="#c89052"/><text x="26" y="42" class="n">01</text><text x="65" y="32" class="case">Manṣūr, Shiraz</text><text x="65" y="55" class="body">ca. 1390–siglo XVII</text><text x="430" y="31" class="body">copias manuscritas +</text><text x="430" y="54" class="body">figuras de sistemas</text><text x="825" y="31" class="body">programa visual y</text><text x="825" y="54" class="body">genealogía de copias</text><text x="1170" y="31" class="lim">origen de figuras y</text><text x="1170" y="54" class="lim">disección directa</text></g>
    <g transform="translate(0 139)"><rect width="1490" height="75" fill="#181d1a"/><circle cx="35" cy="37" r="17" fill="#73a08d"/><text x="26" y="42" class="n">02</text><text x="65" y="32" class="case">Bolonia–Berengario</text><text x="65" y="55" class="body">1316–1523</text><text x="430" y="31" class="body">guías + iconos +</text><text x="430" y="54" class="body">libros ilustrados</text><text x="825" y="31" class="body">roles docentes y</text><text x="825" y="54" class="body">observación publicada</text><text x="1170" y="31" class="lim">regularidad y experiencia</text><text x="1170" y="54" class="lim">de cada sesión</text></g>
    <g transform="translate(0 214)"><rect width="1490" height="75" fill="#1d211d"/><circle cx="35" cy="37" r="17" fill="#bd7747"/><text x="26" y="42" class="n">03</text><text x="65" y="32" class="case">Vesalio–Valverde</text><text x="65" y="55" class="body">1538–1568</text><text x="430" y="31" class="body">ediciones + bloques +</text><text x="430" y="54" class="body">variantes + anotaciones</text><text x="825" y="31" class="body">corrección editorial</text><text x="825" y="54" class="body">y circulación</text><text x="1170" y="31" class="lim">autoría visual y</text><text x="1170" y="54" class="lim">efecto clínico</text></g>
    <g transform="translate(0 289)"><rect width="1490" height="75" fill="#181d1a"/><circle cx="35" cy="37" r="17" fill="#9b8252"/><text x="26" y="42" class="n">04</text><text x="65" y="32" class="case">Nueva España</text><text x="65" y="55" class="body">1576–1646</text><text x="430" y="31" class="body">autopsia + libro +</text><text x="430" y="54" class="body">cátedra + acta docente</text><text x="825" y="31" class="body">cuatro productos</text><text x="825" y="54" class="body">con relojes distintos</text><text x="1170" y="31" class="lim">prioridad continental</text><text x="1170" y="54" class="lim">y continuidad</text></g>
    <g transform="translate(0 364)"><rect width="1490" height="75" fill="#1d211d"/><circle cx="35" cy="37" r="17" fill="#7b9770"/><text x="26" y="42" class="n">05</text><text x="65" y="32" class="case">Itâkî, otomano</text><text x="65" y="55" class="body">ca. 1632</text><text x="430" y="31" class="body">manuscrito + figuras +</text><text x="430" y="54" class="body">terminología turca</text><text x="825" y="31" class="body">composición multifuente</text><text x="825" y="54" class="body">y mediación</text><text x="1170" y="31" class="lim">disección local y</text><text x="1170" y="54" class="lim">recepción</text></g>
    <g transform="translate(0 439)"><rect width="1490" height="75" fill="#181d1a"/><circle cx="35" cy="37" r="17" fill="#67988c"/><text x="26" y="42" class="n">06</text><text x="65" y="32" class="case">Kaitai shinsho</text><text x="65" y="55" class="body">1771–1826</text><text x="430" y="31" class="body">demostración + traducción +</text><text x="430" y="54" class="body">impresión + revisión</text><text x="825" y="31" class="body">agencia traductora</text><text x="825" y="54" class="body">y corrección publicada</text><text x="1170" y="31" class="lim">validación total y</text><text x="1170" y="54" class="lim">adopción uniforme</text></g>
    <g transform="translate(0 514)"><rect width="1490" height="76" fill="#1d211d"/><circle cx="35" cy="37" r="17" fill="#b26f51"/><text x="26" y="42" class="n">07</text><text x="65" y="32" class="case">China Qing</text><text x="65" y="55" class="body">1742–1830</text><text x="430" y="31" class="body">forénsica + trauma +</text><text x="430" y="54" class="body">cadáveres + libro crítico</text><text x="825" y="31" class="body">intercambio operativo</text><text x="825" y="54" class="body">y crítica de autoridad</text><text x="1170" y="31" class="lim">disección seriada y</text><text x="1170" y="54" class="lim">acierto de cada teoría</text></g>
  </g>
  <text x="70" y="846" class="body" style="font-size:18px">Una fila resuelve un producto documental; no hereda verdad total, práctica cotidiana ni resultado clínico.</text>
</svg>
