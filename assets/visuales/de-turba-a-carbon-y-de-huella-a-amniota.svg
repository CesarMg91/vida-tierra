<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">De turba a carbón y de huella a amniota</title>
  <desc id="desc">Dos cadenas paralelas muestran los pasos físicos de la formación del carbón y los pasos inferenciales desde una huella hasta un mínimo amniota.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#091518"/><stop offset="1" stop-color="#172426"/></linearGradient>
    <linearGradient id="peat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b5633"/><stop offset="1" stop-color="#65703a"/></linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#294b5a"/><stop offset="1" stop-color="#386c78"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#aec376"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#8fc5d0"/></marker>
    <style>
      .title{font:700 40px 'Segoe UI',Arial,sans-serif;fill:#f4ead7}.sub{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#b9cbc7}
      .col{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#f1d497}.step{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#f5ebd8}
      .body{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#d6e0dc}.num{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#091518}
      .warn{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#ffd17e}.note{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#bbccc7}
      .gline{stroke:#aec376;stroke-width:3;fill:none;marker-end:url(#ag)}.bline{stroke:#8fc5d0;stroke-width:3;fill:none;marker-end:url(#ab)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/><path d="M800 145V850" stroke="#53666a" stroke-width="2" stroke-dasharray="8 12"/>
  <text x="800" y="58" text-anchor="middle" class="title">Dos cadenas que no admiten atajos</text>
  <text x="800" y="92" text-anchor="middle" class="sub">La izquierda es física y tafonómica; la derecha es icnológica y filogenética.</text>
  <text x="400" y="145" text-anchor="middle" class="col">HUMEDAL → TURBA → CARBÓN</text><text x="1200" y="145" text-anchor="middle" class="col">HUELLA → PRODUCTOR → AMNIOTA</text>

  <g filter="url(#shadow)"><rect x="90" y="185" width="620" height="86" rx="17" fill="url(#peat)"/><rect x="890" y="185" width="620" height="86" rx="17" fill="url(#track)"/></g>
  <circle cx="126" cy="217" r="17" fill="#d1dc99"/><text x="126" y="223" text-anchor="middle" class="num">1</text><text x="160" y="218" class="step">Producción vegetal</text><text x="160" y="247" class="body">biomasa + mortalidad → materia orgánica disponible</text>
  <circle cx="926" cy="217" r="17" fill="#b7dce1"/><text x="926" y="223" text-anchor="middle" class="num">1</text><text x="960" y="218" class="step">Superficie subaérea</text><text x="960" y="247" class="body">depresiones + secuencia → rastro locomotor</text>
  <path d="M400 271V294" class="gline"/><path d="M1200 271V294" class="bline"/>

  <g filter="url(#shadow)"><rect x="90" y="302" width="620" height="86" rx="17" fill="#46583a" stroke="#8fa15f"/><rect x="890" y="302" width="620" height="86" rx="17" fill="#31515d" stroke="#6f9fac"/></g>
  <circle cx="126" cy="334" r="17" fill="#d1dc99"/><text x="126" y="340" text-anchor="middle" class="num">2</text><text x="160" y="335" class="step">Balance positivo bajo saturación</text><text x="160" y="364" class="body">producción &gt; descomposición/exportación/fuego → turba</text>
  <circle cx="926" cy="334" r="17" fill="#b7dce1"/><text x="926" y="340" text-anchor="middle" class="num">2</text><text x="960" y="335" class="step">Anatomía distal</text><text x="960" y="364" class="body">manus/pes + cinco dígitos + garras</text>
  <path d="M400 388V411" class="gline"/><path d="M1200 388V411" class="bline"/>

  <g filter="url(#shadow)"><rect x="90" y="419" width="620" height="86" rx="17" fill="#414d37" stroke="#8fa15f"/><rect x="890" y="419" width="620" height="86" rx="17" fill="#304955" stroke="#6f9fac"/></g>
  <circle cx="126" cy="451" r="17" fill="#d1dc99"/><text x="126" y="457" text-anchor="middle" class="num">3</text><text x="160" y="452" class="step">Conservación en la cuenca</text><text x="160" y="481" class="body">espacio + enterramiento + poco retrabajo → paleoturba</text>
  <circle cx="926" cy="451" r="17" fill="#b7dce1"/><text x="926" y="457" text-anchor="middle" class="num">3</text><text x="960" y="452" class="step">Exclusión de alternativas</text><text x="960" y="481" class="body">pie temnospóndilo incompatible; convergencia aún abierta</text>
  <path d="M400 505V528" class="gline"/><path d="M1200 505V528" class="bline"/>

  <g filter="url(#shadow)"><rect x="90" y="536" width="620" height="86" rx="17" fill="#3d4436" stroke="#9a8b5b"/><rect x="890" y="536" width="620" height="86" rx="17" fill="#33464d" stroke="#8d8c65" stroke-dasharray="7 6"/></g>
  <circle cx="126" cy="568" r="17" fill="#ddc985"/><text x="126" y="574" text-anchor="middle" class="num">4</text><text x="160" y="569" class="step">Compactación y pérdida de agua</text><text x="160" y="598" class="body">reducción de volumen + transformación temprana</text>
  <circle cx="926" cy="568" r="17" fill="#ddc985"/><text x="926" y="574" text-anchor="middle" class="num">4</text><text x="960" y="569" class="step">Afinidad saurópsida probable</text><text x="960" y="598" class="body">caracteres del rastro + árbol comparativo → amniota</text>
  <path d="M400 622V645" class="gline"/><path d="M1200 622V645" class="bline"/>

  <g filter="url(#shadow)"><rect x="90" y="653" width="620" height="86" rx="17" fill="#373a34" stroke="#a27e53"/><rect x="890" y="653" width="620" height="86" rx="17" fill="#3b4143" stroke="#a27e53" stroke-dasharray="7 6"/></g>
  <circle cx="126" cy="685" r="17" fill="#e2b77b"/><text x="126" y="691" text-anchor="middle" class="num">5</text><text x="160" y="686" class="step">Maduración térmica</text><text x="160" y="715" class="body">temperatura + tiempo + fluidos → rango de carbón</text>
  <circle cx="926" cy="685" r="17" fill="#e2b77b"/><text x="926" y="691" text-anchor="middle" class="num">5</text><text x="960" y="686" class="step">Edad transferida de la formación</text><text x="960" y="715" class="body">Tournaisiense temprano → mínimo condicionado</text>
  <path d="M400 739V762" class="gline"/><path d="M1200 739V762" class="bline"/>

  <g filter="url(#shadow)"><rect x="90" y="770" width="620" height="86" rx="17" fill="#333333" stroke="#b56f4c" stroke-width="2"/><rect x="890" y="770" width="620" height="86" rx="17" fill="#393735" stroke="#b56f4c" stroke-width="2"/></g>
  <circle cx="126" cy="802" r="17" fill="#e8a173"/><text x="126" y="808" text-anchor="middle" class="num">6</text><text x="160" y="803" class="step">Veta expuesta</text><text x="160" y="832" class="body">levantamiento + erosión/minería → archivo accesible</text>
  <circle cx="926" cy="802" r="17" fill="#e8a173"/><text x="926" y="808" text-anchor="middle" class="num">6</text><text x="960" y="803" class="step">Reproducción inferida por el nodo</text><text x="960" y="832" class="body">membranas no observadas; productor corporal ausente</text>

  <rect x="90" y="895" width="620" height="55" rx="14" fill="#11292a" stroke="#9aae6a"/><text x="400" y="919" text-anchor="middle" class="warn">El carbón requiere que sobrevivan todos los pasos</text><text x="400" y="941" text-anchor="middle" class="note">Una gran biomasa no garantiza una gran veta.</text>
  <rect x="890" y="895" width="620" height="55" rx="14" fill="#11292a" stroke="#74a8b2"/><text x="1200" y="919" text-anchor="middle" class="warn">Snowy Plains sostiene fuerte 1–3</text><text x="1200" y="941" text-anchor="middle" class="note">4–6 dependen de filogenia, edad y comparación.</text>
</svg>
