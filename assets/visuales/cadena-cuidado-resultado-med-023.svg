<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde el cuidado hasta el resultado medido</title>
  <desc id="desc">Siete capas conectadas pero no automáticas: cuidado, testimonio, institución, regulación, credencial, práctica efectiva y resultado. Cada transición conserva un cortafuego: relato no es práctica, fundación no es calidad, título no es práctica y diploma no es resultado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141720"/><stop offset="1" stop-color="#1d2224"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eceef4"/><stop offset="1" stop-color="#d0d6e2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6 0 12Z" fill="#e2a15f"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="240" fill="#2f3f5c" opacity=".3"/>
  <circle cx="115" cy="850" r="250" fill="#8a5a2e" opacity=".18"/>
  <text x="92" y="92" fill="#86c9bd" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-023 · CADENA DE INFERENCIA</text>
  <text x="92" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="44" font-weight="700">Una credencial no demuestra un cuidado mejor</text>
  <text x="92" y="198" fill="#c6cdd4" font-family="Arial, sans-serif" font-size="24">Quién cuidó, quién lo contó, qué institución, qué norma y qué título son preguntas distintas del resultado.</text>
  <path d="M205 390H1395" stroke="#e2a15f" stroke-width="4" stroke-dasharray="8 10" opacity=".7"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2f3f5c"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">01</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Cuidado</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">monjas · familias</tspan><tspan x="24" dy="25">esclavizadas</tspan><tspan x="24" dy="25">parteras</tspan></text></g>
    <g transform="translate(282 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2f3f5c"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">02</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Testimonio</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">folleto · memoria</tspan><tspan x="24" dy="25">propósito</tspan><tspan x="24" dy="25">público</tspan></text></g>
    <g transform="translate(494 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2f3f5c"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">03</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Institución</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">orden · escuela</tspan><tspan x="24" dy="25">hospital</tspan><tspan x="24" dy="25">asociación</tspan></text></g>
    <g transform="translate(706 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2f3f5c"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">04</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Regulación</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">ley · registro</tspan><tspan x="24" dy="25">título</tspan><tspan x="24" dy="25">derivación</tspan></text></g>
    <g transform="translate(918 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2f3f5c"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">05</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Credencial</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">diploma · lista</tspan><tspan x="24" dy="25">quién entra</tspan><tspan x="24" dy="25">quién no</tspan></text></g>
    <g transform="translate(1130 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2f3f5c"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">06</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Práctica</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">salas · casas</tspan><tspan x="24" dy="25">partos</tspan><tspan x="24" dy="25">reconstruida</tspan></text></g>
    <g transform="translate(1342 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2f3f5c"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">07</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Resultado</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">mortalidad</tspan><tspan x="24" dy="25">comparación</tspan><tspan x="24" dy="25">diseño</tspan></text></g>
  </g>
  <g stroke="#e2a15f" stroke-width="4" marker-end="url(#arrow)"><path d="M260 390H278"/><path d="M472 390H490"/><path d="M684 390H702"/><path d="M896 390H914"/><path d="M1108 390H1126"/><path d="M1320 390H1338"/></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#f1d3b4" text-anchor="middle">
    <text x="271" y="550"><tspan x="271">cuidado ≠</tspan><tspan x="271" dy="21">registro</tspan></text>
    <text x="483" y="550"><tspan x="483">relato ≠</tspan><tspan x="483" dy="21">práctica</tspan></text>
    <text x="695" y="550"><tspan x="695">fundación ≠</tspan><tspan x="695" dy="21">calidad</tspan></text>
    <text x="907" y="550"><tspan x="907">título ≠</tspan><tspan x="907" dy="21">práctica</tspan></text>
    <text x="1119" y="550"><tspan x="1119">diploma ≠</tspan><tspan x="1119" dy="21">resultado</tspan></text>
    <text x="1331" y="550"><tspan x="1331">práctica ≠</tspan><tspan x="1331" dy="21">desenlace</tspan></text>
  </g>
  <rect x="92" y="645" width="1416" height="150" rx="24" fill="#10141a" stroke="#5a7aa0" stroke-width="2"/>
  <text x="125" y="696" fill="#86c9bd" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CONVERGENCIA LEGÍTIMA</text>
  <text x="125" y="744" fill="#f4f1e8" font-family="Georgia, serif" font-size="28">La confianza en un resultado crece con comparación, diseño y grupos independientes;</text>
  <text x="125" y="778" fill="#c6cdd4" font-family="Arial, sans-serif" font-size="19">no con la fecha de una escuela, el número de un registro ni el prestigio de una fundadora.</text>
  <text x="1505" y="850" fill="#7f8a94" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Diagrama editorial · historia de la evidencia, sin recomendaciones clínicas ni de dotación</text>
</svg>
