<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de evidencia de la Investigación 030</title>
  <desc id="desc">Cinco rutas separan tiempo cretácico, angiospermas, insectos, avialanos y mamíferos.</desc>
  <defs>
    <style>
      .bg{fill:#0b1818}.panel{fill:#142827;stroke:#5b8580;stroke-width:2}.head{font:700 33px system-ui,sans-serif;fill:#f2e8ce}.sub{font:700 23px system-ui,sans-serif;fill:#e4b467}.txt{font:19px system-ui,sans-serif;fill:#d9e8e3}.small{font:16px system-ui,sans-serif;fill:#adc6bf}.arrow{stroke:#d78d4d;stroke-width:4;fill:none;marker-end:url(#m)}.dash{stroke:#72aaa1;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#m2)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#d78d4d"/></marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#72aaa1"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="head" x="70" y="70">INVESTIGACIÓN 030 · CRETÁCICO COMO TRANSFORMACIÓN DE REDES</text>
  <text class="small" x="70" y="104">Objetos medidos → verbos permitidos → modelos condicionados → saltos prohibidos</text>

  <rect class="panel" x="60" y="145" width="470" height="245" rx="22"/>
  <text class="sub" x="90" y="185">1 · TIEMPO</text>
  <text class="txt" x="90" y="226">tabla ICS · doce pisos</text>
  <text class="txt" x="90" y="260">WG Berriasiense · ratificación</text>
  <text class="txt" x="90" y="294">El Kef · arcilla · eyección</text>
  <path class="arrow" d="M102 325H385"/>
  <text class="small" x="90" y="362">base pendiente / techo formal</text>

  <rect class="panel" x="565" y="145" width="470" height="245" rx="22"/>
  <text class="sub" x="595" y="185">2 · ANGIOSPERMAS</text>
  <text class="txt" x="595" y="226">polen · flor · fruto · hoja</text>
  <text class="txt" x="595" y="260">ocurrencias · preservación · genes</text>
  <text class="txt" x="595" y="294">venas · abundancia · porte</text>
  <path class="arrow" d="M607 325H890"/>
  <text class="small" x="595" y="362">mínimo / nodo / función / dominancia</text>

  <rect class="panel" x="1070" y="145" width="470" height="245" rx="22"/>
  <text class="sub" x="1100" y="185">3 · INSECTOS</text>
  <text class="txt" x="1100" y="226">ámbar · insecto · polen</text>
  <text class="txt" x="1100" y="260">piezas bucales · pelos · coprolito</text>
  <text class="txt" x="1100" y="294">árbol · fósiles · tasas</text>
  <path class="arrow" d="M1112 325H1395"/>
  <text class="small" x="1100" y="362">visita / ingesta / transporte / efecto</text>

  <rect class="panel" x="180" y="455" width="570" height="260" rx="22"/>
  <text class="sub" x="215" y="497">4 · AVIALANOS</text>
  <text class="txt" x="215" y="540">cráneo + CT + dientes/pico</text>
  <text class="txt" x="215" y="576">morfometría + comparadores</text>
  <text class="txt" x="215" y="612">caracteres + matriz + definición</text>
  <path class="arrow" d="M230 647H600"/>
  <text class="small" x="215" y="686">mosaico / disparidad / tallo o corona</text>

  <rect class="panel" x="850" y="455" width="570" height="260" rx="22"/>
  <text class="sub" x="885" y="497">5 · MAMÍFEROS</text>
  <text class="txt" x="885" y="540">esqueleto + contenido abdominal</text>
  <text class="txt" x="885" y="576">molar + complejidad + morfometría</text>
  <text class="txt" x="885" y="612">matriz + corona + paleogeografía</text>
  <path class="arrow" d="M900 647H1270"/>
  <text class="small" x="885" y="686">tamaño / dieta / radiación / biogeografía</text>

  <path class="dash" d="M530 270H565"/><path class="dash" d="M1035 270H1070"/>
  <path class="dash" d="M490 390V455"/><path class="dash" d="M1110 390V455"/>
  <path class="dash" d="M750 585H850"/>

  <rect x="115" y="785" width="1370" height="140" rx="24" fill="#10211f" stroke="#ba7c45" stroke-width="2"/>
  <text class="sub" x="150" y="826">REGLA CENTRAL</text>
  <text class="txt" x="150" y="864">Primer fósil ≠ origen · diversidad ≠ dominancia · contacto ≠ eficacia</text>
  <text class="txt" x="150" y="899">avialano ≠ Aves corona · euterio ≠ Placentalia · frontera ≠ mecanismo</text>
  <text class="small" x="1180" y="956">Síntesis editorial · 2026-08-11</text>
</svg>
