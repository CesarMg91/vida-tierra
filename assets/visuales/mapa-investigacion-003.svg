<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Mapa epistemológico del origen de los elementos</title>
  <desc id="desc">Diagrama que conecta señales de laboratorio, de telescopios, detectores de neutrinos, ondas gravitacionales y granos meteoríticos con inferencias de nucleosíntesis, mostrando dependencias de modelo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10192d"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8da2c0"/>
    </marker>
    <marker id="modelArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f5b86b"/>
    </marker>
    <style>
      .title{font:700 39px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f6f8ff;letter-spacing:-.4px}
      .subtitle{font:400 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#a8b6cf}
      .col{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#7dd3fc;letter-spacing:1.5px}
      .box{fill:#131f34;stroke:#304563;stroke-width:1.5;rx:18;filter:url(#shadow)}
      .evidence{fill:#0f2831;stroke:#2dd4bf}
      .claim{fill:#17264a;stroke:#60a5fa}
      .limit{fill:#2d2231;stroke:#f59e0b}
      .h{font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f7f9ff}
      .t{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#bec9dc}
      .small{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9ee7de}
      .confidence{font:700 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#06101f}
      .flow{fill:none;stroke:#8da2c0;stroke-width:2.4;marker-end:url(#arrow)}
      .model{fill:none;stroke:#f5b86b;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#modelArrow)}
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="210" fill="#172554" opacity=".20"/>
  <circle cx="90" cy="820" r="260" fill="#134e4a" opacity=".13"/>

  <text x="80" y="70" class="title">¿Cómo localizamos las fábricas de núcleos?</text>
  <text x="80" y="105" class="subtitle">Señal actual → identificación física → proceso → claim delimitado. Las líneas punteadas son dependencias de modelo.</text>

  <text x="80" y="155" class="col">SEÑALES ACTUALES</text>
  <text x="510" y="155" class="col">PUENTE FÍSICO</text>
  <text x="970" y="155" class="col">CLAIMS QUE SOBREVIVEN</text>

  <path class="flow" d="M380 229 C430 229 440 229 490 229"/>
  <path class="flow" d="M870 229 C915 229 925 229 970 229"/>
  <rect x="80" y="180" width="300" height="98" class="box evidence"/>
  <text x="105" y="215" class="h">Líneas espectrales</text>
  <text x="105" y="242" class="t">laboratorio + estrellas + NIST</text>
  <text x="105" y="264" class="small">λ, perfil, intensidad</text>
  <rect x="490" y="180" width="380" height="98" class="box"/>
  <text x="515" y="214" class="h">Estructura atómica</text>
  <text x="515" y="241" class="t">niveles, ionización, transferencia radiativa</text>
  <text x="515" y="264" class="small">identidad fuerte · abundancia condicionada</text>
  <rect x="970" y="180" width="500" height="98" class="box claim"/>
  <text x="995" y="214" class="h">Átomos e iones remotos identificables</text>
  <text x="995" y="242" class="t">no asigna por sí solo fecha ni sitio de síntesis</text>
  <rect x="1398" y="198" width="50" height="25" rx="12" fill="#5eead4"/>
  <text x="1423" y="216" text-anchor="middle" class="confidence">A</text>

  <path class="flow" d="M380 351 C430 351 440 351 490 351"/>
  <path class="flow" d="M870 351 C915 351 925 351 970 351"/>
  <rect x="80" y="302" width="300" height="98" class="box evidence"/>
  <text x="105" y="337" class="h">D/H + reacción nuclear</text>
  <text x="105" y="364" class="t">gas poco metálico + LUNA</text>
  <text x="105" y="386" class="small">abundancia + sección eficaz</text>
  <rect x="490" y="302" width="380" height="98" class="box"/>
  <text x="515" y="336" class="h">Red BBN + expansión</text>
  <text x="515" y="363" class="t">tiempo, temperatura y densidad bariónica</text>
  <text x="515" y="386" class="small">CMB como control parcialmente independiente</text>
  <rect x="970" y="302" width="500" height="98" class="box claim"/>
  <text x="995" y="336" class="h">Inventario primordial: sobre todo H y He</text>
  <text x="995" y="364" class="t">trazas ligeras; el problema de litio sigue abierto</text>
  <rect x="1382" y="320" width="66" height="25" rx="12" fill="#93c5fd"/>
  <text x="1415" y="338" text-anchor="middle" class="confidence">B-COND</text>

  <path class="flow" d="M380 473 C430 473 440 473 490 473"/>
  <path class="flow" d="M870 473 C915 473 925 473 970 473"/>
  <rect x="80" y="424" width="300" height="98" class="box evidence"/>
  <text x="105" y="459" class="h">Neutrinos solares</text>
  <text x="105" y="486" class="t">energía, tasa y dirección</text>
  <text x="105" y="508" class="small">incluye componente CNO</text>
  <rect x="490" y="424" width="380" height="98" class="box"/>
  <text x="515" y="458" class="h">Reacciones de fusión</text>
  <text x="515" y="485" class="t">secciones eficaces + oscilación de sabores</text>
  <text x="515" y="508" class="small">mensajero que escapa del núcleo</text>
  <rect x="970" y="424" width="500" height="98" class="box claim"/>
  <text x="995" y="458" class="h">El Sol fusiona H → He ahora</text>
  <text x="995" y="486" class="t">prueba proceso activo; no toda evolución estelar</text>
  <rect x="1398" y="442" width="50" height="25" rx="12" fill="#5eead4"/>
  <text x="1423" y="460" text-anchor="middle" class="confidence">A</text>

  <path class="flow" d="M380 595 C430 595 440 595 490 595"/>
  <path class="flow" d="M870 595 C915 595 925 595 970 595"/>
  <rect x="80" y="546" width="300" height="98" class="box evidence"/>
  <text x="105" y="581" class="h">Tc + granos SiC</text>
  <text x="105" y="608" class="t">estrella S / meteorito</text>
  <text x="105" y="630" class="small">líneas + razones isotópicas</text>
  <rect x="490" y="546" width="380" height="98" class="box"/>
  <text x="515" y="580" class="h">Captura lenta + dragado</text>
  <text x="515" y="607" class="t">vida media, pulsos AGB y condensación</text>
  <text x="515" y="630" class="small">dos archivos y dos instrumentos</text>
  <rect x="970" y="546" width="500" height="98" class="box claim"/>
  <text x="995" y="580" class="h">Estrellas AGB fabrican material s</text>
  <text x="995" y="608" class="t">rendimientos exactos dependen de mezcla y tasas</text>
  <rect x="1388" y="564" width="60" height="25" rx="12" fill="#5eead4"/>
  <text x="1418" y="582" text-anchor="middle" class="confidence">A / B</text>

  <path class="flow" d="M380 717 C430 717 440 717 490 717"/>
  <path class="flow" d="M870 717 C915 717 925 717 970 717"/>
  <rect x="80" y="668" width="300" height="98" class="box evidence"/>
  <text x="105" y="703" class="h">Gamma + GW + kilonova</text>
  <text x="105" y="730" class="t">SN 1987A / GW170817</text>
  <text x="105" y="752" class="small">56Co · eyección · Sr</text>
  <rect x="490" y="668" width="380" height="98" class="box"/>
  <text x="515" y="702" class="h">Decaimiento + captura rápida</text>
  <text x="515" y="729" class="t">transferencia, opacidad y dinámica</text>
  <text x="515" y="752" class="small">eventos distintos, mensajeros distintos</text>
  <rect x="970" y="668" width="500" height="98" class="box claim"/>
  <text x="995" y="702" class="h">Núcleos frescos: supernovas y fusiones</text>
  <text x="995" y="730" class="t">existencia A · fracciones galácticas C</text>
  <rect x="1388" y="686" width="60" height="25" rx="12" fill="#5eead4"/>
  <text x="1418" y="704" text-anchor="middle" class="confidence">A / C</text>

  <rect x="490" y="798" width="980" height="70" class="box limit"/>
  <text x="515" y="823" class="h">Borde epistemológico</text>
  <text x="515" y="847" class="t">Probar que un sitio produce un isótopo no fija cuánto aportó a la Galaxia ni de dónde vino cada átomo terrestre.</text>
  <path class="model" d="M680 798 C680 785 680 780 680 766"/>
  <path class="model" d="M1220 798 C1220 785 1220 780 1220 766"/>
  <text x="80" y="922" class="subtitle">A = ancla fuerte · B/C = inferencia condicionada o fracción aún abierta</text>
</svg>
