<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de siete capas desde cuerpo disponible hasta circulación</title>
  <desc id="desc">Siete capas separan cuerpo disponible, procedimiento, imagen, texto y autoridad, comparación, corrección y circulación. Cada unión incluye un cortafuego que impide heredar representatividad, observación suficiente, copia directa, práctica, error, exactitud o adopción.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1411"/><stop offset="1" stop-color="#281d17"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#242a24"/><stop offset="1" stop-color="#181d19"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b97a49"/></marker>
    <style>
      .k{font:600 20px 'IBM Plex Sans',Arial,sans-serif;letter-spacing:4px;fill:#d19a5d}.t{font:700 50px 'Source Serif 4',Georgia,serif;fill:#f6ead7}.sub{font:400 20px 'IBM Plex Sans',Arial,sans-serif;fill:#cfc3b1}.num{font:700 16px 'IBM Plex Mono',monospace;fill:#15120f}.head{font:700 25px 'Source Serif 4',Georgia,serif;fill:#f4e5cf}.body{font:400 16px 'IBM Plex Sans',Arial,sans-serif;fill:#d1c5b5}.stop{font:600 14px 'IBM Plex Sans',Arial,sans-serif;fill:#efb482}.foot{font:600 19px 'IBM Plex Sans',Arial,sans-serif;fill:#f1dfc7}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="72" class="k">MED-016 · CADENA DE CORRECCIÓN</text>
  <text x="80" y="136" class="t">Abrir no basta: hay que volver corregible lo observado</text>
  <text x="80" y="179" class="sub">Cada capa conserva procedencia, mediación, versión y límite antes de avanzar.</text>

  <path d="M285 348H350" stroke="#b97a49" stroke-width="4" marker-end="url(#arrow)"/><path d="M640 348H705" stroke="#b97a49" stroke-width="4" marker-end="url(#arrow)"/><path d="M995 348H1060" stroke="#b97a49" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1315 470C1315 545 1160 570 1025 570" stroke="#b97a49" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M770 674H705" stroke="#b97a49" stroke-width="4" marker-end="url(#arrow)"/><path d="M415 674H350" stroke="#b97a49" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(60 235)"><rect width="225" height="230" rx="22" fill="url(#card)" stroke="#a66c40"/><circle cx="38" cy="38" r="19" fill="#d39a58"/><text x="28" y="44" class="num">01</text><text x="24" y="92" class="head">Cuerpo</text><text x="24" y="126" class="body"><tspan x="24">Procedencia, poder,</tspan><tspan x="24" dy="24">selección, estado</tspan><tspan x="24" dy="24">y disponibilidad.</tspan></text><text x="24" y="207" class="stop">≠ representatividad</text></g>
  <g transform="translate(380 235)"><rect width="260" height="230" rx="22" fill="url(#card)" stroke="#99534b"/><circle cx="38" cy="38" r="19" fill="#c96357"/><text x="28" y="44" class="num">02</text><text x="24" y="92" class="head">Procedimiento</text><text x="24" y="126" class="body"><tspan x="24">Finalidad, secuencia,</tspan><tspan x="24" dy="24">instrumentos, tiempo</tspan><tspan x="24" dy="24">y manos.</tspan></text><text x="24" y="207" class="stop">corte ≠ visión suficiente</text></g>
  <g transform="translate(735 235)"><rect width="260" height="230" rx="22" fill="url(#card)" stroke="#9e7643"/><circle cx="38" cy="38" r="19" fill="#c6934e"/><text x="28" y="44" class="num">03</text><text x="24" y="92" class="head">Imagen</text><text x="24" y="126" class="body"><tspan x="24">Mirada, dibujo, talla,</tspan><tspan x="24" dy="24">composición, escala</tspan><tspan x="24" dy="24">y variante.</tspan></text><text x="24" y="207" class="stop">≠ copia directa</text></g>
  <g transform="translate(1090 235)"><rect width="250" height="230" rx="22" fill="url(#card)" stroke="#768b56"/><circle cx="38" cy="38" r="19" fill="#90a56c"/><text x="28" y="44" class="num">04</text><text x="24" y="92" class="head">Texto</text><text x="24" y="126" class="body"><tspan x="24">Lengua, versión,</tspan><tspan x="24" dy="24">género, autoridad</tspan><tspan x="24" dy="24">y nomenclatura.</tspan></text><text x="24" y="207" class="stop">autoridad ≠ práctica</text></g>
  <g transform="translate(770 560)"><rect width="255" height="230" rx="22" fill="url(#card)" stroke="#5d8676"/><circle cx="38" cy="38" r="19" fill="#76a28d"/><text x="28" y="44" class="num">05</text><text x="24" y="92" class="head">Comparación</text><text x="24" y="126" class="body"><tspan x="24">Cuerpos, ediciones,</tspan><tspan x="24" dy="24">tradiciones, figuras</tspan><tspan x="24" dy="24">y variantes.</tspan></text><text x="24" y="207" class="stop">diferencia ≠ error</text></g>
  <g transform="translate(415 560)"><rect width="290" height="230" rx="22" fill="url(#card)" stroke="#8d6c45"/><circle cx="38" cy="38" r="19" fill="#d19a5d"/><text x="28" y="44" class="num">06</text><text x="24" y="92" class="head">Corrección</text><text x="24" y="126" class="body"><tspan x="24">Cambio trazable,</tspan><tspan x="24" dy="24">justificación, control</tspan><tspan x="24" dy="24">y posibilidad de réplica.</tspan></text><text x="24" y="207" class="stop">novedad ≠ exactitud</text></g>
  <g transform="translate(60 560)"><rect width="290" height="230" rx="22" fill="url(#card)" stroke="#6c7757"/><circle cx="38" cy="38" r="19" fill="#93a56e"/><text x="28" y="44" class="num">07</text><text x="24" y="92" class="head">Circulación</text><text x="24" y="126" class="body"><tspan x="24">Ejemplar, traducción,</tspan><tspan x="24" dy="24">aula, lector, crítica</tspan><tspan x="24" dy="24">y adopción.</tspan></text><text x="24" y="207" class="stop">≠ uso ni beneficio</text></g>

  <text x="80" y="850" class="foot">Regla: si cambia el cuerpo, el procedimiento, la versión o el lector, vuelve a declarar el denominador.</text>
</svg>
