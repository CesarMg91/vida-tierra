<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de expedientes de cirugía especializada y mínimamente invasiva</title>
  <desc id="desc">Doce expedientes de MED-028 cruzados con siete capas: técnica, operador, equipo, industria, aprendizaje, comparación y resultado. Cada marca sólo indica que el expediente toca esa capa; no gradúa fuerza de evidencia, no forma una escalera de progreso ni reparte prioridad.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe7ea"/><stop offset="1" stop-color="#c5d2d7"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="58" y="40" width="1484" height="830" rx="28" fill="#f3f7f8" stroke="#26404d" stroke-width="2"/>
  <text x="92" y="94" fill="#2f5f6f" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-028 · MATRIZ DE EVIDENCIA</text>
  <text x="92" y="145" fill="#1c2224" font-family="Georgia, serif" font-size="42" font-weight="700">Doce expedientes, siete capas, ningún pionero fundacional</text>
  <text x="92" y="183" fill="#4c5250" font-family="Arial, sans-serif" font-size="20">Qué capas toca cada expediente. Una marca es presencia, no fuerza ni ranking.</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="92" y="222" width="1416" height="56" rx="10" fill="#26404d"/>
    <g fill="#eef4f6" font-size="16" font-weight="700"><text x="112" y="257">EXPEDIENTE</text><text x="600" y="257" text-anchor="middle">técnica</text><text x="730" y="257" text-anchor="middle">operador</text><text x="860" y="257" text-anchor="middle">equipo</text><text x="990" y="257" text-anchor="middle">industria</text><text x="1120" y="257" text-anchor="middle">aprendizaje</text><text x="1250" y="257" text-anchor="middle">comparación</text><text x="1380" y="257" text-anchor="middle">resultado</text></g>
    <g>
      <g transform="translate(0 282)"><rect x="92" width="1416" height="44" fill="#f7fafb"/><text x="112" y="28" fill="#26404d" font-weight="700">Residencia de Halsted</text><circle cx="730" cy="22" r="9" fill="#26404d"/><circle cx="1120" cy="22" r="9" fill="#26404d"/><circle cx="1250" cy="22" r="9" fill="#26404d"/><circle cx="1380" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 326)"><rect x="92" width="1416" height="44" fill="#e3eaed"/><text x="112" y="28" fill="#26404d" font-weight="700">Mastectomía radical</text><circle cx="600" cy="22" r="9" fill="#26404d"/><circle cx="730" cy="22" r="9" fill="#26404d"/><circle cx="1250" cy="22" r="9" fill="#26404d"/><circle cx="1380" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 370)"><rect x="92" width="1416" height="44" fill="#f7fafb"/><text x="112" y="28" fill="#26404d" font-weight="700">Gibbon y la bomba</text><circle cx="600" cy="22" r="9" fill="#26404d"/><circle cx="860" cy="22" r="9" fill="#26404d"/><circle cx="990" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 414)"><rect x="92" width="1416" height="44" fill="#e3eaed"/><text x="112" y="28" fill="#26404d" font-weight="700">Circulación cruzada</text><circle cx="600" cy="22" r="9" fill="#26404d"/><circle cx="860" cy="22" r="9" fill="#26404d"/><circle cx="1380" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 458)"><rect x="92" width="1416" height="44" fill="#f7fafb"/><text x="112" y="28" fill="#26404d" font-weight="700">Mühe y Mouret</text><circle cx="600" cy="22" r="9" fill="#26404d"/><circle cx="730" cy="22" r="9" fill="#26404d"/><circle cx="860" cy="22" r="9" fill="#26404d"/><circle cx="990" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 502)"><rect x="92" width="1416" height="44" fill="#e3eaed"/><text x="112" y="28" fill="#26404d" font-weight="700">Lesiones de vía biliar</text><circle cx="730" cy="22" r="9" fill="#26404d"/><circle cx="1120" cy="22" r="9" fill="#26404d"/><circle cx="1380" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 546)"><rect x="92" width="1416" height="44" fill="#f7fafb"/><text x="112" y="28" fill="#26404d" font-weight="700">Difusión y ensayos de la laparoscopia</text><circle cx="990" cy="22" r="9" fill="#26404d"/><circle cx="1250" cy="22" r="9" fill="#26404d"/><circle cx="1380" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 590)"><rect x="92" width="1416" height="44" fill="#e3eaed"/><text x="112" y="28" fill="#26404d" font-weight="700">Volumen y resultado</text><circle cx="730" cy="22" r="9" fill="#26404d"/><circle cx="860" cy="22" r="9" fill="#26404d"/><circle cx="1380" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 634)"><rect x="92" width="1416" height="44" fill="#f7fafb"/><text x="112" y="28" fill="#26404d" font-weight="700">Habilidad y rescate</text><circle cx="730" cy="22" r="9" fill="#26404d"/><circle cx="860" cy="22" r="9" fill="#26404d"/><circle cx="1380" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 678)"><rect x="92" width="1416" height="44" fill="#e3eaed"/><text x="112" y="28" fill="#26404d" font-weight="700">Adopción robótica</text><circle cx="860" cy="22" r="9" fill="#26404d"/><circle cx="990" cy="22" r="9" fill="#26404d"/><circle cx="1120" cy="22" r="9" fill="#26404d"/><circle cx="1250" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 722)"><rect x="92" width="1416" height="44" fill="#f7fafb"/><text x="112" y="28" fill="#26404d" font-weight="700">LACC</text><circle cx="600" cy="22" r="9" fill="#26404d"/><circle cx="1250" cy="22" r="9" fill="#26404d"/><circle cx="1380" cy="22" r="9" fill="#26404d"/></g>
      <g transform="translate(0 766)"><rect x="92" width="1416" height="44" fill="#e3eaed"/><text x="112" y="28" fill="#26404d" font-weight="700">Placebo quirúrgico</text><circle cx="600" cy="22" r="9" fill="#26404d"/><circle cx="1250" cy="22" r="9" fill="#26404d"/><circle cx="1380" cy="22" r="9" fill="#26404d"/></g>
    </g>
    <g stroke="#b7c6cb" stroke-width="1"><line x1="665" y1="282" x2="665" y2="810"/><line x1="795" y1="282" x2="795" y2="810"/><line x1="925" y1="282" x2="925" y2="810"/><line x1="1055" y1="282" x2="1055" y2="810"/><line x1="1185" y1="282" x2="1185" y2="810"/><line x1="1315" y1="282" x2="1315" y2="810"/></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#5a6461"><circle cx="100" cy="840" r="7" fill="#26404d"/><text x="114" y="845">el expediente toca la capa</text></g>
  <text x="1505" y="858" fill="#5a6461" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
