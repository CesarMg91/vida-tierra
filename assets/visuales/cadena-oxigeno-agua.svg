<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de inferencia desde oxígeno en zircon hasta agua hadeana</title>
  <desc id="desc">Seis etapas separan el microanálisis actual de la interacción antigua entre agua y roca, con pérdidas de información en fecha, escala y clima.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09121d"/>
      <stop offset="1" stop-color="#15151b"/>
    </linearGradient>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6ecfe2"/>
    </marker>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .k{font:600 23px Inter,Segoe UI,sans-serif;letter-spacing:3px;fill:#6ecfe2}
      .t{font:700 45px Inter,Segoe UI,sans-serif;fill:#f3efe6}
      .st{font:400 21px Inter,Segoe UI,sans-serif;fill:#a7b7c2}
      .n{font:700 21px Inter,Segoe UI,sans-serif;fill:#09121d}
      .ct{font:700 24px Inter,Segoe UI,sans-serif;fill:#f3efe6}
      .b{font:400 18px Inter,Segoe UI,sans-serif;fill:#b7c6cf}
      .loss{font:600 17px Inter,Segoe UI,sans-serif;fill:#d8a470}
      .foot{font:400 19px Inter,Segoe UI,sans-serif;fill:#93a5b1}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text class="k" x="80" y="72">DE LA MUESTRA AL PASADO</text>
  <text class="t" x="80" y="132">Una razón isotópica no es un océano</text>
  <text class="st" x="80" y="177">Cada paso añade física y también una nueva forma de incertidumbre.</text>

  <line x1="165" y1="405" x2="1430" y2="405" stroke="#315469" stroke-width="5"/>

  <g filter="url(#s2)">
    <g transform="translate(75 260)">
      <rect width="220" height="285" rx="24" fill="#173142" stroke="#3e7089" stroke-width="2"/>
      <circle cx="45" cy="45" r="25" fill="#6ecfe2"/><text class="n" text-anchor="middle" x="45" y="53">1</text>
      <text class="ct" x="28" y="100">Microdominio</text>
      <text class="b" x="28" y="137">Microsonda iónica</text>
      <text class="b" x="28" y="164">mide 18O/16O</text>
      <text class="loss" x="28" y="224">No mide agua</text>
      <text class="loss" x="28" y="249">ni una temperatura</text>
    </g>

    <g transform="translate(325 260)">
      <rect width="220" height="285" rx="24" fill="#1b2c3a" stroke="#466377" stroke-width="2"/>
      <circle cx="45" cy="45" r="25" fill="#6ecfe2"/><text class="n" text-anchor="middle" x="45" y="53">2</text>
      <text class="ct" x="28" y="100">Zircon primario</text>
      <text class="b" x="28" y="137">Edad + CL + Raman</text>
      <text class="b" x="28" y="164">+ concordancia + OH</text>
      <text class="loss" x="28" y="224">Grietas y daño</text>
      <text class="loss" x="28" y="249">pueden falsear</text>
    </g>

    <g transform="translate(575 260)">
      <rect width="220" height="285" rx="24" fill="#282b33" stroke="#6e6b70" stroke-width="2"/>
      <circle cx="45" cy="45" r="25" fill="#d6a35b"/><text class="n" text-anchor="middle" x="45" y="53">3</text>
      <text class="ct" x="28" y="100">Magma parental</text>
      <text class="b" x="28" y="137">Fraccionamiento entre</text>
      <text class="b" x="28" y="164">zircon y fundido</text>
      <text class="loss" x="28" y="224">Temperatura y</text>
      <text class="loss" x="28" y="249">calibración</text>
    </g>

    <g transform="translate(825 260)">
      <rect width="220" height="285" rx="24" fill="#302a2a" stroke="#80695d" stroke-width="2"/>
      <circle cx="45" cy="45" r="25" fill="#d6a35b"/><text class="n" text-anchor="middle" x="45" y="53">4</text>
      <text class="ct" x="28" y="100">Roca fuente</text>
      <text class="b" x="28" y="137">Fusión, mezcla o</text>
      <text class="b" x="28" y="164">asimilación previa</text>
      <text class="loss" x="28" y="224">Ruta petrológica</text>
      <text class="loss" x="28" y="249">no única</text>
    </g>

    <g transform="translate(1075 260)">
      <rect width="220" height="285" rx="24" fill="#19333a" stroke="#44777e" stroke-width="2"/>
      <circle cx="45" cy="45" r="25" fill="#6ecfe2"/><text class="n" text-anchor="middle" x="45" y="53">5</text>
      <text class="ct" x="28" y="100">Agua + roca</text>
      <text class="b" x="28" y="137">Intercambio somero</text>
      <text class="b" x="28" y="164">a baja temperatura</text>
      <text class="loss" x="28" y="224">Ocurrió antes</text>
      <text class="loss" x="28" y="249">de la edad U–Pb</text>
    </g>

    <g transform="translate(1325 260)">
      <rect width="220" height="285" rx="24" fill="#232633" stroke="#5d637b" stroke-width="2"/>
      <circle cx="45" cy="45" r="25" fill="#9b91d5"/><text class="n" text-anchor="middle" x="45" y="53">6</text>
      <text class="ct" x="28" y="100">Escala planetaria</text>
      <text class="b" x="28" y="137">Hidrosfera, océano,</text>
      <text class="b" x="28" y="164">clima y habitabilidad</text>
      <text class="loss" x="28" y="224">Volumen y duración</text>
      <text class="loss" x="28" y="249">no observados</text>
    </g>
  </g>

  <g stroke="#6ecfe2" stroke-width="4" marker-end="url(#a2)">
    <path d="M295 405 H318"/>
    <path d="M545 405 H568"/>
    <path d="M795 405 H818"/>
    <path d="M1045 405 H1068"/>
    <path d="M1295 405 H1318"/>
  </g>

  <g transform="translate(80 640)">
    <rect width="1440" height="165" rx="28" fill="#101f2a" stroke="#2f5366" stroke-width="2"/>
    <text class="ct" x="35" y="48">Qué sobrevive a la auditoría</text>
    <circle cx="50" cy="92" r="8" fill="#6ecfe2"/>
    <text class="foot" x="72" y="96">
      <tspan x="72" dy="0">B–C: agua líquida somera alteró material</tspan>
      <tspan x="72" dy="28">que después entró en algunos magmas.</tspan>
    </text>
    <circle cx="780" cy="92" r="8" fill="#d6a35b"/>
    <text class="foot" x="802" y="96">
      <tspan x="802" dy="0">D–E: no fija océano global, clima estable</tspan>
      <tspan x="802" dy="28">ni habitabilidad continua.</tspan>
    </text>
  </g>
  <text class="foot" text-anchor="middle" x="800" y="850">OBSERVACIÓN ACTUAL → MEDICIÓN → PRINCIPIO → MODELO → INFERENCIA DEL PASADO</text>
</svg>
