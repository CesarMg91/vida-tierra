<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de archivos africanos auditados en MED-009</title>
  <desc id="desc">Compara Kerma, Kulubnarti, Aksum, Jenne-jeno, Tombuctú y Tong Hills por archivo observado, inferencia permitida y límite, sin ordenarlos ni puntuarlos.</desc>
  <rect width="1600" height="900" fill="#15120f"/>
  <text x="78" y="78" fill="#d89957" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" letter-spacing="4">MED-009 · MATRIZ SIN RANKING</text>
  <text x="78" y="132" fill="#f3e8d5" font-family="Source Serif 4, Georgia, serif" font-size="46" font-weight="700">Seis archivos, seis resoluciones distintas</text>
  <text x="78" y="172" fill="#b8ad9c" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20">La comparación mide el alcance de la inferencia, no el “avance” de una sociedad.</text>

  <g transform="translate(60 220)" font-family="IBM Plex Sans, Arial, sans-serif">
    <rect width="1480" height="72" rx="14" fill="#342820"/>
    <text x="26" y="45" fill="#d89957" font-size="18" font-weight="700">CASO</text>
    <text x="275" y="45" fill="#d89957" font-size="18" font-weight="700">ARCHIVO OBSERVADO</text>
    <text x="755" y="45" fill="#d89957" font-size="18" font-weight="700">INFERENCIA PERMITIDA</text>
    <text x="1125" y="45" fill="#d89957" font-size="18" font-weight="700">LÍMITE DECISIVO</text>

    <g transform="translate(0 88)"><rect width="1480" height="88" rx="12" fill="#24211c"/><rect width="10" height="88" rx="5" fill="#7f956b"/><text x="26" y="38" fill="#fff1db" font-size="22" font-weight="700">Kerma K317</text><text x="26" y="65" fill="#8fa282" font-size="15">Nubia</text><text x="275" y="37" fill="#d7cbbb" font-size="18">abertura circular + remodelación</text><text x="275" y="63" fill="#a99f91" font-size="16">imagen y contexto funerario</text><text x="755" y="37" fill="#d7cbbb" font-size="18">supervivencia; intervención posible</text><text x="755" y="63" fill="#a99f91" font-size="16">bajo diagnóstico diferencial</text><text x="1125" y="37" fill="#e2b987" font-size="18">finalidad · operador</text><text x="1125" y="63" fill="#b9a48c" font-size="16">tratamiento no identificado</text></g>
    <g transform="translate(0 188)"><rect width="1480" height="88" rx="12" fill="#1e241f"/><rect width="10" height="88" rx="5" fill="#7f956b"/><text x="26" y="38" fill="#fff1db" font-size="22" font-weight="700">Kulubnarti</text><text x="26" y="65" fill="#8fa282" font-size="15">Nubia medieval</text><text x="275" y="37" fill="#d7cbbb" font-size="18">fechas + huesos + isótopos + ADN</text><text x="275" y="63" fill="#a99f91" font-size="16">dos cementerios</text><text x="755" y="37" fill="#d7cbbb" font-size="18">cronología y experiencias múltiples</text><text x="755" y="63" fill="#a99f91" font-size="16">categorías previas revisadas</text><text x="1125" y="37" fill="#e2b987" font-size="18">genética ≠ igualdad</text><text x="1125" y="63" fill="#b9a48c" font-size="16">sin sistema médico inferido</text></g>
    <g transform="translate(0 288)"><rect width="1480" height="88" rx="12" fill="#24211c"/><rect width="10" height="88" rx="5" fill="#bb7d45"/><text x="26" y="38" fill="#fff1db" font-size="22" font-weight="700">Aksum</text><text x="26" y="65" fill="#c18b56" font-size="15">tierras altas</text><text x="275" y="37" fill="#d7cbbb" font-size="18">sitio monumental + muestra mínima</text><text x="275" y="63" fill="#a99f91" font-size="16">manuscritos mucho más tardíos</text><text x="755" y="37" fill="#d7cbbb" font-size="18">trayectoria política; límite tafonómico</text><text x="755" y="63" fill="#a99f91" font-size="16">un individuo isotópico</text><text x="1125" y="37" fill="#e2b987" font-size="18">dato corporal ausente</text><text x="1125" y="63" fill="#b9a48c" font-size="16">sin continuidad automática</text></g>
    <g transform="translate(0 388)"><rect width="1480" height="88" rx="12" fill="#1e241f"/><rect width="10" height="88" rx="5" fill="#bb7d45"/><text x="26" y="38" fill="#fff1db" font-size="22" font-weight="700">Jenne-jeno</text><text x="26" y="65" fill="#c18b56" font-size="15">delta interior del Níger</text><text x="275" y="37" fill="#d7cbbb" font-size="18">urbanismo + producción + redes</text><text x="275" y="63" fill="#a99f91" font-size="16">estratigrafía y conjuntos</text><text x="755" y="37" fill="#d7cbbb" font-size="18">complejidad sin paquete estatal</text><text x="755" y="63" fill="#a99f91" font-size="16">hipótesis sobre especialización</text><text x="1125" y="37" fill="#e2b987" font-size="18">medicina no demostrada</text><text x="1125" y="63" fill="#b9a48c" font-size="16">no es ausencia histórica</text></g>
    <g transform="translate(0 488)"><rect width="1480" height="88" rx="12" fill="#24211c"/><rect width="10" height="88" rx="5" fill="#d09a5d"/><text x="26" y="38" fill="#fff1db" font-size="22" font-weight="700">Tombuctú</text><text x="26" y="65" fill="#d6a76f" font-size="15">bibliotecas privadas</text><text x="275" y="37" fill="#d7cbbb" font-size="18">manuscrito + inventarios</text><text x="275" y="63" fill="#a99f91" font-size="16">fórmulas, plegarias, amuletos</text><text x="755" y="37" fill="#d7cbbb" font-size="18">repertorio escrito y colección</text><text x="755" y="63" fill="#a99f91" font-size="16">cronologías heterogéneas</text><text x="1125" y="37" fill="#e2b987" font-size="18">texto ≠ ejecución</text><text x="1125" y="63" fill="#b9a48c" font-size="16">fecha y efecto abiertos</text></g>
    <g transform="translate(0 588)"><rect width="1480" height="88" rx="12" fill="#1e241f"/><rect width="10" height="88" rx="5" fill="#d09a5d"/><text x="26" y="38" fill="#fff1db" font-size="22" font-weight="700">Tong Hills</text><text x="26" y="65" fill="#d6a76f" font-size="15">Ghana septentrional</text><text x="275" y="37" fill="#d7cbbb" font-size="18">recipientes + residuos + etnografía</text><text x="275" y="63" fill="#a99f91" font-size="16">contexto OSL</text><text x="755" y="37" fill="#d7cbbb" font-size="18">preparación vegetal medicinal probable</text><text x="755" y="63" fill="#a99f91" font-size="16">convergencia controlada</text><text x="1125" y="37" fill="#e2b987" font-size="18">planta · identidad · eficacia</text><text x="1125" y="63" fill="#b9a48c" font-size="16">no heredadas</text></g>
  </g>
  <text x="78" y="204" fill="#918778" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14">Estados distintos: DOCUMENTADO · INFERENCIA PROBABLE · NO DEMOSTRADO · DATO AUSENTE · EVIDENCIA CONTRARIA.</text>
</svg>
