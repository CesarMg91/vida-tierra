<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de diseños, productos legítimos y fallos en evidencia de intervenciones</title>
  <desc id="desc">Cinco filas comparan ensayo aleatorizado, ensayo quirúrgico, estudio observacional, revisión sistemática y guía de reporte sin ordenarlos como jerarquía universal.</desc>
  <defs><style>
    .bg{fill:#0d1112}.head{fill:#19211f}.cell{fill:#14191a;stroke:#33403d;stroke-width:1}.accent{fill:#bf8246}.k{fill:#e3c387;font:600 17px 'IBM Plex Mono',monospace;letter-spacing:1.5px}.h{fill:#f1e8d7;font:500 39px 'Source Serif 4',serif}.th{fill:#cdd8d2;font:600 18px 'IBM Plex Sans',sans-serif}.row{fill:#eddfc8;font:500 23px 'Source Serif 4',serif}.p{fill:#b9b1a5;font:17px 'IBM Plex Sans',sans-serif}.warn{fill:#d8a25a;font:17px 'IBM Plex Sans',sans-serif}.foot{fill:#8f9994;font:16px 'IBM Plex Sans',sans-serif}
  </style></defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="k" x="80" y="70">MED-001 · PRODUCTOS Y FALLOS</text>
  <text class="h" x="80" y="118">Ningún diseño responde todas las preguntas</text>
  <text class="p" x="80" y="154">La fila identifica un producto legítimo y el error que puede sobrevivir. No es un ranking.</text>

  <g transform="translate(80 200)">
    <rect class="head" width="1440" height="65"/>
    <text class="th" x="25" y="40">Diseño / objeto</text><text class="th" x="325" y="40">Producto legítimo</text><text class="th" x="730" y="40">Control decisivo</text><text class="th" x="1080" y="40">Fallo que no desaparece</text>

    <g transform="translate(0 65)"><rect class="cell" width="1440" height="105"/><rect class="accent" width="7" height="105"/><text class="row" x="25" y="40">Ensayo aleatorizado</text><text class="p" x="325" y="34"><tspan x="325">Contraste causal bajo</tspan><tspan x="325" dy="25">asignación y estimando</tspan></text><text class="p" x="730" y="34"><tspan x="730">ocultamiento, seguimiento,</tspan><tspan x="730" dy="25">medición y reporte</tspan></text><text class="warn" x="1080" y="34"><tspan x="1080">pérdidas, cruces, desenlace</tspan><tspan x="1080" dy="25">selectivo, poca aplicabilidad</tspan></text></g>
    <g transform="translate(0 170)"><rect class="cell" width="1440" height="105"/><rect class="accent" width="7" height="105"/><text class="row" x="25" y="40">Ensayo quirúrgico</text><text class="p" x="325" y="34"><tspan x="325">Efecto de una ruta técnica</tspan><tspan x="325" dy="25">en operadores definidos</tspan></text><text class="p" x="730" y="34"><tspan x="730">experiencia, calidad, curva,</tspan><tspan x="730" dy="25">centro y comparador creíble</tspan></text><text class="warn" x="1080" y="34"><tspan x="1080">preferencias, agrupamiento,</tspan><tspan x="1080" dy="25">evolución de la técnica</tspan></text></g>
    <g transform="translate(0 275)"><rect class="cell" width="1440" height="105"/><rect class="accent" width="7" height="105"/><text class="row" x="25" y="40">Cohorte / registro</text><text class="p" x="325" y="34"><tspan x="325">Práctica, daños raros y</tspan><tspan x="325" dy="25">efecto bajo supuestos</tspan></text><text class="p" x="730" y="34"><tspan x="730">ensayo objetivo, tiempo cero,</tspan><tspan x="730" dy="25">confusores y sensibilidad</tspan></text><text class="warn" x="1080" y="34"><tspan x="1080">confusión no medida, selección,</tspan><tspan x="1080" dy="25">sesgo de tiempo inmortal</tspan></text></g>
    <g transform="translate(0 380)"><rect class="cell" width="1440" height="105"/><rect class="accent" width="7" height="105"/><text class="row" x="25" y="40">Revisión sistemática</text><text class="p" x="325" y="34"><tspan x="325">Mapa y síntesis explícita</tspan><tspan x="325" dy="25">de resultados comparables</tspan></text><text class="p" x="730" y="34"><tspan x="730">protocolo, búsqueda, sesgo,</tspan><tspan x="730" dy="25">heterogeneidad y dependencia</tspan></text><text class="warn" x="1080" y="34"><tspan x="1080">publicación selectiva y</tspan><tspan x="1080" dy="25">promedio sin mecanismo</tspan></text></g>
    <g transform="translate(0 485)"><rect class="cell" width="1440" height="105"/><rect class="accent" width="7" height="105"/><text class="row" x="25" y="40">Guía de reporte</text><text class="p" x="325" y="34"><tspan x="325">Descripción transparente</tspan><tspan x="325" dy="25">de plan, estudio o revisión</tspan></text><text class="p" x="730" y="34"><tspan x="730">versión, checklist y acceso</tspan><tspan x="730" dy="25">a protocolo / materiales</tspan></text><text class="warn" x="1080" y="34"><tspan x="1080">descripción completa de un</tspan><tspan x="1080" dy="25">diseño todavía deficiente</tspan></text></g>
  </g>
  <text class="foot" x="80" y="840">El método se elige por la pregunta. La certeza se juzga por desenlace y cadena, no por el nombre de la fila.</text>
</svg>
