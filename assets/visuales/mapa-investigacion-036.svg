<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de evidencia de los primeros homininos</title>
  <desc id="desc">Diagrama que separa edad, asociación, anatomía funcional, paleoambiente y filogenia para Sahelanthropus, Orrorin y Ardipithecus, y evita convertir una ruta en ancestro directo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131f"/><stop offset="1" stop-color="#151526"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9a85f"/><stop offset="1" stop-color="#f1d49d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#61c4c1"/></marker>
    <style>
      .h{font:700 34px system-ui,Segoe UI,sans-serif;fill:#f5e8ce}.s{font:500 20px system-ui,Segoe UI,sans-serif;fill:#c9d6df}.k{font:700 22px system-ui,Segoe UI,sans-serif;fill:#08131f}.b{font:600 20px system-ui,Segoe UI,sans-serif;fill:#f4ead8}.n{font:500 17px system-ui,Segoe UI,sans-serif;fill:#b9cad5}.tag{font:700 15px system-ui,Segoe UI,sans-serif;letter-spacing:1.2px;fill:#61c4c1}.line{stroke:#61c4c1;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="260" fill="#193047" opacity=".35"/><circle cx="120" cy="900" r="260" fill="#342543" opacity=".3"/>
  <text x="80" y="75" class="h">Primeros homininos: cinco archivos que no se sustituyen</text>
  <text x="80" y="112" class="s">Edad, pertenencia, función, ambiente y parentesco responden preguntas distintas.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="270" height="155" rx="22" fill="#d9a85f"/>
    <text x="98" y="205" class="k">1 · CONTEXTO</text><text x="98" y="242" class="k">Y EDAD</text>
    <text x="98" y="278" style="font:600 17px system-ui;fill:#29313a">toba · polaridad · sedimento</text>
    <rect x="385" y="165" width="270" height="155" rx="22" fill="#153147" stroke="#61c4c1" stroke-width="2"/>
    <text x="413" y="205" class="b">2 · ASOCIACIÓN</text><text x="413" y="242" class="b">TAFONÓMICA</text>
    <text x="413" y="278" class="n">articulación · localidad · retrabajo</text>
    <rect x="700" y="165" width="270" height="155" rx="22" fill="#153147" stroke="#61c4c1" stroke-width="2"/>
    <text x="728" y="205" class="b">3 · FORMA</text><text x="728" y="242" class="b">Y FUNCIÓN</text>
    <text x="728" y="278" class="n">CT · cortical · biomecánica</text>
    <rect x="1015" y="165" width="220" height="155" rx="22" fill="#153147" stroke="#61c4c1" stroke-width="2"/>
    <text x="1043" y="205" class="b">4 · AMBIENTE</text><text x="1043" y="242" class="b">LOCAL</text>
    <text x="1043" y="278" class="n">fitolitos · fauna · δ¹³C</text>
    <rect x="1280" y="165" width="250" height="155" rx="22" fill="#d9a85f"/>
    <text x="1308" y="205" class="k">5 · FILOGENIA</text><text x="1308" y="242" class="k">CONDICIONADA</text>
    <text x="1308" y="278" style="font:600 14px system-ui;fill:#29313a">caracteres · outgroups · matriz</text>
  </g>
  <path d="M340 242H378" class="line"/><path d="M655 242H693" class="line"/><path d="M970 242H1008" class="line"/><path d="M1235 242H1273" class="line"/>

  <text x="70" y="385" class="tag">TRES EXPEDIENTES, NINGUNA ESCALERA</text>
  <g filter="url(#shadow)">
    <rect x="70" y="420" width="460" height="340" rx="24" fill="#102334" stroke="#4f98a3" stroke-width="2"/>
    <rect x="90" y="440" width="178" height="36" rx="18" fill="#4f98a3"/><text x="111" y="465" class="k" style="font-size:18px">~7 Ma · CHAD</text>
    <text x="95" y="520" class="h" style="font-size:28px">Sahelanthropus</text>
    <text x="95" y="561" class="b">cráneo deformado</text><text x="95" y="591" class="n">→ reconstrucción de base</text>
    <text x="95" y="633" class="b">fémur + 2 ulnae</text><text x="95" y="663" class="n">→ misma localidad, no articulados</text>
    <text x="95" y="705" class="b">2026: señales bípedas + forma Pan</text>
    <rect x="95" y="724" width="388" height="1" fill="#426579"/><text x="95" y="748" class="n">límite: asociación y exclusividad del rasgo</text>

    <rect x="570" y="420" width="460" height="340" rx="24" fill="#102334" stroke="#4f98a3" stroke-width="2"/>
    <rect x="590" y="440" width="186" height="36" rx="18" fill="#4f98a3"/><text x="611" y="465" class="k" style="font-size:18px">~6 Ma · KENIA</text>
    <text x="595" y="520" class="h" style="font-size:28px">Orrorin</text>
    <text x="595" y="561" class="b">holotipo dental</text><text x="595" y="591" class="n">→ taxonomía del hipodigma</text>
    <text x="595" y="633" class="b">fémures de varios individuos</text><text x="595" y="663" class="n">→ carga bípeda y forma mosaico</text>
    <text x="595" y="705" class="b">edad precisa sólo por sección</text>
    <rect x="595" y="724" width="388" height="1" fill="#426579"/><text x="595" y="748" class="n">límite: hipodigma ≠ genealogía directa</text>

    <rect x="1070" y="420" width="460" height="340" rx="24" fill="#102334" stroke="#4f98a3" stroke-width="2"/>
    <rect x="1090" y="440" width="310" height="36" rx="18" fill="#4f98a3"/><text x="1111" y="465" class="k" style="font-size:18px">5.8–4.4 Ma · ETIOPÍA</text>
    <text x="1095" y="520" class="h" style="font-size:28px">Ardipithecus</text>
    <text x="1095" y="561" class="b">kadabba: dientes + pocos huesos</text><text x="1095" y="591" class="n">→ afinidad probable, locomoción escasa</text>
    <text x="1095" y="633" class="b">ramidus: esqueleto parcial asociado</text><text x="1095" y="663" class="n">→ bipedalismo + prensión + trepa</text>
    <text x="1095" y="705" class="b">mano/talus reabren suspensión vertical</text>
    <rect x="1095" y="724" width="388" height="1" fill="#426579"/><text x="1095" y="748" class="n">límite: reconstrucción y modelo comparativo</text>
  </g>

  <rect x="70" y="815" width="1460" height="115" rx="24" fill="#241d2e" stroke="#d9a85f" stroke-width="2"/>
  <text x="100" y="855" class="tag" style="fill:#e7bb73">RESULTADO PERMITIDO</text>
  <text x="100" y="893" class="b">Repertorios locomotores mosaico cerca del origen hominino; Ardipithecus tiene la asociación corporal más fuerte.</text>
  <text x="100" y="920" class="n">No se obtiene una línea Sahelanthropus → Orrorin → Ardipithecus → humanos ni un ancestro común identificado.</text>
  <text x="1265" y="973" class="tag">INV 036 · AUDITADO</text>
</svg>
