<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde la observación hasta la atribución de un agente</title>
  <desc id="desc">Siete capas conectadas pero no automáticas: observación, aislamiento, cultivo, reproducción experimental, epidemiología, mecanismo y atribución. Cada transición conserva un cortafuego: presencia no es causa, cultivo no es enfermedad, modelo no es persona, asociación no es mecanismo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101718"/><stop offset="1" stop-color="#1b2422"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8f0f1"/><stop offset="1" stop-color="#cbdad7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6 0 12Z" fill="#e4c77a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="240" fill="#24434a" opacity=".3"/>
  <circle cx="115" cy="850" r="250" fill="#3c6f63" opacity=".18"/>
  <text x="92" y="92" fill="#8fd3c6" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-022 · CADENA DE INFERENCIA</text>
  <text x="92" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="44" font-weight="700">Un microbio aislado no explica una enfermedad</text>
  <text x="92" y="198" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="24">Observar, aislar, cultivar, inocular, contar y explicar son evidencias distintas; ninguna hereda a las demás.</text>
  <path d="M205 390H1395" stroke="#e4c77a" stroke-width="4" stroke-dasharray="8 10" opacity=".7"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">01</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Observación</text><text x="24" y="166" fill="#4c5250" font-size="17"><tspan x="24" dy="0">tejido · tinción</tspan><tspan x="24" dy="25">presencia</tspan><tspan x="24" dy="25">¿y los sanos?</tspan></text></g>
    <g transform="translate(282 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">02</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Aislamiento</text><text x="24" y="166" fill="#4c5250" font-size="17"><tspan x="24" dy="0">separar</tspan><tspan x="24" dy="25">candidato</tspan><tspan x="24" dy="25">residente o no</tspan></text></g>
    <g transform="translate(494 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">03</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Cultivo</text><text x="24" y="166" fill="#4c5250" font-size="17"><tspan x="24" dy="0">medio · placa</tspan><tspan x="24" dy="25">cepa pura</tspan><tspan x="24" dy="25">lo no cultivable</tspan></text></g>
    <g transform="translate(706 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">04</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Experimento</text><text x="24" y="166" fill="#4c5250" font-size="17"><tspan x="24" dy="0">huésped · vía</tspan><tspan x="24" dy="25">dosis</tspan><tspan x="24" dy="25">daño inducido</tspan></text></g>
    <g transform="translate(918 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">05</text><text x="24" y="92" fill="#1f211e" font-size="19" font-weight="700">Epidemiología</text><text x="24" y="166" fill="#4c5250" font-size="17"><tspan x="24" dy="0">expuestos</tspan><tspan x="24" dy="25">denominador</tspan><tspan x="24" dy="25">portadores sanos</tspan></text></g>
    <g transform="translate(1130 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">06</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Mecanismo</text><text x="24" y="166" fill="#4c5250" font-size="17"><tspan x="24" dy="0">toxina · gen</tspan><tspan x="24" dy="25">comunidad</tspan><tspan x="24" dy="25">respuesta inmune</tspan></text></g>
    <g transform="translate(1342 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">07</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Atribución</text><text x="24" y="166" fill="#4c5250" font-size="17"><tspan x="24" dy="0">qué fracción</tspan><tspan x="24" dy="25">en qué huésped</tspan><tspan x="24" dy="25">revisable</tspan></text></g>
  </g>
  <g stroke="#e4c77a" stroke-width="4" marker-end="url(#arrow)"><path d="M260 390H278"/><path d="M472 390H490"/><path d="M684 390H702"/><path d="M896 390H914"/><path d="M1108 390H1126"/><path d="M1320 390H1338"/></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#f0dcae" text-anchor="middle">
    <text x="271" y="550"><tspan x="271">presencia ≠</tspan><tspan x="271" dy="21">causa</tspan></text>
    <text x="483" y="550"><tspan x="483">aislado ≠</tspan><tspan x="483" dy="21">patógeno</tspan></text>
    <text x="695" y="550"><tspan x="695">cultivo ≠</tspan><tspan x="695" dy="21">enfermedad</tspan></text>
    <text x="907" y="550"><tspan x="907">modelo ≠</tspan><tspan x="907" dy="21">persona</tspan></text>
    <text x="1119" y="550"><tspan x="1119">asociación ≠</tspan><tspan x="1119" dy="21">mecanismo</tspan></text>
    <text x="1331" y="550"><tspan x="1331">mecanismo ≠</tspan><tspan x="1331" dy="21">atribución</tspan></text>
  </g>
  <rect x="92" y="645" width="1416" height="150" rx="24" fill="#0f1414" stroke="#4f8a80" stroke-width="2"/>
  <text x="125" y="696" fill="#8fd3c6" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CONVERGENCIA LEGÍTIMA</text>
  <text x="125" y="744" fill="#f4f1e8" font-family="Georgia, serif" font-size="28">La confianza crece cuando tejido, cultivo, modelo, población y mecanismo coinciden</text>
  <text x="125" y="778" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="19">y cada uno declara su límite; disminuye cuando un hallazgo, una placa o una secuencia sustituyen al denominador.</text>
  <text x="1505" y="850" fill="#7f8c88" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Diagrama editorial · historia de la evidencia, sin indicaciones clínicas ni dosis</text>
</svg>
