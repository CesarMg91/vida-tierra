<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Rutas ramificadas de evolución estelar</title>
  <desc id="desc">Diagrama conceptual reproducible que muestra nacimiento por acreción, secuencia principal y rutas hacia gigantes, enanas blancas, colapso de núcleo, estrellas de neutrones y agujeros negros, modificadas por composición, rotación, pérdida de masa y binariedad. No fija umbrales de masa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#17172a"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset=".45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="giant" cx="46%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset=".5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#91a7c6"/>
    </marker>
    <marker id="branchArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/>
    </marker>
    <marker id="modelArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f5b86b"/>
    </marker>
    <style>
      .title{font:700 40px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}
      .sub{font:400 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#aebbd0}
      .label{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f5f8ff}
      .labelSmall{font:700 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f5f8ff}
      .text{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#bec9dc}
      .tiny{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9fe7dc}
      .cap{font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#7dd3fc;letter-spacing:1.3px}
      .box{fill:#111e33;stroke:#314761;stroke-width:1.5;rx:18;filter:url(#shadow)}
      .birth{fill:#102c32;stroke:#2dd4bf}
      .normal{fill:#1f2942;stroke:#fbbf24}
      .low{fill:#24203a;stroke:#c084fc}
      .high{fill:#321f2d;stroke:#fb7185}
      .compact{fill:#12243d;stroke:#60a5fa}
      .modifier{fill:#33271e;stroke:#f59e0b}
      .flow{fill:none;stroke:#91a7c6;stroke-width:3;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#branchArrow)}
      .model{fill:none;stroke:#f5b86b;stroke-width:2.2;stroke-dasharray:9 7;marker-end:url(#modelArrow)}
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1490" cy="100" r="240" fill="#7c3aed" opacity=".08"/>
  <circle cx="90" cy="890" r="280" fill="#0f766e" opacity=".09"/>
  <text x="70" y="65" class="title">Rutas estelares: una familia de historias, no un ciclo único</text>
  <text x="70" y="100" class="sub">La masa inicial organiza; composición, rotación, pérdida de masa y compañeras redistribuyen las rutas. Sin umbrales universales.</text>

  <text x="70" y="153" class="cap">FORMACIÓN OBSERVADA</text>
  <text x="590" y="153" class="cap">ESTADO ESTABLE Y DIVERGENCIA</text>
  <text x="1110" y="153" class="cap">REMANENTES</text>

  <!-- Formación -->
  <rect x="70" y="185" width="310" height="150" class="box birth"/>
  <path d="M105 260 C145 205 215 205 250 258 C285 300 340 278 352 315 C315 330 118 330 88 305 C80 287 88 270 105 260Z" fill="#23334b" opacity=".9"/>
  <circle cx="220" cy="270" r="21" fill="#fde68a" filter="url(#glow)"/>
  <ellipse cx="220" cy="271" rx="66" ry="17" fill="none" stroke="#f59e0b" stroke-width="5" transform="rotate(-8 220 271)"/>
  <path d="M216 249 L204 205 M224 249 L237 205 M216 292 L202 329 M225 292 L241 329" stroke="#67e8f9" stroke-width="4" opacity=".8"/>
  <text x="95" y="218" class="label">Nube densa → protostrella</text>
  <text x="95" y="242" class="text">infall + disco + outflow</text>

  <path class="flow" d="M380 260 C435 260 465 260 520 260"/>

  <rect x="520" y="185" width="320" height="150" class="box normal"/>
  <circle cx="608" cy="264" r="46" fill="url(#star)" filter="url(#glow)"/>
  <text x="682" y="224" class="label">Secuencia principal</text>
  <text x="682" y="251" class="text">equilibrio hidrostático</text>
  <text x="682" y="275" class="text">fusión H → He</text>
  <text x="682" y="300" class="tiny">masa dinámica + neutrinos + población</text>

  <path class="branch" d="M840 240 C910 240 930 230 980 230"/>
  <path class="branch" d="M840 290 C910 290 930 510 980 510"/>

  <!-- Low/intermediate branch -->
  <rect x="980" y="175" width="290" height="150" class="box low"/>
  <circle cx="1052" cy="250" r="52" fill="url(#giant)" filter="url(#glow)"/>
  <circle cx="1052" cy="250" r="72" fill="none" stroke="#fb923c" stroke-width="2" opacity=".4"/>
  <text x="1120" y="216" class="label">Gigante / AGB</text>
  <text x="1120" y="243" class="text">interior estratificado</text>
  <text x="1120" y="267" class="text">pérdida de envoltura</text>
  <text x="1120" y="292" class="tiny">ruta común, no exclusiva</text>

  <path class="branch" d="M1270 250 C1320 250 1334 250 1380 250"/>
  <rect x="1380" y="175" width="150" height="150" class="box compact"/>
  <circle cx="1455" cy="235" r="20" fill="#f8fafc" filter="url(#glow)"/>
  <ellipse cx="1455" cy="235" rx="48" ry="35" fill="none" stroke="#a78bfa" stroke-width="3" opacity=".65"/>
  <text x="1455" y="286" text-anchor="middle" class="label">Enana blanca</text>
  <text x="1455" y="309" text-anchor="middle" class="tiny">masa–radio + IFMR</text>

  <!-- Massive branch -->
  <rect x="980" y="435" width="290" height="150" class="box high"/>
  <circle cx="1050" cy="510" r="55" fill="#b91c1c" opacity=".8" filter="url(#glow)"/>
  <path d="M1050 444 L1061 480 L1090 456 L1076 492 L1118 484 L1083 508 L1118 530 L1075 525 L1088 564 L1059 538 L1048 576 L1037 538 L1006 565 L1022 525 L980 533 L1016 508 L981 483 L1022 492 L1007 456 L1038 480Z" fill="#fb7185" opacity=".45"/>
  <text x="1120" y="476" class="label">Colapso de núcleo</text>
  <text x="1120" y="503" class="text">supernova visible, débil</text>
  <text x="1120" y="527" class="text">o colapso con fallback</text>
  <text x="1120" y="552" class="tiny">neutrinos + progenitor</text>

  <path class="branch" d="M1270 480 C1315 480 1322 420 1370 420"/>
  <path class="branch" d="M1270 540 C1315 540 1322 610 1370 610"/>

  <rect x="1370" y="355" width="160" height="135" class="box compact"/>
  <circle cx="1450" cy="408" r="24" fill="#93c5fd" filter="url(#glow)"/>
  <path d="M1450 384 L1450 352 M1450 432 L1450 464" stroke="#67e8f9" stroke-width="6" opacity=".75"/>
  <ellipse cx="1450" cy="408" rx="53" ry="15" fill="none" stroke="#60a5fa" stroke-width="2" transform="rotate(22 1450 408)"/>
  <text x="1450" y="451" text-anchor="middle" class="labelSmall">Estrella de</text>
  <text x="1450" y="470" text-anchor="middle" class="labelSmall">neutrones</text>
  <text x="1450" y="486" text-anchor="middle" class="tiny">timing + dinámica</text>

  <rect x="1370" y="545" width="160" height="135" class="box compact"/>
  <circle cx="1450" cy="599" r="29" fill="#020617" stroke="#f59e0b" stroke-width="5"/>
  <ellipse cx="1450" cy="599" rx="62" ry="22" fill="none" stroke="#fb923c" stroke-width="5" transform="rotate(-12 1450 599)"/>
  <text x="1450" y="651" text-anchor="middle" class="label">Agujero negro</text>
  <text x="1450" y="672" text-anchor="middle" class="tiny">masa dinámica, no luz propia</text>

  <!-- Modifiers -->
  <rect x="70" y="710" width="1460" height="194" class="box modifier"/>
  <text x="100" y="752" class="cap">MODIFICADORES QUE IMPIDEN UNA FRONTERA ÚNICA</text>

  <g>
    <rect x="100" y="782" width="245" height="78" rx="16" fill="#171e2d" stroke="#f59e0b"/>
    <text x="222" y="814" text-anchor="middle" class="label">Composición</text>
    <text x="222" y="839" text-anchor="middle" class="text">opacidad · redes · vientos</text>

    <rect x="380" y="782" width="245" height="78" rx="16" fill="#171e2d" stroke="#f59e0b"/>
    <text x="502" y="814" text-anchor="middle" class="label">Rotación y campos</text>
    <text x="502" y="839" text-anchor="middle" class="text">mezcla · forma · transporte</text>

    <rect x="660" y="782" width="245" height="78" rx="16" fill="#171e2d" stroke="#f59e0b"/>
    <text x="782" y="814" text-anchor="middle" class="label">Pérdida de masa</text>
    <text x="782" y="839" text-anchor="middle" class="text">viento · pulsos · fallback</text>

    <rect x="940" y="782" width="245" height="78" rx="16" fill="#171e2d" stroke="#f59e0b"/>
    <text x="1062" y="814" text-anchor="middle" class="label">Binariedad</text>
    <text x="1062" y="839" text-anchor="middle" class="text">transferencia · fusión · despojo</text>

    <rect x="1220" y="782" width="275" height="78" rx="16" fill="#171e2d" stroke="#f59e0b"/>
    <text x="1357" y="814" text-anchor="middle" class="label">Explosión y ambiente</text>
    <text x="1357" y="839" text-anchor="middle" class="text">asimetría · compañera · metalicidad</text>
  </g>

  <path class="model" d="M222 782 C250 690 610 650 650 335"/>
  <path class="model" d="M502 782 C540 700 730 680 740 335"/>
  <path class="model" d="M782 782 C810 690 1060 650 1080 585"/>
  <path class="model" d="M1062 782 C1080 700 1180 690 1210 585"/>
  <path class="model" d="M1357 782 C1370 735 1440 715 1450 680"/>

  <text x="70" y="948" class="sub">Flecha = ruta respaldada para parte de la población. No expresa escala temporal, porcentaje, destino inevitable ni umbral exacto de masa.</text>
</svg>
