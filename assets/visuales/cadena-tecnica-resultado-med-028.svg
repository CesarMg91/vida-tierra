<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde la técnica hasta el resultado quirúrgico</title>
  <desc id="desc">Siete capas conectadas pero no automáticas: técnica → operador → equipo → industria → aprendizaje → comparación → resultado. Cada transición conserva un cortafuego: técnica no es operador, operador no es sistema, equipo no es beneficio, dispositivo no es evidencia, curva no es efecto y serie no es comparación; una incisión más pequeña no es un desenlace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121719"/><stop offset="1" stop-color="#1d2224"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8eef1"/><stop offset="1" stop-color="#cad7dc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6 0 12Z" fill="#d38a5c"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="240" fill="#26404d" opacity=".3"/>
  <circle cx="115" cy="850" r="250" fill="#8a4a2e" opacity=".18"/>
  <text x="92" y="92" fill="#94c9dc" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-028 · CADENA DE INFERENCIA</text>
  <text x="92" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="44" font-weight="700">Una incisión más pequeña no demuestra una operación mejor</text>
  <text x="92" y="198" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="24">técnica → operador → equipo → industria → aprendizaje → comparación → resultado</text>
  <path d="M205 390H1395" stroke="#d38a5c" stroke-width="4" stroke-dasharray="8 10" opacity=".7"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#26404d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">01</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">técnica</text><text x="24" y="166" fill="#4c5250" font-size="16"><tspan x="24" dy="0">radical · abierta</tspan><tspan x="24" dy="25">laparoscopia</tspan><tspan x="24" dy="25">robot</tspan></text></g>
    <g transform="translate(282 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#26404d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">02</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">operador</text><text x="24" y="166" fill="#4c5250" font-size="16"><tspan x="24" dy="0">Halsted</tspan><tspan x="24" dy="25">caso 1 · caso 50</tspan><tspan x="24" dy="25">habilidad en video</tspan></text></g>
    <g transform="translate(494 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#26404d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">03</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">equipo</text><text x="24" y="166" fill="#4c5250" font-size="16"><tspan x="24" dy="0">perfusión</tspan><tspan x="24" dy="25">hospital</tspan><tspan x="24" dy="25">rescate</tspan></text></g>
    <g transform="translate(706 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#26404d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">04</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">industria</text><text x="24" y="166" fill="#4c5250" font-size="16"><tspan x="24" dy="0">IBM · láser</tspan><tspan x="24" dy="25">programa robótico</tspan><tspan x="24" dy="25">conflictos</tspan></text></g>
    <g transform="translate(918 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#26404d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">05</text><text x="24" y="92" fill="#1f211e" font-size="20" font-weight="700">aprendizaje</text><text x="24" y="166" fill="#4c5250" font-size="16"><tspan x="24" dy="0">pirámide</tspan><tspan x="24" dy="25">curva biliar</tspan><tspan x="24" dy="25">ilusión</tspan></text></g>
    <g transform="translate(1130 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#26404d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">06</text><text x="24" y="92" fill="#1f211e" font-size="20" font-weight="700">comparación</text><text x="24" y="166" fill="#4c5250" font-size="16"><tspan x="24" dy="0">NSABP · COST</tspan><tspan x="24" dy="25">LACC · REAL</tspan><tspan x="24" dy="25">simulacro</tspan></text></g>
    <g transform="translate(1342 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#26404d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">07</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">resultado</text><text x="24" y="166" fill="#4c5250" font-size="16"><tspan x="24" dy="0">supervivencia</tspan><tspan x="24" dy="25">recurrencia</tspan><tspan x="24" dy="25">función</tspan></text></g>
  </g>
  <g stroke="#d38a5c" stroke-width="4" marker-end="url(#arrow)"><path d="M260 390H278"/><path d="M472 390H490"/><path d="M684 390H702"/><path d="M896 390H914"/><path d="M1108 390H1126"/><path d="M1320 390H1338"/></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#f0c8b0" text-anchor="middle">
    <text x="271" y="550"><tspan x="271">técnica ≠</tspan><tspan x="271" dy="21">operador</tspan></text>
    <text x="483" y="550"><tspan x="483">operador ≠</tspan><tspan x="483" dy="21">sistema</tspan></text>
    <text x="695" y="550"><tspan x="695">equipo ≠</tspan><tspan x="695" dy="21">beneficio</tspan></text>
    <text x="907" y="550"><tspan x="907">dispositivo ≠</tspan><tspan x="907" dy="21">evidencia</tspan></text>
    <text x="1119" y="550"><tspan x="1119">curva ≠</tspan><tspan x="1119" dy="21">efecto</tspan></text>
    <text x="1331" y="550"><tspan x="1331">serie ≠</tspan><tspan x="1331" dy="21">comparación</tspan></text>
  </g>
  <rect x="92" y="645" width="1416" height="150" rx="24" fill="#0f1414" stroke="#4f7f8a" stroke-width="2"/>
  <text x="125" y="696" fill="#94c9dc" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CONVERGENCIA LEGÍTIMA</text>
  <text x="125" y="744" fill="#f4f1e8" font-family="Georgia, serif" font-size="28">Ningún eslabón hereda la fuerza del siguiente: incisión no es desenlace.</text>
  <text x="125" y="778" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="19">Una técnica que se difunde, un volumen alto o una mejoría tras operar no sustituyen una comparación.</text>
  <text x="1505" y="850" fill="#7f8c88" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Diagrama editorial · historia de la evidencia, sin recomendaciones clínicas ni preferencias de técnica</text>
</svg>
