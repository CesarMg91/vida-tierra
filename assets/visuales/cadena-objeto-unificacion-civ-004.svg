<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Del objeto a la «unificación»: operaciones y saltos</title>
  <desc id="desc">Seis cajas conectadas por líneas continuas (operaciones auditadas) desde el objeto hasta el proceso; debajo, arcos discontinuos marcan los saltos que exigen otro archivo: pueblo, año, rey, conquista y «unificación».</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1011"/><stop offset="1" stop-color="#171512"/></linearGradient>
    <style>.k{font:19px Consolas,monospace;letter-spacing:2px;fill:#c39456}.h{font:27px Georgia,serif;fill:#efe3d1}.t{font:19px Arial,sans-serif;fill:#c9c2b8}.l{font:17px Arial,sans-serif;fill:#d6a27b}.small{font:15px Consolas,monospace;fill:#91ad92}.lane{fill:#141a19;stroke:#6f5a3c;stroke-width:1}.node{fill:#27352d;stroke:#779176;stroke-width:1}.rule{stroke:#8b6a43;stroke-width:2}.dash{stroke:#a96545;stroke-width:2;stroke-dasharray:8 8;fill:none}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="96" class="k">CIV-004 · CADENA INFERENCIAL</text>
  <text x="80" y="150" font-family="Georgia,serif" font-size="42" fill="#f2e7d6">Una imagen real no es un acontecimiento</text>
  <text x="80" y="190" class="t">Línea continua: operación auditada. Línea discontinua: salto que exige un archivo independiente.</text>
  <g transform="translate(80 300)"><rect width="215" height="150" fill="#141a19" stroke="#779176"/><text x="18" y="48" class="h">Objeto</text><text x="18" y="88" class="small">tumba, hueso, vasija,</text><text x="18" y="112" class="small">etiqueta, paleta</text></g>
  <g transform="translate(325 300)"><rect width="215" height="150" fill="#141a19" stroke="#779176"/><text x="18" y="48" class="h">Contexto</text><text x="18" y="88" class="small">procedencia y</text><text x="18" y="112" class="small">deposición</text></g>
  <g transform="translate(570 300)"><rect width="215" height="150" fill="#141a19" stroke="#779176"/><text x="18" y="48" class="h">Orden</text><text x="18" y="88" class="small">seriación, estratos,</text><text x="18" y="112" class="small">14C + Bayes</text></g>
  <g transform="translate(815 300)"><rect width="215" height="150" fill="#141a19" stroke="#779176"/><text x="18" y="48" class="h">Fase</text><text x="18" y="88" class="small">bloque Naqada o</text><text x="18" y="112" class="small">intervalo modelado</text></g>
  <g transform="translate(1060 300)"><rect width="215" height="150" fill="#141a19" stroke="#779176"/><text x="18" y="48" class="h">Distribución</text><text x="18" y="88" class="small">prácticas compartidas</text><text x="18" y="112" class="small">entre sitios</text></g>
  <g transform="translate(1305 300)"><rect width="215" height="150" fill="#141a19" stroke="#779176"/><text x="18" y="48" class="h">Proceso</text><text x="18" y="88" class="small">interacción,</text><text x="18" y="112" class="small">apropiación, dominio</text></g>
  <path class="rule" d="M299 375H321"/><path d="M321 369L325 375L321 381" fill="none" stroke="#8b6a43" stroke-width="2"/>
  <path class="rule" d="M544 375H566"/><path d="M566 369L570 375L566 381" fill="none" stroke="#8b6a43" stroke-width="2"/>
  <path class="rule" d="M789 375H811"/><path d="M811 369L815 375L811 381" fill="none" stroke="#8b6a43" stroke-width="2"/>
  <path class="rule" d="M1034 375H1056"/><path d="M1056 369L1060 375L1056 381" fill="none" stroke="#8b6a43" stroke-width="2"/>
  <path class="rule" d="M1279 375H1301"/><path d="M1301 369L1305 375L1301 381" fill="none" stroke="#8b6a43" stroke-width="2"/>
  <path class="dash" d="M187 455C227 560 387 560 432 455"/><text x="257" y="600" class="l">≠ pueblo</text>
  <path class="dash" d="M432 455C472 560 632 560 677 455"/><text x="502" y="600" class="l">≠ año</text>
  <path class="dash" d="M677 455C717 560 877 560 922 455"/><text x="747" y="600" class="l">≠ rey</text>
  <path class="dash" d="M922 455C962 560 1122 560 1167 455"/><text x="992" y="600" class="l">≠ conquista</text>
  <path class="dash" d="M1167 455C1207 560 1367 560 1412 455"/><text x="1237" y="600" class="l">≠ «unificación»</text>
  <text x="80" y="760" class="t">El modelo bayesiano fecha fases y reinados con incertidumbre; ninguna caja fecha una unificación.</text>
</svg>
