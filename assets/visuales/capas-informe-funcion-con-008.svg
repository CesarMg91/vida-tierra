<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro capas: informe, correlato, mecanismo y función; qué se midió en cada una y qué no se sigue</title>
  <desc id="desc">Tabla de cinco filas. Informe: hay informes en REM y no-REM, pero no registran la experiencia sin pérdida. Correlato: PET, zona caliente posterior y comunicación en tiempo real, pero un correlato no es la sede ni la causa. Mecanismo: activación-síntesis frente a teorías prosencefálicas y cognitivas, sin prueba discriminante. Función: amenazas y memoria, sin separar soñar de dormir. Metafísica: sin datos a favor.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1420"/><stop offset="1" stop-color="#16222f"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="92" fill="#9cc1e6" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">CON-008 · CUATRO CAPAS</text>
  <text x="92" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="44" font-weight="700">Lo que se midió y lo que no se sigue</text>
  <text x="320" y="236" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="20" font-weight="700">Qué se midió</text>
  <text x="940" y="236" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="20" font-weight="700">Qué no se sigue</text>
  <text x="92" y="312" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Informe</text>
  <text x="92" y="342" fill="#9cc1e6" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza A</text>
  <rect x="300" y="270" width="600" height="88" rx="12" fill="#e8f1ee"/>
  <text x="320" y="304" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">REM y no-REM producen informes; 34 % frente a 77 % con</text>
  <text x="320" y="329" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">despertares en serie</text>
  <rect x="920" y="270" width="588" height="88" rx="12" fill="#e6ecf5"/>
  <text x="940" y="304" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">que el informe registre la experiencia sin pérdida</text>
  <text x="92" y="416" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Correlato</text>
  <text x="92" y="446" fill="#9cc1e6" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza B</text>
  <rect x="300" y="374" width="600" height="88" rx="12" fill="#f3e6cf"/>
  <text x="320" y="408" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">PET del REM; zona caliente posterior que predice el</text>
  <text x="320" y="433" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">informe; 6 de 36 respondieron en tiempo real</text>
  <rect x="920" y="374" width="588" height="88" rx="12" fill="#e6ecf5"/>
  <text x="940" y="408" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">que la zona sea la sede ni la causa de la experiencia</text>
  <text x="92" y="520" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Mecanismo</text>
  <text x="92" y="550" fill="#9cc1e6" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza C</text>
  <rect x="300" y="478" width="600" height="88" rx="12" fill="#f3e6cf"/>
  <text x="320" y="512" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">activación-síntesis frente a prosencéfalo, dos</text>
  <text x="320" y="537" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">generadores y red por defecto</text>
  <rect x="920" y="478" width="588" height="88" rx="12" fill="#e6ecf5"/>
  <text x="940" y="512" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">que una teoría haya vencido: falta la prueba</text>
  <text x="940" y="537" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">discriminante</text>
  <text x="92" y="624" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Función</text>
  <text x="92" y="654" fill="#9cc1e6" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza C</text>
  <rect x="300" y="582" width="600" height="88" rx="12" fill="#f3e6cf"/>
  <text x="320" y="616" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">más amenazas soñadas tras el trauma; soñar la tarea se</text>
  <text x="320" y="641" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">asocia a mejora</text>
  <rect x="920" y="582" width="588" height="88" rx="12" fill="#e6ecf5"/>
  <text x="940" y="616" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">que soñar, y no dormir, cause el beneficio</text>
  <text x="92" y="728" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Metafísica</text>
  <text x="92" y="758" fill="#9cc1e6" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza E</text>
  <rect x="300" y="686" width="600" height="88" rx="12" fill="#f3d6c8"/>
  <text x="320" y="720" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">relatos de sueños vívidos, premonitorios o con mensajes</text>
  <rect x="920" y="686" width="588" height="88" rx="12" fill="#e6ecf5"/>
  <text x="940" y="720" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">que revelen otra realidad o información que la persona</text>
  <text x="940" y="745" fill="#22302e" font-family="Arial, sans-serif" font-size="19" font-weight="400">no podía conocer</text>
  <text x="92" y="850" fill="#9fb0ab" font-family="Arial, sans-serif" font-size="19">Verde: sólido. Ocre: medido o propuesto con límites serios. Rojo claro: sin datos a favor. No es una guía de inducción ni de interpretación de sueños.</text>
</svg>
