<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde el diseño hasta la decisión</title>
  <desc id="desc">Siete capas conectadas pero no automáticas: diseño, asignación, consentimiento, registro, publicación, síntesis y decisión. Cada transición conserva un cortafuego: diseño no es grupos iguales, asignación no es ética, consentimiento no es justificación, registro no es informe, publicado no es hecho y síntesis no es decisión.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11161b"/><stop offset="1" stop-color="#1b2228"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8edf2"/><stop offset="1" stop-color="#cbd5de"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6 0 12Z" fill="#e0a15f"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="240" fill="#2d3f55" opacity=".3"/>
  <circle cx="115" cy="850" r="250" fill="#8e5a3c" opacity=".18"/>
  <text x="92" y="92" fill="#9cc2d8" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-029 · CADENA DE INFERENCIA</text>
  <text x="92" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="37" font-weight="700">Un ensayo publicado no demuestra una evidencia completa</text>
  <text x="92" y="198" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="22">Diseño, asignación, consentimiento, registro, publicación, síntesis y decisión: ninguna capa hereda a las demás.</text>
  <path d="M205 390H1395" stroke="#e0a15f" stroke-width="4" stroke-dasharray="8 10" opacity=".7"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d3f55"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">01</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Diseño</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">comparación</tspan><tspan x="24" dy="25">desenlace</tspan><tspan x="24" dy="25">fases</tspan></text></g>
    <g transform="translate(282 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d3f55"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">02</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Asignación</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">alternancia</tspan><tspan x="24" dy="25">azar oculto</tspan><tspan x="24" dy="25">previsible</tspan></text></g>
    <g transform="translate(494 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d3f55"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">03</text><text x="24" y="92" fill="#1f211e" font-size="18" font-weight="700">Consentimiento</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">Núremberg</tspan><tspan x="24" dy="25">Belmont</tspan><tspan x="24" dy="25">comités</tspan></text></g>
    <g transform="translate(706 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d3f55"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">04</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Registro</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">ICMJE 2005</tspan><tspan x="24" dy="25">ley 2007</tspan><tspan x="24" dy="25">Helsinki</tspan></text></g>
    <g transform="translate(918 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d3f55"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">05</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Publicación</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">lo hecho</tspan><tspan x="24" dy="25">lo publicado</tspan><tspan x="24" dy="25">desenlaces</tspan></text></g>
    <g transform="translate(1130 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d3f55"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">06</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Síntesis</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">Cochrane</tspan><tspan x="24" dy="25">acumulativo</tspan><tspan x="24" dy="25">GRADE</tspan></text></g>
    <g transform="translate(1342 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d3f55"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">07</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Decisión</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">aprobación</tspan><tspan x="24" dy="25">guía</tspan><tspan x="24" dy="25">paciente</tspan></text></g>
  </g>
  <g stroke="#e0a15f" stroke-width="4" marker-end="url(#arrow)"><path d="M260 390H278"/><path d="M472 390H490"/><path d="M684 390H702"/><path d="M896 390H914"/><path d="M1108 390H1126"/><path d="M1320 390H1338"/></g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#f0d3b0" text-anchor="middle">
    <text x="271" y="550"><tspan x="271">diseño ≠</tspan><tspan x="271" dy="21">grupos iguales</tspan></text>
    <text x="483" y="550"><tspan x="483">asignación ≠</tspan><tspan x="483" dy="21">ética</tspan></text>
    <text x="695" y="550"><tspan x="695">consentimiento ≠</tspan><tspan x="695" dy="21">justificación</tspan></text>
    <text x="907" y="550"><tspan x="907">registro ≠</tspan><tspan x="907" dy="21">informe</tspan></text>
    <text x="1119" y="550"><tspan x="1119">publicado ≠</tspan><tspan x="1119" dy="21">hecho</tspan></text>
    <text x="1331" y="550"><tspan x="1331">síntesis ≠</tspan><tspan x="1331" dy="21">decisión</tspan></text>
  </g>
  <rect x="92" y="645" width="1416" height="150" rx="24" fill="#0f1317" stroke="#5b7f9a" stroke-width="2"/>
  <text x="125" y="696" fill="#9cc2d8" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CONVERGENCIA LEGÍTIMA</text>
  <text x="125" y="744" fill="#f4f1e8" font-family="Georgia, serif" font-size="25">La confianza crece cuando asignación oculta, consentimiento, registro y publicación completa coinciden;</text>
  <text x="125" y="778" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="19">disminuye cuando un ensayo célebre, una aprobación, lo publicado o un meta-análisis sustituyen a las capas que faltan.</text>
  <text x="1505" y="850" fill="#7f8c88" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Diagrama editorial · historia de la evidencia, sin indicaciones clínicas ni dosis</text>
</svg>
