<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde la infraestructura hasta el daño</title>
  <desc id="desc">Siete capas conectadas pero no automáticas: infraestructura, procedimiento, serie, comparación, protocolo, resultado y daño. Cada transición conserva un cortafuego: infraestructura no es resultado, posible no es beneficioso, serie no es efecto, asociación no es protocolo probado, meta no es desenlace y sobrevivir no es estar sin daño.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121719"/><stop offset="1" stop-color="#1c2422"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e6eef0"/><stop offset="1" stop-color="#c9d8d6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6 0 12Z" fill="#d9785b"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="240" fill="#24434a" opacity=".3"/>
  <circle cx="115" cy="850" r="250" fill="#8e3f2e" opacity=".18"/>
  <text x="92" y="92" fill="#8fd3c6" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-026 · CADENA DE INFERENCIA</text>
  <text x="92" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="44" font-weight="700">Una fisiología sostenida no demuestra una vida salvada</text>
  <text x="92" y="198" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="24">Infraestructura, procedimiento, serie, comparación, protocolo, resultado y daño: ninguna capa hereda a las demás.</text>
  <path d="M205 390H1395" stroke="#d9785b" stroke-width="4" stroke-dasharray="8 10" opacity=".7"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">01</text><text x="24" y="92" fill="#1f211e" font-size="20" font-weight="700">Infraestructura</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">grupos · citrato</tspan><tspan x="24" dy="25">banco · respirador</tspan><tspan x="24" dy="25">sistema regional</tspan></text></g>
    <g transform="translate(282 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">02</text><text x="24" y="92" fill="#1f211e" font-size="20" font-weight="700">Procedimiento</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">transfusión</tspan><tspan x="24" dy="25">traqueostomía</tspan><tspan x="24" dy="25">catéter</tspan></text></g>
    <g transform="translate(494 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">03</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Serie</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">casos listados</tspan><tspan x="24" dy="25">antes-después</tspan><tspan x="24" dy="25">registro</tspan></text></g>
    <g transform="translate(706 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">04</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Comparación</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">azar · ajuste</tspan><tspan x="24" dy="25">tiempo modelado</tspan><tspan x="24" dy="25">comparador</tspan></text></g>
    <g transform="translate(918 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">05</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Protocolo</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">triaje · guía</tspan><tspan x="24" dy="25">proporción · meta</tspan><tspan x="24" dy="25">fecha de adopción</tspan></text></g>
    <g transform="translate(1130 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">06</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Resultado</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">vida · muerte</tspan><tspan x="24" dy="25">plazo</tspan><tspan x="24" dy="25">función</tspan></text></g>
    <g transform="translate(1342 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#24434a"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">07</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Daño</text><text x="24" y="166" fill="#4c5250" font-size="18"><tspan x="24" dy="0">infección</tspan><tspan x="24" dy="25">ventilador</tspan><tspan x="24" dy="25">secuelas</tspan></text></g>
  </g>
  <g stroke="#d9785b" stroke-width="4" marker-end="url(#arrow)"><path d="M260 390H278"/><path d="M472 390H490"/><path d="M684 390H702"/><path d="M896 390H914"/><path d="M1108 390H1126"/><path d="M1320 390H1338"/></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#f0c8b8" text-anchor="middle">
    <text x="271" y="550"><tspan x="271">infraestructura ≠</tspan><tspan x="271" dy="21">resultado</tspan></text>
    <text x="483" y="550"><tspan x="483">posible ≠</tspan><tspan x="483" dy="21">beneficioso</tspan></text>
    <text x="695" y="550"><tspan x="695">serie ≠</tspan><tspan x="695" dy="21">efecto</tspan></text>
    <text x="907" y="550"><tspan x="907">asociación ≠</tspan><tspan x="907" dy="21">protocolo probado</tspan></text>
    <text x="1119" y="550"><tspan x="1119">meta ≠</tspan><tspan x="1119" dy="21">desenlace</tspan></text>
    <text x="1331" y="550"><tspan x="1331">sobrevivir ≠</tspan><tspan x="1331" dy="21">sin daño</tspan></text>
  </g>
  <rect x="92" y="645" width="1416" height="150" rx="24" fill="#0f1414" stroke="#4f8a80" stroke-width="2"/>
  <text x="125" y="696" fill="#8fd3c6" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CONVERGENCIA LEGÍTIMA</text>
  <text x="125" y="744" fill="#f4f1e8" font-family="Georgia, serif" font-size="28">La confianza crece cuando cadenas independientes coinciden y declaran comparador, tiempo,</text>
  <text x="125" y="778" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="19">desenlace y daño; disminuye cuando un registro, una hora de oro, un monitor o una meta sustituyen a la comparación.</text>
  <text x="1505" y="850" fill="#7f8c88" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Diagrama editorial · historia de la evidencia, sin indicaciones clínicas, umbrales ni dosis</text>
</svg>
