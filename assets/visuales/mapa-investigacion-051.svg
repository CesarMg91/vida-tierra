<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Investigación 051: archivos, mediciones e inferencias</title>
  <desc id="desc">Matriz de seis cadenas epistemológicas. Cada fila separa archivo material, medición, resultado limitado, puente adicional y conclusión que no se hereda.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a20"/>
      <stop offset="1" stop-color="#19252c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#79b8b1"/>
    </marker>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf3f1}.muted{fill:#a9bbb9}.head{font-size:18px;font-weight:700;letter-spacing:1.4px}.body{font-size:17px;font-weight:650}.small{font-size:14px}.tiny{font-size:13px}.box{stroke-width:1.5}.flow{fill:none;stroke:#79b8b1;stroke-width:2;marker-end:url(#arrow)}.gate{fill:none;stroke:#d7a657;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="150" fill="#244047" opacity=".22"/>
  <circle cx="120" cy="820" r="190" fill="#283b35" opacity=".20"/>

  <text class="t" x="60" y="58" font-size="31" font-weight="760">Investigación 051 · del archivo a la forma política</text>
  <text class="t muted" x="60" y="91" font-size="17">Seis cadenas independientes: medir una fila no completa las demás ni produce una escala de «civilización».</text>

  <g class="t head">
    <rect x="60" y="126" width="245" height="50" rx="10" fill="#21343b" stroke="#46666a"/>
    <rect x="335" y="126" width="245" height="50" rx="10" fill="#21343b" stroke="#46666a"/>
    <rect x="610" y="126" width="265" height="50" rx="10" fill="#21343b" stroke="#46666a"/>
    <rect x="905" y="126" width="280" height="50" rx="10" fill="#3b3324" stroke="#9a7540"/>
    <rect x="1215" y="126" width="325" height="50" rx="10" fill="#3b2828" stroke="#8b5555"/>
    <text x="182.5" y="158" text-anchor="middle">ARCHIVO</text>
    <text x="457.5" y="158" text-anchor="middle">MEDICIÓN</text>
    <text x="742.5" y="158" text-anchor="middle">RESULTADO LIMITADO</text>
    <text x="1045" y="158" text-anchor="middle">PUENTE ADICIONAL</text>
    <text x="1377.5" y="158" text-anchor="middle">NO HEREDADO</text>
  </g>

  <g filter="url(#shadow)">
