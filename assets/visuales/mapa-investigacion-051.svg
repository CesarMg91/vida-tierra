    <g>
      <rect class="box" x="60" y="682" width="245" height="78" rx="12" fill="#1e3437" stroke="#4c7777"/>
      <rect class="box" x="335" y="682" width="245" height="78" rx="12" fill="#203840" stroke="#4d7781"/>
      <rect class="box" x="610" y="682" width="265" height="78" rx="12" fill="#233b3a" stroke="#57847d"/>
      <rect class="box" x="905" y="682" width="280" height="78" rx="12" fill="#3d3525" stroke="#a77e42"/>
      <rect class="box" x="1215" y="682" width="325" height="78" rx="12" fill="#3c292b" stroke="#98595f"/>
