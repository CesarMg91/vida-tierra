      <text class="t body" x="457.5" y="712" text-anchor="middle">agua · clima · cambio</text><text class="t small muted" x="457.5" y="737" text-anchor="middle">resolución propia</text>
      <text class="t body" x="742.5" y="712" text-anchor="middle">oportunidad · restricción</text><text class="t small muted" x="742.5" y="737" text-anchor="middle">paisaje modificado</text>
      <text class="t body" x="1045" y="712" text-anchor="middle">mecanismo + desfase</text><text class="t small muted" x="1045" y="737" text-anchor="middle">casos negativos</text>
      <text class="t body" x="1377.5" y="712" text-anchor="middle">causa política única</text><text class="t small muted" x="1377.5" y="737" text-anchor="middle">despotismo · colapso total</text>
