      <rect class="box" x="1215" y="586" width="325" height="78" rx="12" fill="#3c292b" stroke="#98595f"/>
      <text class="t body" x="182.5" y="616" text-anchor="middle">Entierro · isótopo · ADN</text><text class="t small muted" x="182.5" y="641" text-anchor="middle">individuo / tejido</text>
      <text class="t body" x="457.5" y="616" text-anchor="middle">tratamiento · dieta</text><text class="t small muted" x="457.5" y="641" text-anchor="middle">movilidad · parentesco</text>
