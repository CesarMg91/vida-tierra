      <rect class="box" x="1215" y="298" width="325" height="78" rx="12" fill="#3c292b" stroke="#98595f"/>
      <text class="t body" x="182.5" y="328" text-anchor="middle">Casas · barrios</text><text class="t small muted" x="182.5" y="353" text-anchor="middle">planta / acceso / fase</text>
      <text class="t body" x="457.5" y="328" text-anchor="middle">superficie · inversión</text><text class="t small muted" x="457.5" y="353" text-anchor="middle">contenido · distribución</text>
      <text class="t body" x="742.5" y="328" text-anchor="middle">actividad doméstica</text><text class="t small muted" x="742.5" y="353" text-anchor="middle">variación material</text>
      <text class="t body" x="1045" y="328" text-anchor="middle">unidad + contemporaneidad</text><text class="t small muted" x="1045" y="353" text-anchor="middle">transmisión independiente</text>
