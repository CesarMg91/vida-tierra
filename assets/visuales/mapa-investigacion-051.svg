    <g>
      <rect class="box" x="60" y="298" width="245" height="78" rx="12" fill="#1e3437" stroke="#4c7777"/>
      <rect class="box" x="335" y="298" width="245" height="78" rx="12" fill="#203840" stroke="#4d7781"/>
