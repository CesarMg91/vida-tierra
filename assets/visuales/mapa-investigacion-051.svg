      <rect class="box" x="610" y="202" width="265" height="78" rx="12" fill="#233b3a" stroke="#57847d"/>
      <rect class="box" x="905" y="202" width="280" height="78" rx="12" fill="#3d3525" stroke="#a77e42"/>
      <rect class="box" x="1215" y="202" width="325" height="78" rx="12" fill="#3c292b" stroke="#98595f"/>
      <text class="t body" x="182.5" y="232" text-anchor="middle">Prospección · lidar</text><text class="t small muted" x="182.5" y="257" text-anchor="middle">rasgo / sitio / fase</text>
      <text class="t body" x="457.5" y="232" text-anchor="middle">área · densidad</text><text class="t small muted" x="457.5" y="257" text-anchor="middle">distancia · conexión</text>
      <text class="t body" x="742.5" y="232" text-anchor="middle">patrón de asentamiento</text><text class="t small muted" x="742.5" y="257" text-anchor="middle">centralidad condicionada</text>
      <text class="t body" x="1045" y="232" text-anchor="middle">fase + hogares + funciones</text><text class="t small muted" x="1045" y="257" text-anchor="middle">control terrestre</text>
      <text class="t body" x="1377.5" y="232" text-anchor="middle">ciudad · Estado</text><text class="t small muted" x="1377.5" y="257" text-anchor="middle">población exacta</text>
    </g>
