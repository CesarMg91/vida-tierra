<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde los datos hasta la responsabilidad en la medicina digital</title>
  <desc id="desc">Ocho capas conectadas pero no automáticas: datos → modelo → validación → despliegue → deriva → equidad → utilidad → responsabilidad. Cada transición conserva un cortafuego: datos no es modelo, modelo no es validez, validación no es despliegue, despliegue no es estabilidad, la deriva no es una excepción, exactitud no es equidad y aprobación no es responsable; un modelo exacto no demuestra un beneficio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111821"/><stop offset="1" stop-color="#1b2229"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e6eef2"/><stop offset="1" stop-color="#c8d7de"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6 0 12Z" fill="#d9785b"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="240" fill="#1f4a5c" opacity=".3"/>
  <circle cx="115" cy="850" r="250" fill="#8e3f2e" opacity=".18"/>
  <text x="60" y="92" fill="#8fc9dc" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-033 · CADENA DE INFERENCIA</text>
  <text x="60" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="39" font-weight="700">Un modelo exacto no demuestra un beneficio ni asigna un responsable</text>
  <text x="60" y="198" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="22">datos → modelo → validación → despliegue → deriva → equidad → utilidad → responsabilidad</text>
  <path d="M170 390H1430" stroke="#d9785b" stroke-width="4" stroke-dasharray="8 10" opacity=".7"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(60 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f4a5c"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">01</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">datos</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">expediente</tspan><tspan x="18" dy="24">costo · creatinina</tspan><tspan x="18" dy="24">oxímetro</tspan></text></g>
    <g transform="translate(246 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f4a5c"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">02</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">modelo</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">reglas · regresión</tspan><tspan x="18" dy="24">redes · lenguaje</tspan><tspan x="18" dy="24">etiqueta</tspan></text></g>
    <g transform="translate(432 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f4a5c"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">03</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">validación</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">AUC 0.63</tspan><tspan x="18" dy="24">ensayo pivotal</tspan><tspan x="18" dy="24">examen</tspan></text></g>
    <g transform="translate(618 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f4a5c"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">04</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">despliegue</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">umbral · alerta</tspan><tspan x="18" dy="24">clínica · red</tspan><tspan x="18" dy="24">flujo</tspan></text></g>
    <g transform="translate(804 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f4a5c"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">05</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">deriva</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">pandemia</tspan><tspan x="18" dy="24">códigos</tspan><tspan x="18" dy="24">calibración</tspan></text></g>
    <g transform="translate(990 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f4a5c"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">06</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">equidad</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">error por grupo</tspan><tspan x="18" dy="24">sustituto</tspan><tspan x="18" dy="24">instrumento</tspan></text></g>
    <g transform="translate(1176 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f4a5c"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">07</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">utilidad</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">ensayo</tspan><tspan x="18" dy="24">comparador</tspan><tspan x="18" dy="24">desenlace</tspan></text></g>
    <g transform="translate(1362 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f4a5c"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">08</text><text x="18" y="92" fill="#1f211e" font-size="17" font-weight="700">responsabilidad</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">FDA · UE</tspan><tspan x="18" dy="24">clínico</tspan><tspan x="18" dy="24">¿quién responde?</tspan></text></g>
  </g>
  <g stroke="#d9785b" stroke-width="4" marker-end="url(#arrow)"><path d="M230 390H244"/><path d="M416 390H430"/><path d="M602 390H616"/><path d="M788 390H802"/><path d="M974 390H988"/><path d="M1160 390H1174"/><path d="M1346 390H1360"/></g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#f0c8b8" text-anchor="middle">
    <text x="237" y="550"><tspan x="237">datos ≠</tspan><tspan x="237" dy="20">modelo</tspan></text>
    <text x="423" y="550"><tspan x="423">modelo ≠</tspan><tspan x="423" dy="20">validez</tspan></text>
    <text x="609" y="550"><tspan x="609">validación ≠</tspan><tspan x="609" dy="20">despliegue</tspan></text>
    <text x="795" y="550"><tspan x="795">despliegue ≠</tspan><tspan x="795" dy="20">estabilidad</tspan></text>
    <text x="981" y="550"><tspan x="981">deriva ≠</tspan><tspan x="981" dy="20">excepción</tspan></text>
    <text x="1167" y="550"><tspan x="1167">exactitud ≠</tspan><tspan x="1167" dy="20">equidad</tspan></text>
    <text x="1353" y="550"><tspan x="1353">aprobación ≠</tspan><tspan x="1353" dy="20">responsable</tspan></text>
  </g>
  <rect x="60" y="645" width="1480" height="150" rx="24" fill="#0f1418" stroke="#4f7f8a" stroke-width="2"/>
  <text x="93" y="696" fill="#8fc9dc" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CONVERGENCIA LEGÍTIMA</text>
  <text x="93" y="744" fill="#f4f1e8" font-family="Georgia, serif" font-size="27">Ningún eslabón hereda la fuerza del siguiente: una aprobación no es un beneficio medido.</text>
  <text x="93" y="778" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="19">La etiqueta elegida y el instrumento de medida atraviesan todas las capas: son decisiones, no datos neutros.</text>
  <text x="1540" y="850" fill="#7f8c88" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Diagrama editorial · historia de la evidencia, sin indicaciones clínicas ni orientación sobre sistemas</text>
</svg>
