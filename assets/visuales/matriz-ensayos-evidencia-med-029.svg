<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de ensayos, regulación y medicina basada en evidencia</title>
  <desc id="desc">Doce expedientes comparados por periodo, archivo, producto mejor resuelto y límite. La tabla no forma una escalera de progreso ni reparte prioridad.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2e8ee"/><stop offset="1" stop-color="#c7d2db"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="58" y="40" width="1484" height="830" rx="28" fill="#f3f6f9" stroke="#2d3f55" stroke-width="2"/>
  <text x="92" y="94" fill="#3f5f7a" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-029 · MATRIZ DE EVIDENCIA</text>
  <text x="92" y="145" fill="#1c2228" font-family="Georgia, serif" font-size="42" font-weight="700">Doce archivos, siete capas, ningún fundador</text>
  <text x="92" y="183" fill="#4c5250" font-family="Arial, sans-serif" font-size="20">Qué tipo de evidencia sostiene cada expediente y dónde debe detenerse la inferencia.</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="92" y="222" width="1416" height="56" rx="10" fill="#2d3f55"/>
    <g fill="#eef3f7" font-size="18" font-weight="700"><text x="112" y="257">EXPEDIENTE</text><text x="392" y="257">ARCHIVO</text><text x="760" y="257">PRODUCTO RESUELTO</text><text x="1122" y="257">LÍMITE</text></g>
    <g>
      <g transform="translate(0 282)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Lind</text><text x="112" y="39" fill="#5a6461" font-size="13">1747–1795</text><text x="392" y="29" fill="#252722">tratado · Milne · Tröhler</text><text x="760" y="29" fill="#252722">comparación en paralelo</text><text x="1122" y="29" fill="#8e5a3c">historicidad abierta</text></g>
      <g transform="translate(0 328)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Alternancia</text><text x="112" y="39" fill="#5a6461" font-size="13">1816–1947</text><text x="392" y="29" fill="#252722">Chalmers 2001 y 2012</text><text x="760" y="29" fill="#252722">240 ensayos imparciales</text><text x="1122" y="29" fill="#8e5a3c">previsible</text></g>
      <g transform="translate(0 374)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Fibiger</text><text x="112" y="39" fill="#5a6461" font-size="13">1896–1898</text><text x="392" y="29" fill="#252722">Hospitalstidende · BMJ</text><text x="760" y="29" fill="#252722">asignación por calendario</text><text x="1122" y="29" fill="#8e5a3c">493 excluidos; sin cegamiento</text></g>
      <g transform="translate(0 420)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">MRC 1948</text><text x="112" y="39" fill="#5a6461" font-size="13">1946–1948</text><text x="392" y="29" fill="#252722">MED-024</text><text x="760" y="29" fill="#252722">azar oculto en sobres</text><text x="1122" y="29" fill="#8e5a3c">no inventó la comparación</text></g>
      <g transform="translate(0 466)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Núremberg · Helsinki</text><text x="112" y="39" fill="#5a6461" font-size="13">1947–2024</text><text x="392" y="29" fill="#252722">USHMM · AMM</text><text x="760" y="29" fill="#252722">consentimiento, registro</text><text x="1122" y="29" fill="#8e5a3c">sin cumplimiento propio</text></g>
      <g transform="translate(0 512)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Beecher · Tuskegee</text><text x="112" y="39" fill="#5a6461" font-size="13">1932–2018</text><text x="392" y="29" fill="#252722">NEJM · CDC · QJE</text><text x="760" y="29" fill="#252722">violación y legado</text><text x="1122" y="29" fill="#8e5a3c">desenlaces distintos</text></g>
      <g transform="translate(0 558)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Belmont</text><text x="112" y="39" fill="#5a6461" font-size="13">1974–2000</text><text x="392" y="29" fill="#252722">informe · CDC · Emanuel</text><text x="760" y="29" fill="#252722">principios y comités</text><text x="1122" y="29" fill="#8e5a3c">norma estadounidense</text></g>
      <g transform="translate(0 604)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Regulación</text><text x="112" y="39" fill="#5a6461" font-size="13">1962–2026</text><text x="392" y="29" fill="#252722">21 CFR · JAMA · ICH</text><text x="760" y="29" fill="#252722">fases y umbral</text><text x="1122" y="29" fill="#8e5a3c">un ensayo; sustitutos</text></g>
      <g transform="translate(0 650)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Cochrane</text><text x="112" y="39" fill="#5a6461" font-size="13">1972–1993</text><text x="392" y="29" fill="#252722">libro · BJOG · NYAS</text><text x="760" y="29" fill="#252722">revisión mantenida</text><text x="1122" y="29" fill="#8e5a3c">hereda lo publicado</text></g>
      <g transform="translate(0 696)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Meta-análisis</text><text x="112" y="39" fill="#5a6461" font-size="13">1959–1992</text><text x="392" y="29" fill="#252722">NEJM · JAMA</text><text x="760" y="29" fill="#252722">evidencia antes que práctica</text><text x="1122" y="29" fill="#8e5a3c">lectura retrospectiva</text></g>
      <g transform="translate(0 742)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">EBM · GRADE</text><text x="112" y="39" fill="#5a6461" font-size="13">1991–2018</text><text x="392" y="29" fill="#252722">JAMA · BMJ · JCE</text><text x="760" y="29" fill="#252722">lema y certeza explícita</text><text x="1122" y="29" fill="#8e5a3c">marca apropiable</text></g>
      <g transform="translate(0 788)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Sesgos · plataformas</text><text x="112" y="39" fill="#5a6461" font-size="13">1959–2026</text><text x="392" y="29" fill="#252722">NEJM · Lancet · Science</text><text x="760" y="29" fill="#252722">lo hecho frente a lo publicado</text><text x="1122" y="29" fill="#8e5a3c">cumplimiento parcial</text></g>
    </g>
  </g>
  <text x="1505" y="858" fill="#5a6461" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
