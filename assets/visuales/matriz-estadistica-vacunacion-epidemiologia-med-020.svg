<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de doce expedientes de conteo, comparación y límite</title>
  <desc id="desc">Tabla editorial de MED-020: doce expedientes entre 1662 y 2026 con su archivo dominante, el producto mejor resuelto y el límite decisivo. Las filas no forman una escala de progreso ni puntúan instituciones o países.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141816"/><stop offset="1" stop-color="#1f231d"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="92" fill="#d7a45f" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-020 · MATRIZ DE EXPEDIENTES</text>
  <text x="92" y="148" fill="#fff8e8" font-family="Georgia, serif" font-size="40" font-weight="700">Qué contó cada archivo y qué no puede heredar</text>
  <text y="205" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8d8779"><tspan x="92">EXPEDIENTE</tspan><tspan x="470">ARCHIVO</tspan><tspan x="860">PRODUCTO</tspan><tspan x="1170">LÍMITE DECISIVO</tspan></text>
  <path d="M80 220H1520" stroke="#517462" stroke-width="2"/>
  <rect x="80" y="219" width="1440" height="47" rx="8" fill="#1b211d"/><text y="250" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Londres 1662</tspan><tspan x="470" fill="#cfc7b5">listas parroquiales</tspan><tspan x="860" fill="#8eb09d">regularidades</tspan><tspan x="1170" fill="#e2a44f">causa sin médico; sin censo</tspan></text>
  <text y="297" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Inoculación 1714–1766</tspan><tspan x="470" fill="#cfc7b5">cartas, informes, modelo</tspan><tspan x="860" fill="#8eb09d">riesgo comparado</tspan><tspan x="1170" fill="#e2a44f">clase; clasificación</tspan></text>
  <rect x="80" y="313" width="1440" height="47" rx="8" fill="#1b211d"/><text y="344" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Vacuna 1796–1902</tspan><tspan x="470" fill="#cfc7b5">tratado, granjas, genomas</tspan><tspan x="860" fill="#8eb09d">difusión</tspan><tspan x="1170" fill="#e2a44f">material incierto; niños portadores</tspan></text>
  <text y="391" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Louis 1835</tspan><tspan x="470" fill="#cfc7b5">series clínicas</tspan><tspan x="860" fill="#8eb09d">contraste numérico</tspan><tspan x="1170" fill="#e2a44f">sin aleatorización</tspan></text>
  <rect x="80" y="407" width="1440" height="47" rx="8" fill="#1b211d"/><text y="438" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Viena 1847</tspan><tspan x="470" fill="#cfc7b5">tablas por clínica</tspan><tspan x="860" fill="#8eb09d">asignación alterna</tspan><tspan x="1170" fill="#e2a44f">antes-después; sin agente</tspan></text>
  <text y="485" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Londres 1849–1855</tspan><tspan x="470" fill="#cfc7b5">Tabla IX, informes</tspan><tspan x="860" fill="#8eb09d">experimento natural</tspan><tspan x="1170" fill="#e2a44f">casas, no personas</tspan></text>
  <rect x="80" y="501" width="1440" height="47" rx="8" fill="#1b211d"/><text y="532" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Nightingale 1854–1858</tspan><tspan x="470" fill="#cfc7b5">tablas y diagramas</tspan><tspan x="860" fill="#8eb09d">argumento de reforma</tspan><tspan x="1170" fill="#e2a44f">retórica ≠ estimación</tspan></text>
  <text y="579" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Obligación 1853–1905</tspan><tspan x="470" fill="#cfc7b5">leyes, sentencias, protestas</tspan><tspan x="860" fill="#8eb09d">implementación</tspan><tspan x="1170" fill="#e2a44f">carga por clase y raza</tspan></text>
  <rect x="80" y="595" width="1440" height="47" rx="8" fill="#1b211d"/><text y="626" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Tabaco 1950–1965</tspan><tspan x="470" fill="#cfc7b5">casos y controles, cohorte</tspan><tspan x="860" fill="#8eb09d">convergencia causal</tspan><tspan x="1170" fill="#e2a44f">duda organizada; «criterios»</tspan></text>
  <text y="673" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Salk 1954–1955</tspan><tspan x="470" fill="#cfc7b5">ensayo con placebo</tspan><tspan x="860" fill="#8eb09d">efecto aleatorizado</tspan><tspan x="1170" fill="#e2a44f">voluntarios; Cutter</tspan></text>
  <rect x="80" y="689" width="1440" height="47" rx="8" fill="#1b211d"/><text y="720" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">Erradicación 1966–1980</tspan><tspan x="470" fill="#cfc7b5">vigilancia, correspondencia</tspan><tspan x="860" fill="#8eb09d">buscar y contener</tspan><tspan x="1170" fill="#e2a44f">decisión local</tspan></text>
  <text y="767" font-family="Arial, sans-serif" font-size="19"><tspan x="92" fill="#fff8e8" font-weight="700">2006–2026</tspan><tspan x="470" fill="#cfc7b5">registros nacionales</tspan><tspan x="860" fill="#8eb09d">grandes denominadores</tspan><tspan x="1170" fill="#e2a44f">vacunado sano; política aparte</tspan></text>
  <text x="1505" y="870" fill="#8d8779" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Síntesis editorial · sin puntuaciones · no recomienda</text>
</svg>
