<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Radiación ordovícica: tres historias y archivos distintos</title>
  <desc id="desc">Mapa epistemológico que separa las radiaciones marinas, la evidencia terrestre mínima y la crisis hirnantiana en dos pulsos. Cada ruta muestra sus archivos, inferencias y límites antes de una síntesis multicausal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.55" stop-color="#10293a"/>
      <stop offset="1" stop-color="#1b1724"/>
    </linearGradient>
    <linearGradient id="marine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#113f55"/>
      <stop offset="1" stop-color="#0c2d3e"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3b23"/>
      <stop offset="1" stop-color="#2c291f"/>
    </linearGradient>
    <linearGradient id="crisis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2635"/>
      <stop offset="1" stop-color="#291d2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72d4db"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8bc70"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e49aaf"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 46px; font-weight: 750; fill: #f2f6f5; letter-spacing: -0.7px; }
      .subtitle { font-size: 21px; fill: #b8cad0; }
      .kicker { font-size: 16px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; }
      .head { font-size: 28px; font-weight: 720; fill: #f5f6f2; }
      .body { font-size: 18px; fill: #d7e2e2; }
      .small { font-size: 16px; fill: #b9c8ca; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 14px; fill: #a9bec3; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1425" cy="115" r="180" fill="#2a5360" opacity="0.14"/>
  <circle cx="120" cy="900" r="240" fill="#70404f" opacity="0.10"/>

  <g class="sans">
    <text x="82" y="76" class="kicker" fill="#75d7dc">INVESTIGACIÓN 023 · MAPA EPISTEMOLÓGICO</text>
    <text x="82" y="132" class="title">Radiación ordovícica: tres historias, archivos distintos</text>
    <text x="82" y="170" class="subtitle">No existe una sola curva capaz de medir diversidad, colonización terrestre y extinción.</text>

    <g filter="url(#shadow)">
      <rect x="70" y="220" width="710" height="430" rx="26" fill="url(#marine)" stroke="#397f91" stroke-width="2"/>
      <rect x="810" y="220" width="350" height="430" rx="26" fill="url(#land)" stroke="#927443" stroke-width="2"/>
      <rect x="1190" y="220" width="340" height="430" rx="26" fill="url(#crisis)" stroke="#98546a" stroke-width="2"/>
    </g>

    <text x="104" y="258" class="kicker" fill="#73d3da">A · OCÉANOS</text>
    <text x="104" y="299" class="head">Radiaciones marinas sucesivas</text>
    <text x="104" y="334" class="body">Pelágica · bentónica · arrecifal · provincial</text>

    <rect x="104" y="366" width="305" height="104" rx="17" fill="#0b2534" stroke="#2e6677"/>
    <text x="126" y="397" class="kicker" fill="#75d7dc">ARCHIVO</text>
    <text x="126" y="430" class="body">Ocurrencias + colecciones</text>
    <text x="126" y="457" class="small">roca · facies · taxonomía · tiempo</text>

    <rect x="441" y="366" width="305" height="104" rx="17" fill="#0b2534" stroke="#2e6677"/>
    <text x="463" y="397" class="kicker" fill="#75d7dc">VARIABLES</text>
    <text x="463" y="430" class="body">Riqueza ≠ disparidad</text>
    <text x="463" y="457" class="small">≠ biomasa ≠ ecospace</text>

    <rect x="104" y="496" width="642" height="116" rx="17" fill="#102f3e" stroke="#397f91"/>
    <text x="126" y="528" class="kicker" fill="#75d7dc">INFERENCIA DELIMITADA</text>
    <text x="126" y="562" class="body">La GOBE es un paquete diacrónico de expansiones.</text>
    <text x="126" y="590" class="small">El enfriamiento puede habilitar; el O₂ cambia con escala y proxy.</text>

    <text x="840" y="258" class="kicker" fill="#e7ba6c">B · CONTINENTES</text>
    <text x="840" y="299" class="head">Mínimos terrestres</text>
    <rect x="840" y="332" width="290" height="118" rx="17" fill="#302919" stroke="#7e6539"/>
    <text x="862" y="365" class="kicker" fill="#e8bc70">CRIPTOESPORAS</text>
    <text x="862" y="398" class="body">473–471 Ma</text>
    <text x="862" y="426" class="small">plantas terrestres tempranas</text>
    <rect x="840" y="476" width="290" height="118" rx="17" fill="#302919" stroke="#7e6539"/>
    <text x="862" y="509" class="kicker" fill="#e8bc70">TRAZAS</text>
    <text x="862" y="542" class="body">Ordovícico tardío</text>
    <text x="862" y="570" class="small">actividad animal; productor abierto</text>
    <text x="840" y="625" class="small">No bosque · no flora vascular · no cuerpo</text>

    <text x="1220" y="258" class="kicker" fill="#e69caf">C · CRISIS FINAL</text>
    <text x="1220" y="299" class="head">Dos pulsos</text>
    <rect x="1220" y="332" width="280" height="118" rx="17" fill="#311d28" stroke="#7f4055"/>
    <text x="1242" y="365" class="kicker" fill="#e69caf">PULSO I</text>
    <text x="1242" y="398" class="body">Enfriamiento + hielo</text>
    <text x="1242" y="426" class="small">nivel del mar · pérdida de hábitat</text>
    <rect x="1220" y="476" width="280" height="118" rx="17" fill="#311d28" stroke="#7f4055"/>
    <text x="1242" y="509" class="kicker" fill="#e69caf">PULSO II</text>
    <text x="1242" y="542" class="body">Calentamiento + anoxia</text>
    <text x="1242" y="570" class="small">acoplamiento y alcance debatidos</text>
    <text x="1220" y="625" class="small">No instante · no causa universal</text>

    <path d="M425 651 V694" stroke="#72d4db" stroke-width="3" marker-end="url(#arrowCyan)"/>
    <path d="M985 651 V694" stroke="#e8bc70" stroke-width="3" marker-end="url(#arrowAmber)"/>
    <path d="M1360 651 V694" stroke="#e49aaf" stroke-width="3" marker-end="url(#arrowRose)"/>

    <rect x="70" y="710" width="1460" height="145" rx="24" fill="#101c27" stroke="#405463" stroke-width="2"/>
    <text x="105" y="750" class="kicker" fill="#b7cbd0">AUDITORÍA COMÚN</text>
    <text x="105" y="790" class="head">Tiempo + lugar + facies + detectabilidad + modelo</text>
    <text x="105" y="826" class="body">Cada flecha causal debe sobrevivir controles de muestreo, sincronía, independencia y escala.</text>

    <path d="M800 855 V890" stroke="#b7cbd0" stroke-width="3" marker-end="url(#arrowCyan)"/>
    <rect x="330" y="900" width="940" height="70" rx="20" fill="#182f38" stroke="#72d4db" stroke-width="2"/>
    <text x="800" y="930" text-anchor="middle" class="kicker" fill="#75d7dc">SÍNTESIS MÁS FUERTE</text>
    <text x="800" y="956" text-anchor="middle" class="body">Radiación real y plural · tierra mínima preservada · crisis multicausal</text>
  </g>
</svg>
