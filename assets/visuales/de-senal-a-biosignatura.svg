<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de inferencia desde una señal antigua hasta una biosignatura</title>
  <desc id="desc">Cinco etapas separan edad del huésped, indigeneidad, singenicidad, biogenicidad y edad mínima de la vida. La cadena no produce la fecha exacta del origen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071820"/><stop offset="1" stop-color="#19151d"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#65c9c1"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".36"/></filter>
    <style>
      .k{font:600 22px Inter,Segoe UI,sans-serif;letter-spacing:4px;fill:#70d0c8}.t{font:700 45px Inter,Segoe UI,sans-serif;fill:#f3eee7}.s{font:400 20px Inter,Segoe UI,sans-serif;fill:#a7b7c1}.n{font:700 20px Inter,Segoe UI,sans-serif;fill:#071820}.ct{font:700 22px Inter,Segoe UI,sans-serif;fill:#f3eee7}.b{font:400 17px Inter,Segoe UI,sans-serif;fill:#c0cbd1}.loss{font:600 16px Inter,Segoe UI,sans-serif;fill:#e1a06a}.foot{font:400 17px Inter,Segoe UI,sans-serif;fill:#98aab4}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text class="k" x="70" y="66">DE LA SEÑAL A LA VIDA</text><text class="t" x="70" y="126">Cinco preguntas antes de llamar biosignatura a una forma</text><text class="s" x="70" y="169">Cada paso descarta un fallo distinto; ninguno se hereda de la edad de la roca.</text>
  <line x1="175" y1="400" x2="1415" y2="400" stroke="#315563" stroke-width="5"/>
  <g filter="url(#sh)">
    <g transform="translate(55 242)"><rect width="280" height="320" rx="24" fill="#17333c" stroke="#477d7b" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#66c9c0"/><text class="n" x="44" y="52" text-anchor="middle">1</text><text class="ct" x="24" y="101">Edad del huésped</text><text class="b" x="24" y="140">Mineral · roca · intrusión</text><text class="b" x="24" y="169">Reloj y evento</text><text class="loss" x="24" y="239">¿Qué objeto fecha</text><text class="loss" x="24" y="266">realmente el número?</text></g>
    <g transform="translate(360 242)"><rect width="280" height="320" rx="24" fill="#273130" stroke="#697b67" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#9eb45d"/><text class="n" x="44" y="52" text-anchor="middle">2</text><text class="ct" x="24" y="101">Indigeneidad</text><text class="b" x="24" y="140">Interior · controles</text><text class="b" x="24" y="169">Repetición en la muestra</text><text class="loss" x="24" y="239">¿Contaminación</text><text class="loss" x="24" y="266">o señal propia?</text></g>
    <g transform="translate(665 242)"><rect width="280" height="320" rx="24" fill="#302e27" stroke="#827451" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#d0a44e"/><text class="n" x="44" y="52" text-anchor="middle">3</text><text class="ct" x="24" y="101">Singenicidad</text><text class="b" x="24" y="140">Capas · inclusiones</text><text class="b" x="24" y="169">Vetas y metamorfismo</text><text class="loss" x="24" y="239">¿Estaba al depósito</text><text class="loss" x="24" y="266">o llegó después?</text></g>
    <g transform="translate(970 242)"><rect width="280" height="320" rx="24" fill="#332923" stroke="#8b674e" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#d17d50"/><text class="n" x="44" y="52" text-anchor="middle">4</text><text class="ct" x="24" y="101">Biogenicidad</text><text class="b" x="24" y="140">3-D + química + facies</text><text class="b" x="24" y="169">Población + tafonomía</text><text class="loss" x="24" y="239">¿Supera minerales,</text><text class="loss" x="24" y="266">fluidos y deformación?</text></g>
    <g transform="translate(1275 242)"><rect width="280" height="320" rx="24" fill="#342327" stroke="#8d595f" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#bd674b"/><text class="n" x="44" y="52" text-anchor="middle">5</text><text class="ct" x="24" y="101">Edad mínima</text><text class="b" x="24" y="140">“Vida por al menos X”</text><text class="b" x="24" y="169">Confianza heredada</text><text class="loss" x="24" y="239">No fecha el origen</text><text class="loss" x="24" y="266">ni el primer organismo</text></g>
  </g>
  <g stroke="#65c9c1" stroke-width="4" marker-end="url(#a)"><path d="M335 400 H352"/><path d="M640 400 H657"/><path d="M945 400 H962"/><path d="M1250 400 H1267"/></g>

  <g transform="translate(70 650)"><rect width="1460" height="150" rx="27" fill="#10262d" stroke="#3b6368" stroke-width="2"/><text class="ct" x="30" y="44">Regla de decisión</text><circle cx="43" cy="88" r="7" fill="#66c9c0"/><text class="foot" x="61" y="94">Edad precisa + forma parecida = candidata, no biosignatura.</text><circle cx="620" cy="88" r="7" fill="#d0a44e"/><text class="foot" x="638" y="94">Varias técnicas sobre el mismo objeto comparten contexto.</text><circle cx="1115" cy="88" r="7" fill="#bd674b"/><text class="foot" x="1133" y="94">Más antigua puede ser menos sólida.</text><text class="foot" x="30" y="128">El paquete fuerte combina escalas distintas y prueba activamente la mejor alternativa abiótica.</text></g>
  <text class="foot" x="800" y="855" text-anchor="middle">HUÉSPED → INDÍGENA → SINGENÉTICA → BIOGÉNICA → EDAD MÍNIMA</text>
</svg>
