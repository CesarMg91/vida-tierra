<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde una impresión ediacárica hasta un organismo</title>
  <desc id="desc">Ocho puertas separan el objeto fósil de inferencias sobre anatomía, conducta, ecología y afinidad filogenética.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#020911" flood-opacity="0.72"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#adc8da"/></marker>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#e0a263"/><stop offset="0.5" stop-color="#d884a5"/><stop offset="1" stop-color="#65cbd4"/></linearGradient>
    <style>.bg{fill:#071a27}.title{font:700 42px Georgia,serif;fill:#f3f6f8}.sub{font:18px Arial,sans-serif;fill:#afc0cb}.box{stroke-width:2}.label{font:700 16px Arial,sans-serif;fill:#f4f7f8}.small{font:13px Consolas,monospace;fill:#c2cdd5}.head{font:700 23px Georgia,serif;fill:#f1f4f6}.gate{font:700 18px Georgia,serif;fill:#ffd0bc}.foot{font:14px Consolas,monospace;fill:#aebfca}.line{stroke:#adc8da;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="64" y="66">De una impresión a un organismo ediacárico</text>
  <text class="sub" x="64" y="101">Cada caja añade información; ninguna semejanza visual autoriza saltar directamente al parentesco.</text>
  <rect x="64" y="138" width="1472" height="10" rx="5" fill="url(#bar)"/>

  <g filter="url(#shadow)">
    <rect class="box" x="53" y="198" width="164" height="148" rx="19" fill="#714c36" stroke="#e59c67"/>
    <rect class="box" x="247" y="198" width="164" height="148" rx="19" fill="#6d463d" stroke="#e78876"/>
    <rect class="box" x="441" y="198" width="164" height="148" rx="19" fill="#704153" stroke="#e27e9c"/>
    <rect class="box" x="635" y="198" width="164" height="148" rx="19" fill="#5e3f62" stroke="#d48fc8"/>
    <rect class="box" x="829" y="198" width="164" height="148" rx="19" fill="#4a3e68" stroke="#b58ee0"/>
    <rect class="box" x="1023" y="198" width="164" height="148" rx="19" fill="#34486c" stroke="#8fa7df"/>
    <rect class="box" x="1217" y="198" width="164" height="148" rx="19" fill="#1d5265" stroke="#71bddc"/>
    <rect class="box" x="1411" y="198" width="136" height="148" rx="19" fill="#164c59" stroke="#4cc5d4"/>
  </g>
  <g>
    <text class="label" x="78" y="239">Objeto</text><text class="small" x="78" y="278">molde o</text><text class="small" x="78" y="306">película</text>
    <text class="label" x="272" y="239">Contexto</text><text class="small" x="272" y="278">capa, facies</text><text class="small" x="272" y="306">y edad</text>
    <text class="label" x="466" y="239">Tafonomía</text><text class="small" x="466" y="278">entierro y</text><text class="small" x="466" y="306">deformación</text>
    <text class="label" x="660" y="239">Anatomía</text><text class="small" x="660" y="278">contorno y</text><text class="small" x="660" y="306">estructuras</text>
    <text class="label" x="854" y="239">Desarrollo</text><text class="small" x="854" y="278">crecimiento</text><text class="small" x="854" y="306">y polaridad</text>
    <text class="label" x="1048" y="239">Conducta</text><text class="small" x="1048" y="278">traza y</text><text class="small" x="1048" y="306">orientación</text>
    <text class="label" x="1242" y="239">Caracteres</text><text class="small" x="1242" y="278">homología</text><text class="small" x="1242" y="306">o convergencia</text>
    <text class="label" x="1434" y="239">Afinidad</text><text class="small" x="1434" y="278">nodo con</text><text class="small" x="1434" y="306">condiciones</text>
  </g>
  <g class="line"><line x1="217" y1="272" x2="239" y2="272"/><line x1="411" y1="272" x2="433" y2="272"/><line x1="605" y1="272" x2="627" y2="272"/><line x1="799" y1="272" x2="821" y2="272"/><line x1="993" y1="272" x2="1015" y2="272"/><line x1="1187" y1="272" x2="1209" y2="272"/><line x1="1381" y1="272" x2="1403" y2="272"/></g>

  <text class="head" x="64" y="418">Puertas de auditoría</text>
  <g filter="url(#shadow)">
    <rect x="64" y="449" width="340" height="122" rx="19" fill="#3e303b" stroke="#e47d98" stroke-width="2"/>
    <rect x="430" y="449" width="340" height="122" rx="19" fill="#3e303b" stroke="#e47d98" stroke-width="2"/>
    <rect x="796" y="449" width="340" height="122" rx="19" fill="#3e303b" stroke="#e47d98" stroke-width="2"/>
    <rect x="1162" y="449" width="374" height="122" rx="19" fill="#3e303b" stroke="#e47d98" stroke-width="2"/>
  </g>
  <text class="gate" x="90" y="490">Relieve ≠ piel</text><text class="small" x="90" y="526">puede moldear interior, exterior</text><text class="small" x="90" y="550">o estructura resistente</text>
  <text class="gate" x="456" y="490">Forma ≠ homología</text><text class="small" x="456" y="526">simetría y módulos también</text><text class="small" x="456" y="550">pueden converger</text>
  <text class="gate" x="822" y="490">Proximidad ≠ productor</text><text class="small" x="822" y="526">cuerpo y traza deben coincidir</text><text class="small" x="822" y="550">en escala, dirección y contacto</text>
  <text class="gate" x="1188" y="490">Animal ≠ corona</text><text class="small" x="1188" y="526">un nodo mínimo no identifica</text><text class="small" x="1188" y="550">molusco, cnidario u otro clado</text>

  <g filter="url(#shadow)"><rect x="64" y="632" width="716" height="155" rx="21" fill="#554238" stroke="#f0a45f" stroke-width="2"/><rect x="820" y="632" width="716" height="155" rx="21" fill="#174d58" stroke="#4cc5d4" stroke-width="2"/></g>
  <text class="head" x="92" y="675">Lo que converge</text>
  <text class="small" x="92" y="713">• comunidades complejas desde ~574 Ma</text><text class="small" x="92" y="744">• crecimiento, movilidad y nichos por taxón</text><text class="small" x="92" y="775">• varios animales dentro de una biota plural</text>
  <text class="head" x="850" y="675">Resultado delimitado</text>
  <text class="small" x="850" y="713">Dickinsonia animal y bilaterianos: B-COND.</text><text class="small" x="850" y="744">Rangomorfos, dietas y nodos finos: C–D.</text><text class="small" x="850" y="775">Una “fauna fallida” o clado único: E.</text>
  <text class="foot" x="800" y="850" text-anchor="middle">La afinidad hereda la incertidumbre de contexto, tafonomía, anatomía y homología.</text>
</svg>
