<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mapa epistemológico de herramientas, fuego y cooperación</title>
  <desc id="desc">Tres cadenas paralelas separan objeto de fabricante y transmisión, señal térmica de ignición, y organización espacial de cooperación y lenguaje. Las líneas discontinuas indican saltos que requieren evidencia independiente.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="1" stop-color="#112735"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#79c6c3"/>
    </marker>
    <marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#e39a62"/>
    </marker>
    <style>
      .title{font:700 42px system-ui,sans-serif;fill:#f4f0e6}.sub{font:400 20px system-ui,sans-serif;fill:#b9c9d0}.lane{font:700 22px system-ui,sans-serif;fill:#f0c58d}.box{fill:#132b39;stroke:#36586a;stroke-width:2}.box2{fill:#183843;stroke:#4d807f;stroke-width:2}.boxw{fill:#34271f;stroke:#b8794c;stroke-width:2}.h{font:700 19px system-ui,sans-serif;fill:#f6f2e8}.p{font:400 15px system-ui,sans-serif;fill:#cbd7da}.small{font:600 14px system-ui,sans-serif;fill:#90bdbd}.warn{font:700 15px system-ui,sans-serif;fill:#f1b37f}.okline{stroke:#79c6c3;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#e39a62;stroke-width:4;stroke-dasharray:10 10;fill:none;marker-end:url(#warn)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="210" fill="#23475a" opacity=".18"/>
  <text x="80" y="78" class="title">Tres archivos, tres cadenas y ningún atajo</text>
  <text x="80" y="112" class="sub">Línea continua: puente material sustentado · Línea discontinua: requiere evidencia independiente</text>

  <g filter="url(#shadow)">
    <rect x="55" y="150" width="1490" height="190" rx="22" fill="#0d202c" stroke="#294653"/>
    <rect x="55" y="365" width="1490" height="190" rx="22" fill="#0d202c" stroke="#294653"/>
    <rect x="55" y="580" width="1490" height="190" rx="22" fill="#0d202c" stroke="#294653"/>
  </g>

  <text x="85" y="190" class="lane">1 · OBJETO TÉCNICO</text>
  <g transform="translate(85 210)">
    <rect width="240" height="95" rx="14" class="box"/><text x="20" y="34" class="h">Pieza + contexto</text><text x="20" y="61" class="p">fractura, posición, materia</text><text x="20" y="82" class="p">prima y asociación</text>
  </g>
  <path d="M325 257H390" class="okline"/>
  <g transform="translate(400 210)">
    <rect width="240" height="95" rx="14" class="box2"/><text x="20" y="34" class="h">Secuencia técnica</text><text x="20" y="61" class="p">núcleo, lascas, negativos,</text><text x="20" y="82" class="p">remontaje y repetición</text>
  </g>
  <path d="M640 257H705" class="okline"/>
  <g transform="translate(715 210)">
    <rect width="220" height="95" rx="14" class="box2"/><text x="20" y="34" class="h">Uso condicionado</text><text x="20" y="61" class="p">desgaste, residuo y</text><text x="20" y="82" class="p">posición funcional</text>
  </g>
  <path d="M935 257H1000" class="dash"/>
  <g transform="translate(1010 210)">
    <rect width="215" height="95" rx="14" class="boxw"/><text x="20" y="34" class="h">Fabricante</text><text x="20" y="61" class="p">taxón o individuo</text><text x="20" y="82" class="warn">no está en la forma</text>
  </g>
  <path d="M1225 257H1290" class="dash"/>
  <g transform="translate(1300 210)">
    <rect width="210" height="95" rx="14" class="boxw"/><text x="18" y="34" class="h">Transmisión</text><text x="18" y="61" class="p">copia, enseñanza, lengua</text><text x="18" y="82" class="warn">requieren otro archivo</text>
  </g>

  <text x="85" y="405" class="lane">2 · ARCHIVO TÉRMICO</text>
  <g transform="translate(85 425)">
    <rect width="210" height="95" rx="14" class="box"/><text x="18" y="34" class="h">Material calentado</text><text x="18" y="61" class="p">mineral, hueso, piedra</text><text x="18" y="82" class="p">o sedimento alterado</text>
  </g>
  <path d="M295 472H350" class="okline"/>
  <g transform="translate(360 425)">
    <rect width="220" height="95" rx="14" class="box2"/><text x="18" y="34" class="h">Combustión in situ</text><text x="18" y="61" class="p">ceniza, gradiente y</text><text x="18" y="82" class="p">microestratigrafía</text>
  </g>
  <path d="M580 472H635" class="okline"/>
  <g transform="translate(645 425)">
    <rect width="190" height="95" rx="14" class="box2"/><text x="18" y="34" class="h">Control</text><text x="18" y="61" class="p">localización y vínculo</text><text x="18" y="82" class="p">con actividad</text>
  </g>
  <path d="M835 472H890" class="okline"/>
  <g transform="translate(900 425)">
    <rect width="190" height="95" rx="14" class="box2"/><text x="18" y="34" class="h">Recurrencia</text><text x="18" y="61" class="p">episodios separados,</text><text x="18" y="82" class="p">no palimpsesto único</text>
  </g>
  <path d="M1090 472H1150" class="dash"/>
  <g transform="translate(1160 425)">
    <rect width="220" height="95" rx="14" class="boxw"/><text x="18" y="34" class="h">Ignición deliberada</text><text x="18" y="61" class="p">aparato o residuos</text><text x="18" y="82" class="warn">Barnham: B-COND</text>
  </g>
  <path d="M1380 472H1430" class="dash"/>
  <text x="1445" y="459" class="warn">lenguaje</text><text x="1445" y="482" class="warn">cocina</text><text x="1445" y="505" class="warn">moral</text>

  <text x="85" y="620" class="lane">3 · ORGANIZACIÓN Y COOPERACIÓN</text>
  <g transform="translate(85 640)">
    <rect width="230" height="95" rx="14" class="box"/><text x="18" y="34" class="h">Transporte / selección</text><text x="18" y="61" class="p">distancia y preferencia</text><text x="18" y="82" class="p">no cuentan agentes</text>
  </g>
  <path d="M315 687H375" class="okline"/>
  <g transform="translate(385 640)">
    <rect width="230" height="95" rx="14" class="box2"/><text x="18" y="34" class="h">Refits / repetición</text><text x="18" y="61" class="p">orden y retorno bajo</text><text x="18" y="82" class="p">resolución temporal</text>
  </g>
  <path d="M615 687H675" class="okline"/>
  <g transform="translate(685 640)">
    <rect width="235" height="95" rx="14" class="box2"/><text x="18" y="34" class="h">Organización espacial</text><text x="18" y="61" class="p">excluir mezcla, formación</text><text x="18" y="82" class="p">y palimpsestos</text>
  </g>
  <path d="M920 687H980" class="dash"/>
  <g transform="translate(990 640)">
    <rect width="220" height="95" rx="14" class="boxw"/><text x="18" y="34" class="h">Coordinación</text><text x="18" y="61" class="p">simultaneidad y necesidad</text><text x="18" y="82" class="warn">Schöningen: probable</text>
  </g>
  <path d="M1210 687H1270" class="dash"/>
  <g transform="translate(1280 640)">
    <rect width="230" height="95" rx="14" class="boxw"/><text x="18" y="34" class="h">Instituciones sociales</text><text x="18" y="61" class="p">roles, parentesco, normas</text><text x="18" y="82" class="warn">no observadas aquí</text>
  </g>

  <rect x="80" y="805" width="1440" height="54" rx="13" fill="#102633" stroke="#335160"/>
  <text x="110" y="839" class="small">Regla: la mejor inferencia puede ser fuerte y condicional; ningún producto técnico hereda automáticamente especie, lenguaje o modernidad.</text>
</svg>
