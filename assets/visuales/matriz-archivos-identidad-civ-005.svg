<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro archivos de identidad y lo que cada uno no demuestra</title>
  <desc id="desc">Matriz de cuatro filas —cultura material, genoma, lengua y texto— y cuatro columnas: unidad, cómo se obtiene, qué no demuestra y un caso auditado que rompe la equivalencia automática con los otros archivos (campaniforme, Vanuatu, Shum Laka y el nombre «olmeca»).</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1011"/><stop offset="1" stop-color="#171512"/></linearGradient>
    <style>.k{font:19px Consolas,monospace;letter-spacing:2px;fill:#c39456}.h{font:25px Georgia,serif;fill:#efe3d1}.t{font:19px Arial,sans-serif;fill:#c9c2b8}.l{font:17px Arial,sans-serif;fill:#d6a27b}.small{font:14px Consolas,monospace;fill:#91ad92}.cell{font:15px Arial,sans-serif;fill:#cfc7bb}.head{font:14px Consolas,monospace;letter-spacing:1px;fill:#c39456}.rule{stroke:#8b6a43;stroke-width:2}.dash{stroke:#a96545;stroke-width:2;stroke-dasharray:8 8;fill:none}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="96" class="k">CIV-005 · MATRIZ DE ARCHIVOS</text>
  <text x="70" y="150" font-family="Georgia,serif" font-size="42" fill="#f2e7d6">Cuatro archivos, cuatro relojes</text>
  <text x="70" y="190" class="t">Su coincidencia es un resultado de cada caso, no un supuesto. La última columna es el falsador histórico de la equivalencia.</text>
  <text x="84" y="262" class="head">ARCHIVO</text><text x="304" y="262" class="head">UNIDAD</text><text x="544" y="262" class="head">CÓMO SE OBTIENE</text><text x="844" y="262" class="head">NO DEMUESTRA</text><text x="1154" y="262" class="head">CASO QUE LO ROMPE</text>
  <g><rect x="70" y="290" width="202" height="112" fill="#11171a" stroke="#4f4a3c"/><rect x="290" y="290" width="222" height="112" fill="#11171a" stroke="#4f4a3c"/><rect x="530" y="290" width="282" height="112" fill="#11171a" stroke="#4f4a3c"/><rect x="830" y="290" width="292" height="112" fill="#11171a" stroke="#4f4a3c"/><rect x="1140" y="290" width="382" height="112" fill="#11171a" stroke="#4f4a3c"/><text x="84" y="352" class="h">Cultura material</text><text x="304" y="336" class="cell">tipo, estilo,</text><text x="304" y="362" class="cell">horizonte</text><text x="544" y="336" class="cell">clasificación politética,</text><text x="544" y="362" class="cell">seriación, procedencia</text><text x="844" y="336" class="cell">pueblo, lengua,</text><text x="844" y="362" class="cell">ascendencia</text><text x="1154" y="336" class="l">campaniforme Iberia–Europa</text><text x="1154" y="362" class="l">central: estilo sin migración</text></g>
  <g><rect x="70" y="418" width="202" height="112" fill="#141a19" stroke="#4f4a3c"/><rect x="290" y="418" width="222" height="112" fill="#141a19" stroke="#4f4a3c"/><rect x="530" y="418" width="282" height="112" fill="#141a19" stroke="#4f4a3c"/><rect x="830" y="418" width="292" height="112" fill="#141a19" stroke="#4f4a3c"/><rect x="1140" y="418" width="382" height="112" fill="#141a19" stroke="#4f4a3c"/><text x="84" y="480" class="h">Genoma</text><text x="304" y="464" class="cell">componente o</text><text x="304" y="490" class="cell">proporción de mezcla</text><text x="544" y="464" class="cell">ADMIXTURE, estadísticos f,</text><text x="544" y="490" class="cell">qpAdm con proxies</text><text x="844" y="464" class="cell">etnia, lengua,</text><text x="844" y="490" class="cell">autodenominación</text><text x="1154" y="464" class="l">Vanuatu: ascendencia papú</text><text x="1154" y="490" class="l">con lenguas austronesias</text></g>
  <g><rect x="70" y="546" width="202" height="112" fill="#11171a" stroke="#4f4a3c"/><rect x="290" y="546" width="222" height="112" fill="#11171a" stroke="#4f4a3c"/><rect x="530" y="546" width="282" height="112" fill="#11171a" stroke="#4f4a3c"/><rect x="830" y="546" width="292" height="112" fill="#11171a" stroke="#4f4a3c"/><rect x="1140" y="546" width="382" height="112" fill="#11171a" stroke="#4f4a3c"/><text x="84" y="608" class="h">Lengua</text><text x="304" y="592" class="cell">nodo de un árbol</text><text x="304" y="618" class="cell">fechado</text><text x="544" y="592" class="cell">cognados, calibración,</text><text x="544" y="618" class="cell">filogenia bayesiana</text><text x="844" y="592" class="cell">ascendencia, cerámica,</text><text x="844" y="618" class="cell">patria única</text><text x="1154" y="592" class="l">Shum Laka: patria bantú sin</text><text x="1154" y="618" class="l">ancestros de sus hablantes</text></g>
  <g><rect x="70" y="674" width="202" height="112" fill="#141a19" stroke="#4f4a3c"/><rect x="290" y="674" width="222" height="112" fill="#141a19" stroke="#4f4a3c"/><rect x="530" y="674" width="282" height="112" fill="#141a19" stroke="#4f4a3c"/><rect x="830" y="674" width="292" height="112" fill="#141a19" stroke="#4f4a3c"/><rect x="1140" y="674" width="382" height="112" fill="#141a19" stroke="#4f4a3c"/><text x="84" y="736" class="h">Texto</text><text x="304" y="720" class="cell">etnónimo</text><text x="304" y="746" class="cell">(casi siempre exónimo)</text><text x="544" y="720" class="cell">autor, lengua, género,</text><text x="544" y="746" class="cell">distancia y propósito</text><text x="844" y="720" class="cell">autoadscripción ni</text><text x="844" y="746" class="cell">referente arqueológico</text><text x="1154" y="720" class="l">«olmeca»: nombre náhuatl</text><text x="1154" y="746" class="l">tardío para un estilo antiguo</text></g>
  <text x="70" y="830" class="t">El acoplamiento existe —la expansión bantú lo muestra— pero se prueba caso por caso con archivos independientes.</text>
</svg>
