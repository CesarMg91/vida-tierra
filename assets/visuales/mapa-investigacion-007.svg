<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de evidencia del núcleo terrestre</title>
  <desc id="desc">Cinco rutas conectan sismogramas, geodesia, geoquímica, mineralogía de alta presión y cronómetros con claims separados sobre geometría, estado, composición y tiempo del núcleo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#67e8f9"/>
    </marker>
    <style>
      .h1{font:700 44px system-ui,sans-serif;fill:#f8fafc}.sub{font:400 22px system-ui,sans-serif;fill:#a5b4c8}
      .tag{font:700 18px system-ui,sans-serif;letter-spacing:1.4px;fill:#67e8f9}.head{font:700 25px system-ui,sans-serif;fill:#fff}
      .body{font:400 19px system-ui,sans-serif;fill:#cbd5e1}.small{font:400 17px system-ui,sans-serif;fill:#94a3b8}
      .claim{font:700 21px system-ui,sans-serif;fill:#fff}.grade{font:800 20px system-ui,sans-serif;fill:#fde68a}
      .card{fill:#111d2d;stroke:#334155;stroke-width:2}.line{stroke:#67e8f9;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="220" fill="#f59e0b" opacity=".04"/>
  <text x="80" y="82" class="h1">¿Cómo sabemos que existe el núcleo?</text>
  <text x="80" y="122" class="sub">Una propiedad observada no responde por sí sola geometría, estado, composición y edad.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="280" height="310" rx="24" class="card"/>
    <text x="95" y="220" class="tag">SISMOLOGÍA</text>
    <text x="95" y="260" class="head">Llegadas y fases</text>
    <path d="M100 305 C145 255 190 350 235 300 S315 335 330 285" stroke="#67e8f9" stroke-width="4" fill="none"/>
    <text x="95" y="375" class="body">PKP · SKS · PKIKP</text>
    <text x="95" y="407" class="body">sombras · reflexiones</text>
    <text x="95" y="450" class="small">Elasticidad + refracción</text>

    <rect x="365" y="180" width="280" height="310" rx="24" class="card"/>
    <text x="390" y="220" class="tag">GEODESIA</text>
    <text x="390" y="260" class="head">Masa y rotación</text>
    <circle cx="505" cy="330" r="65" fill="none" stroke="#64748b" stroke-width="12"/>
    <circle cx="505" cy="330" r="28" fill="url(#core)"/>
    <path d="M435 410H575" stroke="#67e8f9" stroke-width="5"/>
    <text x="390" y="445" class="body">I / MR² = 0.3308</text>
    <text x="390" y="475" class="small">Masa concentrada al centro</text>

    <rect x="660" y="180" width="280" height="310" rx="24" class="card"/>
    <text x="685" y="220" class="tag">GEOQUÍMICA</text>
    <text x="685" y="260" class="head">Lo que falta</text>
    <circle cx="735" cy="335" r="32" fill="#64748b"/><circle cx="800" cy="318" r="24" fill="#94a3b8"/>
    <circle cx="855" cy="355" r="40" fill="#f59e0b" opacity=".75"/>
    <text x="685" y="415" class="body">manto + meteoritos</text>
    <text x="685" y="447" class="body">partición metal/silicato</text>
    <text x="685" y="477" class="small">Balance condicionado</text>

    <rect x="955" y="180" width="280" height="310" rx="24" class="card"/>
    <text x="980" y="220" class="tag">ALTA PRESIÓN</text>
    <text x="980" y="260" class="head">Aleaciones extremas</text>
    <path d="M1035 300L1080 360L1125 300M1035 420L1080 360L1125 420" stroke="#e2e8f0" stroke-width="8" fill="none"/>
    <circle cx="1080" cy="360" r="22" fill="#f59e0b"/>
    <text x="980" y="445" class="body">ρ · Vp · fase · liquidus</text>
    <text x="980" y="475" class="small">Experimento + ab initio</text>

    <rect x="1250" y="180" width="280" height="310" rx="24" class="card"/>
    <text x="1275" y="220" class="tag">CRONÓMETROS</text>
    <text x="1275" y="260" class="head">Separación y mezcla</text>
    <path d="M1290 380C1340 280 1400 440 1490 300" stroke="#c084fc" stroke-width="6" fill="none"/>
    <circle cx="1348" cy="330" r="9" fill="#fde68a"/><circle cx="1430" cy="370" r="9" fill="#fde68a"/>
    <text x="1275" y="430" class="body">Hf–W + M(t)</text>
    <text x="1275" y="462" class="small">Equilibrio no observado</text>
  </g>

  <path d="M210 510V570" class="line"/><path d="M505 510V570" class="line"/>
  <path d="M800 510V570" class="line"/><path d="M1095 510V570" class="line"/><path d="M1390 510V570" class="line"/>

  <g filter="url(#shadow)">
    <rect x="70" y="595" width="350" height="245" rx="24" fill="#162337" stroke="#22d3ee" stroke-width="2"/>
    <text x="100" y="640" class="tag">GEOMETRÍA · A</text>
    <text x="100" y="685" class="claim">CMB ≈ 3480 km</text>
    <text x="100" y="720" class="claim">ICB ≈ 1221.5 km</text>
    <text x="100" y="770" class="body">Fases + modos + geodesia</text>
    <text x="100" y="805" class="small">Promedio radial, no esfera perfecta</text>

    <rect x="440" y="595" width="350" height="245" rx="24" fill="#162337" stroke="#22d3ee" stroke-width="2"/>
    <text x="470" y="640" class="tag">ESTADO · A</text>
    <text x="470" y="685" class="claim">Externo líquido</text>
    <text x="470" y="720" class="claim">Interno sólido</text>
    <text x="470" y="770" class="body">μ≈0 externo · μ&gt;0 interno</text>
    <text x="470" y="805" class="small">Conversión S↔K explícita</text>

    <rect x="810" y="595" width="350" height="245" rx="24" fill="#162337" stroke="#f59e0b" stroke-width="2"/>
    <text x="840" y="640" class="tag">COMPOSICIÓN · B-COND</text>
    <text x="840" y="685" class="claim">Fe dominante + Ni</text>
    <text x="840" y="720" class="claim">+ elementos ligeros</text>
    <text x="840" y="770" class="body">O · Si · S · C · H compiten</text>
    <text x="840" y="805" class="small">Receta exacta subdeterminada</text>

    <rect x="1180" y="595" width="350" height="245" rx="24" fill="#162337" stroke="#c084fc" stroke-width="2"/>
    <text x="1210" y="640" class="tag">TIEMPO · B-COND / C</text>
    <text x="1210" y="685" class="claim">Segregación temprana</text>
    <text x="1210" y="720" class="claim">Nucleación interna posterior</text>
    <text x="1210" y="770" class="body">Dos relojes no intercambiables</text>
    <text x="1210" y="805" class="small">Edad interna todavía modelada</text>
  </g>

  <text x="80" y="910" class="grade">Regla de lectura</text>
  <text x="260" y="910" class="body">la precisión de una llegada no se hereda automáticamente a un porcentaje químico o una edad.</text>
  <text x="80" y="955" class="small">Diagrama conceptual reproducible · INV-EARTH-CORE-001 · 2026-08-10</text>
</svg>
