<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde una aparición fósil hasta un ecosistema terrestre</title>
  <desc id="desc">Una cadena de siete controles impide convertir una aparición fósil en origen, terrestreidad, convivencia o ecosistema completo sin identificar, fechar, auditar el contexto y demostrar interacción.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08151e"/><stop offset="1" stop-color="#18262c"/></linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b2c5cc"/></marker>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.3"/></filter>
    <style>
      .t{font:700 40px 'Segoe UI',sans-serif;fill:#f4efe3}.st{font:400 20px 'Segoe UI',sans-serif;fill:#becdd3}.n{font:700 18px 'Segoe UI',sans-serif;fill:#0b1720}.h{font:700 21px 'Segoe UI',sans-serif;fill:#f5efe4}.b{font:400 16px 'Segoe UI',sans-serif;fill:#d5e0e4}.sm{font:400 14px 'Segoe UI',sans-serif;fill:#bbcad0}.box{fill:#17303a;stroke:#56717d;stroke-width:2}.arrow{stroke:#b2c5cc;stroke-width:3;fill:none;marker-end:url(#a2)}.bad{fill:#30222a;stroke:#a46f82;stroke-width:2}.ok{fill:#203427;stroke:#7ca174;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="920" fill="url(#bg2)"/>
  <text x="70" y="68" class="t">De una aparición fósil a un ecosistema terrestre</text>
  <text x="70" y="102" class="st">Cada flecha añade un supuesto comprobable; ninguna FAD contiene toda la cadena.</text>

  <g filter="url(#s2)">
    <rect x="60" y="180" width="190" height="190" rx="20" class="box"/>
    <circle cx="100" cy="220" r="22" fill="#d7b56d"/><text x="100" y="227" text-anchor="middle" class="n">1</text>
    <text x="85" y="270" class="h">IDENTIDAD</text>
    <text x="85" y="306" class="b">espora, eje, poro,</text>
    <text x="85" y="331" class="b">cutícula o coprolito</text>

    <path d="M250 275 H280" class="arrow"/>
    <rect x="290" y="180" width="190" height="190" rx="20" class="box"/>
    <circle cx="330" cy="220" r="22" fill="#d7b56d"/><text x="330" y="227" text-anchor="middle" class="n">2</text>
    <text x="315" y="270" class="h">EDAD</text>
    <text x="315" y="306" class="b">capa, biozona,</text>
    <text x="315" y="331" class="b">circón y correlación</text>

    <path d="M480 275 H510" class="arrow"/>
    <rect x="520" y="180" width="190" height="190" rx="20" class="box"/>
    <circle cx="560" cy="220" r="22" fill="#79aeba"/><text x="560" y="227" text-anchor="middle" class="n">3</text>
    <text x="545" y="270" class="h">CONTEXTO</text>
    <text x="545" y="306" class="b">marino, marginal</text>
    <text x="545" y="331" class="b">o no marino</text>

    <path d="M710 275 H740" class="arrow"/>
    <rect x="750" y="180" width="190" height="190" rx="20" class="box"/>
    <circle cx="790" cy="220" r="22" fill="#79aeba"/><text x="790" y="227" text-anchor="middle" class="n">4</text>
    <text x="775" y="270" class="h">FUNCIÓN</text>
    <text x="775" y="306" class="b">vasos, respiración,</text>
    <text x="775" y="331" class="b">crecimiento o ingestión</text>

    <path d="M940 275 H970" class="arrow"/>
    <rect x="980" y="180" width="190" height="190" rx="20" class="box"/>
    <circle cx="1020" cy="220" r="22" fill="#8da973"/><text x="1020" y="227" text-anchor="middle" class="n">5</text>
    <text x="1005" y="270" class="h">PROCEDENCIA</text>
    <text x="1005" y="306" class="b">in situ, transportado</text>
    <text x="1005" y="331" class="b">o retrabajado</text>

    <path d="M1170 275 H1200" class="arrow"/>
    <rect x="1210" y="180" width="190" height="190" rx="20" class="box"/>
    <circle cx="1250" cy="220" r="22" fill="#8da973"/><text x="1250" y="227" text-anchor="middle" class="n">6</text>
    <text x="1235" y="270" class="h">INTERACCIÓN</text>
    <text x="1235" y="306" class="b">contenido, depredador</text>
    <text x="1235" y="331" class="b">o asociación repetida</text>

    <path d="M1400 275 H1430" class="arrow"/>
    <rect x="1438" y="180" width="112" height="190" rx="20" class="ok"/>
    <circle cx="1474" cy="220" r="22" fill="#9fc28d"/><text x="1474" y="227" text-anchor="middle" class="n">7</text>
    <text x="1460" y="270" class="h">RED</text>
    <text x="1460" y="306" class="b">mínima</text>
    <text x="1460" y="331" class="b">y local</text>
  </g>

  <rect x="60" y="430" width="480" height="162" rx="20" class="bad"/>
  <text x="88" y="470" class="h">Atajos prohibidos</text>
  <text x="88" y="508" class="b">primera aparición → origen</text>
  <text x="88" y="536" class="b">parecido → parentesco o terrestreidad</text>
  <text x="88" y="564" class="b">misma capa → interacción completa</text>

  <rect x="560" y="430" width="480" height="162" rx="20" class="box"/>
  <text x="588" y="470" class="h">Caso Pneumodesmus</text>
  <text x="588" y="508" class="b">poros valvulados → respiración aérea (B)</text>
  <text x="588" y="536" class="b">esporas + circones + bloques → edad (B-COND)</text>
  <text x="588" y="564" class="b">Las rutas convergen, pero no se sustituyen.</text>

  <rect x="1060" y="430" width="490" height="162" rx="20" class="ok"/>
  <text x="1088" y="470" class="h">Conclusión permitida</text>
  <text x="1088" y="508" class="b">El Silúrico conserva productores, hongos,</text>
  <text x="1088" y="536" class="b">animales respiradores, depredación y consumo:</text>
  <text x="1088" y="564" class="b">un ensamblaje terrestre mínimo, no un bosque.</text>

  <path d="M300 645 H1300" stroke="#59727c" stroke-width="2" stroke-dasharray="8 10"/>
  <text x="80" y="704" class="h">Qué añade cada archivo</text>
  <text x="80" y="744" class="b">Espora: reproducción y dispersión · eje/esporangio: cuerpo · traqueida: transporte interno · filamento: crecimiento fúngico.</text>
  <text x="80" y="780" class="b">Espiráculo: aire · cutícula depredadora: nivel trófico · coprolito: ingestión · facies: lugar de depósito, no origen automático.</text>
  <text x="80" y="836" class="st">Resultado: varias evidencias convergen sin convertir sus dependencias en confirmaciones independientes.</text>
  <text x="1530" y="886" text-anchor="end" class="sm">INV-SILURIAN-001 · cadena inferencial · 2026-08-11</text>
</svg>
