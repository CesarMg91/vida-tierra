<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa epistemológico del origen africano de Homo sapiens</title>
  <desc id="desc">Cinco archivos de evidencia producen resultados distintos. Fósiles y cronología sostienen una emergencia africana distribuida; genomas favorecen estructura condicionada; arqueología informa conducta. Ninguna ruta localiza por sí sola una cuna.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1723"/><stop offset="1" stop-color="#182735"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#98aebd"/></marker>
    <style>
      .k{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#f4eee1;letter-spacing:.6px}
      .h{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#fffaf0}
      .s{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#d4dde2}
      .t{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#f2c17d}
      .tiny{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#b8c8d2}
      .box{fill:#152837;stroke:#476176;stroke-width:2;rx:22;filter:url(#shadow)}
      .result{fill:#203743;stroke:#67b0aa;stroke-width:2.5;rx:22;filter:url(#shadow)}
      .warn{fill:#382b27;stroke:#c8845e;stroke-width:2.5;rx:22;filter:url(#shadow)}
      .line{fill:none;stroke:#98aebd;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#c8845e;stroke-width:2.5;stroke-dasharray:9 9}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="72" class="h">Origen africano de Homo sapiens</text>
  <text x="80" y="108" class="s">Cinco archivos, cinco productos; una cuna puntual no está observada</text>

  <g transform="translate(70 170)">
    <rect class="box" width="260" height="148"/>
    <text x="24" y="40" class="k">FÓSILES</text>
    <text x="24" y="75" class="s">Irhoud · Omo</text><text x="24" y="104" class="s">Herto · Florisbad</text>
    <text x="24" y="132" class="tiny">forma + procedencia</text>
  </g>
  <g transform="translate(70 364)">
    <rect class="box" width="260" height="148"/>
    <text x="24" y="40" class="k">RELOJES</text>
    <text x="24" y="75" class="s">TL · US-ESR</text><text x="24" y="104" class="s">Ar/Ar · tefra</text>
    <text x="24" y="132" class="tiny">objeto + relación</text>
  </g>
  <g transform="translate(70 558)">
    <rect class="box" width="260" height="148"/>
    <text x="24" y="40" class="k">GENOMAS</text>
    <text x="24" y="75" class="s">LD · diversidad</text><text x="24" y="104" class="s">SMC · frecuencias</text>
    <text x="24" y="132" class="tiny">datos + modelo</text>
  </g>
  <g transform="translate(70 752)">
    <rect class="box" width="260" height="148"/>
    <text x="24" y="40" class="k">ARQUEOLOGÍA</text>
    <text x="24" y="75" class="s">MSA · pigmento</text><text x="24" y="104" class="s">obsidiana distante</text>
    <text x="24" y="132" class="tiny">práctica + contexto</text>
  </g>

  <path class="line" d="M330 244 C410 244 422 232 485 232"/>
  <path class="line" d="M330 438 C410 438 422 386 485 386"/>
  <path class="line" d="M330 632 C410 632 422 598 485 598"/>
  <path class="line" d="M330 826 C410 826 422 808 485 808"/>

  <g transform="translate(485 175)">
    <rect class="result" width="360" height="150"/>
    <text x="28" y="42" class="k">AFINIDAD FÓSIL</text>
    <text x="28" y="78" class="s">mosaico sapiens temprano</text>
    <text x="28" y="108" class="t">B</text><text x="62" y="108" class="tiny">no ancestro directo</text>
  </g>
  <g transform="translate(485 345)">
    <rect class="result" width="360" height="150"/>
    <text x="28" y="42" class="k">EDAD LOCAL</text>
    <text x="28" y="78" class="s">intervalo, mínimo o evento</text>
    <text x="28" y="108" class="t">B-COND</text><text x="122" y="108" class="tiny">no nacimiento</text>
  </g>
  <g transform="translate(485 540)">
    <rect class="result" width="360" height="150"/>
    <text x="28" y="42" class="k">ESTRUCTURA</text>
    <text x="28" y="78" class="s">tallos, flujo o pulso</text>
    <text x="28" y="108" class="t">B-COND / C</text><text x="160" y="108" class="tiny">depende del modelo</text>
  </g>
  <g transform="translate(485 735)">
    <rect class="result" width="360" height="150"/>
    <text x="28" y="42" class="k">CONDUCTA SITUADA</text>
    <text x="28" y="78" class="s">movilidad · tecnología</text>
    <text x="28" y="108" class="t">B</text><text x="62" y="108" class="tiny">no taxón ni genes</text>
  </g>

  <path class="line" d="M845 250 C930 250 930 315 1005 315"/>
  <path class="line" d="M845 420 C930 420 930 355 1005 355"/>
  <path class="line" d="M845 615 C930 615 930 525 1005 525"/>
  <path class="line" d="M845 810 C930 810 930 695 1005 695"/>

  <g transform="translate(1005 225)">
    <rect class="result" width="505" height="190"/>
    <text x="30" y="48" class="k">RESULTADO ROBUSTO</text>
    <text x="30" y="88" class="h" style="font-size:28px">origen africano</text>
    <text x="30" y="124" class="s">emergencia distribuida y mosaico</text>
    <text x="30" y="158" class="t">A–B</text>
  </g>
  <g transform="translate(1005 455)">
    <rect class="result" width="505" height="190"/>
    <text x="30" y="48" class="k">MARCO FAVORECIDO</text>
    <text x="30" y="88" class="h" style="font-size:28px">poblaciones estructuradas</text>
    <text x="30" y="124" class="s">con flujo, no panmixia continua</text>
    <text x="30" y="158" class="t">B-COND / C</text>
  </g>
  <g transform="translate(1005 685)">
    <rect class="warn" width="505" height="190"/>
    <text x="30" y="48" class="k">NO DETERMINADO</text>
    <text x="30" y="88" class="h" style="font-size:27px">región, número y cronología</text>
    <text x="30" y="124" class="s">de los tallos ancestrales</text>
    <text x="30" y="158" class="t">C–D</text>
  </g>

  <path class="dash" d="M1030 892 C860 950 590 944 374 900"/>
  <text x="535" y="950" class="tiny">ADN de ~300–200 ka y regiones submuestreadas: cuello de botella</text>
</svg>
