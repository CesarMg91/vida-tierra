<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Siete casos de «colapso» por seis niveles</title>
  <desc id="desc">Matriz de 7 casos (fin del Bronce en el Mediterráneo oriental, desurbanización del Indo, mayas clásicos del sur, Angkor, Rapa Nui, Cahokia y Roma en Occidente) por seis niveles: señal climática o ambiental, cronología fina, despoblamiento, cambio institucional, continuidad y atribución causal. Cada celda indica el estado del nivel en el módulo público: sostenido, condicionado, no demostrado o dato ausente. Ninguna fila tiene la atribución causal sostenida y todas tienen alguna continuidad.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1011"/><stop offset="1" stop-color="#171512"/></linearGradient>
    <style>.k{font:19px Consolas,monospace;letter-spacing:2px;fill:#c39456}.h{font:22px Georgia,serif;fill:#efe3d1}.t{font:19px Arial,sans-serif;fill:#c9c2b8}.l{font:16px Arial,sans-serif;fill:#d6a27b}.small{font:14px Consolas,monospace;fill:#91ad92}.cell{font:13px Arial,sans-serif;fill:#151310}.head{font:13px Consolas,monospace;letter-spacing:1px;fill:#c39456}.row{font:15px Arial,sans-serif;fill:#e6dccd}.rule{stroke:#8b6a43;stroke-width:2}.dash{stroke:#a96545;stroke-width:2;stroke-dasharray:8 8;fill:none}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="96" class="k">CIV-010 · MATRIZ DE NIVELES</text>
  <text x="70" y="150" font-family="Georgia,serif" font-size="42" fill="#f2e7d6">Ninguna atribución causal está sostenida</text>
  <text x="70" y="190" class="t">El estado es el del archivo de cada nivel, no una calificación de la sociedad. «Dato ausente» no es colapso.</text>
  <text x="530" y="236" class="head">SEÑAL</text><text x="702" y="236" class="head">CRONOLOGÍA</text><text x="874" y="236" class="head">DESPOBLAM.</text><text x="1046" y="236" class="head">INSTITUC.</text><text x="1218" y="236" class="head">CONTINUIDAD</text><text x="1390" y="236" class="head">ATRIBUCIÓN</text>
  <g><text x="70" y="278" class="row">Fin del Bronce en el Mediterráneo oriental</text><text x="70" y="300" class="small">c. 1250–1100 a. C.</text><rect x="520" y="250" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="530" y="287" class="cell">sostenido</text><rect x="692" y="250" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="702" y="287" class="cell">sostenido</text><rect x="864" y="250" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="874" y="287" class="cell">condicionado</text><rect x="1036" y="250" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1046" y="287" class="cell">sostenido</text><rect x="1208" y="250" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1218" y="287" class="cell">sostenido</text><rect x="1380" y="250" width="164" height="62" fill="#d79a70" fill-opacity=".9" stroke="#2c2720"/><text x="1390" y="287" class="cell">no demostrado</text></g>
  <g><text x="70" y="348" class="row">Desurbanización del Indo</text><text x="70" y="370" class="small">c. 2100–1700 a. C.</text><rect x="520" y="320" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="530" y="357" class="cell">sostenido</text><rect x="692" y="320" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="702" y="357" class="cell">condicionado</text><rect x="864" y="320" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="874" y="357" class="cell">condicionado</text><rect x="1036" y="320" width="164" height="62" fill="#6f6a62" fill-opacity=".9" stroke="#2c2720"/><text x="1046" y="357" class="cell" fill="#e6dccd">dato ausente</text><rect x="1208" y="320" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1218" y="357" class="cell">sostenido</text><rect x="1380" y="320" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="1390" y="357" class="cell">condicionado</text></g>
  <g><text x="70" y="418" class="row">Mayas clásicos del sur</text><text x="70" y="440" class="small">c. 750–1100 d. C.</text><rect x="520" y="390" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="530" y="427" class="cell">sostenido</text><rect x="692" y="390" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="702" y="427" class="cell">sostenido</text><rect x="864" y="390" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="874" y="427" class="cell">sostenido</text><rect x="1036" y="390" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1046" y="427" class="cell">sostenido</text><rect x="1208" y="390" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1218" y="427" class="cell">sostenido</text><rect x="1380" y="390" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="1390" y="427" class="cell">condicionado</text></g>
  <g><text x="70" y="488" class="row">Angkor</text><text x="70" y="510" class="small">siglos XIII–XVIII d. C.</text><rect x="520" y="460" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="530" y="497" class="cell">sostenido</text><rect x="692" y="460" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="702" y="497" class="cell">sostenido</text><rect x="864" y="460" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="874" y="497" class="cell">condicionado</text><rect x="1036" y="460" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1046" y="497" class="cell">sostenido</text><rect x="1208" y="460" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1218" y="497" class="cell">sostenido</text><rect x="1380" y="460" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="1390" y="497" class="cell">condicionado</text></g>
  <g><text x="70" y="558" class="row">Rapa Nui</text><text x="70" y="580" class="small">c. 1200–1900 d. C.</text><rect x="520" y="530" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="530" y="567" class="cell">condicionado</text><rect x="692" y="530" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="702" y="567" class="cell">condicionado</text><rect x="864" y="530" width="164" height="62" fill="#d79a70" fill-opacity=".9" stroke="#2c2720"/><text x="874" y="567" class="cell">no demostrado</text><rect x="1036" y="530" width="164" height="62" fill="#6f6a62" fill-opacity=".9" stroke="#2c2720"/><text x="1046" y="567" class="cell" fill="#e6dccd">dato ausente</text><rect x="1208" y="530" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1218" y="567" class="cell">sostenido</text><rect x="1380" y="530" width="164" height="62" fill="#d79a70" fill-opacity=".9" stroke="#2c2720"/><text x="1390" y="567" class="cell">no demostrado</text></g>
  <g><text x="70" y="628" class="row">Cahokia y el Cuarto Vacío</text><text x="70" y="650" class="small">c. 1150–1700 d. C.</text><rect x="520" y="600" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="530" y="637" class="cell">sostenido</text><rect x="692" y="600" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="702" y="637" class="cell">condicionado</text><rect x="864" y="600" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="874" y="637" class="cell">sostenido</text><rect x="1036" y="600" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="1046" y="637" class="cell">condicionado</text><rect x="1208" y="600" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1218" y="637" class="cell">sostenido</text><rect x="1380" y="600" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="1390" y="637" class="cell">condicionado</text></g>
  <g><text x="70" y="698" class="row">Roma en Occidente</text><text x="70" y="720" class="small">siglos II–VII d. C.</text><rect x="520" y="670" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="530" y="707" class="cell">condicionado</text><rect x="692" y="670" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="702" y="707" class="cell">sostenido</text><rect x="864" y="670" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="874" y="707" class="cell">condicionado</text><rect x="1036" y="670" width="164" height="62" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="1046" y="707" class="cell">sostenido</text><rect x="1208" y="670" width="164" height="62" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="1218" y="707" class="cell">condicionado</text><rect x="1380" y="670" width="164" height="62" fill="#d79a70" fill-opacity=".9" stroke="#2c2720"/><text x="1390" y="707" class="cell">no demostrado</text></g>
  <rect x="70" y="808" width="22" height="22" fill="#a9c1a7"/><text x="102" y="825" class="t">sostenido</text><rect x="300" y="808" width="22" height="22" fill="#d9bd8d"/><text x="332" y="825" class="t">condicionado</text><rect x="530" y="808" width="22" height="22" fill="#d79a70"/><text x="562" y="825" class="t">no demostrado</text><rect x="760" y="808" width="22" height="22" fill="#6f6a62"/><text x="792" y="825" class="t">dato ausente</text>
</svg>
