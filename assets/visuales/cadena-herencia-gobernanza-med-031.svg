<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde la herencia observada hasta la gobernanza en la genética médica</title>
  <desc id="desc">Ocho capas conectadas pero no automáticas: herencia observada → variante → asociación → penetrancia → predicción individual → transferencia → clasificación → gobernanza. Cada transición conserva un cortafuego: un patrón no es un mecanismo, una variante no es una enfermedad, una asociación no es una predicción, la penetrancia de familias no es la de la población, un riesgo relativo no es un destino, lo hallado en una ascendencia no vale sin medirlo en otra y una clasificación no es un hecho fijo; una muestra donada no es un permiso para todo uso.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a18"/><stop offset="1" stop-color="#1b2226"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e6f0ec"/><stop offset="1" stop-color="#c7d9d2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6 0 12Z" fill="#d9785b"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="240" fill="#1f5a4e" opacity=".3"/>
  <circle cx="115" cy="850" r="250" fill="#8e3f2e" opacity=".18"/>
  <text x="60" y="92" fill="#8fd0bd" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-031 · CADENA DE INFERENCIA</text>
  <text x="60" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="39" font-weight="700">Una variante no es un destino; una población no hereda a una persona</text>
  <text x="60" y="198" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="22">herencia → variante → asociación → penetrancia → predicción → transferencia → clasificación → gobernanza</text>
  <path d="M170 390H1430" stroke="#d9785b" stroke-width="4" stroke-dasharray="8 10" opacity=".7"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(60 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f5a4e"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">01</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">herencia</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">cruzas · familias</tspan><tspan x="18" dy="24">gemelos</tspan><tspan x="18" dy="24">proporciones</tspan></text></g>
    <g transform="translate(246 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f5a4e"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">02</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">variante</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">cromosoma</tspan><tspan x="18" dy="24">marcador · gen</tspan><tspan x="18" dy="24">secuencia</tspan></text></g>
    <g transform="translate(432 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f5a4e"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">03</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">asociación</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">casos y controles</tspan><tspan x="18" dy="24">efecto pequeño</tspan><tspan x="18" dy="24">replicación</tspan></text></g>
    <g transform="translate(618 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f5a4e"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">04</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">penetrancia</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">familias</tspan><tspan x="18" dy="24">biobancos</tspan><tspan x="18" dy="24">reclutamiento</tspan></text></g>
    <g transform="translate(804 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f5a4e"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">05</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">predicción</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">detección</tspan><tspan x="18" dy="24">falsos positivos</tspan><tspan x="18" dy="24">calibración</tspan></text></g>
    <g transform="translate(990 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f5a4e"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">06</text><text x="18" y="92" fill="#1f211e" font-size="17" font-weight="700">transferencia</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">ascendencia</tspan><tspan x="18" dy="24">distancia genética</tspan><tspan x="18" dy="24">contexto</tspan></text></g>
    <g transform="translate(1176 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f5a4e"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">07</text><text x="18" y="92" fill="#1f211e" font-size="17" font-weight="700">clasificación</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">cinco categorías</tspan><tspan x="18" dy="24">fecha</tspan><tspan x="18" dy="24">reclasificación</tspan></text></g>
    <g transform="translate(1362 275)"><rect width="168" height="235" rx="20" fill="url(#card)"/><circle cx="34" cy="38" r="20" fill="#1f5a4e"/><text x="34" y="45" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">08</text><text x="18" y="92" fill="#1f211e" font-size="20" font-weight="700">gobernanza</text><text x="18" y="160" fill="#4c5250" font-size="15"><tspan x="18" dy="0">consentimiento</tspan><tspan x="18" dy="24">ley · regulación</tspan><tspan x="18" dy="24">custodio</tspan></text></g>
  </g>
  <g stroke="#d9785b" stroke-width="4" marker-end="url(#arrow)"><path d="M230 390H244"/><path d="M416 390H430"/><path d="M602 390H616"/><path d="M788 390H802"/><path d="M974 390H988"/><path d="M1160 390H1174"/><path d="M1346 390H1360"/></g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#f0c8b8" text-anchor="middle">
    <text x="237" y="550"><tspan x="237">patrón ≠</tspan><tspan x="237" dy="20">mecanismo</tspan></text>
    <text x="423" y="550"><tspan x="423">variante ≠</tspan><tspan x="423" dy="20">enfermedad</tspan></text>
    <text x="609" y="550"><tspan x="609">asociación ≠</tspan><tspan x="609" dy="20">predicción</tspan></text>
    <text x="795" y="550"><tspan x="795">familias ≠</tspan><tspan x="795" dy="20">población</tspan></text>
    <text x="981" y="550"><tspan x="981">riesgo relativo ≠</tspan><tspan x="981" dy="20">destino</tspan></text>
    <text x="1167" y="550"><tspan x="1167">una ascendencia ≠</tspan><tspan x="1167" dy="20">otra</tspan></text>
    <text x="1353" y="550"><tspan x="1353">etiqueta ≠</tspan><tspan x="1353" dy="20">hecho fijo</tspan></text>
  </g>
  <rect x="60" y="645" width="1480" height="150" rx="24" fill="#0f1416" stroke="#4f8a7c" stroke-width="2"/>
  <text x="93" y="696" fill="#8fd0bd" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CONVERGENCIA LEGÍTIMA</text>
  <text x="93" y="744" fill="#f4f1e8" font-family="Georgia, serif" font-size="27">Ningún eslabón hereda la fuerza del siguiente: una muestra donada no es un permiso para todo.</text>
  <text x="93" y="778" fill="#c6d0cc" font-family="Arial, sans-serif" font-size="19">Quién está en las bases y cómo se reclutó a los portadores atraviesan todas las capas.</text>
  <text x="1540" y="850" fill="#7f8c88" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Diagrama editorial · historia de la evidencia, sin recomendaciones clínicas ni orientación sobre pruebas</text>
</svg>
