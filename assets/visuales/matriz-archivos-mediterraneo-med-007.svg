<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de archivos de la medicina griega y helenística</title>
  <desc id="desc">Cinco conjuntos documentales se comparan por testimonio, inferencia permitida y límite. Las filas no constituyen un ranking, una secuencia de progreso ni una medida de eficacia.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1e8d8"/><stop offset="1" stop-color="#dfd1bb"/></linearGradient><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#3b2c20" flood-opacity=".18"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><path d="M0 0H1600V18H0z" fill="#1f4138"/>
  <text x="90" y="92" fill="#8b4f2d" font-family="IBM Plex Sans,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-007 · MATRIZ SIN RANKING</text>
  <text x="90" y="150" fill="#211d18" font-family="Source Serif 4,Georgia,serif" font-size="50" font-weight="600">Cada archivo responde una pregunta distinta</text>
  <text x="90" y="192" fill="#5e554a" font-family="IBM Plex Sans,Arial,sans-serif" font-size="22">Texto, inscripción, instrumento y relato posterior requieren operaciones de lectura diferentes.</text>
  <g transform="translate(90 242)" filter="url(#shadow)" font-family="IBM Plex Sans,Arial,sans-serif">
    <rect width="1420" height="512" rx="20" fill="#fbf7ef"/><path d="M0 0H1420V72H0z" fill="#243b34"/>
    <text x="28" y="45" fill="#f4ecdf" font-size="18" font-weight="700">ARCHIVO</text><text x="336" y="45" fill="#f4ecdf" font-size="18" font-weight="700">TESTIMONIO SITUADO</text><text x="732" y="45" fill="#f4ecdf" font-size="18" font-weight="700">INFERENCIA PERMITIDA</text><text x="1090" y="45" fill="#f4ecdf" font-size="18" font-weight="700">LÍMITE</text>
    <g fill="#29231e" font-size="18">
      <g transform="translate(0 72)"><rect width="1420" height="88" fill="#fbf7ef"/><text x="28" y="37" font-size="21" font-weight="700">Corpus hipocrático</text><text x="28" y="65" fill="#8b4f2d">textos plurales</text><text x="336" y="37">~60 tratados, estratos</text><text x="336" y="65">y posiciones divergentes</text><text x="732" y="37">Debates, géneros y</text><text x="732" y="65">repertorios médicos</text><text x="1090" y="37">Autor único, doctrina</text><text x="1090" y="65">o escuela uniforme</text></g>
      <g transform="translate(0 160)"><rect width="1420" height="88" fill="#eee5d7"/><text x="28" y="37" font-size="21" font-weight="700">Epidemias</text><text x="28" y="65" fill="#8b4f2d">casos y constituciones</text><text x="336" y="37">Relatos clínicos editados</text><text x="336" y="65">con curso y pronóstico</text><text x="732" y="37">Formas de observar,</text><text x="732" y="65">seleccionar y narrar</text><text x="1090" y="37">Cohorte, vigilancia</text><text x="1090" y="65">o resultado comparable</text></g>
      <g transform="translate(0 248)"><rect width="1420" height="88" fill="#fbf7ef"/><text x="28" y="37" font-size="21" font-weight="700">Tratados quirúrgicos</text><text x="28" y="65" fill="#8b4f2d">maniobras prescritas</text><text x="336" y="37">Reducción, vendaje,</text><text x="336" y="65">instrumento y secuencia</text><text x="732" y="37">Saber operativo y</text><text x="732" y="65">razonamiento mecánico</text><text x="1090" y="37">Frecuencia, destreza</text><text x="1090" y="65">o eficacia demostrada</text></g>
      <g transform="translate(0 336)"><rect width="1420" height="88" fill="#eee5d7"/><text x="28" y="37" font-size="21" font-weight="700">Iamata de Epidauro</text><text x="28" y="65" fill="#8b4f2d">70 relatos públicos</text><text x="336" y="37">Estelas votivas con curas,</text><text x="336" y="65">oráculos y sanciones</text><text x="732" y="37">Repertorio narrativo</text><text x="732" y="65">del santuario</text><text x="1090" y="37">Registro exhaustivo,</text><text x="1090" y="65">denominador o tasa</text></g>
      <g transform="translate(0 424)"><rect width="1420" height="88" fill="#fbf7ef"/><text x="28" y="37" font-size="21" font-weight="700">Anatomía alejandrina</text><text x="28" y="65" fill="#8b4f2d">testigos posteriores</text><text x="336" y="37">Fragmentos y citas sobre</text><text x="336" y="65">Herófilo y Erasístrato</text><text x="732" y="37">Disección humana probable</text><text x="732" y="65">y comparación anatómica</text><text x="1090" y="37">Vivisección segura,</text><text x="1090" y="65">escala o mejora clínica</text></g>
    </g>
    <path d="M308 0V512M704 0V512M1062 0V512" stroke="#aa9c88"/>
  </g>
  <rect x="90" y="790" width="1420" height="54" rx="14" fill="#1f4138"/><text x="116" y="824" fill="#f4ecdf" font-family="IBM Plex Sans,Arial,sans-serif" font-size="19">Pluralidad documental ≠ “milagro griego”; observación escrita ≠ práctica uniforme ≠ resultado clínico.</text>
</svg>
