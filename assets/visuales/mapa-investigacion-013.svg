<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de evidencia de la Investigación 013 sobre la vida más antigua</title>
  <desc id="desc">Compara Strelley, Dresser, Isua y candidatas más antiguas en dos ejes: antigüedad y fuerza probatoria. La roca más antigua no contiene necesariamente la biosignatura más robusta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071820"/><stop offset="1" stop-color="#19151d"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58b8ae"/><stop offset=".52" stop-color="#d1a44e"/><stop offset="1" stop-color="#bd684b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".36"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#65c9c1"/></marker>
    <style>
      .k{font:600 22px Inter,Segoe UI,sans-serif;letter-spacing:4px;fill:#70d0c8}.t{font:700 46px Inter,Segoe UI,sans-serif;fill:#f3eee6}.s{font:400 20px Inter,Segoe UI,sans-serif;fill:#a7b7c1}
      .card{fill:#142832;stroke:#355765;stroke-width:2}.ct{font:700 23px Inter,Segoe UI,sans-serif;fill:#f2eee7}.m{font:700 21px Inter,Segoe UI,sans-serif;fill:#79d1c9}.b{font:400 17px Inter,Segoe UI,sans-serif;fill:#c0cbd1}.sm{font:400 16px Inter,Segoe UI,sans-serif;fill:#9babb3}.warn{font:600 16px Inter,Segoe UI,sans-serif;fill:#e2a16b}.dark{font:700 23px Inter,Segoe UI,sans-serif;fill:#071820}.tag{font:700 17px Inter,Segoe UI,sans-serif;fill:#071820}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1455" cy="110" r="270" fill="#6d4430" opacity=".14"/><circle cx="90" cy="930" r="300" fill="#24675f" opacity=".16"/>
  <text class="k" x="80" y="68">INVESTIGACIÓN 013 · MAPA DE EVIDENCIA</text>
  <text class="t" x="80" y="132">Más antigua no significa más demostrada</text>
  <text class="s" x="80" y="176">Cada candidata debe asegurar edad, singenicidad y biogenicidad antes de fijar una edad mínima.</text>

  <g filter="url(#shadow)">
    <g transform="translate(70 225)"><rect class="card" width="345" height="238" rx="22"/><rect width="345" height="11" rx="6" fill="#55b9ad"/><text class="ct" x="24" y="56">Strelley Pool</text><text class="m" x="24" y="94">~3.43 Ga · B-COND</text><text class="b" x="24" y="130">Arrecife + facies + paredes</text><text class="b" x="24" y="158">+ tafonomía + C/N/S</text><text class="warn" x="24" y="202">Umbral conservador</text></g>
    <g transform="translate(440 225)"><rect class="card" width="345" height="238" rx="22"/><rect width="345" height="11" rx="6" fill="#9cb35d"/><text class="ct" x="24" y="56">Dresser</text><text class="m" x="24" y="94">~3.48 Ga · C↑</text><text class="b" x="24" y="130">MISS + azufre + sistema</text><text class="b" x="24" y="158">de fuentes termales</text><text class="warn" x="24" y="202">Miméticos hidrotermales</text></g>
    <g transform="translate(810 225)"><rect class="card" width="345" height="238" rx="22"/><rect width="345" height="11" rx="6" fill="#d0a34d"/><text class="ct" x="24" y="56">Isua</text><text class="m" x="24" y="94">≥3.7 Ga · C↑</text><text class="b" x="24" y="130">Grafito en capas + población</text><text class="b" x="24" y="158">isotópica + huéspedes</text><text class="warn" x="24" y="202">Química sin célula visible</text></g>
    <g transform="translate(1180 225)"><rect class="card" width="350" height="238" rx="22"/><rect width="350" height="11" rx="6" fill="#bd674b"/><text class="ct" x="24" y="56">Candidatas más antiguas</text><text class="m" x="24" y="94">3.75–4.10 Ga · D–E</text><text class="b" x="24" y="130">Nuvvuagittuq · Saglek</text><text class="b" x="24" y="158">Akilia · zircon Jack Hills</text><text class="warn" x="24" y="202">Falta cerrar algún puente</text></g>
  </g>

  <g stroke="#65c9c1" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".82"><path d="M242 480 C242 548 560 548 670 608"/><path d="M612 480 C612 540 700 555 742 608"/><path d="M982 480 C982 540 900 555 858 608"/><path d="M1355 480 C1355 548 1045 548 930 608"/></g>
  <g filter="url(#shadow)"><rect x="435" y="598" width="730" height="145" rx="72" fill="url(#core)"/><text class="dark" x="800" y="649" text-anchor="middle">Tres puertas: indígena · singenética · biogénica</text><text class="dark" x="800" y="686" text-anchor="middle">una señal compatible no basta para cruzar las tres</text><rect x="737" y="707" width="126" height="32" rx="16" fill="#f7ead9"/><text class="tag" x="800" y="729" text-anchor="middle">AUDITADO</text></g>
  <line x1="800" y1="756" x2="800" y2="802" stroke="#65c9c1" stroke-width="4" marker-end="url(#arrow)"/>

  <g>
    <rect x="70" y="818" width="455" height="122" rx="22" fill="#173038" stroke="#4c7d7a" stroke-width="2"/><text class="ct" x="98" y="858">Lo que sí sabemos</text><text class="sm" x="98" y="887">Vida por al menos 3.43 Ga</text><text class="sm" x="98" y="912">Isua fortalece un límite más antiguo</text>
    <rect x="573" y="818" width="455" height="122" rx="22" fill="#302a27" stroke="#816c54" stroke-width="2"/><text class="ct" x="601" y="858">Lo que sigue abierto</text><text class="sm" x="601" y="887">Dresser frente a miméticos</text><text class="sm" x="601" y="912">Biogenicidad pre-3.7 Ga</text>
    <rect x="1075" y="818" width="455" height="122" rx="22" fill="#342426" stroke="#8b5b59" stroke-width="2"/><text class="ct" x="1103" y="858">Lo que no fecha</text><text class="sm" x="1103" y="887">Origen exacto, lugar o número</text><text class="sm" x="1103" y="912">de orígenes independientes</text>
  </g>
</svg>
