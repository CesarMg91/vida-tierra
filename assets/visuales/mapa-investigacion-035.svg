<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de evidencia de la Investigación 035</title>
  <desc id="desc">Seis rutas independientes y conectadas llevan de genomas, tríos, genealogías, fósiles y cromosomas a parentesco y tiempo. El centro distingue separación poblacional de coalescencia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08141a"/>
      <stop offset="0.55" stop-color="#0d1c25"/>
      <stop offset="1" stop-color="#171629"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8aa8b8"/>
    </marker>
    <style>
      .kicker{font:600 20px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#77d5cf}
      .title{font:700 42px 'Segoe UI',Arial,sans-serif;fill:#f4efe4}
      .sub{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#b8c7cc}
      .cardTitle{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#f5f1e9}
      .label{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#d9e5e7}
      .body{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#aebfc5}
      .small{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#91a9b1}
      .centerTitle{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#fff6df}
      .centerBody{font:500 18px 'Segoe UI',Arial,sans-serif;fill:#d9d3c5}
      .rule{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#f3c980}
      .line{fill:none;stroke:#8aa8b8;stroke-width:2.5;marker-end:url(#arrow);opacity:.75}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1430" cy="80" r="260" fill="#213f4b" opacity="0.22"/>
  <circle cx="120" cy="790" r="320" fill="#392650" opacity="0.18"/>

  <text x="80" y="70" class="kicker">INVESTIGACIÓN 035 · MAPA DE EVIDENCIA</text>
  <text x="80" y="122" class="title">Una separación, varios relojes</text>
  <text x="80" y="158" class="sub">Cada ruta mide un objeto distinto; la fecha aparece sólo al declarar sus puentes.</text>

  <path class="line" d="M420 305 C560 305 555 385 650 405"/>
  <path class="line" d="M420 540 C560 540 555 485 650 460"/>
  <path class="line" d="M950 405 C1050 380 1045 305 1180 305"/>
  <path class="line" d="M950 460 C1050 485 1045 540 1180 540"/>
  <path class="line" d="M800 650 L800 555"/>
  <path class="line" d="M800 270 L800 340"/>

  <g filter="url(#shadow)">
    <rect x="70" y="210" width="350" height="190" rx="20" fill="#102a32" stroke="#2d7b7a" stroke-width="2"/>
    <circle cx="112" cy="252" r="20" fill="#2b9b94"/>
    <text x="112" y="259" text-anchor="middle" class="label">1</text>
    <text x="145" y="260" class="cardTitle">Topología</text>
    <text x="100" y="305" class="label">homología + outgroups</text>
    <text x="100" y="336" class="body">millones de sitios y bloques</text>
    <text x="100" y="368" class="rule">→ árbol de especies</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="445" width="350" height="190" rx="20" fill="#152638" stroke="#456eae" stroke-width="2"/>
    <circle cx="112" cy="487" r="20" fill="#527fc5"/>
    <text x="112" y="494" text-anchor="middle" class="label">2</text>
    <text x="145" y="495" class="cardTitle">Diferencia genómica</text>
    <text x="100" y="540" class="label">alineamiento + denominador</text>
    <text x="100" y="571" class="body">SNP, indel, copia y estructura</text>
    <text x="100" y="603" class="rule">→ distancia declarada</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="625" y="205" width="350" height="145" rx="20" fill="#2b2238" stroke="#8268a8" stroke-width="2"/>
    <circle cx="667" cy="247" r="20" fill="#8063aa"/>
    <text x="667" y="254" text-anchor="middle" class="label">3</text>
    <text x="700" y="255" class="cardTitle">Tríos y generaciones</text>
    <text x="655" y="299" class="body">de novo + edad parental + vida</text>
    <text x="655" y="326" class="rule">→ tasa reciente por año</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="340" width="360" height="220" rx="28" fill="#24252b" stroke="#d2a75c" stroke-width="3"/>
    <text x="800" y="392" text-anchor="middle" class="centerTitle">Separación poblacional</text>
    <text x="800" y="425" text-anchor="middle" class="centerBody">inicio / fin / distribución</text>
    <line x1="665" y1="450" x2="935" y2="450" stroke="#665d4b"/>
    <text x="800" y="485" text-anchor="middle" class="rule">NO ES</text>
    <text x="800" y="516" text-anchor="middle" class="centerBody">TMRCA de un locus ni fecha observada</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="625" y="650" width="350" height="150" rx="20" fill="#162d33" stroke="#4a9ea0" stroke-width="2"/>
    <circle cx="667" cy="692" r="20" fill="#3b908f"/>
    <text x="667" y="699" text-anchor="middle" class="label">4</text>
    <text x="700" y="700" class="cardTitle">Coalescencia e ILS</text>
    <text x="655" y="742" class="body">recombinación + árboles locales</text>
    <text x="655" y="771" class="rule">→ historia ancestral</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="210" width="350" height="190" rx="20" fill="#362b1d" stroke="#b98743" stroke-width="2"/>
    <circle cx="1222" cy="252" r="20" fill="#b27b35"/>
    <text x="1222" y="259" text-anchor="middle" class="label">5</text>
    <text x="1255" y="260" class="cardTitle">Fósiles</text>
    <text x="1210" y="305" class="label">carácter + rama + horizonte</text>
    <text x="1210" y="336" class="body">edad y preservación explícitas</text>
    <text x="1210" y="368" class="rule">→ mínimo condicionado</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="445" width="350" height="190" rx="20" fill="#2e2434" stroke="#a05f83" stroke-width="2"/>
    <circle cx="1222" cy="487" r="20" fill="#a75f83"/>
    <text x="1222" y="494" text-anchor="middle" class="label">6</text>
    <text x="1255" y="495" class="cardTitle">Estructura cromosómica</text>
    <text x="1210" y="540" class="label">sintenia + fusión + polaridad</text>
    <text x="1210" y="571" class="body">cromosoma 2 como carácter</text>
    <text x="1210" y="603" class="rule">→ cambio de rama, no reloj</text>
  </g>

  <rect x="70" y="710" width="460" height="100" rx="18" fill="#0e2028" stroke="#35505b"/>
  <text x="95" y="748" class="label">Topología robusta</text>
  <text x="95" y="780" class="body">((Homo, Pan), Gorilla), Pongo</text>
  <text x="95" y="803" class="small">Pan vivo no es el ancestro común.</text>

  <rect x="1070" y="710" width="460" height="100" rx="18" fill="#0e2028" stroke="#35505b"/>
  <text x="1095" y="748" class="label">Síntesis prudente Homo–Pan</text>
  <text x="1095" y="780" class="body">~5.5–7 Ma · Mioceno tardío</text>
  <text x="1095" y="803" class="small">Intervalo de modelos, no instante fósil.</text>

  <text x="80" y="862" class="small">Regla central: más genoma reduce regiones invisibles; no elimina tasa, coalescencia, población ancestral ni calibración.</text>
</svg>
