      <g transform="translate(0 328)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Alemania</text><text x="112" y="39" fill="#5a6461" font-size="13">1933–1945</text><text x="392" y="29" fill="#252722">USHMM · The Lancet 2023</text><text x="760" y="29" fill="#252722">ley y recuento interno</text><text x="1122" y="29" fill="#8e5a3c">total de víctimas estimado</text></g>
      <g transform="translate(0 374)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">EE. UU. años setenta</text><text x="112" y="39" fill="#5a6461" font-size="13">1971–1978</text><text x="392" y="29" fill="#252722">GAO 1976 · Stern · Lawrence</text><text x="760" y="29" fill="#252722">recuento mínimo y formularios</text><text x="1122" y="29" fill="#8e5a3c">coerción no evaluada</text></g>
      <g transform="translate(0 420)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Perú</text><text x="112" y="39" fill="#5a6461" font-size="13">1996–2024</text><text x="392" y="29" fill="#252722">Ewig · CIDH · CEDAW</text><text x="760" y="29" fill="#252722">política y decisión internacional</text><text x="1122" y="29" fill="#8e5a3c">cifras citadas, no auditadas</text></g>
