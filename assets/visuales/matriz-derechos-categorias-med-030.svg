      <g transform="translate(0 696)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">DSM</text><text x="112" y="39" fill="#5a6461" font-size="13">1952–2017</text><text x="392" y="29" fill="#252722">Kendell · Drescher · Regier</text><text x="760" y="29" fill="#252722">confiabilidad y retirada</text><text x="1122" y="29" fill="#8e5a3c">confiabilidad no es validez</text></g>
      <g transform="translate(0 742)"><rect x="92" width="1416" height="46" fill="#f7f9fb"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Psiquiatría política</text><text x="112" y="39" fill="#5a6461" font-size="13">1960–2010</text><text x="392" y="29" fill="#252722">van Voren · Bloch</text><text x="760" y="29" fill="#252722">presos y sanción profesional</text><text x="1122" y="29" fill="#8e5a3c">estimaciones</text></g>
      <g transform="translate(0 788)"><rect x="92" width="1416" height="46" fill="#e3e9ee"/><text x="112" y="21" fill="#2d3f55" font-weight="700">Discapacidad</text><text x="112" y="39" fill="#5a6461" font-size="13">1976–2026</text><text x="392" y="29" fill="#252722">UPIAS · CDPD · OMS</text><text x="760" y="29" fill="#252722">modelo y tratado</text><text x="1122" y="29" fill="#8e5a3c">artículo 12 en disputa</text></g>
