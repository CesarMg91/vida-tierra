<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de evidencia de la eucariogénesis</title>
  <desc id="desc">Cinco rutas separan la genealogía nuclear arqueana, las proteínas y células Asgard, la genealogía mitocondrial bacteriana, la reconstrucción de LECA y la cronología. Las rutas convergen en resultados robustos y dejan abiertos el huésped y donante exactos, el engullimiento, la transición de membranas y la fecha.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#14263a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02070d" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#91a6ba"/>
    </marker>
    <style>
      .h1{font:700 42px system-ui,sans-serif;fill:#f5f8fb}.sub{font:400 19px system-ui,sans-serif;fill:#b9c7d4}.lane{font:700 21px system-ui,sans-serif;fill:#f8fbff}.txt{font:500 17px system-ui,sans-serif;fill:#e8eef4}.small{font:400 15px system-ui,sans-serif;fill:#c8d4df}.conf{font:800 18px system-ui,sans-serif}.box{stroke-width:2;rx:15;filter:url(#shadow)}.link{fill:none;stroke:#91a6ba;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="70" y="68" class="h1">Eucariogénesis: dos genealogías y una integración</text>
  <text x="70" y="101" class="sub">Dato → puente → afirmación. La convergencia no recupera la escena histórica.</text>

  <text x="70" y="160" class="lane">1 · Genealogía nuclear</text>
  <rect x="70" y="180" width="285" height="100" class="box" fill="#123a4a" stroke="#45b7c6"/>
  <text x="92" y="215" class="txt">Proteínas informacionales</text><text x="92" y="242" class="small">Archaea + Eukaryota</text><text x="92" y="265" class="small">alineamientos y árboles</text>
  <path d="M355 230 H420" class="link"/>
  <rect x="430" y="180" width="285" height="100" class="box" fill="#18384b" stroke="#6dc5d1"/>
  <text x="452" y="215" class="txt">Modelos filogenéticos</text><text x="452" y="242" class="small">taxones, composición, raíz</text><text x="452" y="265" class="small">y MAG quiméricos</text>
  <path d="M715 230 H780" class="link"/>
  <rect x="790" y="180" width="330" height="100" class="box" fill="#174e55" stroke="#61d5cd"/>
  <text x="812" y="215" class="txt">Eukaryota desde Archaea</text><text x="812" y="242" class="small">Asgard: pariente amplio</text><text x="812" y="267" class="conf" fill="#79eadb">A-COND · A-B</text>

  <text x="70" y="326" class="lane">2 · Piezas y células Asgard</text>
  <rect x="70" y="346" width="285" height="110" class="box" fill="#243650" stroke="#8e9fe7"/>
  <text x="92" y="381" class="txt">ESP + estructuras</text><text x="92" y="408" class="small">actina, profilina, ESCRT</text><text x="92" y="433" class="small">membranas y ubiquitina</text>
  <path d="M355 401 H420" class="link"/>
  <rect x="430" y="346" width="285" height="110" class="box" fill="#283b55" stroke="#a2aff2"/>
  <text x="452" y="381" class="txt">Cultivo + criotomografía</text><text x="452" y="408" class="small">protrusiones y Lokiactina</text><text x="452" y="433" class="small">sin núcleo ni fagocitosis</text>
  <path d="M715 401 H780" class="link"/>
  <rect x="790" y="346" width="330" height="110" class="box" fill="#3a3d68" stroke="#c0b9ff"/>
  <text x="812" y="381" class="txt">Complejidad molecular previa</text><text x="812" y="408" class="small">capacidad ancestral condicionada</text><text x="812" y="435" class="conf" fill="#d2caff">B</text>

  <text x="70" y="502" class="lane">3 · Genealogía mitocondrial</text>
  <rect x="70" y="522" width="285" height="110" class="box" fill="#4b2e24" stroke="#ec9569"/>
  <text x="92" y="557" class="txt">Genoma + ribosoma</text><text x="92" y="584" class="small">membranas, división,</text><text x="92" y="609" class="small">genes transferidos e importación</text>
  <path d="M355 577 H420" class="link"/>
  <rect x="430" y="522" width="285" height="110" class="box" fill="#513526" stroke="#f0a36f"/>
  <text x="452" y="557" class="txt">Árboles bacterianos</text><text x="452" y="584" class="small">taxones y modelos cambian</text><text x="452" y="609" class="small">la posición fina</text>
  <path d="M715 577 H780" class="link"/>
  <rect x="790" y="522" width="330" height="110" class="box" fill="#674326" stroke="#ffc37b"/>
  <text x="812" y="557" class="txt">Endosimbionte Alpha-relacionado</text><text x="812" y="584" class="small">donante exacto abierto</text><text x="812" y="611" class="conf" fill="#ffd098">A-COND · B-COND</text>

  <text x="70" y="678" class="lane">4 · Reconstrucción de LECA</text>
  <rect x="70" y="698" width="285" height="110" class="box" fill="#193f35" stroke="#63bc8e"/>
  <text x="92" y="733" class="txt">Sistemas en grandes clados</text><text x="92" y="760" class="small">núcleo, tráfico, citoesqueleto</text><text x="92" y="785" class="small">mitocondria y MRO</text>
  <path d="M355 753 H420" class="link"/>
  <rect x="430" y="698" width="285" height="110" class="box" fill="#21483d" stroke="#73cf9c"/>
  <text x="452" y="733" class="txt">Ortología + pérdidas</text><text x="452" y="760" class="small">reconstrucción de presencia</text><text x="452" y="785" class="small">antes de la radiación</text>
  <path d="M715 753 H780" class="link"/>
  <rect x="790" y="698" width="330" height="110" class="box" fill="#235b45" stroke="#82e0aa"/>
  <text x="812" y="733" class="txt">LECA complejo y mitocondriado</text><text x="812" y="760" class="small">no equivale al primer eucariota</text><text x="812" y="787" class="conf" fill="#9af0b9">A-B</text>

  <text x="1170" y="160" class="lane">5 · Tiempo</text>
  <rect x="1170" y="180" width="360" height="150" class="box" fill="#3c3449" stroke="#b990d1"/>
  <text x="1193" y="216" class="txt">Duplicaciones + reloj</text><text x="1193" y="246" class="small">edad modelada de nodos</text><text x="1193" y="274" class="small">función ancestral añadida</text><text x="1193" y="304" class="conf" fill="#d8b7ea">C-D</text>
  <rect x="1170" y="360" width="360" height="150" class="box" fill="#39404b" stroke="#aebdca"/>
  <text x="1193" y="396" class="txt">Fósil + facies + redox</text><text x="1193" y="426" class="small">presencia mínima y ecología</text><text x="1193" y="454" class="small">no fecha la endosimbiosis</text><text x="1193" y="484" class="conf" fill="#d2dce5">B-C · C-COND</text>

  <rect x="1160" y="548" width="380" height="260" class="box" fill="#2f2630" stroke="#d67888"/>
  <text x="1190" y="588" class="lane">Queda abierto</text>
  <text x="1190" y="625" class="txt">• rama Asgard exacta</text>
  <text x="1190" y="658" class="txt">• donante bacteriano exacto</text>
  <text x="1190" y="691" class="txt">• orden núcleo–mitocondria</text>
  <text x="1190" y="724" class="txt">• engullimiento e integración</text>
  <text x="1190" y="757" class="txt">• transición de membranas</text>
  <text x="1190" y="790" class="conf" fill="#f19aaa">C-D → E</text>

  <rect x="70" y="866" width="1460" height="82" rx="20" fill="#0d1b28" stroke="#4a647a" stroke-width="2"/>
  <text x="800" y="901" text-anchor="middle" class="txt">Resultado robusto: asociación arqueano–bacteriana integrada antes de LECA</text>
  <text x="800" y="929" text-anchor="middle" class="small">No heredar esa confianza al mecanismo físico, la secuencia fina, la fecha o las especies participantes.</text>
</svg>
