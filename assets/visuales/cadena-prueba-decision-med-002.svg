<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde el uso previsto de una prueba hasta los desenlaces</title>
  <desc id="desc">Seis estaciones separan población, prueba y umbral, referencia, rendimiento, manejo y desenlace. Entre cada estación hay un puente inferencial que puede fallar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111716"/><stop offset="1" stop-color="#080b0c"/></linearGradient>
    <style>
      .eyebrow{font:600 17px 'IBM Plex Sans',Arial,sans-serif;letter-spacing:3px;fill:#b78a51}
      .title{font:400 53px 'Source Serif 4',Georgia,serif;fill:#f0e6d3}
      .subtitle{font:400 22px 'IBM Plex Sans',Arial,sans-serif;fill:#aeb8b1}
      .num{font:500 18px 'IBM Plex Mono',Consolas,monospace;fill:#cc9559}
      .label{font:500 27px 'Source Serif 4',Georgia,serif;fill:#f0e6d3}
      .body{font:400 17px 'IBM Plex Sans',Arial,sans-serif;fill:#b7c0ba}
      .limit{font:500 15px 'IBM Plex Sans',Arial,sans-serif;fill:#d6ad74}
      .bridge{font:500 14px 'IBM Plex Sans',Arial,sans-serif;letter-spacing:1px;fill:#82968c}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6e887b"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 190H1600" stroke="#2f3c38"/>
  <text class="eyebrow" x="90" y="78">MED-002 · MAPA EPISTEMOLÓGICO</text>
  <text class="title" x="90" y="143">Una prueba no es una decisión</text>
  <text class="subtitle" x="1510" y="140" text-anchor="end">Cada flecha exige otro archivo.</text>

  <g transform="translate(70 260)">
    <g><rect width="220" height="330" rx="8" fill="#151d1c" stroke="#405049"/><text class="num" x="22" y="38">01</text><circle cx="110" cy="104" r="33" fill="none" stroke="#c18a4e" stroke-width="3"/><circle cx="75" cy="126" r="21" fill="none" stroke="#758b80"/><circle cx="145" cy="126" r="21" fill="none" stroke="#758b80"/><text class="label" x="22" y="184">Población</text><text class="body" x="22" y="222">espectro, entrada</text><text class="body" x="22" y="248">y uso previsto</text><path d="M22 274H198" stroke="#35423e"/><text class="limit" x="22" y="304">No: «cualquier paciente»</text></g>
    <g transform="translate(246)"><rect width="220" height="330" rx="8" fill="#151d1c" stroke="#405049"/><text class="num" x="22" y="38">02</text><path d="M55 126H165M110 75V160" stroke="#c18a4e" stroke-width="3"/><circle cx="110" cy="126" r="17" fill="#151d1c" stroke="#d9b477" stroke-width="3"/><text class="label" x="22" y="184">Prueba + umbral</text><text class="body" x="22" y="222">versión, lector, muestra</text><text class="body" x="22" y="248">y corte predefinido</text><path d="M22 274H198" stroke="#35423e"/><text class="limit" x="22" y="304">No: número aislado</text></g>
    <g transform="translate(492)"><rect width="220" height="330" rx="8" fill="#151d1c" stroke="#405049"/><text class="num" x="22" y="38">03</text><rect x="60" y="76" width="100" height="82" rx="4" fill="none" stroke="#769387" stroke-width="3"/><path d="M77 119L99 141L145 91" fill="none" stroke="#d9b477" stroke-width="4"/><text class="label" x="22" y="184">Referencia</text><text class="body" x="22" y="222">operación, intervalo</text><text class="body" x="22" y="248">y verificación</text><path d="M22 274H198" stroke="#35423e"/><text class="limit" x="22" y="304">No: verdad perfecta</text></g>
    <g transform="translate(738)"><rect width="220" height="330" rx="8" fill="#151d1c" stroke="#405049"/><text class="num" x="22" y="38">04</text><circle cx="77" cy="103" r="8" fill="#c18a4e"/><circle cx="110" cy="80" r="8" fill="#769387"/><circle cx="143" cy="123" r="8" fill="#c18a4e"/><path d="M60 151C90 116 128 147 160 94" fill="none" stroke="#d9b477" stroke-width="3"/><text class="label" x="22" y="184">Rendimiento</text><text class="body" x="22" y="222">exactitud, calibración</text><text class="body" x="22" y="248">e incertidumbre</text><path d="M22 274H198" stroke="#35423e"/><text class="limit" x="22" y="304">No: utilidad heredada</text></g>
    <g transform="translate(984)"><rect width="220" height="330" rx="8" fill="#151d1c" stroke="#405049"/><text class="num" x="22" y="38">05</text><path d="M110 76V106M110 106L70 151M110 106L150 151" fill="none" stroke="#769387" stroke-width="3"/><circle cx="70" cy="151" r="13" fill="none" stroke="#c18a4e" stroke-width="3"/><circle cx="150" cy="151" r="13" fill="none" stroke="#c18a4e" stroke-width="3"/><text class="label" x="22" y="184">Manejo</text><text class="body" x="22" y="222">acción, alternativa</text><text class="body" x="22" y="248">y adherencia</text><path d="M22 274H198" stroke="#35423e"/><text class="limit" x="22" y="304">No: acción beneficiosa</text></g>
    <g transform="translate(1230)"><rect width="220" height="330" rx="8" fill="#151d1c" stroke="#7d5a38"/><text class="num" x="22" y="38">06</text><path d="M60 112H160M85 82L60 112L85 142M135 82L160 112L135 142" fill="none" stroke="#d9b477" stroke-width="3"/><text class="label" x="22" y="184">Desenlace</text><text class="body" x="22" y="222">beneficio, daño, carga</text><text class="body" x="22" y="248">y recursos</text><path d="M22 274H198" stroke="#60472f"/><text class="limit" x="22" y="304">Importante para pacientes</text></g>
  </g>

  <g stroke="#6e887b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)">
    <path d="M290 425H314"/><path d="M536 425H560"/><path d="M782 425H806"/><path d="M1028 425H1052"/><path d="M1274 425H1298"/>
  </g>
  <text class="bridge" x="800" y="650" text-anchor="middle">DETECCIÓN ≠ EXACTITUD ≠ PROBABILIDAD ≠ UTILIDAD ≠ BENEFICIO</text>
  <rect x="90" y="704" width="1420" height="112" rx="8" fill="#101514" stroke="#35423e"/>
  <text class="eyebrow" x="120" y="744">CORTAFUEGO</text>
  <text class="subtitle" x="120" y="780">Un intervalo estrecho alrededor de una estimación sesgada sigue siendo una respuesta precisa</text>
  <text class="subtitle" x="120" y="807">a la pregunta equivocada.</text>
  <text class="body" x="1480" y="744" text-anchor="end">Diagrama conceptual · no calcula ni recomienda</text>
</svg>
