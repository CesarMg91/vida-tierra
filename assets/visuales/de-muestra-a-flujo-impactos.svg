<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de inferencia desde una muestra lunar hasta el flujo y el efecto terrestre</title>
  <desc id="desc">Cinco etapas separan edad isotópica, evento, distribución, flujo y efecto en la Tierra, mostrando la información adicional necesaria en cada paso.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131d"/><stop offset="1" stop-color="#17131e"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#69c7da"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".36"/></filter>
    <style>
      .k{font:600 22px Inter,Segoe UI,sans-serif;letter-spacing:4px;fill:#72ccdf}.t{font:700 45px Inter,Segoe UI,sans-serif;fill:#f3eee7}.s{font:400 20px Inter,Segoe UI,sans-serif;fill:#a7b7c1}.n{font:700 20px Inter,Segoe UI,sans-serif;fill:#07131d}.ct{font:700 22px Inter,Segoe UI,sans-serif;fill:#f3eee7}.b{font:400 17px Inter,Segoe UI,sans-serif;fill:#c0cbd1}.loss{font:600 16px Inter,Segoe UI,sans-serif;fill:#e1a06a}.foot{font:400 17px Inter,Segoe UI,sans-serif;fill:#98aab4}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text class="k" x="70" y="66">DE LA ROCA A LA HISTORIA</text><text class="t" x="70" y="126">Cinco preguntas antes de dibujar una curva de impactos</text><text class="s" x="70" y="169">La incertidumbre crece si se ocultan procedencia, preservación, población y escala Tierra–Luna.</text>
  <line x1="175" y1="400" x2="1415" y2="400" stroke="#315363" stroke-width="5"/>
  <g filter="url(#sh)">
    <g transform="translate(55 242)"><rect width="280" height="320" rx="24" fill="#173241" stroke="#477487" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#70cede"/><text class="n" x="44" y="52" text-anchor="middle">1</text><text class="ct" x="24" y="101">Muestra fechada</text><text class="b" x="24" y="140">U–Pb · Pb–Pb · Ar–Ar</text><text class="b" x="24" y="169">Textura y cierre</text><text class="loss" x="24" y="239">¿Cristalizó, cerró</text><text class="loss" x="24" y="266">o fue reiniciada?</text></g>
    <g transform="translate(360 242)"><rect width="280" height="320" rx="24" fill="#262d32" stroke="#71645d" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#d48c50"/><text class="n" x="44" y="52" text-anchor="middle">2</text><text class="ct" x="24" y="101">Evento asignado</text><text class="b" x="24" y="140">Composición + mapa</text><text class="b" x="24" y="169">Impacto y cuenca</text><text class="loss" x="24" y="239">Lugar de hallazgo</text><text class="loss" x="24" y="266">≠ lugar de origen</text></g>
    <g transform="translate(665 242)"><rect width="280" height="320" rx="24" fill="#30272a" stroke="#845e55" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#bf6848"/><text class="n" x="44" y="52" text-anchor="middle">3</text><text class="ct" x="24" y="101">Eventos recuperados</text><text class="b" x="24" y="140">Supervivencia + transporte</text><text class="b" x="24" y="169">Muestreo y clasificación</text><text class="loss" x="24" y="239">Varias muestras pueden</text><text class="loss" x="24" y="266">ser el mismo impacto</text></g>
    <g transform="translate(970 242)"><rect width="280" height="320" rx="24" fill="#292431" stroke="#735f86" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#9a78c8"/><text class="n" x="44" y="52" text-anchor="middle">4</text><text class="ct" x="24" y="101">Flujo inferido</text><text class="b" x="24" y="140">Área + tiempo + población</text><text class="b" x="24" y="169">Cráteres acumulados</text><text class="loss" x="24" y="239">Pico, cola e híbrido</text><text class="loss" x="24" y="266">pueden parecerse</text></g>
    <g transform="translate(1275 242)"><rect width="280" height="320" rx="24" fill="#29302b" stroke="#737b59" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#d0b55b"/><text class="n" x="44" y="52" text-anchor="middle">5</text><text class="ct" x="24" y="101">Efecto terrestre</text><text class="b" x="24" y="140">Velocidad + gravedad</text><text class="b" x="24" y="169">Aire + océano + corteza</text><text class="loss" x="24" y="239">Impacto lunar</text><text class="loss" x="24" y="266">≠ esterilización</text></g>
  </g>
  <g stroke="#69c7da" stroke-width="4" marker-end="url(#a)"><path d="M335 400 H352"/><path d="M640 400 H657"/><path d="M945 400 H962"/><path d="M1250 400 H1267"/></g>

  <g transform="translate(70 650)"><rect width="1460" height="150" rx="27" fill="#10232d" stroke="#365767" stroke-width="2"/><text class="ct" x="30" y="44">Qué sobrevive a la auditoría</text><circle cx="43" cy="88" r="7" fill="#70cede"/><text class="foot" x="61" y="94">B-COND: bombardeo temprano intenso y declinante.</text><circle cx="555" cy="88" r="7" fill="#9a78c8"/><text class="foot" x="573" y="94">D: pico terminal global único.</text><circle cx="970" cy="88" r="7" fill="#d0b55b"/><text class="foot" x="988" y="94">D–E: curva de efectos en la Tierra.</text><text class="foot" x="30" y="128">La edad de SPA no se promedia: 4.25 y 4.33 Ga compiten sobre la identidad del material fechado.</text></g>
  <text class="foot" x="800" y="855" text-anchor="middle">MUESTRA → EVENTO → DISTRIBUCIÓN RECUPERADA → FLUJO → EFECTO TERRESTRE</text>
</svg>
