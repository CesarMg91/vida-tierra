  <g><text x="70" y="276" class="row">Arroz del bajo Yangtsé</text><text x="70" y="296" class="small">Asia oriental</text><rect x="430" y="250" width="174" height="54" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="440" y="282" class="cell">sostenido</text><rect x="612" y="250" width="174" height="54" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="622" y="282" class="cell">condicionado</text><rect x="794" y="250" width="174" height="54" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="804" y="282" class="cell">sostenido</text><rect x="976" y="250" width="174" height="54" fill="#a9c1a7" fill-opacity=".9" stroke="#2c2720"/><text x="986" y="282" class="cell">sostenido</text><rect x="1158" y="250" width="174" height="54" fill="#d9bd8d" fill-opacity=".9" stroke="#2c2720"/><text x="1168" y="282" class="cell">condicionado</text><rect x="1340" y="250" width="174" height="54" fill="#d79a70" fill-opacity=".9" stroke="#2c2720"/><text x="1350" y="282" class="cell">no demostrado</text></g>
