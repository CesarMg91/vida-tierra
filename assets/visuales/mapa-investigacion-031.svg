<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de evidencia de la Investigación 031 sobre el límite K–Pg</title>
  <desc id="desc">Seis columnas conectan el límite formal, la evidencia de Chicxulub, la cronología de Deccan, los forzamientos ambientales, la selectividad biológica y los relojes de recuperación, con una franja inferior de inferencias permitidas y límites.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#132a32"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9cc8c8"/></marker>
    <style>
      .h1{font:700 38px system-ui,sans-serif;fill:#f4ead7}.sub{font:18px system-ui,sans-serif;fill:#b9d4d2}.head{font:700 21px system-ui,sans-serif;fill:#07131c}.body{font:16px system-ui,sans-serif;fill:#e9f0eb}.small{font:14px system-ui,sans-serif;fill:#bfd0cc}.rule{stroke:#9cc8c8;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{rx:18;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="75" class="h1">K–Pg: seis archivos, una atribución condicionada</text>
  <text x="80" y="112" class="sub">Observación → medición → puente → conclusión; ningún panel sustituye a los demás</text>

  <g transform="translate(65 165)">
    <rect class="box" width="225" height="500" fill="#263c48"/>
    <rect width="225" height="70" rx="18" fill="#e9c46a"/><text x="22" y="43" class="head">1 · FRONTERA</text>
    <text x="22" y="112" class="body"><tspan x="22">El Kef</tspan><tspan x="22" dy="30">base de arcilla</tspan><tspan x="22" dy="30">tabla ICS</tspan><tspan x="22" dy="30">66.0 Ma</tspan></text>
    <path d="M22 250H203" stroke="#e9c46a" stroke-width="2"/>
    <text x="22" y="285" class="small"><tspan x="22">Entrega:</tspan><tspan x="22" dy="25">horizonte formal</tspan><tspan x="22" dy="25">y correlación</tspan></text>
    <text x="22" y="395" class="small"><tspan x="22">No entrega:</tspan><tspan x="22" dy="25">mecanismo causal</tspan></text>
  </g>
  <g transform="translate(315 165)">
    <rect class="box" width="225" height="500" fill="#263c48"/>
    <rect width="225" height="70" rx="18" fill="#f4a261"/><text x="20" y="43" class="head">2 · IMPACTO</text>
    <text x="20" y="112" class="body"><tspan x="20">iridio</tspan><tspan x="20" dy="30">cuarzo chocado</tspan><tspan x="20" dy="30">esférulas</tspan><tspan x="20" dy="30">cráter + núcleo</tspan></text>
    <path d="M20 250H205" stroke="#f4a261" stroke-width="2"/>
    <text x="20" y="285" class="small"><tspan x="20">Entrega:</tspan><tspan x="20" dy="25">Chicxulub enlazado</tspan><tspan x="20" dy="25">con la capa</tspan></text>
    <text x="20" y="395" class="small"><tspan x="20">No entrega:</tspan><tspan x="20" dy="25">toda mortalidad</tspan></text>
  </g>
  <g transform="translate(565 165)">
    <rect class="box" width="225" height="500" fill="#263c48"/>
    <rect width="225" height="70" rx="18" fill="#d76f4b"/><text x="18" y="43" class="head">3 · DECCAN</text>
    <text x="20" y="112" class="body"><tspan x="20">U–Pb</tspan><tspan x="20" dy="30">⁴⁰Ar/³⁹Ar</tspan><tspan x="20" dy="30">volumen</tspan><tspan x="20" dy="30">GDGT / carbono</tspan></text>
    <path d="M20 250H205" stroke="#d76f4b" stroke-width="2"/>
    <text x="20" y="285" class="small"><tspan x="20">Entrega:</tspan><tspan x="20" dy="25">pulsos y cambio</tspan><tspan x="20" dy="25">ambiental</tspan></text>
    <text x="20" y="395" class="small"><tspan x="20">Abierto:</tspan><tspan x="20" dy="25">volumen + gases</tspan></text>
  </g>
  <g transform="translate(815 165)">
    <rect class="box" width="225" height="500" fill="#263c48"/>
    <rect width="225" height="70" rx="18" fill="#74a6a6"/><text x="14" y="43" class="head">4 · FORZAR</text>
    <text x="20" y="112" class="body"><tspan x="20">polvo</tspan><tspan x="20" dy="30">sulfatos / hollín</tspan><tspan x="20" dy="30">luz / temperatura</tspan><tspan x="20" dy="30">pH / nutrientes</tspan></text>
    <path d="M20 250H205" stroke="#74a6a6" stroke-width="2"/>
    <text x="20" y="285" class="small"><tspan x="20">Entrega:</tspan><tspan x="20" dy="25">rangos modelados</tspan><tspan x="20" dy="25">de ambiente</tspan></text>
    <text x="20" y="395" class="small"><tspan x="20">No entrega:</tspan><tspan x="20" dy="25">medición mundial</tspan></text>
  </g>
  <g transform="translate(1065 165)">
    <rect class="box" width="225" height="500" fill="#263c48"/>
    <rect width="225" height="70" rx="18" fill="#8ab17d"/><text x="10" y="43" class="head">5 · EXTINCIÓN</text>
    <text x="20" y="112" class="body"><tspan x="20">fósiles</tspan><tspan x="20" dy="30">talla / dieta</tspan><tspan x="20" dy="30">hábitat / luz</tspan><tspan x="20" dy="30">energía</tspan></text>
    <path d="M20 250H205" stroke="#8ab17d" stroke-width="2"/>
    <text x="20" y="285" class="small"><tspan x="20">Entrega:</tspan><tspan x="20" dy="25">filtros selectivos</tspan><tspan x="20" dy="25">condicionados</tspan></text>
    <text x="20" y="395" class="small"><tspan x="20">No entrega:</tspan><tspan x="20" dy="25">regla universal</tspan></text>
  </g>
  <g transform="translate(1315 165)">
    <rect class="box" width="225" height="500" fill="#263c48"/>
    <rect width="225" height="70" rx="18" fill="#b6c98d"/><text x="8" y="43" class="head">6 · RECUPERAR</text>
    <text x="20" y="112" class="body"><tspan x="20">presencia</tspan><tspan x="20" dy="30">productividad</tspan><tspan x="20" dy="30">riqueza</tspan><tspan x="20" dy="30">red / exportación</tspan></text>
    <path d="M20 250H205" stroke="#b6c98d" stroke-width="2"/>
    <text x="20" y="285" class="small"><tspan x="20">Entrega:</tspan><tspan x="20" dy="25">relojes de años</tspan><tspan x="20" dy="25">a 10⁶ años</tspan></text>
    <text x="20" y="395" class="small"><tspan x="20">No entrega:</tspan><tspan x="20" dy="25">una normalidad</tspan></text>
  </g>

  <path class="rule" d="M290 420H307"/><path class="rule" d="M540 420H557"/><path class="rule" d="M790 420H807"/><path class="rule" d="M1040 420H1057"/><path class="rule" d="M1290 420H1307"/>
  <rect x="65" y="715" width="1475" height="205" rx="24" fill="#172f38" stroke="#456b70" stroke-width="2"/>
  <text x="95" y="765" class="sub">ATRIBUCIÓN RESULTANTE</text>
  <text x="95" y="810" class="body"><tspan x="95">Chicxulub: disparador dominante por convergencia física, estratigráfica y biológica.</tspan><tspan x="95" dy="34">Deccan: perturbación real; magnitud, gases, reparto temporal e interacción siguen abiertos.</tspan><tspan x="95" dy="34">Extinción y recuperación: resultados selectivos, regionales y dependientes de la variable medida.</tspan></text>
</svg>
