<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cinco capas: práctica, informe, correlato, efecto y afirmación metafísica; qué se midió en cada una y qué no se sigue</title>
  <desc id="desc">Tabla de cinco filas. Práctica: familias y grupos de técnicas, pero «meditación» no es una sola cosa. Informe: métodos que ordenan los datos cerebrales, pero el informe no es un registro. Correlato: gamma de expertos y red por defecto, sin asignación al azar; sin cambios estructurales en el ensayo más grande. Efecto: moderado frente a lista de espera y pequeño o nulo frente a controles activos. Metafísica: sin datos a favor.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14120f"/><stop offset="1" stop-color="#211d16"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="92" fill="#d8c9a3" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">CON-009 · CINCO CAPAS</text>
  <text x="92" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="44" font-weight="700">Lo que se midió y lo que no se sigue</text>
  <text x="320" y="236" fill="#cfc8b8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Qué se midió</text>
  <text x="940" y="236" fill="#cfc8b8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Qué no se sigue</text>
  <text x="92" y="312" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Práctica</text>
  <text x="92" y="342" fill="#d8c9a3" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza A</text>
  <rect x="300" y="270" width="600" height="88" rx="12" fill="#ece8dc"/>
  <text x="320" y="304" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">familias atencionales, constructivas y deconstructivas;</text>
  <text x="320" y="329" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">siete grupos empíricos de técnicas</text>
  <rect x="920" y="270" width="588" height="88" rx="12" fill="#e9e4f0"/>
  <text x="940" y="304" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">que «meditación» sea una sola cosa con un solo efecto</text>
  <text x="92" y="416" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Informe</text>
  <text x="92" y="446" fill="#d8c9a3" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza A</text>
  <rect x="300" y="374" width="600" height="88" rx="12" fill="#ece8dc"/>
  <text x="320" y="408" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">botones, retroalimentación y entrevistas que ordenan los</text>
  <text x="320" y="433" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">datos cerebrales</text>
  <rect x="920" y="374" width="588" height="88" rx="12" fill="#e9e4f0"/>
  <text x="940" y="408" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">que el informe registre la experiencia sin vocabulario</text>
  <text x="940" y="433" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">ni expectativa</text>
  <text x="92" y="520" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Correlato</text>
  <text x="92" y="550" fill="#d8c9a3" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza B</text>
  <rect x="300" y="478" width="600" height="88" rx="12" fill="#f1e2c8"/>
  <text x="320" y="512" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">más gamma en expertos; red por defecto menos activa; sin</text>
  <text x="320" y="537" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">cambio estructural en 218 personas</text>
  <rect x="920" y="478" width="588" height="88" rx="12" fill="#e9e4f0"/>
  <text x="940" y="512" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">que la práctica cause la diferencia: los expertos no</text>
  <text x="940" y="537" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">se asignan al azar</text>
  <text x="92" y="624" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Efecto</text>
  <text x="92" y="654" fill="#d8c9a3" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza B/C</text>
  <rect x="300" y="582" width="600" height="88" rx="12" fill="#f1e2c8"/>
  <text x="320" y="616" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">moderado frente a lista de espera; pequeño o nulo frente</text>
  <text x="320" y="641" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">a controles activos; MYRIAD nulo</text>
  <rect x="920" y="582" width="588" height="88" rx="12" fill="#e9e4f0"/>
  <text x="940" y="616" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">un componente específico de la meditación ni la</text>
  <text x="940" y="641" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">ausencia de efectos adversos</text>
  <text x="92" y="728" fill="#f4f1e8" font-family="Georgia, serif" font-size="25" font-weight="700">Metafísica</text>
  <text x="92" y="758" fill="#d8c9a3" font-family="Arial, sans-serif" font-size="18" font-weight="700">confianza E</text>
  <rect x="300" y="686" width="600" height="88" rx="12" fill="#f3d6c8"/>
  <text x="320" y="720" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">informes de «conciencia pura» y de ceses; ningún EEG</text>
  <text x="320" y="745" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">reconocible en el tukdam</text>
  <rect x="920" y="686" width="588" height="88" rx="12" fill="#e9e4f0"/>
  <text x="940" y="720" fill="#2a251c" font-family="Arial, sans-serif" font-size="19" font-weight="400">una conciencia sin cerebro ni acceso a otra realidad</text>
  <text x="92" y="850" fill="#aaa290" font-family="Arial, sans-serif" font-size="19">Claro: sólido. Ocre: medido con límites serios. Rojo claro: sin datos a favor. No es una guía de meditación ni una recomendación clínica.</text>
</svg>
