<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de teoría microbiana y laboratorio</title>
  <desc id="desc">Diez expedientes comparados por periodo, archivo, producto mejor resuelto y límite. La tabla no forma una escalera de progreso ni reparte prioridad entre escuelas o países.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe9e7"/><stop offset="1" stop-color="#c4d4d1"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="58" y="40" width="1484" height="830" rx="28" fill="#f3f8f7" stroke="#24434a" stroke-width="2"/>
  <text x="92" y="94" fill="#2f6f66" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-022 · MATRIZ DE EVIDENCIA</text>
  <text x="92" y="145" fill="#1c2422" font-family="Georgia, serif" font-size="42" font-weight="700">Diez archivos, diez productos, ningún agente suficiente</text>
  <text x="92" y="183" fill="#4c5250" font-family="Arial, sans-serif" font-size="20">Qué tipo de evidencia sostiene cada expediente y dónde debe detenerse la atribución.</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="92" y="222" width="1416" height="56" rx="10" fill="#24434a"/>
    <g fill="#eef6f4" font-size="18" font-weight="700"><text x="112" y="257">EXPEDIENTE</text><text x="392" y="257">ARCHIVO</text><text x="760" y="257">PRODUCTO RESUELTO</text><text x="1122" y="257">LÍMITE</text></g>
    <g>
      <g transform="translate(0 286)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Contagio y semillas</text><text x="112" y="44" fill="#5a6461" font-size="15">Antigüedad–1546</text><text x="392" y="34" fill="#252722">textos médicos</text><text x="760" y="34" fill="#252722">vocabulario de transmisión</text><text x="1122" y="34" fill="#8e3f2e">entidades lógicas, no observadas</text></g>
      <g transform="translate(0 340)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Henle y miasmatistas</text><text x="112" y="44" fill="#5a6461" font-size="15">1840–1892</text><text x="392" y="34" fill="#252722">conjetura · higiene</text><text x="760" y="34" fill="#252722">criterio e interacción</text><text x="1122" y="34" fill="#8e3f2e">germen postulado, nunca aislado</text></g>
      <g transform="translate(0 394)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Pasteur</text><text x="112" y="44" fill="#5a6461" font-size="15">1857–1885</text><text x="392" y="34" fill="#252722">cuaderno · publicación</text><text x="760" y="34" fill="#252722">fermentación y vacunas</text><text x="1122" y="34" fill="#8e3f2e">informe distinto de la práctica</text></g>
      <g transform="translate(0 448)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Carbunco</text><text x="112" y="44" fill="#5a6461" font-size="15">1876</text><text x="392" y="34" fill="#252722">artículo · animales</text><text x="760" y="34" fill="#252722">enfermedad inducida</text><text x="1122" y="34" fill="#8e3f2e">casos naturales escasos</text></g>
      <g transform="translate(0 502)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Tuberculosis</text><text x="112" y="44" fill="#5a6461" font-size="15">1882–1890</text><text x="392" y="34" fill="#252722">tinción · agar · placa</text><text x="760" y="34" fill="#252722">agente de una crónica mayor</text><text x="1122" y="34" fill="#8e3f2e">la tuberculina fracasó</text></g>
      <g transform="translate(0 556)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Cólera</text><text x="112" y="44" fill="#5a6461" font-size="15">1854–1892</text><text x="392" y="34" fill="#252722">comisión · agua</text><text x="760" y="34" fill="#252722">vibrión en cultivo puro</text><text x="1122" y="34" fill="#8e3f2e">portadores sanos</text></g>
      <g transform="translate(0 610)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Postulados</text><text x="112" y="44" fill="#5a6461" font-size="15">1878–1905</text><text x="392" y="34" fill="#252722">artículos e historiografía</text><text x="760" y="34" fill="#252722">exigencia de necesidad</text><text x="1122" y="34" fill="#8e3f2e">texto y autoría disputados</text></g>
      <g transform="translate(0 664)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Virus y priones</text><text x="112" y="44" fill="#5a6461" font-size="15">1892–1982</text><text x="392" y="34" fill="#252722">filtro · bioquímica</text><text x="760" y="34" fill="#252722">agentes fuera del molde</text><text x="1122" y="34" fill="#8e3f2e">el cultivo deja de aplicar</text></g>
      <g transform="translate(0 718)"><rect x="92" width="1416" height="54" fill="#f7fbfa"/><text x="112" y="23" fill="#24434a" font-weight="700">Gen y secuencia</text><text x="112" y="44" fill="#5a6461" font-size="15">1988–1996</text><text x="392" y="34" fill="#252722">16S · mutantes</text><text x="760" y="34" fill="#252722">atribución sin cultivo</text><text x="1122" y="34" fill="#8e3f2e">secuencia no es causa</text></g>
      <g transform="translate(0 772)"><rect x="92" width="1416" height="54" fill="#e3ecea"/><text x="112" y="23" fill="#24434a" font-weight="700">Cohorte y microbioma</text><text x="112" y="44" fill="#5a6461" font-size="15">2005–2026</text><text x="392" y="34" fill="#252722">ensayo · metagenoma</text><text x="760" y="34" fill="#252722">denominador y comunidad</text><text x="1122" y="34" fill="#8e3f2e">detectar no es atribuir</text></g>
    </g>
  </g>
  <text x="1505" y="858" fill="#5a6461" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
