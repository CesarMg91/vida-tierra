<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">De rift a océano y de pluma a vuelo</title>
  <desc id="desc">Dos cadenas causales muestran los pasos necesarios para reconstruir apertura oceánica y capacidad de vuelo.</desc>
  <defs>
    <style>
      .bg{fill:#10191f}.box{fill:#182a33;stroke:#668691;stroke-width:2}.box2{fill:#2a2420;stroke:#b07a4e;stroke-width:2}.h{font:700 34px system-ui,sans-serif;fill:#f1e3c3}.sh{font:700 24px system-ui,sans-serif;fill:#e1b16f}.t{font:18px system-ui,sans-serif;fill:#dce7e7}.s{font:15px system-ui,sans-serif;fill:#abc0c3}.a{stroke:#d48d50;stroke-width:4;fill:none;marker-end:url(#m)}.a2{stroke:#75a6ae;stroke-width:4;fill:none;marker-end:url(#m2)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#d48d50"/></marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#75a6ae"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="h" x="65" y="65">DOS TRANSICIONES · NINGÚN SALTO AUTOMÁTICO</text>

  <text class="sh" x="70" y="125">A · DE ESTRUCTURA HEREDADA A OCÉANO</text>
  <rect class="box" x="70" y="155" width="210" height="110" rx="18"/>
  <text class="t" x="95" y="197">falla + cuenca</text><text class="s" x="95" y="228">extensión medida</text>
  <rect class="box" x="330" y="155" width="210" height="110" rx="18"/>
  <text class="t" x="355" y="197">corteza estirada</text><text class="s" x="355" y="228">balance restaurado</text>
  <rect class="box" x="590" y="155" width="210" height="110" rx="18"/>
  <text class="t" x="615" y="197">ruptura</text><text class="s" x="615" y="228">segmento + criterio</text>
  <rect class="box" x="850" y="155" width="210" height="110" rx="18"/>
  <text class="t" x="875" y="197">corteza transicional</text><text class="s" x="875" y="228">magmatismo variable</text>
  <rect class="box" x="1110" y="155" width="210" height="110" rx="18"/>
  <text class="t" x="1135" y="197">fondo oceánico</text><text class="s" x="1135" y="228">anomalía + edad</text>
  <rect class="box2" x="1370" y="155" width="160" height="110" rx="18"/>
  <text class="t" x="1394" y="197">Atlántico</text><text class="s" x="1394" y="228">estrecho y lento</text>
  <path class="a2" d="M280 210H330"/><path class="a2" d="M540 210H590"/><path class="a2" d="M800 210H850"/><path class="a2" d="M1060 210H1110"/><path class="a2" d="M1320 210H1370"/>
  <text class="s" x="70" y="305">La fecha cambia si el objeto es extensión, ruptura, primera corteza o conexión marina.</text>

  <text class="sh" x="70" y="390">B · DE PLUMA PRESERVADA A VUELO CONDICIONADO</text>
  <rect class="box2" x="70" y="420" width="210" height="110" rx="18"/>
  <text class="t" x="95" y="462">impresión</text><text class="s" x="95" y="493">tipo de pluma</text>
  <rect class="box2" x="330" y="420" width="210" height="110" rx="18"/>
  <text class="t" x="355" y="462">distribución</text><text class="s" x="355" y="493">ala + cola</text>
  <rect class="box2" x="590" y="420" width="210" height="110" rx="18"/>
  <text class="t" x="615" y="462">articulación</text><text class="s" x="615" y="493">rango de movimiento</text>
  <rect class="box2" x="850" y="420" width="210" height="110" rx="18"/>
  <text class="t" x="875" y="462">hueso + CT</text><text class="s" x="875" y="493">cargas comparadas</text>
  <rect class="box2" x="1110" y="420" width="210" height="110" rx="18"/>
  <text class="t" x="1135" y="462">modelo mecánico</text><text class="s" x="1135" y="493">potencia + control</text>
  <rect class="box" x="1370" y="420" width="160" height="110" rx="18"/>
  <text class="t" x="1394" y="462">capacidad</text><text class="s" x="1394" y="493">no conducta</text>
  <path class="a" d="M280 475H330"/><path class="a" d="M540 475H590"/><path class="a" d="M800 475H850"/><path class="a" d="M1060 475H1110"/><path class="a" d="M1320 475H1370"/>
  <text class="s" x="70" y="570">Pluma, ala, vuelo activo y ciclo moderno son resultados distintos.</text>

  <rect x="70" y="640" width="1460" height="175" rx="24" fill="#121f26" stroke="#89715a" stroke-width="2"/>
  <text class="sh" x="105" y="685">CONTROL DE IDENTIDAD</text>
  <text class="t" x="105" y="728">cola larga / abreviada / fusionada → caracteres → matriz → nodo avialano</text>
  <text class="t" x="105" y="766">ningún estado aislado → Aves corona, ancestro directo o vuelo moderno</text>
  <text class="s" x="1170" y="790">Investigación 029 · 2026-08-11</text>
  <text class="s" x="70" y="860">Diagrama original del proyecto · cadenas condicionadas, no mediciones sustitutivas</text>
</svg>
