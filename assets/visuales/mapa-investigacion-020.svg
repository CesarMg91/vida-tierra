<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa epistemológico de Snowball Earth</title>
  <desc id="desc">Seis rutas separan sedimentos, edades, paleolatitud, clima, carbonatos y refugios antes de inferir dos glaciaciones de alcance casi global.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#020911" flood-opacity="0.7"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8c4d8"/></marker>
    <style>
      .bg{fill:#071a27}.title{font:700 42px Georgia,serif;fill:#f3f6f8}.sub{font:18px Arial,sans-serif;fill:#afc0cb}.head{font:700 23px Georgia,serif;fill:#f1f4f6}.box{stroke-width:2}.label{font:700 18px Arial,sans-serif;fill:#f5f7f8}.small{font:14px Consolas,monospace;fill:#c5d0d7}.conf{font:700 18px Georgia,serif}.foot{font:700 18px Arial,sans-serif;fill:#eef4f7}.note{font:14px Consolas,monospace;fill:#aebfca}.line{stroke:#a8c4d8;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="64" y="66">Snowball Earth: roca, reloj, brújula y modelo</text>
  <text class="sub" x="64" y="101">El hielo local se observa; la escala global y la cobertura oceánica requieren puentes adicionales.</text>

  <text class="head" x="64" y="155">1 · Sedimento: ¿hubo hielo aquí?</text>
  <g filter="url(#shadow)"><rect class="box" x="64" y="170" rx="18" width="280" height="112" fill="#164c59" stroke="#4cc5d4"/><rect class="box" x="404" y="170" rx="18" width="280" height="112" fill="#1c5267" stroke="#72bddd"/><rect class="box" x="744" y="170" rx="18" width="310" height="112" fill="#214e63" stroke="#72bddd"/></g>
  <text class="label" x="88" y="208">Diamictita + dropstones</text><text class="small" x="88" y="241">estrías, facies, deformación</text>
  <text class="label" x="428" y="208">Proceso glacial</text><text class="small" x="428" y="241">alternativas descartadas</text>
  <text class="label" x="768" y="208">Hielo local / regional</text><text class="conf" x="768" y="247" fill="#76d6e2">B</text>
  <path class="line" d="M344 226 H397"/><path class="line" d="M684 226 H737"/>

  <text class="head" x="64" y="343">2 · Reloj: ¿qué intervalo comparten?</text>
  <g filter="url(#shadow)"><rect class="box" x="64" y="358" rx="18" width="280" height="112" fill="#3c3c68" stroke="#9a93e8"/><rect class="box" x="404" y="358" rx="18" width="280" height="112" fill="#4a3e68" stroke="#b58ee0"/><rect class="box" x="744" y="358" rx="18" width="310" height="112" fill="#534067" stroke="#ce8fda"/></g>
  <text class="label" x="88" y="396">Zircon U–Pb + Re–Os</text><text class="small" x="88" y="429">antes / dentro / después</text>
  <text class="label" x="428" y="396">Correlación e hiatos</text><text class="small" x="428" y="429">dos episodios separados</text>
  <text class="label" x="768" y="396">717–659 / 639–635 Ma</text><text class="conf" x="768" y="435" fill="#d7a5e8">B-COND</text>
  <path class="line" d="M344 414 H397"/><path class="line" d="M684 414 H737"/>

  <text class="head" x="64" y="531">3 · Brújula: ¿estaba cerca del ecuador?</text>
  <g filter="url(#shadow)"><rect class="box" x="64" y="546" rx="18" width="280" height="112" fill="#205b4a" stroke="#55cf9d"/><rect class="box" x="404" y="546" rx="18" width="280" height="112" fill="#285c4f" stroke="#76d7ad"/><rect class="box" x="744" y="546" rx="18" width="310" height="112" fill="#29634f" stroke="#68d9ab"/></g>
  <text class="label" x="88" y="584">Remanencia magnética</text><text class="small" x="88" y="617">componentes + portador</text>
  <text class="label" x="428" y="584">Primariedad + campo</text><text class="small" x="428" y="617">pliegue, reversión, dipolo</text>
  <text class="label" x="768" y="584">Hielo a baja latitud</text><text class="conf" x="768" y="623" fill="#8be5bd">B por conjunto</text>
  <path class="line" d="M344 602 H397"/><path class="line" d="M684 602 H737"/>

  <text class="head" x="64" y="719">4 · Planeta: ¿qué geometría climática?</text>
  <g filter="url(#shadow)"><rect class="box" x="64" y="734" rx="18" width="280" height="112" fill="#6b4325" stroke="#f2a35d"/><rect class="box" x="404" y="734" rx="18" width="280" height="112" fill="#76502d" stroke="#f2b36f"/><rect class="box" x="744" y="734" rx="18" width="310" height="112" fill="#72482d" stroke="#ed985c"/></g>
  <text class="label" x="88" y="772">Hielo tropical + albedo</text><text class="small" x="88" y="805">Sol, nubes, polvo, CO₂</text>
  <text class="label" x="428" y="772">Modelos rivales</text><text class="small" x="428" y="805">hard / thin / waterbelt</text>
  <text class="label" x="768" y="772">Casi global ≠ sellado</text><text class="conf" x="768" y="811" fill="#ffc184">B-COND · D océano</text>
  <path class="line" d="M344 790 H397"/><path class="line" d="M684 790 H737"/>

  <text class="head" x="1120" y="155">5 · Salida y carbonatos</text>
  <g filter="url(#shadow)"><rect class="box" x="1120" y="170" rx="18" width="416" height="145" fill="#493f57" stroke="#c59bd9"/><rect class="box" x="1120" y="340" rx="18" width="416" height="145" fill="#574334" stroke="#e6ad76"/><rect class="box" x="1120" y="510" rx="18" width="416" height="145" fill="#264f58" stroke="#60c7d4"/><rect class="box" x="1120" y="680" rx="18" width="416" height="166" fill="#4a3841" stroke="#e68098"/></g>
  <text class="label" x="1148" y="208">Fuente – sumidero de CO₂</text><text class="small" x="1148" y="241">volcanismo, meteorización, fondo marino</text><text class="conf" x="1148" y="278" fill="#d9b3e8">participación B-COND</text>
  <text class="label" x="1148" y="378">Umbral de deshielo</text><text class="small" x="1148" y="411">nubes, albedo, polvo y presión</text><text class="conf" x="1148" y="448" fill="#f2c28e">valor exacto D</text>
  <text class="label" x="1148" y="548">Carbonato de capa</text><text class="small" x="1148" y="581">mezcla + alcalinidad + tiempo</text><text class="conf" x="1148" y="618" fill="#8bd8e1">cambio B · mecanismo D</text>
  <text class="label" x="1148" y="718">6 · Refugios y evolución</text><text class="small" x="1148" y="754">Fe, N, Ce, fósiles y facies</text><text class="conf" x="1148" y="792" fill="#ef9db0">hábitats B-COND</text><text class="small" x="1148" y="824">causa de radiación: E</text>

  <rect x="64" y="890" rx="20" width="1472" height="72" fill="#102b3b" stroke="#547f98" stroke-width="2"/>
  <text class="foot" x="800" y="922" text-anchor="middle">Núcleo robusto: dos episodios prolongados con hielo continental en paleotrópicos</text>
  <text class="note" x="800" y="947" text-anchor="middle">Abierto: océano, continuidad Sturtiana, umbrales, refugios y causalidad biológica.</text>
</svg>
