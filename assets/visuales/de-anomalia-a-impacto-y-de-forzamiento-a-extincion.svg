<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadenas de inferencia desde la anomalía hasta Chicxulub y desde el forzamiento hasta la extinción</title>
  <desc id="desc">Dos cadenas paralelas muestran once pasos observacionales y modelados. La superior conecta arcilla, iridio, minerales de choque, cráter y núcleo. La inferior conecta partículas, opacidad, clima, productividad, energía y selectividad fósil.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1620"/><stop offset="1" stop-color="#25383b"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d6e2df"/></marker>
    <style>.t{font:700 36px system-ui,sans-serif;fill:#f5ead7}.st{font:18px system-ui,sans-serif;fill:#c7d7d3}.lh{font:700 24px system-ui,sans-serif;fill:#101820}.b{font:600 16px system-ui,sans-serif;fill:#f5f7f0;text-anchor:middle}.n{font:14px system-ui,sans-serif;fill:#b9cac6;text-anchor:middle}.arr{stroke:#d6e2df;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="75" y="70" class="t">Dos cadenas que no deben colapsarse</text>
  <text x="75" y="108" class="st">La primera identifica el evento; la segunda prueba cómo una perturbación puede producir pérdidas selectivas.</text>

  <rect x="75" y="160" width="310" height="55" rx="14" fill="#f4a261"/><text x="95" y="196" class="lh">A · DE ANOMALÍA A IMPACTO</text>
  <g>
    <rect x="75" y="270" width="180" height="105" rx="18" fill="#2c4d5a"/><text x="165" y="312" class="b">arcilla K–Pg</text><text x="165" y="342" class="n">posición + edad</text>
    <rect x="330" y="270" width="180" height="105" rx="18" fill="#355d68"/><text x="420" y="312" class="b">iridio</text><text x="420" y="342" class="n">fondo + repetición</text>
    <rect x="585" y="270" width="180" height="105" rx="18" fill="#466f73"/><text x="675" y="304" class="b">choque +</text><text x="675" y="328" class="b">esférulas</text><text x="675" y="354" class="n">alta presión</text>
    <rect x="840" y="270" width="180" height="105" rx="18" fill="#7a6a58"/><text x="930" y="304" class="b">anomalía</text><text x="930" y="328" class="b">geofísica</text><text x="930" y="354" class="n">estructura circular</text>
    <rect x="1095" y="270" width="180" height="105" rx="18" fill="#9b694f"/><text x="1185" y="304" class="b">brecha +</text><text x="1185" y="328" class="b">fundido</text><text x="1185" y="354" class="n">núcleo del cráter</text>
    <rect x="1350" y="270" width="180" height="105" rx="18" fill="#c66b49"/><text x="1440" y="304" class="b">Chicxulub</text><text x="1440" y="328" class="b">↔ capa</text><text x="1440" y="354" class="n">Ir interno</text>
    <path class="arr" d="M255 322H322"/><path class="arr" d="M510 322H577"/><path class="arr" d="M765 322H832"/><path class="arr" d="M1020 322H1087"/><path class="arr" d="M1275 322H1342"/>
  </g>

  <rect x="75" y="465" width="435" height="55" rx="14" fill="#8ab17d"/><text x="95" y="501" class="lh">B · DE FORZAMIENTO A EXTINCIÓN</text>
  <g>
    <rect x="75" y="575" width="180" height="105" rx="18" fill="#524b55"/><text x="165" y="617" class="b">partículas</text><text x="165" y="647" class="n">masa + tamaño + altura</text>
    <rect x="330" y="575" width="180" height="105" rx="18" fill="#4b5860"/><text x="420" y="617" class="b">opacidad</text><text x="420" y="647" class="n">vida atmosférica</text>
    <rect x="585" y="575" width="180" height="105" rx="18" fill="#405d66"/><text x="675" y="609" class="b">luz +</text><text x="675" y="633" class="b">temperatura</text><text x="675" y="659" class="n">modelo climático</text>
    <rect x="840" y="575" width="180" height="105" rx="18" fill="#386b67"/><text x="930" y="609" class="b">productividad</text><text x="930" y="633" class="b">y pH</text><text x="930" y="659" class="n">océano / tierra</text>
    <rect x="1095" y="575" width="180" height="105" rx="18" fill="#49765e"/><text x="1185" y="609" class="b">energía +</text><text x="1185" y="633" class="b">rasgos</text><text x="1185" y="659" class="n">umbrales ecológicos</text>
    <rect x="1350" y="575" width="180" height="105" rx="18" fill="#748f58"/><text x="1440" y="609" class="b">selectividad</text><text x="1440" y="633" class="b">fósil</text><text x="1440" y="659" class="n">prueba del mecanismo</text>
    <path class="arr" d="M255 627H322"/><path class="arr" d="M510 627H577"/><path class="arr" d="M765 627H832"/><path class="arr" d="M1020 627H1087"/><path class="arr" d="M1275 627H1342"/>
  </g>

  <rect x="75" y="750" width="1455" height="80" rx="18" fill="#142a31" stroke="#68868a" stroke-width="2"/>
  <text x="802" y="784" class="b">Regla de auditoría</text>
  <text x="802" y="813" class="n">Identificar el impacto no determina automáticamente el peso de cada aerosol; simular un mecanismo no sustituye su patrón fósil.</text>
</svg>
