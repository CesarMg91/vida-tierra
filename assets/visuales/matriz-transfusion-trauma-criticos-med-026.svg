<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de transfusión, trauma y cuidados críticos</title>
  <desc id="desc">Doce expedientes comparados por periodo, archivo, producto mejor resuelto y límite. La tabla no forma una escalera de progreso ni reparte prioridad.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe9e7"/><stop offset="1" stop-color="#c4d4d1"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="58" y="40" width="1484" height="830" rx="28" fill="#f3f8f7" stroke="#24434a" stroke-width="2"/>
  <text x="92" y="94" fill="#2f6f66" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-026 · MATRIZ DE EVIDENCIA</text>
  <text x="92" y="145" fill="#1c2422" font-family="Georgia, serif" font-size="42" font-weight="700">Doce archivos, doce productos, ningún rescate fundacional</text>
  <text x="92" y="183" fill="#4c5250" font-family="Arial, sans-serif" font-size="20">Qué tipo de evidencia sostiene cada expediente y dónde debe detenerse la inferencia.</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="92" y="222" width="1416" height="56" rx="10" fill="#24434a"/>
    <g fill="#eef6f4" font-size="18" font-weight="700"><text x="112" y="257">EXPEDIENTE</text><text x="392" y="257">ARCHIVO</text><text x="760" y="257">PRODUCTO RESUELTO</text><text x="1122" y="257">LÍMITE</text></g>
    <g>
      <g transform="translate(0 282)"><rect x="92" width="1416" height="46" fill="#f7fbfa"/><text x="112" y="21" fill="#24434a" font-weight="700">Primeras transfusiones</text><text x="112" y="39" fill="#5a6461" font-size="13">1666–1668</text><text x="392" y="29" fill="#252722">Phil. Trans. · sentencia</text><text x="760" y="29" fill="#252722">procedimiento posible</text><text x="1122" y="29" fill="#8e3f2e">sin serie; regla, no eficacia</text></g>
      <g transform="translate(0 328)"><rect x="92" width="1416" height="46" fill="#e3ecea"/><text x="112" y="21" fill="#24434a" font-weight="700">Blundell</text><text x="112" y="39" fill="#5a6461" font-size="13">1818–1829</text><text x="392" y="29" fill="#252722">MCT · Lancet</text><text x="760" y="29" fill="#252722">reposición entre personas</text><text x="1122" y="29" fill="#8e3f2e">sin grupos ni contraste</text></g>
      <g transform="translate(0 374)"><rect x="92" width="1416" height="46" fill="#f7fbfa"/><text x="112" y="21" fill="#24434a" font-weight="700">ABO · citrato</text><text x="112" y="39" fill="#5a6461" font-size="13">1901–1918</text><text x="392" y="29" fill="#252722">Landsteiner · JEM · BMJ</text><text x="760" y="29" fill="#252722">compatibilidad y conservación</text><text x="1122" y="29" fill="#8e3f2e">condición, no tasa</text></g>
      <g transform="translate(0 420)"><rect x="92" width="1416" height="46" fill="#e3ecea"/><text x="112" y="21" fill="#24434a" font-weight="700">Bancos · Drew</text><text x="112" y="39" fill="#5a6461" font-size="13">1937–1950</text><text x="392" y="29" fill="#252722">HHS · Love · Kendrick</text><text x="760" y="29" fill="#252722">inventario y escala</text><text x="1122" y="29" fill="#8e3f2e">segregación sin base serológica</text></g>
      <g transform="translate(0 466)"><rect x="92" width="1416" height="46" fill="#f7fbfa"/><text x="112" y="21" fill="#24434a" font-weight="700">Sangre contaminada</text><text x="112" y="39" fill="#5a6461" font-size="13">1943–2024</text><text x="392" y="29" fill="#252722">NEJM · IOM · Inquiry</text><text x="760" y="29" fill="#252722">rastreo y decisiones</text><text x="1122" y="29" fill="#8e3f2e">estimaciones de infectados</text></g>
      <g transform="translate(0 512)"><rect x="92" width="1416" height="46" fill="#e3ecea"/><text x="112" y="21" fill="#24434a" font-weight="700">Larrey · Cannon</text><text x="112" y="39" fill="#5a6461" font-size="13">1792–1994</text><text x="392" y="29" fill="#252722">historia · JAMA · NEJM</text><text x="760" y="29" fill="#252722">regla de triaje</text><text x="1122" y="29" fill="#8e3f2e">sin contraste histórico</text></g>
      <g transform="translate(0 558)"><rect x="92" width="1416" height="46" fill="#f7fbfa"/><text x="112" y="21" fill="#24434a" font-weight="700">Guerra como laboratorio</text><text x="112" y="39" fill="#5a6461" font-size="13">2001–2015</text><text x="392" y="29" fill="#252722">registro · PROPPR</text><text x="760" y="29" fill="#252722">hipótesis delimitada</text><text x="1122" y="29" fill="#8e3f2e">sesgo de supervivencia</text></g>
      <g transform="translate(0 604)"><rect x="92" width="1416" height="46" fill="#e3ecea"/><text x="112" y="21" fill="#24434a" font-weight="700">Sistemas · hora de oro</text><text x="112" y="39" fill="#5a6461" font-size="13">1966–2010</text><text x="392" y="29" fill="#252722">NAS · NEJM · AEM</text><text x="760" y="29" fill="#252722">efecto de sistemas</text><text x="1122" y="29" fill="#8e3f2e">reloj sin respaldo</text></g>
      <g transform="translate(0 650)"><rect x="92" width="1416" height="46" fill="#f7fbfa"/><text x="112" y="21" fill="#24434a" font-weight="700">Copenhague · UCI</text><text x="112" y="39" fill="#5a6461" font-size="13">1929–1953</text><text x="392" y="29" fill="#252722">Lancet · revisiones</text><text x="760" y="29" fill="#252722">ventilación manual</text><text x="1122" y="29" fill="#8e3f2e">antes-después irreconciliable</text></g>
      <g transform="translate(0 696)"><rect x="92" width="1416" height="46" fill="#e3ecea"/><text x="112" y="21" fill="#24434a" font-weight="700">Monitorización</text><text x="112" y="39" fill="#5a6461" font-size="13">1970–2020</text><text x="392" y="29" fill="#252722">NEJM · JAMA · Lancet</text><text x="760" y="29" fill="#252722">medición a la cabecera</text><text x="1122" y="29" fill="#8e3f2e">medir no es mejorar</text></g>
      <g transform="translate(0 742)"><rect x="92" width="1416" height="46" fill="#f7fbfa"/><text x="112" y="21" fill="#24434a" font-weight="700">Ensayos que desmintieron</text><text x="112" y="39" fill="#5a6461" font-size="13">1999–2023</text><text x="392" y="29" fill="#252722">NEJM · CCM</text><text x="760" y="29" fill="#252722">contrastes grandes</text><text x="1122" y="29" fill="#8e3f2e">comparador y época</text></g>
      <g transform="translate(0 788)"><rect x="92" width="1416" height="46" fill="#e3ecea"/><text x="112" y="21" fill="#24434a" font-weight="700">Daños nuevos</text><text x="112" y="39" fill="#5a6461" font-size="13">1998–2013</text><text x="392" y="29" fill="#252722">revisiones · cohortes</text><text x="760" y="29" fill="#252722">daños nombrados</text><text x="1122" y="29" fill="#8e3f2e">asociación, no atribución</text></g>
    </g>
  </g>
  <text x="1505" y="858" fill="#5a6461" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
