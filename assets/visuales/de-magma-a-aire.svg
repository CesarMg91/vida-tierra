<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de inferencia desde zircon y magma hasta atmósfera temprana</title>
  <desc id="desc">Cinco etapas distinguen medición mineral, fugacidad del fundido, gas desgasificado, atmósfera procesada y archivos arqueanos posteriores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131e"/><stop offset="1" stop-color="#18141e"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6dc9dc"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .k{font:600 23px Inter,Segoe UI,sans-serif;letter-spacing:4px;fill:#71cfe2}.t{font:700 45px Inter,Segoe UI,sans-serif;fill:#f3efe7}.s{font:400 21px Inter,Segoe UI,sans-serif;fill:#a6b6c0}.n{font:700 20px Inter,Segoe UI,sans-serif;fill:#07131e}.ct{font:700 23px Inter,Segoe UI,sans-serif;fill:#f3efe7}.b{font:400 18px Inter,Segoe UI,sans-serif;fill:#bcc9d0}.loss{font:600 17px Inter,Segoe UI,sans-serif;fill:#e2a46f}.foot{font:400 18px Inter,Segoe UI,sans-serif;fill:#96a8b3}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text class="k" x="75" y="68">DEL MINERAL AL AIRE</text><text class="t" x="75" y="128">Una cadena de cinco variables, no una medición única</text><text class="s" x="75" y="172">La confianza se conserva sólo si cada flecha declara entradas, procesamiento y época.</text>
  <line x1="180" y1="404" x2="1410" y2="404" stroke="#315263" stroke-width="5"/>
  <g filter="url(#sh)">
    <g transform="translate(70 250)"><rect width="265" height="310" rx="24" fill="#173141" stroke="#447286" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#6dc9dc"/><text class="n" x="44" y="52" text-anchor="middle">1</text><text class="ct" x="25" y="102">Zircon medido</text><text class="b" x="25" y="140">U–Pb + textura</text><text class="b" x="25" y="169">Ce o estado de U</text><text class="loss" x="25" y="238">Objeto: mineral</text><text class="loss" x="25" y="267">No contiene el aire</text></g>
    <g transform="translate(370 250)"><rect width="265" height="310" rx="24" fill="#252c32" stroke="#70665e" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#d79a4e"/><text class="n" x="44" y="52" text-anchor="middle">2</text><text class="ct" x="25" y="102">fO₂ del fundido</text><text class="b" x="25" y="140">T + calibración</text><text class="b" x="25" y="169">Valencia y equilibrio</text><text class="loss" x="25" y="238">Potencial químico</text><text class="loss" x="25" y="267">No porcentaje de O₂</text></g>
    <g transform="translate(670 250)"><rect width="265" height="310" rx="24" fill="#30272a" stroke="#825e55" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#bf7447"/><text class="n" x="44" y="52" text-anchor="middle">3</text><text class="ct" x="25" y="102">Gas desgasificado</text><text class="b" x="25" y="140">CHONS + P–T</text><text class="b" x="25" y="169">Solubilidad y redox</text><text class="loss" x="25" y="238">Equilibrio/modelo</text><text class="loss" x="25" y="267">No aire retenido</text></g>
    <g transform="translate(970 250)"><rect width="265" height="310" rx="24" fill="#282431" stroke="#705d83" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#9a7cd0"/><text class="n" x="44" y="52" text-anchor="middle">4</text><text class="ct" x="25" y="102">Aire procesado</text><text class="b" x="25" y="140">Condensa y reacciona</text><text class="b" x="25" y="169">Impactos + escape</text><text class="loss" x="25" y="238">Masa y composición</text><text class="loss" x="25" y="267">cambian con tiempo</text></g>
    <g transform="translate(1270 250)"><rect width="265" height="310" rx="24" fill="#263029" stroke="#727957" stroke-width="2"/><circle cx="44" cy="44" r="25" fill="#d1b457"/><text class="n" x="44" y="52" text-anchor="middle">5</text><text class="ct" x="25" y="102">Límites posteriores</text><text class="b" x="25" y="140">S-MIF · Xe · N/Ar</text><text class="b" x="25" y="169">Vesículas arqueanas</text><text class="loss" x="25" y="238">Más cerca del aire</text><text class="loss" x="25" y="267">pero más jóvenes</text></g>
  </g>
  <g stroke="#6dc9dc" stroke-width="4" marker-end="url(#a)"><path d="M335 404 H362"/><path d="M635 404 H662"/><path d="M935 404 H962"/><path d="M1235 404 H1262"/></g>
  <g transform="translate(75 650)"><rect width="1450" height="150" rx="27" fill="#10222d" stroke="#355668" stroke-width="2"/><text class="ct" x="32" y="45">Reglas que sobreviven a la auditoría</text><circle cx="45" cy="91" r="7" fill="#d79a4e"/><text class="foot" x="63" y="96">B-COND: algunos fundidos hadeanos tenían redox moderado.</text><circle cx="550" cy="91" r="7" fill="#d1b457"/><text class="foot" x="568" y="96">B-COND: el borde ~3.77 Ga era anóxico.</text><circle cx="1040" cy="91" r="7" fill="#9a7cd0"/><text class="foot" x="1058" y="96">D–E: mezcla y presión hadeanas exactas.</text><text class="foot" x="32" y="129">Ninguna flecha autoriza convertir FMQ en O₂ libre ni presión arqueana en presión hadeana.</text></g>
  <text class="foot" text-anchor="middle" x="800" y="855">MINERAL → FUNDIDO → GAS POSIBLE → ATMÓSFERA PROCESADA → ARCHIVO POSTERIOR</text>
</svg>
