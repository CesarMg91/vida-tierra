<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de enfermería, salud pública y profesiones</title>
  <desc id="desc">Once expedientes comparados por periodo, archivo, producto mejor resuelto y límite. La tabla no forma una escalera de profesionalización ni reparte el título de fundadora.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1e6ee"/><stop offset="1" stop-color="#c7d0dc"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="58" y="40" width="1484" height="830" rx="28" fill="#f4f6f9" stroke="#2f3f5c" stroke-width="2"/>
  <text x="92" y="94" fill="#3c6f8a" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-023 · MATRIZ DE EVIDENCIA</text>
  <text x="92" y="145" fill="#1c2228" font-family="Georgia, serif" font-size="42" font-weight="700">Once archivos, once productos, ninguna fundadora única</text>
  <text x="92" y="183" fill="#4c5258" font-family="Arial, sans-serif" font-size="20">Qué tipo de evidencia sostiene cada expediente y dónde debe detenerse la inferencia.</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="92" y="216" width="1416" height="56" rx="10" fill="#2f3f5c"/>
    <g fill="#eef2f7" font-size="18" font-weight="700"><text x="112" y="251">EXPEDIENTE</text><text x="430" y="251">ARCHIVO</text><text x="790" y="251">PRODUCTO RESUELTO</text><text x="1140" y="251">LÍMITE</text></g>
    <g>
      <g transform="translate(0 280)"><rect x="92" width="1416" height="49" fill="#f7f9fb"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Antes de la profesión</text><text x="112" y="41" fill="#5a6470" font-size="14">XIII–XIX</text><text x="430" y="31" fill="#252722">manuscrito · prefacio</text><text x="790" y="31" fill="#252722">actoras y repertorio</text><text x="1140" y="31" fill="#8a4a2e">pericia sin documentar</text></g>
      <g transform="translate(0 329)"><rect x="92" width="1416" height="49" fill="#e4e9ef"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Cuidadoras no registradas</text><text x="112" y="41" fill="#5a6470" font-size="14">XVIII–XIX</text><text x="430" y="31" fill="#252722">arqueología · cartas</text><text x="790" y="31" fill="#252722">trabajo diario</text><text x="1140" y="31" fill="#8a4a2e">archivo del esclavizador</text></g>
      <g transform="translate(0 378)"><rect x="92" width="1416" height="49" fill="#f7f9fb"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Kaiserswerth</text><text x="112" y="41" fill="#5a6470" font-size="14">1833–1851</text><text x="430" y="31" fill="#252722">folleto institucional</text><text x="790" y="31" fill="#252722">números y prueba</text><text x="1140" y="31" fill="#8a4a2e">sin desenlaces comparados</text></g>
      <g transform="translate(0 427)"><rect x="92" width="1416" height="49" fill="#e4e9ef"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Scutari · Notes</text><text x="112" y="41" fill="#5a6470" font-size="14">1854–1859</text><text x="430" y="31" fill="#252722">tasas · reseñas · texto</text><text x="790" y="31" fill="#252722">cronología de la caída</text><text x="1140" y="31" fill="#8a4a2e">cambios simultáneos</text></g>
      <g transform="translate(0 476)"><rect x="92" width="1416" height="49" fill="#f7f9fb"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Seacole</text><text x="112" y="41" fill="#5a6470" font-size="14">1854–2016</text><text x="430" y="31" fill="#252722">memoria · prensa</text><text x="790" y="31" fill="#252722">práctica, rechazo, memoria</text><text x="1140" y="31" fill="#8a4a2e">categorías en disputa</text></g>
      <g transform="translate(0 525)"><rect x="92" width="1416" height="49" fill="#e4e9ef"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Registro</text><text x="112" y="41" fill="#5a6470" font-size="14">1887–1919</text><text x="430" y="31" fill="#252722">leyes · asociaciones</text><text x="790" y="31" fill="#252722">títulos y listas</text><text x="1140" y="31" fill="#8a4a2e">práctica no contada</text></g>
      <g transform="translate(0 574)"><rect x="92" width="1416" height="49" fill="#f7f9fb"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Segregación</text><text x="112" y="41" fill="#5a6470" font-size="14">1879–1951</text><text x="430" y="31" fill="#252722">registros escolares</text><text x="790" y="31" fill="#252722">exclusión medida</text><text x="1140" y="31" fill="#8a4a2e">cuidado no medido</text></g>
      <g transform="translate(0 623)"><rect x="92" width="1416" height="49" fill="#e4e9ef"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Colonial</text><text x="112" y="41" fill="#5a6470" font-size="14">1896–1966</text><text x="430" y="31" fill="#252722">fondos · historia social</text><text x="790" y="31" fill="#252722">jerarquía racial</text><text x="1140" y="31" fill="#8a4a2e">misiones no auditadas</text></g>
      <g transform="translate(0 672)"><rect x="92" width="1416" height="49" fill="#f7f9fb"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Parteras</text><text x="112" y="41" fill="#5a6470" font-size="14">1902–XX</text><text x="430" y="31" fill="#252722">series · etnografía</text><text x="790" y="31" fill="#252722">credencial vs desenlace</text><text x="1140" y="31" fill="#8a4a2e">una región</text></g>
      <g transform="translate(0 721)"><rect x="92" width="1416" height="49" fill="#e4e9ef"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Salud pública · jerarquía</text><text x="112" y="41" fill="#5a6470" font-size="14">1815–1916</text><text x="430" y="31" fill="#252722">informes · leyes</text><text x="790" y="31" fill="#252722">oficio plural, techo</text><text x="1140" y="31" fill="#8a4a2e">sin medida de efecto</text></g>
      <g transform="translate(0 770)"><rect x="92" width="1416" height="49" fill="#f7f9fb"/><text x="112" y="21" fill="#2f3f5c" font-weight="700">Dotación</text><text x="112" y="41" fill="#5a6470" font-size="14">2002–2026</text><text x="430" y="31" fill="#252722">altas · turnos · leyes</text><text x="790" y="31" fill="#252722">asociación consistente</text><text x="1140" y="31" fill="#8a4a2e">sesgo; tamaño incierto</text></g>
    </g>
  </g>
  <text x="1505" y="858" fill="#5a6470" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
