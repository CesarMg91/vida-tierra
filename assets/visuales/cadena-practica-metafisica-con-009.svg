<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde una práctica hasta una afirmación metafísica, con un cortafuegos entre cada paso</title>
  <desc id="desc">Seis pasos: práctica, informe, correlato, efecto, componente específico y metafísica. Entre cada par hay un cortafuegos: una práctica no es una experiencia, un informe no es un registro, un correlato no es una causa, un efecto frente a un control débil no es un efecto específico y ningún dato es una tesis sobre la realidad.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14120f"/><stop offset="1" stop-color="#211d16"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="92" fill="#d8c9a3" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">CON-009 · CADENA DE INFERENCIA</text>
  <text x="92" y="152" fill="#f4f1e8" font-family="Georgia, serif" font-size="46" font-weight="700">Una práctica no es una revelación</text>
  <text x="92" y="198" fill="#cfc8b8" font-family="Arial, sans-serif" font-size="24">Cada paso añade supuestos; la confianza de un paso no viaja sola al siguiente.</text>
  <rect x="92" y="300" width="222" height="250" rx="18" fill="#ece8dc"/>
  <text x="114" y="350" fill="#7a5f2f" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">01</text>
  <text x="114" y="392" fill="#1f1a12" font-family="Georgia, serif" font-size="22" font-weight="700">Práctica</text>
  <text x="114" y="430" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">qué técnica,</text>
  <text x="114" y="456" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">cuánto tiempo y</text>
  <text x="114" y="482" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">en qué población</text>
  <rect x="332" y="300" width="222" height="250" rx="18" fill="#ece8dc"/>
  <text x="354" y="350" fill="#7a5f2f" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">02</text>
  <text x="354" y="392" fill="#1f1a12" font-family="Georgia, serif" font-size="22" font-weight="700">Informe</text>
  <text x="354" y="430" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">lo que la persona</text>
  <text x="354" y="456" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">dice o señala que</text>
  <text x="354" y="482" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">vivió</text>
  <rect x="572" y="300" width="222" height="250" rx="18" fill="#ece8dc"/>
  <text x="594" y="350" fill="#7a5f2f" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">03</text>
  <text x="594" y="392" fill="#1f1a12" font-family="Georgia, serif" font-size="22" font-weight="700">Correlato</text>
  <text x="594" y="430" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">qué cambia en el</text>
  <text x="594" y="456" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">cerebro de quien</text>
  <text x="594" y="482" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">practica</text>
  <rect x="812" y="300" width="222" height="250" rx="18" fill="#f1e2c8"/>
  <text x="834" y="350" fill="#7a5f2f" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">04</text>
  <text x="834" y="392" fill="#1f1a12" font-family="Georgia, serif" font-size="22" font-weight="700">Efecto</text>
  <text x="834" y="430" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">qué cambia</text>
  <text x="834" y="456" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">después,</text>
  <text x="834" y="482" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">comparado con un</text>
  <text x="834" y="508" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">control</text>
  <rect x="1052" y="300" width="222" height="250" rx="18" fill="#f1e2c8"/>
  <text x="1074" y="350" fill="#7a5f2f" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">05</text>
  <text x="1074" y="392" fill="#1f1a12" font-family="Georgia, serif" font-size="22" font-weight="700">Componente</text>
  <text x="1074" y="430" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">lo que sólo la</text>
  <text x="1074" y="456" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">práctica</text>
  <text x="1074" y="482" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">aportaría frente</text>
  <text x="1074" y="508" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">a un control</text>
  <text x="1074" y="534" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">activo</text>
  <rect x="1292" y="300" width="222" height="250" rx="18" fill="#f3d6c8"/>
  <text x="1314" y="350" fill="#7a5f2f" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">06</text>
  <text x="1314" y="392" fill="#1f1a12" font-family="Georgia, serif" font-size="22" font-weight="700">Metafísica</text>
  <text x="1314" y="430" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">qué revelaría</text>
  <text x="1314" y="456" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">sobre la</text>
  <text x="1314" y="482" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">naturaleza de la</text>
  <text x="1314" y="508" fill="#3d372c" font-family="Arial, sans-serif" font-size="19" font-weight="400">conciencia</text>
  <line x1="323" y1="580" x2="323" y2="640" stroke="#d9785b" stroke-width="3"/>
  <text x="323" y="676" text-anchor="middle" fill="#f0b39c" font-family="Arial, sans-serif" font-size="19">≠ experiencia</text>
  <line x1="563" y1="580" x2="563" y2="640" stroke="#d9785b" stroke-width="3"/>
  <text x="563" y="676" text-anchor="middle" fill="#f0b39c" font-family="Arial, sans-serif" font-size="19">≠ registro</text>
  <line x1="803" y1="580" x2="803" y2="640" stroke="#d9785b" stroke-width="3"/>
  <text x="803" y="676" text-anchor="middle" fill="#f0b39c" font-family="Arial, sans-serif" font-size="19">≠ causa</text>
  <line x1="1043" y1="580" x2="1043" y2="640" stroke="#d9785b" stroke-width="3"/>
  <text x="1043" y="676" text-anchor="middle" fill="#f0b39c" font-family="Arial, sans-serif" font-size="19">≠ específico</text>
  <line x1="1283" y1="580" x2="1283" y2="640" stroke="#d9785b" stroke-width="3"/>
  <text x="1283" y="676" text-anchor="middle" fill="#f0b39c" font-family="Arial, sans-serif" font-size="19">≠ realidad</text>
  <text x="92" y="790" fill="#aaa290" font-family="Arial, sans-serif" font-size="20">Claro: lo que se describe, se informa o se mide. Ocre: lo que exige controles. Rojo claro: sin datos a favor.</text>
  <text x="92" y="822" fill="#aaa290" font-family="Arial, sans-serif" font-size="20">Síntesis del expediente; no es una guía de meditación ni una recomendación clínica.</text>
</svg>
