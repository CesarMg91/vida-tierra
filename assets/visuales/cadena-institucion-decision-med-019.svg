<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena desde institución hasta decisión clínica</title>
  <desc id="desc">Siete capas conectadas pero no automáticas: institución, admisión, encuentro, examen, registro, comparación y decisión. Cada transición conserva un cortafuego inferencial.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151714"/><stop offset="1" stop-color="#242019"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2e5c6"/><stop offset="1" stop-color="#dfcc9f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#c78344"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="240" fill="#2d493d" opacity=".28"/>
  <circle cx="115" cy="850" r="250" fill="#8e562e" opacity=".18"/>
  <text x="92" y="92" fill="#d7a45f" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">MED-019 · CADENA DE INFERENCIA</text>
  <text x="92" y="152" fill="#fff8e8" font-family="Georgia, serif" font-size="47" font-weight="700">Una cama hospitalaria no convierte a una persona en un caso</text>
  <text x="92" y="198" fill="#cfc7b5" font-family="Arial, sans-serif" font-size="24">Observar exige acceso, encuentro y técnica; comparar exige registro, denominador y límites.</text>
  <path d="M205 390H1395" stroke="#c78344" stroke-width="4" stroke-dasharray="8 10" opacity=".75"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">01</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Institución</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">gobierno · camas</tspan><tspan x="24" dy="25">personal · fondos</tspan><tspan x="24" dy="25">finalidad</tspan></text></g>
    <g transform="translate(282 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">02</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Admisión</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">ingreso · urgencia</tspan><tspan x="24" dy="25">caridad · pago</tspan><tspan x="24" dy="25">exclusión</tspan></text></g>
    <g transform="translate(494 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">03</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Encuentro</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">relato · espera</tspan><tspan x="24" dy="25">cuidado · poder</tspan><tspan x="24" dy="25">negociación</tspan></text></g>
    <g transform="translate(706 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">04</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Examen</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">mirar · tocar</tspan><tspan x="24" dy="25">percutir · oír</tspan><tspan x="24" dy="25">interpretar</tspan></text></g>
    <g transform="translate(918 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">05</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Registro</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">selección · forma</tspan><tspan x="24" dy="25">autor · propósito</tspan><tspan x="24" dy="25">omisión</tspan></text></g>
    <g transform="translate(1130 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">06</text><text x="24" y="92" fill="#1f211e" font-size="21" font-weight="700">Comparación</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">serie · criterio</tspan><tspan x="24" dy="25">denominador</tspan><tspan x="24" dy="25">discordancia</tspan></text></g>
    <g transform="translate(1342 275)"><rect width="190" height="235" rx="22" fill="url(#card)"/><circle cx="38" cy="40" r="22" fill="#2d493d"/><text x="38" y="48" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">07</text><text x="24" y="92" fill="#1f211e" font-size="22" font-weight="700">Decisión</text><text x="24" y="166" fill="#514c42" font-size="18"><tspan x="24">diagnóstico</tspan><tspan x="24" dy="25">acción · alta</tspan><tspan x="24" dy="25">revisión</tspan></text></g>
  </g>
  <g stroke="#c78344" stroke-width="4" marker-end="url(#arrow)"><path d="M260 390H278"/><path d="M472 390H490"/><path d="M684 390H702"/><path d="M896 390H914"/><path d="M1108 390H1126"/><path d="M1320 390H1338"/></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#e6d8b8" text-anchor="middle">
    <text x="271" y="550"><tspan x="271">cama ≠</tspan><tspan x="271" dy="21">acceso</tspan></text>
    <text x="483" y="550"><tspan x="483">ingreso ≠</tspan><tspan x="483" dy="21">población</tspan></text>
    <text x="695" y="550"><tspan x="695">presencia ≠</tspan><tspan x="695" dy="21">consentimiento</tspan></text>
    <text x="907" y="550"><tspan x="907">signo ≠</tspan><tspan x="907" dy="21">lesión</tspan></text>
    <text x="1119" y="550"><tspan x="1119">ficha ≠</tspan><tspan x="1119" dy="21">persona</tspan></text>
    <text x="1331" y="550"><tspan x="1331">serie ≠</tspan><tspan x="1331" dy="21">causalidad</tspan></text>
  </g>
  <rect x="92" y="645" width="1416" height="150" rx="24" fill="#111310" stroke="#517462" stroke-width="2"/>
  <text x="125" y="696" fill="#8eb09d" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CASO CLÍNICO LEGÍTIMO</text>
  <text x="125" y="744" fill="#fff8e8" font-family="Georgia, serif" font-size="29">La fuerza aumenta cuando selección, técnica, voz, propósito y discordancias permanecen visibles</text>
  <text x="125" y="778" fill="#cfc7b5" font-family="Arial, sans-serif" font-size="19">y disminuye cuando prestigio, volumen o formulario sustituyen población, referencia y resultado.</text>
  <text x="1505" y="850" fill="#8d8779" text-anchor="end" font-family="Arial, sans-serif" font-size="16">Diagrama editorial · sin escala clínica ni institucional</text>
</svg>
