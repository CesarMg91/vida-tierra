<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cronología multiarquivo de Asia y Sahul</title>
  <desc id="desc">Diagrama temporal de noventa a veinte mil años con carriles separados para presencias y mínimos, secuencias arqueológicas, cruces y modelos, y divergencias genómicas.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#182b31"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".28"/></filter>
    <style>
      .h1{font:700 38px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4ead8}
      .sub{font:400 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#b9c9ca}
      .lane{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#efc27e}
      .tick{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#aebfc0}
      .event{font:650 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#13242b}
      .event2{font:500 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24383d}
      .note{font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f0c490}
      .foot{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#bdc9c9}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="82" y="76" class="h1">Cuatro relojes que no deben alinearse como uno</text>
  <text x="82" y="108" class="sub">Ventana visual 90–20 ka · posiciones aproximadas; los intervalos y objetos se conservan en cada etiqueta</text>

  <line x1="290" y1="158" x2="1510" y2="158" stroke="#63777b" stroke-width="2"/>
  <g class="tick" text-anchor="middle">
    <line x1="290" y1="148" x2="290" y2="795" stroke="#40545a"/><text x="290" y="140">90 ka</text>
    <line x1="464" y1="148" x2="464" y2="795" stroke="#40545a"/><text x="464" y="140">80</text>
    <line x1="639" y1="148" x2="639" y2="795" stroke="#40545a"/><text x="639" y="140">70</text>
    <line x1="813" y1="148" x2="813" y2="795" stroke="#40545a"/><text x="813" y="140">60</text>
    <line x1="987" y1="148" x2="987" y2="795" stroke="#40545a"/><text x="987" y="140">50</text>
    <line x1="1161" y1="148" x2="1161" y2="795" stroke="#40545a"/><text x="1161" y="140">40</text>
    <line x1="1336" y1="148" x2="1336" y2="795" stroke="#40545a"/><text x="1336" y="140">30</text>
    <line x1="1510" y1="148" x2="1510" y2="795" stroke="#40545a"/><text x="1510" y="140">20</text>
  </g>

  <g>
    <rect x="70" y="184" width="1440" height="130" rx="20" fill="#20343b" stroke="#486168"/>
    <rect x="70" y="331" width="1440" height="146" rx="20" fill="#1d3037" stroke="#486168"/>
    <rect x="70" y="494" width="1440" height="130" rx="20" fill="#20343b" stroke="#486168"/>
    <rect x="70" y="641" width="1440" height="154" rx="20" fill="#1d3037" stroke="#486168"/>
  </g>
  <text x="94" y="216" class="lane">1 · CUERPOS Y MÍNIMOS</text>
  <text x="94" y="365" class="lane">2 · SITIOS Y OCUPACIÓN</text>
  <text x="94" y="526" class="lane">3 · MAR Y MODELOS</text>
  <text x="94" y="675" class="lane">4 · GENOMAS / DIVERGENCIAS</text>

  <g filter="url(#shadow2)">
    <rect x="334" y="228" width="258" height="66" rx="14" fill="#d9b476"/>
    <text x="463" y="252" text-anchor="middle" class="event">Tam Pà Ling</text>
    <text x="463" y="276" text-anchor="middle" class="event2">92–65; presencia ≥68</text>
    <rect x="561" y="197" width="248" height="66" rx="14" fill="#d9b476"/>
    <text x="685" y="221" text-anchor="middle" class="event">Lida Ajer</text>
    <text x="685" y="245" text-anchor="middle" class="event2">73–63 · asociación C-COND</text>
    <rect x="600" y="267" width="264" height="66" rx="14" fill="#e5c997"/>
    <text x="732" y="291" text-anchor="middle" class="event">Muna · plantilla</text>
    <text x="732" y="315" text-anchor="middle" class="event2">mínimo U-series 67.8</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="648" y="378" width="252" height="70" rx="14" fill="#a9c9c6"/>
    <text x="774" y="402" text-anchor="middle" class="event">Madjedbebe</text>
    <text x="774" y="426" text-anchor="middle" class="event2">~65 · extremo C-COND</text>
    <rect x="925" y="342" width="254" height="70" rx="14" fill="#c7d8cf"/>
    <text x="1052" y="366" text-anchor="middle" class="event">Ivane Valley</text>
    <text x="1052" y="390" text-anchor="middle" class="event2">49–44 · tierras altas</text>
    <rect x="1020" y="416" width="260" height="70" rx="14" fill="#c7d8cf"/>
    <text x="1150" y="440" text-anchor="middle" class="event">Niah</text>
    <text x="1150" y="464" text-anchor="middle" class="event2">~46–34 · actividad</text>
    <rect x="1072" y="342" width="0" height="0" fill="none"/>
  </g>

  <rect x="750" y="538" width="88" height="48" rx="12" fill="#d97b59"/>
  <text x="794" y="558" text-anchor="middle" class="event">Laili</text>
  <text x="794" y="578" text-anchor="middle" class="event2">59–54</text>
  <text x="618" y="570" class="note">ausencia local</text>
  <rect x="1080" y="538" width="104" height="48" rx="12" fill="#7db4b2"/>
  <text x="1132" y="558" text-anchor="middle" class="event">Laili</text>
  <text x="1132" y="578" text-anchor="middle" class="event2">~44</text>
  <text x="1198" y="568" class="note">ocupación intensa</text>
  <path d="M639 598 H1070" stroke="#8fc3c3" stroke-width="5" stroke-dasharray="12 9"/>
  <text x="852" y="617" text-anchor="middle" class="foot">modelos de ruta 65–45 ka · norte/mixto favorecido ≠ viaje observado</text>

  <g filter="url(#shadow2)">
    <rect x="740" y="688" width="536" height="70" rx="15" fill="#9fc2ca"/>
    <text x="1008" y="713" text-anchor="middle" class="event">Separación papú–australiana modelada</text>
    <text x="1008" y="738" text-anchor="middle" class="event2">25–40 ka o ~47 ka · HPD 27–64 · no es desembarco</text>
    <rect x="1050" y="744" width="356" height="56" rx="14" fill="#b9d0c9"/>
    <text x="1228" y="768" text-anchor="middle" class="event">Estructura regional australiana</text>
    <text x="1228" y="790" text-anchor="middle" class="event2">separaciones modeladas ~35–26 ka</text>
  </g>

  <rect x="70" y="830" width="1440" height="42" rx="14" fill="#151f26" stroke="#52666b"/>
  <text x="790" y="857" text-anchor="middle" class="foot">Punto o intervalo de sitio ≠ llegada · mínimo de costra ≠ pigmento · ruta modelada ≠ trayectoria · split genómico ≠ fecha arqueológica</text>
</svg>
