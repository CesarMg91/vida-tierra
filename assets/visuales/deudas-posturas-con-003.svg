  <foreignObject x="670" y="314" width="250" height="68"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font:19px/1.25 Arial,sans-serif;color:#22302e">la organiza</p></foreignObject>
