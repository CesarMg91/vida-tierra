<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de expedientes de inmunología y trasplante</title>
  <desc id="desc">Doce expedientes de MED-027 cruzados con siete capas: mecanismo, compatibilidad, procedimiento, serie, registro, asignación y ética. Cada marca sólo indica que el expediente toca esa capa; no gradúa fuerza de evidencia, no forma una escalera de progreso ni reparte prioridad.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe9e7"/><stop offset="1" stop-color="#c4d4d1"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="58" y="40" width="1484" height="830" rx="28" fill="#f3f8f7" stroke="#24434a" stroke-width="2"/>
  <text x="92" y="94" fill="#2f6f66" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">MED-027 · MATRIZ DE EVIDENCIA</text>
  <text x="92" y="145" fill="#1c2422" font-family="Georgia, serif" font-size="42" font-weight="700">Doce expedientes, siete capas, ninguna hazaña fundacional</text>
  <text x="92" y="183" fill="#4c5250" font-family="Arial, sans-serif" font-size="20">Qué capas toca cada expediente. Una marca es presencia, no fuerza ni ranking.</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="92" y="222" width="1416" height="56" rx="10" fill="#24434a"/>
    <g fill="#eef6f4" font-size="16" font-weight="700"><text x="112" y="257">EXPEDIENTE</text><text x="560" y="257" text-anchor="middle">mecanismo</text><text x="696" y="257" text-anchor="middle">compatibilidad</text><text x="832" y="257" text-anchor="middle">procedimiento</text><text x="968" y="257" text-anchor="middle">serie</text><text x="1104" y="257" text-anchor="middle">registro</text><text x="1240" y="257" text-anchor="middle">asignación</text><text x="1376" y="257" text-anchor="middle">ética</text></g>
    <g>
      <g transform="translate(0 282)"><rect x="92" width="1416" height="44" fill="#f7fbfa"/><text x="112" y="28" fill="#24434a" font-weight="700">Inmunidad temprana</text><circle cx="560" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 326)"><rect x="92" width="1416" height="44" fill="#e3ecea"/><text x="112" y="28" fill="#24434a" font-weight="700">Tolerancia y selección clonal</text><circle cx="560" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 370)"><rect x="92" width="1416" height="44" fill="#f7fbfa"/><text x="112" y="28" fill="#24434a" font-weight="700">HLA y prueba cruzada</text><circle cx="560" cy="22" r="9" fill="#24434a"/><circle cx="696" cy="22" r="9" fill="#24434a"/><circle cx="968" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 414)"><rect x="92" width="1416" height="44" fill="#e3ecea"/><text x="112" y="28" fill="#24434a" font-weight="700">Gemelos de Boston</text><circle cx="832" cy="22" r="9" fill="#24434a"/><circle cx="968" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 458)"><rect x="92" width="1416" height="44" fill="#f7fbfa"/><text x="112" y="28" fill="#24434a" font-weight="700">Irradiación y azatioprina</text><circle cx="560" cy="22" r="9" fill="#24434a"/><circle cx="832" cy="22" r="9" fill="#24434a"/><circle cx="968" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 502)"><rect x="92" width="1416" height="44" fill="#e3ecea"/><text x="112" y="28" fill="#24434a" font-weight="700">Ciclosporina y tacrolimus</text><circle cx="560" cy="22" r="9" fill="#24434a"/><circle cx="968" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 546)"><rect x="92" width="1416" height="44" fill="#f7fbfa"/><text x="112" y="28" fill="#24434a" font-weight="700">Corazón 1967–1970</text><circle cx="832" cy="22" r="9" fill="#24434a"/><circle cx="968" cy="22" r="9" fill="#24434a"/><circle cx="1104" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 590)"><rect x="92" width="1416" height="44" fill="#e3ecea"/><text x="112" y="28" fill="#24434a" font-weight="700">Muerte encefálica</text><circle cx="968" cy="22" r="9" fill="#24434a"/><circle cx="1376" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 634)"><rect x="92" width="1416" height="44" fill="#f7fbfa"/><text x="112" y="28" fill="#24434a" font-weight="700">Asignación</text><circle cx="696" cy="22" r="9" fill="#24434a"/><circle cx="1104" cy="22" r="9" fill="#24434a"/><circle cx="1240" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 678)"><rect x="92" width="1416" height="44" fill="#e3ecea"/><text x="112" y="28" fill="#24434a" font-weight="700">Comercio y China</text><circle cx="1104" cy="22" r="9" fill="#24434a"/><circle cx="1376" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 722)"><rect x="92" width="1416" height="44" fill="#f7fbfa"/><text x="112" y="28" fill="#24434a" font-weight="700">Supervivencia del injerto</text><circle cx="1104" cy="22" r="9" fill="#24434a"/></g>
      <g transform="translate(0 766)"><rect x="92" width="1416" height="44" fill="#e3ecea"/><text x="112" y="28" fill="#24434a" font-weight="700">Xenotrasplante</text><circle cx="560" cy="22" r="9" fill="#24434a"/><circle cx="832" cy="22" r="9" fill="#24434a"/><circle cx="968" cy="22" r="9" fill="#24434a"/><circle cx="1376" cy="22" r="9" fill="#24434a"/></g>
    </g>
    <g stroke="#b7c9c5" stroke-width="1"><line x1="628" y1="282" x2="628" y2="810"/><line x1="764" y1="282" x2="764" y2="810"/><line x1="900" y1="282" x2="900" y2="810"/><line x1="1036" y1="282" x2="1036" y2="810"/><line x1="1172" y1="282" x2="1172" y2="810"/><line x1="1308" y1="282" x2="1308" y2="810"/></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#5a6461"><circle cx="100" cy="840" r="7" fill="#24434a"/><text x="114" y="845">el expediente toca la capa</text></g>
  <text x="1505" y="858" fill="#5a6461" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Síntesis del expediente · sin puntuaciones ni ranking</text>
</svg>
