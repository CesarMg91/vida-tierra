<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de evidencia de la recuperación silúrica y el ensamblaje terrestre</title>
  <desc id="desc">Cuatro rutas separan límite formal, recuperación marina, perturbaciones internas y ensamblaje terrestre. Cada ruta muestra objeto, medición, puente, conclusión y límite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="1" stop-color="#12212b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9eb7c3"/>
    </marker>
    <style>
      .title{font:700 42px 'Segoe UI',sans-serif;fill:#f3eee2}.sub{font:400 20px 'Segoe UI',sans-serif;fill:#b9cad2}.laneTitle{font:700 24px 'Segoe UI',sans-serif;fill:#07131d}.head{font:700 18px 'Segoe UI',sans-serif;fill:#f5efe2}.body{font:400 16px 'Segoe UI',sans-serif;fill:#d4e0e5}.small{font:400 14px 'Segoe UI',sans-serif;fill:#bdccd2}.grade{font:700 18px 'Segoe UI',sans-serif;fill:#f7f0df}.box{fill:#162b36;stroke:#496473;stroke-width:2}.limit{fill:#2a2228;stroke:#956879;stroke-width:2}.line{fill:none;stroke:#9eb7c3;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="url(#bg)"/>
  <text x="80" y="74" class="title">Silúrico: cuatro archivos, cuatro relojes</text>
  <text x="80" y="108" class="sub">Una aparición conserva un mínimo; una recuperación exige métrica, región y línea de base.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="350" height="58" rx="18" fill="#d7b56d"/>
    <text x="245" y="187" text-anchor="middle" class="laneTitle">LÍMITE FORMAL</text>
    <rect x="70" y="230" width="350" height="125" rx="16" class="box"/>
    <text x="92" y="261" class="head">Objeto</text>
    <text x="92" y="289" class="body">Dob’s Linn, lutita y horizonte</text>
    <text x="92" y="316" class="body">FAD de A. ascensus</text>
    <path d="M245 355 V390" class="line"/>
    <rect x="70" y="392" width="350" height="120" rx="16" class="box"/>
    <text x="92" y="424" class="head">Puente</text>
    <text x="92" y="452" class="body">bioestratigrafía y ratificación</text>
    <text x="92" y="480" class="body">calibración numérica revisable</text>
    <path d="M245 512 V547" class="line"/>
    <rect x="70" y="549" width="350" height="112" rx="16" class="box"/>
    <text x="92" y="581" class="head">Permite</text>
    <text x="92" y="610" class="body">base del Silúrico/Rhuddaniense</text>
    <text x="92" y="638" class="grade">Confianza A</text>
    <rect x="70" y="686" width="350" height="112" rx="16" class="limit"/>
    <text x="92" y="718" class="head">No permite</text>
    <text x="92" y="747" class="body">fin de la LOME o recuperación</text>
    <text x="92" y="775" class="body">simultánea de todos los clados</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="150" width="350" height="58" rx="18" fill="#79aeba"/>
    <text x="615" y="187" text-anchor="middle" class="laneTitle">RECUPERACIÓN MARINA</text>
    <rect x="440" y="230" width="350" height="125" rx="16" class="box"/>
    <text x="462" y="261" class="head">Objetos</text>
    <text x="462" y="289" class="body">ocurrencias, rasgos, arrecifes</text>
    <text x="462" y="316" class="body">y peces articulados</text>
    <path d="M615 355 V390" class="line"/>
    <rect x="440" y="392" width="350" height="120" rx="16" class="box"/>
    <text x="462" y="424" class="head">Puentes</text>
    <text x="462" y="452" class="body">muestreo + línea de base</text>
    <text x="462" y="480" class="body">composición + ecospace + filogenia</text>
    <path d="M615 512 V547" class="line"/>
    <rect x="440" y="549" width="350" height="112" rx="16" class="box"/>
    <text x="462" y="581" class="head">Permite</text>
    <text x="462" y="610" class="body">recuperaciones plurales y regionales</text>
    <text x="462" y="638" class="grade">A-B proceso · C bordes</text>
    <rect x="440" y="686" width="350" height="112" rx="16" class="limit"/>
    <text x="462" y="718" class="head">No permite</text>
    <text x="462" y="747" class="body">un único tiempo planetario</text>
    <text x="462" y="775" class="body">ni restauración de la misma comunidad</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="150" width="350" height="58" rx="18" fill="#b17a8d"/>
    <text x="985" y="187" text-anchor="middle" class="laneTitle">PERTURBACIONES</text>
    <rect x="810" y="230" width="350" height="125" rx="16" class="box"/>
    <text x="832" y="261" class="head">Objetos</text>
    <text x="832" y="289" class="body">rangos, facies, nivel del mar</text>
    <text x="832" y="316" class="body">C, S, I, Fe y redox</text>
    <path d="M985 355 V390" class="line"/>
    <rect x="810" y="392" width="350" height="120" rx="16" class="box"/>
    <text x="832" y="424" class="head">Puentes</text>
    <text x="832" y="452" class="body">reservorio + sincronía</text>
    <text x="832" y="480" class="body">mecanismo + selectividad</text>
    <path d="M985 512 V547" class="line"/>
    <rect x="810" y="549" width="350" height="112" rx="16" class="box"/>
    <text x="832" y="581" class="head">Permite</text>
    <text x="832" y="610" class="body">Ireviken, Mulde y Lau condicionados</text>
    <text x="832" y="638" class="grade">B eventos · C-D causas</text>
    <rect x="810" y="686" width="350" height="112" rx="16" class="limit"/>
    <text x="832" y="718" class="head">No permite</text>
    <text x="832" y="747" class="body">δ13C como termómetro, oxímetro</text>
    <text x="832" y="775" class="body">o agente de muerte automático</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="150" width="350" height="58" rx="18" fill="#8da973"/>
    <text x="1355" y="187" text-anchor="middle" class="laneTitle">ENSAMBLAJE TERRESTRE</text>
    <rect x="1180" y="230" width="350" height="125" rx="16" class="box"/>
    <text x="1202" y="261" class="head">Objetos</text>
    <text x="1202" y="289" class="body">esporas, ejes, traqueidas, hongos</text>
    <text x="1202" y="316" class="body">cutículas, espiráculos y coprolitos</text>
    <path d="M1355 355 V390" class="line"/>
    <rect x="1180" y="392" width="350" height="120" rx="16" class="box"/>
    <text x="1202" y="424" class="head">Puentes</text>
    <text x="1202" y="452" class="body">anatomía + edad + contexto</text>
    <text x="1202" y="480" class="body">ingestión + transporte + facies</text>
    <path d="M1355 512 V547" class="line"/>
    <rect x="1180" y="549" width="350" height="112" rx="16" class="box"/>
    <text x="1202" y="581" class="head">Permite</text>
    <text x="1202" y="610" class="body">productores, hongos y redes mínimas</text>
    <text x="1202" y="638" class="grade">B · B-COND conexiones</text>
    <rect x="1180" y="686" width="350" height="112" rx="16" class="limit"/>
    <text x="1202" y="718" class="head">No permite</text>
    <text x="1202" y="747" class="body">bosque, origen, convivencia</text>
    <text x="1202" y="775" class="body">ni terrestreidad por silueta</text>
  </g>

  <rect x="70" y="842" width="1460" height="126" rx="22" fill="#0d1c25" stroke="#4a6572" stroke-width="2"/>
  <text x="100" y="881" class="head">Dependencias que no son votos independientes</text>
  <text x="100" y="914" class="body">Riqueza y composición comparten ocurrencias · arrecifes y eventos comparten facies/nivel · esporas y cuerpos comparten transporte costero.</text>
  <text x="100" y="946" class="body">En Pneumodesmus: poros → respiración; esporas + circones + estructura → edad. Una ruta puede cambiar sin borrar la otra.</text>
  <text x="1500" y="1010" text-anchor="end" class="small">INV-SILURIAN-001 · síntesis conceptual · 2026-08-11</text>
</svg>
