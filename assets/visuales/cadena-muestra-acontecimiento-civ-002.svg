<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de seis capas desde una muestra hasta un acontecimiento histórico</title>
  <desc id="desc">Seis tarjetas separan muestra, medición, calendario, contexto, fase y acontecimiento. Entre ellas aparecen puentes que deben demostrarse. Una banda inferior enumera fallos que pueden detener la inferencia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11130f"/><stop offset="1" stop-color="#1d241d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#050605" flood-opacity=".46"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c57b45"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 735 C350 650 630 820 940 735 S1320 660 1600 745 V900 H0z" fill="#233128" opacity=".8"/>
  <text x="96" y="92" fill="#f2e7d2" font-family="Georgia,serif" font-size="48" font-weight="700">Una fecha no es un acontecimiento</text>
  <text x="98" y="137" fill="#cbbda8" font-family="Arial,sans-serif" font-size="23">Cada flecha es un puente que debe demostrarse; la cadena puede detenerse sin inventar el resto.</text>

  <g filter="url(#shadow)" font-family="Arial,sans-serif">
    <g transform="translate(72 230)"><rect width="220" height="274" rx="22" fill="#262620" stroke="#6f775d" stroke-width="2"/><circle cx="42" cy="42" r="25" fill="#4c654f"/><text x="42" y="51" text-anchor="middle" fill="#f6eddc" font-size="27" font-weight="700">1</text><text x="24" y="102" fill="#e7b477" font-size="25" font-weight="700">Muestra</text><text x="24" y="140" fill="#f2e7d2" font-size="20"><tspan x="24" dy="0">Semilla, carbón,</tspan><tspan x="24" dy="29">hueso, anillo,</tspan><tspan x="24" dy="29">grano o tefra</tspan></text><text x="24" y="242" fill="#aeb6a2" font-size="17">Objeto y procedencia</text></g>
    <g transform="translate(318 230)"><rect width="220" height="274" rx="22" fill="#262620" stroke="#6f775d" stroke-width="2"/><circle cx="42" cy="42" r="25" fill="#4c654f"/><text x="42" y="51" text-anchor="middle" fill="#f6eddc" font-size="27" font-weight="700">2</text><text x="24" y="102" fill="#e7b477" font-size="25" font-weight="700">Medición</text><text x="24" y="140" fill="#f2e7d2" font-size="20"><tspan x="24" dy="0">Actividad, dosis,</tspan><tspan x="24" dy="29">anillos, campo</tspan><tspan x="24" dy="29">o composición</tspan></text><text x="24" y="242" fill="#aeb6a2" font-size="17">Resultado instrumental</text></g>
    <g transform="translate(564 230)"><rect width="220" height="274" rx="22" fill="#262620" stroke="#6f775d" stroke-width="2"/><circle cx="42" cy="42" r="25" fill="#4c654f"/><text x="42" y="51" text-anchor="middle" fill="#f6eddc" font-size="27" font-weight="700">3</text><text x="24" y="102" fill="#e7b477" font-size="25" font-weight="700">Calendario</text><text x="24" y="140" fill="#f2e7d2" font-size="20"><tspan x="24" dy="0">Distribución,</tspan><tspan x="24" dy="29">intervalos y</tspan><tspan x="24" dy="29">modos posibles</tspan></text><text x="24" y="242" fill="#aeb6a2" font-size="17">Curva y corrección</text></g>
    <g transform="translate(810 230)"><rect width="220" height="274" rx="22" fill="#262620" stroke="#6f775d" stroke-width="2"/><circle cx="42" cy="42" r="25" fill="#4c654f"/><text x="42" y="51" text-anchor="middle" fill="#f6eddc" font-size="27" font-weight="700">4</text><text x="24" y="102" fill="#e7b477" font-size="25" font-weight="700">Contexto</text><text x="24" y="140" fill="#f2e7d2" font-size="20"><tspan x="24" dy="0">Capa, piso, fosa,</tspan><tspan x="24" dy="29">muro, incendio</tspan><tspan x="24" dy="29">o relleno</tspan></text><text x="24" y="242" fill="#aeb6a2" font-size="17">Asociación evaluada</text></g>
    <g transform="translate(1056 230)"><rect width="220" height="274" rx="22" fill="#262620" stroke="#6f775d" stroke-width="2"/><circle cx="42" cy="42" r="25" fill="#4c654f"/><text x="42" y="51" text-anchor="middle" fill="#f6eddc" font-size="27" font-weight="700">5</text><text x="24" y="102" fill="#e7b477" font-size="25" font-weight="700">Fase</text><text x="24" y="140" fill="#f2e7d2" font-size="20"><tspan x="24" dy="0">Secuencia, inicio,</tspan><tspan x="24" dy="29">final o duración</tspan><tspan x="24" dy="29">modelados</tspan></text><text x="24" y="242" fill="#aeb6a2" font-size="17">Orden y sensibilidad</text></g>
    <g transform="translate(1302 230)"><rect width="220" height="274" rx="22" fill="#31251d" stroke="#c57b45" stroke-width="2"/><circle cx="42" cy="42" r="25" fill="#a65f35"/><text x="42" y="51" text-anchor="middle" fill="#fff3df" font-size="27" font-weight="700">6</text><text x="24" y="102" fill="#f0bd7b" font-size="24" font-weight="700">Acontecimiento</text><text x="24" y="140" fill="#f2e7d2" font-size="19"><tspan x="24" dy="0">Destrucción,</tspan><tspan x="24" dy="28">institución o</tspan><tspan x="24" dy="28">proceso histórico</tspan></text><text x="24" y="242" fill="#d3b99c" font-size="17">Archivos convergentes</text></g>
  </g>

  <g stroke="#c57b45" stroke-width="3" marker-end="url(#arrow)"><path d="M294 367h18"/><path d="M540 367h18"/><path d="M786 367h18"/><path d="M1032 367h18"/><path d="M1278 367h18"/></g>
  <g fill="#e1c8a8" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="303" y="341">preparación</text><text x="549" y="341">calibración</text><text x="795" y="341">asociación</text><text x="1041" y="341">modelo</text><text x="1287" y="341">identificación</text></g>

  <rect x="72" y="574" width="1450" height="204" rx="26" fill="#171914" stroke="#4f5948" stroke-width="2"/>
  <text x="104" y="624" fill="#f2e7d2" font-family="Georgia,serif" font-size="28" font-weight="700">Razones legítimas para detener la cadena</text>
  <g font-family="Arial,sans-serif" font-size="19"><text x="105" y="672" fill="#d7c7b1">madera vieja · contaminación · reservorio · meseta de calibración</text><text x="105" y="710" fill="#d7c7b1">residualidad · intrusión · último anillo ausente · blanqueamiento incompleto</text><text x="105" y="748" fill="#d7c7b1">prior no defendible · sincronismo circular · institución no observada</text></g>
  <rect x="1096" y="626" width="390" height="112" rx="18" fill="#26352a"/>
  <text x="1122" y="667" fill="#b9d0b9" font-family="Arial,sans-serif" font-size="19" font-weight="700">Resultado correcto</text>
  <text x="1122" y="704" fill="#eef1e9" font-family="Arial,sans-serif" font-size="18">«No demostrado en este nivel»</text>
  <text x="80" y="846" fill="#9eaa98" font-family="Arial,sans-serif" font-size="17">CIV-002 · diagrama epistemológico · no es una calculadora ni una escala de progreso</text>
</svg>
