<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de seis redes médicas auditadas en MED-011</title>
  <desc id="desc">Compara los archivos de Hunayn, al-Razi, el Canon, óptica y oftalmología, bimaristanes, y Geniza con regulación. Cada fila muestra archivo fuerte, inferencia permitida y límite principal sin asignar puntuaciones.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2ca"/>
      <stop offset="1" stop-color="#d8c6a7"/>
    </linearGradient>
    <style>
      .sans{font-family:"IBM Plex Sans",Arial,sans-serif}.serif{font-family:"Source Serif 4",Georgia,serif}
      .eyebrow{font-size:18px;letter-spacing:3px;font-weight:700;fill:#7b4f2c}.title{font-size:44px;font-weight:650;fill:#201914}
      .subtitle{font-size:22px;fill:#5e5145}.head{font-size:20px;font-weight:700;fill:#f3eadc}.case{font-size:22px;font-weight:700;fill:#201914}
      .cell{font-size:17px;fill:#322a23}.tag{font-size:15px;font-weight:700;letter-spacing:1px;fill:#245d4a}.foot{font-size:18px;fill:#5e5145}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="76" y="70" class="sans eyebrow">MED-011 · MATRIZ SIN RANKING</text>
  <text x="76" y="125" class="serif title">Seis redes, seis productos documentales</text>
  <text x="76" y="164" class="sans subtitle">La celda compara qué se conserva; no califica sociedades ni convierte archivo en efecto.</text>

  <g transform="translate(76 218)">
    <rect width="1448" height="54" rx="12" fill="#27231e"/>
    <text x="24" y="35" class="sans head">CASO / RED</text>
    <text x="315" y="35" class="sans head">ARCHIVO FUERTE</text>
    <text x="730" y="35" class="sans head">INFERENCIA PERMITIDA</text>
    <text x="1116" y="35" class="sans head">LÍMITE DECISIVO</text>
  </g>

  <g transform="translate(76 286)">
    <rect width="1448" height="82" rx="10" fill="#f6eddd" stroke="#b69d7b"/>
    <rect width="10" height="82" rx="5" fill="#a86d3d"/>
    <text x="24" y="32" class="sans case">Hunayn · Galeno</text><text x="24" y="60" class="sans tag">TRADUCCIÓN</text>
    <text x="315" y="31" class="sans cell"><tspan x="315">informe, atribuciones y</tspan><tspan x="315" dy="23">copias posteriores</tspan></text>
    <text x="730" y="31" class="sans cell"><tspan x="730">cotejo, revisión y red</tspan><tspan x="730" dy="23">multilingüe de encargo</tspan></text>
    <text x="1116" y="31" class="sans cell"><tspan x="1116">voz original, lectura</tspan><tspan x="1116" dy="23">y aplicación clínica</tspan></text>
  </g>
  <g transform="translate(76 380)">
    <rect width="1448" height="82" rx="10" fill="#e8e2d1" stroke="#9e9b7d"/>
    <rect width="10" height="82" rx="5" fill="#497a63"/>
    <text x="24" y="32" class="sans case">Al-Razi</text><text x="24" y="60" class="sans tag">CASOS</text>
    <text x="315" y="31" class="sans cell"><tspan x="315">casos, notas, compilación</tspan><tspan x="315" dy="23">y copia parcial de 1094</tspan></text>
    <text x="730" y="31" class="sans cell"><tspan x="730">razonamiento situado y</tspan><tspan x="730" dy="23">tensión teoría–práctica</tspan></text>
    <text x="1116" y="31" class="sans cell"><tspan x="1116">consecutividad, edición</tspan><tspan x="1116" dy="23">y seguimiento</tspan></text>
  </g>
  <g transform="translate(76 474)">
    <rect width="1448" height="82" rx="10" fill="#f6eddd" stroke="#b69d7b"/>
    <rect width="10" height="82" rx="5" fill="#a86d3d"/>
    <text x="24" y="32" class="sans case">Canon</text><text x="24" y="60" class="sans tag">REGLAS · COMENTARIO</text>
    <text x="315" y="31" class="sans cell"><tspan x="315">siete condiciones, copias</tspan><tspan x="315" dy="23">y comentarios críticos</tspan></text>
    <text x="730" y="31" class="sans cell"><tspan x="730">programa metodológico y</tspan><tspan x="730" dy="23">recepción no pasiva</tspan></text>
    <text x="1116" y="31" class="sans cell"><tspan x="1116">protocolo ejecutado,</tspan><tspan x="1116" dy="23">ensayo o eficacia</tspan></text>
  </g>
  <g transform="translate(76 568)">
    <rect width="1448" height="82" rx="10" fill="#e8e2d1" stroke="#9e9b7d"/>
    <rect width="10" height="82" rx="5" fill="#497a63"/>
    <text x="24" y="32" class="sans case">Óptica · ojo</text><text x="24" y="60" class="sans tag">EXPERIMENTO · TÉCNICA</text>
    <text x="315" y="31" class="sans cell"><tspan x="315">problemas ópticos, manuales</tspan><tspan x="315" dy="23">y aguja descrita</tspan></text>
    <text x="730" y="31" class="sans cell"><tspan x="730">investigación visual y</tspan><tspan x="730" dy="23">propuesta quirúrgica</tspan></text>
    <text x="1116" y="31" class="sans cell"><tspan x="1116">frecuencia, seguridad</tspan><tspan x="1116" dy="23">y recuperación visual</tspan></text>
  </g>
  <g transform="translate(76 662)">
    <rect width="1448" height="82" rx="10" fill="#f6eddd" stroke="#b69d7b"/>
    <rect width="10" height="82" rx="5" fill="#a86d3d"/>
    <text x="24" y="32" class="sans case">Bimaristanes</text><text x="24" y="60" class="sans tag">FUNDACIÓN</text>
    <text x="315" y="31" class="sans cell"><tspan x="315">waqf, espacio, cargos</tspan><tspan x="315" dy="23">y patronazgo</tspan></text>
    <text x="730" y="31" class="sans cell"><tspan x="730">programa e institución</tspan><tspan x="730" dy="23">urbana situada</tspan></text>
    <text x="1116" y="31" class="sans cell"><tspan x="1116">operación diaria, acceso,</tspan><tspan x="1116" dy="23">calidad y resultado</tspan></text>
  </g>
  <g transform="translate(76 756)">
    <rect width="1448" height="82" rx="10" fill="#e8e2d1" stroke="#9e9b7d"/>
    <rect width="10" height="82" rx="5" fill="#497a63"/>
    <text x="24" y="32" class="sans case">Geniza · hisba</text><text x="24" y="60" class="sans tag">PRÁCTICA · NORMA</text>
    <text x="315" y="31" class="sans cell"><tspan x="315">recetas, cuadernos,</tspan><tspan x="315" dy="23">formularios y relatos</tspan></text>
    <text x="730" y="31" class="sans cell"><tspan x="730">selección práctica y</tspan><tspan x="730" dy="23">disputa regulatoria</tspan></text>
    <text x="1116" y="31" class="sans cell"><tspan x="1116">dispensación, cumplimiento</tspan><tspan x="1116" dy="23">y licencia universal</tspan></text>
  </g>
  <text x="76" y="878" class="sans foot">Dato ausente ≠ ausencia histórica · norma ≠ práctica · circulación ≠ eficacia</text>
</svg>
